  - { id: G-01-029, given: "当前账号创建了待填写登记表 A（有效期内，客户已保存过部分内容、填写页还开着）、待审核 B、待关联 C（没有审批中的规则配置审批单）", when: "①对 A 点删除；②确认；③客户在开着的填写页点保存；④对 B、C 分别点删除并确认", then: "①确认框文案为「删除后客户将无法再打开填写链接，已填写的内容一并删除，确认删除吗？」；②A 从列表消失；③保存失败，页面转为 404，重新打开 A 的链接也是 404；④B、C 从列表消失，链接 404（R-01-017）" }
