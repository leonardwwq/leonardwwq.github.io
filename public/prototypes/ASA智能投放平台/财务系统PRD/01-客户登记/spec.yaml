# 01-客户登记 · 机器可读规格（2026-10-16 用户已核对主流程与代定项）
# 来源：html/客户登记表.html:2349/2534、html/客户登记表填写页面.html:1377 + 用户确认（见 decisions）

meta:
  feature: 客户登记
  product: ASA
  version: v2.1.0
  page: 01-客户登记
  date: 2026-10-16
  prd: PRD.md
  status: 待评审

scope:
  in:
    - 客户登记表列表（登记表 tab）：搜索、状态筛选、排序、分页、行操作
    - 新增客户登记表弹窗
    - 详情 / 编辑 / 审核弹窗
    - 删除
    - 「规则配置」行操作入口（只负责跳转，规则内容归 03-规则配置）
    - 「已提交审批」tab：只列本账号提交的规则配置审批单，详情与撤回规则引用 12-审批配置与审批中心
    - 对外填写页（免登录、自动保存、提交、中英文）
    - 提交通知
    - 登记表实体与状态机定义（02、04 引用）
  out:
    - 规则配置页内容与登记表规则配置审批详情的记录内容（归 03-规则配置，D-01-02）
    - 审批详情页通用框架、撤回、会签（归 12-审批配置与审批中心，版本级约定）
    - 关联客户动作本身（归 04-客户管理）；添加账户选登记表动作本身（归 02-账户管理）
    - 客户列表行操作里的「规则配置」入口（残留，不做，D-01-03）；04 客户材料登记表行另有入口，打开同一个 03 页面（R-04-060）
    - 新增弹窗选投放应用（残留，不做，D-01-07）
    - 编辑登记表后同步到已关联客户/账户（不做，D-01-06）
    - 创建后修改链接有效期、提交通知（不做，填错删除重建，D-01-19）
    - 存量账户的历史上传文件行（含迁移补建的无附件行）及其规则配置入口（在 04 客户材料，D-00-57、R-04-060；不进本页列表）
    - 填写页移动端适配（本期不要求）
    - 登记表退回客户修改（未通过为终止态，D-01-01）

roles:
  - { role: 内部用户, can: [新增登记表, 查看自己创建的登记表, 详情, 编辑（含改名称）, 审核, 删除未关联客户的登记表（R-01-017）, 进入规则配置, 查看自己提交的规则配置审批单, 撤回自己提交的审批中审批单（不受权限点限制，R-01-037）], cannot: [查看他人创建的登记表, 删除待开户或已开户的登记表], source: 权限点「客户登记管理」：一个点管全部内部动作，只能处理本人创建的登记表；没有该点时菜单不显示、直接访问显示「无权限访问」（R-01-037、D-00-70、R-13-020）；不预设角色 }
  - { role: 客户, can: [凭链接免登录填写、保存、提交], cannot: [提交后再修改, 访问过期或已删除的链接], source: 链接 token，无账号 }

entities:
  - name: 客户登记表
    key: customer_registration
    fields:
      - { key: registration_id, label: 登记表ID, type: string, required: true, generated: true, rule: 唯一；生成规则由技术定 }
      - { key: name, label: 登记表名称, type: string, required: true, rule: R-01-001；待填写～已开户可改（R-01-039） }
      - { key: link_ttl_hours, label: 链接有效期, type: enum, required: true, enum: [48, 72], default: 48, unit: 小时, rule: R-01-002 }
      - { key: expires_at, label: 链接到期时间, type: datetime, required: true, tz: 服务端时间（存 UTC）, generated: true, rule: R-01-002；列表不展示，待填写 / 已过期的详情顶部按北京时间展示（R-01-010） }
      - { key: fill_token, label: 填写链接标识, type: string, required: true, generated: true, rule: R-01-020 }
      - { key: notify_channel, label: 提交通知方式, type: enum, required: true, enum: [企业微信, 邮箱, 不通知], default: 企业微信, rule: R-01-003 }
      - { key: notify_email, label: 通知邮箱, type: string, required: false, rule: R-01-004 }
      - { key: owner_user_id, label: 归属者（创建人）, type: ref, required: true, generated: true, rule: R-01-008 }
      - { key: status, label: 状态, type: enum, required: true, enum: [待填写, 待审核, 待关联, 待开户, 已开户, 已过期, 未通过], default: 待填写, rule: 见 flows }
      - { key: customer_id, label: 关联客户ID, type: ref, required: false, rule: 04-客户管理关联本登记表时写入 }
      - { key: account_system, label: 所属账户系统, type: ref, required: false, rule: 02-账户管理绑定本登记表时写入 }
      - { key: account_id, label: 绑定账户ID, type: ref, required: false, rule: 02-账户管理绑定本登记表时写入 }
      - { key: created_at, label: 创建时间, type: datetime, required: true, tz: Asia/Shanghai, precision: 秒, generated: true }
      - { key: submitted_at, label: 提交时间, type: datetime, required: false, tz: Asia/Shanghai, precision: 秒, generated: true, rule: 客户提交时写入；列表不展示 }
      - { key: edited_at, label: 编辑时间, type: datetime, required: false, tz: Asia/Shanghai, precision: 秒, generated: true, rule: 内部编辑或审核弹窗保存时写入；列表不展示 }
      - { key: draft_saved_at, label: 最近保存时间, type: datetime, required: false, generated: true, tz: 服务端存 UTC，填写页按客户浏览器本地时间展示, rule: R-01-024 }
      # —— 以下为登记内容（填写页、详情、编辑、审核共用同一套，R-01-010）——
      - { key: contract_entity, label: 签约主体名称, type: string, required: true, rule: R-01-021；客户自由填写的文本，与 04 客户上的「伙伴云签约主体」（枚举）不是同一字段，同名 key 由技术区分 }
      - { key: product_app, label: 投放产品, type: ref, required: true, rule: 只能选 1 个应用（应用名称 + 应用ID）；R-01-022 }
      - { key: competitor_apps, label: 参考竞品, type: list, required: false, rule: 可选多个应用；R-01-022 }
      - { key: apple_account_email, label: 苹果账户邮箱, type: string, required: true, rule: R-01-023 }
      - { key: asc_email, label: ASC关联邮箱, type: string, required: true, rule: R-01-023 }
      - { key: delivery_type, label: 投放类型, type: enum, required: true, enum: [代投, 自投], rule: 单选，无默认值；添加账户时回填（02 引用） }
      - { key: launch_date, label: 产品投放日期, type: date, required: true, rule: 日期下限仅填写页校验（R-01-025）；内部弹窗可选任意日期（R-01-018） }
      - { key: regions, label: 产品投放地区, type: list, required: true, rule: 可多选、可搜索；地区清单沿用现有地区选择组件 }
      - { key: daily_budget, label: 日预算, type: decimal, required: true, precision: 2, currency: 不带币种, rule: R-01-026 }
      - { key: kpi, label: KPI要求, type: text, required: true, rule: 多行输入框 }
      - { key: attribution_platform, label: 三方归因平台, type: string, required: false }
      - { key: remark, label: 备注, type: text, required: false, rule: 多行输入框 }

flows:
  - entity: 客户登记表
    states: [待填写, 待审核, 待关联, 待开户, 已开户, 已过期, 未通过]
    initial: 待填写
    transitions:
      - { from: 待填写, action: 提交, actor: 客户, to: 待审核, guard: 未过期且必填与格式校验通过（R-01-027） }
      - { from: 待填写, action: 到期, actor: 系统, to: 已过期, guard: 当前时间 ≥ expires_at（R-01-002） }
      - { from: 待审核, action: 审核通过, actor: 内部用户, to: 待关联, guard: R-01-015 }
      - { from: 待审核, action: 审核不通过, actor: 内部用户, to: 未通过, guard: 二次确认（R-01-016） }
      - { from: 待关联, action: 关联客户, actor: 内部用户（在 04-客户管理）, to: 待开户, guard: 由 04 定义 }
      - { from: 待开户, action: 添加账户并选择本登记表, actor: 内部用户（在 02-账户管理）, to: 已开户, guard: 由 02 定义 }
    reverse:
      - { action: 删除, actor: 内部用户（创建人）, allowed_from: [待填写, 待审核, 待关联, 已过期, 未通过], guard: 创建人是当前账号、状态仍在可删范围、没有审批中的规则配置审批单, note: 删除后列表不再展示，填写链接 404；待开户、已开户不能删（等同解绑）（R-01-017、D-01-18） }
      - { action: 退回客户修改, actor: —, allowed_from: [], note: 不支持；客户要重填由商务新建登记表（D-01-01） }
      - { action: 解除客户/账户关联, actor: —, allowed_from: [], note: 本期没有解绑操作（D-01-16） }

refs:
  - { page: 04-客户管理, ids: [R-04-057, R-04-060], uses: "创建人账号已禁用的待关联登记表由持「客户管理-读写」的人在 04 绑定下拉里选到（D-01-18，04 定义）；客户材料绑定行详情按 R-01-010 只读格式、名称取当前名（R-01-039）" }
  - { page: 03-规则配置, ids: [R-03-048, R-03-050, R-03-053], uses: "已删除登记表的审批单：审批内容区公司 / 账户显示「暂未关联」（R-03-048）、查看范围创建人按删除时判断（R-03-050）；附件登记表的规则单不进本页「已提交审批」（R-03-053）" }
  - { page: 12-审批配置与审批中心, ids: [R-12-018, R-12-032], uses: "已提交审批含免审单（R-12-018）；撤回只校验申请人本人 + 审批中（R-12-032、D-00-79②）" }
  - { page: 13-导航与权限, ids: [R-13-020], uses: "本页全部内部动作只用「客户登记管理」一个权限点控制、只能处理本人创建的登记表（D-00-70）；13 汇总菜单与权限点清单（R-01-037）" }

rules:
  # 新增
  - { id: R-01-001, module: 新增, text: 登记表名称必填，不做重名校验 }
  - { id: R-01-002, module: 新增, text: 链接有效期单选 48 小时 / 72 小时，默认 48 小时；从创建成功那一刻起算，expires_at = created_at + 有效期；到期时仍为待填写的登记表转为已过期，链接失效（D-01-05） }
  - { id: R-01-003, module: 新增, text: 提交通知单选 企业微信 / 邮箱 / 不通知，默认企业微信；选企业微信且当前账号已绑定企业微信时不展示任何输入框；未绑定时直接弹出个人中心的「绑定企业微信」弹窗，交互与广告管理-添加监控一致 }
  - { id: R-01-004, module: 新增, text: 提交通知选邮箱时展示邮箱输入框，自动回填个人中心里的邮箱，可编辑，必填并做简单邮箱格式校验 }
  - { id: R-01-005, module: 新增, text: 点击「创建并复制填写链接」：创建登记表（状态待填写），把填写链接复制到剪贴板，关闭弹窗，弱提示「创建成功，已复制填写链接至剪贴板」；写剪贴板失败按 R-01-038 }
  - { id: R-01-006, module: 新增, text: 选企业微信但绑定弹窗被关闭、仍未绑定时，不能创建，停留在新增弹窗 }
  - { id: R-01-038, module: 新增, text: "写剪贴板失败兜底（D-01-21）：创建成功后（R-01-005）或在列表点「待填写」（R-01-013）时写剪贴板失败，弹出窗口显示「复制失败，请手动复制」、填写链接全文（可全选）和「复制」按钮，右上角 ✕ 关闭；创建场景下登记表照常创建，新增弹窗关闭，列表照常出现这一行" }
  # 列表
  - { id: R-01-007, module: 列表, text: 搜索框按登记表名称、登记表ID 包含匹配 }
  - { id: R-01-008, module: 列表, text: 列表只展示当前登录账号创建的登记表，账号之间互相看不到 }
  - { id: R-01-009, module: 列表, text: 状态筛选为 全部 / 待填写 / 待审核 / 待关联 / 待开户 / 已开户 / 已过期 / 未通过，默认全部（D-01-01 增加未通过） }
  - { id: R-01-011, module: 列表, text: 排序：待审核置顶；同组内按创建时间降序 }
  - { id: R-01-012, module: 列表, text: 列表字段：登记表名称、登记表ID、关联客户、客户ID、所属账户系统、绑定账户、绑定账户ID、状态、创建时间、操作；关联客户/客户ID 在 04 关联后展示，所属账户系统/绑定账户/绑定账户ID 在 02 绑定后展示，未关联时展示「-」；分页 10/50/100/300 条每页，展示总条数 }
  - { id: R-01-013, module: 列表, text: 状态为待填写时，状态文字可点击，点击复制填写链接，弱提示「已复制填写链接至剪贴板」；写剪贴板失败按 R-01-038 }
  - { id: R-01-014, module: 操作, text: 行操作按状态显示，不可操作的按钮隐藏：详情=全部状态；编辑=待填写（只改登记表名称，R-01-039）/待审核/待关联/待开户/已开户；审核=待审核；删除=待填写/待审核/待关联/已过期/未通过（R-01-017）；规则配置=待关联/待开户/已开户（D-01-08） }
  - { id: R-01-037, module: 权限, text: "客户登记表的内部动作（进入列表、新增、详情、编辑、复制填写链接、审核、删除，以及从列表点「规则配置」）只用一个权限点「客户登记管理」控制（D-00-70、R-13-020）；有该点的人只能处理本人创建的登记表（R-01-008），各状态显示哪些按钮仍按 R-01-014。没有该点时：导航不显示「客户登记表」菜单；直接访问列表或登记表地址显示「无权限访问」；服务端对上述动作的请求同样校验并拒绝，不产生任何变更。权限被收回后，本人已创建的登记表不转移归属、不改状态，填写链接照常可填（按 R-01-028）；创建人也删不了这些登记表（已知限制，D-01-22）。规则配置页本身的访问与规则配置审批详情的查看沿用 03 的放开口径（D-03-22、D-03-23），不受本条限制。撤回本人提交的规则配置审批单也不受本条限制：只校验申请人本人且单据审批中（D-00-79②、R-12-032），权限被收回后仍可在审批详情页撤回" }
  - { id: R-01-010, module: 操作, text: "详情、编辑、审核弹窗里的登记内容与填写页字段一致；详情只读、不展示底部按钮；编辑只有「保存」按钮；待填写状态的详情展示客户最近一次保存的内容，未保存过则字段为空。详情顶部按状态多显示一行（D-01-21）：待填写 → 填写链接文本 + 「复制」按钮（失败按 R-01-038）+ 链接到期时间（北京时间 yyyy-mm-dd hh:mm:ss）；已过期 → 「已于 {到期时间} 过期」；其他状态不显示。登记内容只读展示格式（本页详情、02 预览 R-02-022、04 客户材料绑定行详情 R-04-060）：日预算千分位 + 2 位小数（如 5,000.00）；KPI要求、备注等多行文本完整展示、保留换行、不截断；编辑、审核弹窗输入框里日预算不加千分位" }
  - { id: R-01-015, module: 审核, text: 审核弹窗顶部是登记表名称（R-01-039），下面是登记内容，都可编辑；按钮为 保存 / 审核通过 / 审核不通过；点保存只保存、不关闭弹窗；点审核通过时先保存当前内容（按 R-01-018 校验），再把状态改为待关联并关闭弹窗 }
  - { id: R-01-016, module: 审核, text: 点审核不通过需二次确认，确认后状态改为未通过（终止），不需要填原因；未通过不通知客户（D-01-01） }
  - { id: R-01-017, module: 操作, text: "删除（D-01-18）：创建人可删除未关联客户的登记表，即待填写、待审核、待关联、已过期、未通过；待开户、已开户不能删（等同解绑，D-01-16）。删除前二次确认：待填写文案为「删除后客户将无法再打开填写链接，已填写的内容一并删除，确认删除吗？」，其他状态沿用现有删除确认。服务端在确认后按最新数据校验：状态仍在可删范围、创建人是当前账号、没有审批中的规则配置审批单；有审批中的规则配置审批单 → 不删，提示「该登记表有审批中的规则配置，请先撤回」；状态已变为待开户 / 已开户 → 不删，提示「状态已变化，请刷新」并刷新该行。删除成功后从列表消失，填写链接 404（R-01-028）；客户正开着填写页的，下一次保存（含自动保存）或提交失败、页面转 404（R-01-030）。这张表已结束的规则配置审批单仍保留在「已提交审批」和审批中心，可照常打开详情：登记表名称取删除时的名称，并标「（已删除）」；审批内容区的公司、所属账户系统、关联账户显示「暂未关联」（R-03-048）；查看范围里的创建人按删除时判断（R-03-050）（D-01-22）" }
  - { id: R-01-018, module: 操作, text: "内部编辑或审核弹窗保存不改变状态，也不同步到已关联的客户、账户（D-01-06）。保存和审核通过时校验（D-01-14）：登记表名称必填（R-01-001）、R-01-027 列出的必填项、格式 R-01-023 和 R-01-026；不校验 R-01-025 的日期下限，产品投放日期可为任意日期，日期选择器不禁用过去的日子（D-01-20）；服务端同口径。待填写的编辑弹窗只校验登记表名称必填（R-01-039）" }
  - { id: R-01-019, module: 操作, text: 点「规则配置」打开该登记表的规则配置页，页面内容、提交审批规则由 03-规则配置定义 }
  - { id: R-01-039, module: 操作, text: "改名称（D-01-19）：登记表名称在待填写、待审核、待关联、待开户、已开户都可改；待填写点「编辑」的弹窗只有「登记表名称」一项（登记内容由客户在填，内部不改，避免与客户自动保存互相覆盖）；其他状态的编辑、审核弹窗顶部是「登记表名称」输入框；名称必填、不做重名校验（R-01-001）；改名不改状态、不改有效期；本页列表与「已提交审批」、02 添加账户登记表下拉与编辑弹窗、04 客户材料等显示登记表名称的地方一律取当前名称；登记表已删除的，审批单上按 R-01-017 取删除时的名称并标「（已删除）」" }
  # 填写页
  - { id: R-01-020, module: 填写页, text: 每张登记表有独立的填写链接，免登录访问；链接不可被猜到（具体生成方式由技术定） }
  - { id: R-01-028, module: 填写页, text: 链接只在有效期内可访问，过了 expires_at 一律 404，与登记表状态无关；有效期内：待填写 → 填写页；已提交过（待审核/待关联/待开户/已开户/未通过）→ 展示「提交成功，工作人员会尽快联系您」，不可编辑；已删除或链接不存在 → 404（D-01-04、D-01-09）。链接过期只影响访问，已提交的登记表状态不变 }
  - { id: R-01-021, module: 填写页, text: 签约主体名称为单行输入框 }
  - { id: R-01-022, module: 填写页, text: 投放产品与参考竞品通过应用搜索选择（应用名称 + 应用ID，搜索数据源沿用现有应用搜索）；投放产品只能 1 个，再选会替换；参考竞品可多选，选中后弱提示「选择成功」，并在输入框下方追加一个应用；同一应用在参考竞品里不重复添加，已添加的可移除。另有三条（D-01-21）：①应用搜索的商店地区默认值按浏览器语言：zh 开头默认中国大陆，其他默认美国，可手动切换，只影响搜索、不保存，与「产品投放地区」无关；②下拉按钮文案与字段名一致：投放产品「设为投放产品」，参考竞品「添加为参考竞品」，英文版按 R-01-031 翻成同一套词；③同一应用不能既是投放产品又是参考竞品：已选为一方的应用在另一方的搜索结果里按钮置灰，提示「已选为投放产品」/「已添加为参考竞品」。内部编辑、审核弹窗用同一组件，规则相同 }
  - { id: R-01-023, module: 填写页, text: 苹果账户邮箱、ASC关联邮箱做简单邮箱格式校验（含 @ 和域名后缀） }
  - { id: R-01-025, module: 填写页, text: 产品投放日期选单日，不可选今天之前的日期（「今天」按客户浏览器本地日期）；选择器下方提示「建议提前预留 2-3 天」；本条只在客户填写页生效，内部编辑、审核弹窗不校验日期下限（R-01-018） }
  - { id: R-01-026, module: 填写页, text: 日预算只填数字，必须大于 0，最多 2 位小数，不带币种（D-01-10） }
  - { id: R-01-024, module: 填写页, text: 「保存」与每 1 分钟自动保存只保存当前内容，不提交、不校验必填和格式；保存成功后页面顶部显示「yyyy-mm-dd hh:mm:ss 已保存」（客户浏览器本地时间）；再次打开链接时回显最近一次保存的内容；有未保存的修改（最近一次修改晚于最近一次成功保存）时，关闭、刷新、离开页面由浏览器弹出默认离开确认（文案由浏览器决定），没有未保存修改、提交成功后、页面已转 404 时不弹（D-01-21） }
  - { id: R-01-027, module: 填写页, text: 提交时校验全部必填项（签约主体名称、投放产品、苹果账户邮箱、ASC关联邮箱、投放类型、产品投放日期、产品投放地区、日预算、KPI要求）与格式（R-01-023、R-01-025、R-01-026），不通过时不发起提交并在对应字段下提示 }
  - { id: R-01-029, module: 填写页, text: 校验通过后二次确认「请确认是否提交？」；确认后状态改为待审核、写入提交时间，页面展示「提交成功，工作人员会尽快联系您」 }
  - { id: R-01-030, module: 填写页, text: 提交或保存时登记表已过期或已被删除（R-01-017），提交/保存失败，页面转为 404 }
  - { id: R-01-031, module: 填写页, text: 页面语言按客户浏览器语言：中文（zh 开头）显示简体中文，其他一律英文；不提供手动切换；影响范围包括字段名、输入框提示、地区名、提示语、确认框、提交成功文案 }
  # 通知
  - { id: R-01-032, module: 通知, text: "客户提交成功后，按该登记表的提交通知方式通知归属者：企业微信发到归属者绑定的企业微信，邮箱发到创建时填写的邮箱，不通知则不发；内容「您创建的{客户登记表名称}客户已提交，请前往审核。」；通知发送失败不影响提交结果" }
  # 已提交审批 tab
  - { id: R-01-033, module: 已提交审批, text: 列表页顶部有「客户登记表 / 已提交审批」两个切换；已提交审批只展示当前账号提交的客户登记表规则配置审批单，含免审单（0 节点或节点全部跳过、提交即已通过，状态显示已通过，R-12-018）。只含在线登记表的规则配置单；04 历史上传文件 / 迁移占位行的规则单不在此（R-03-053） }
  - { id: R-01-034, module: 已提交审批, text: 搜索按审批单号、登记表名称；状态筛选 全部 / 审批中 / 已通过 / 已驳回 / 已撤回，默认全部 }
  - { id: R-01-035, module: 已提交审批, text: 列表字段：审批单号、客户登记表（名称；登记表已删除的取删除时的名称并标「（已删除）」，R-01-017）、操作对象（固定「规则配置」）、申请人、申请时间、审批状态、操作；排序：审批中置顶，其余按申请时间降序 }
  - { id: R-01-036, module: 已提交审批, text: 行操作：所有状态可「详情」，新页打开该审批单的审批详情（通用框架见 12，记录内容见 03）；仅审批中可「撤回」，撤回只校验申请人本人且单据审批中、不校验「客户登记管理」等业务权限点（D-00-79②、R-12-032），撤回的确认文案与后果按 12-审批配置与审批中心统一定义，与客户管理已提交审批一致（D-01-11） }

