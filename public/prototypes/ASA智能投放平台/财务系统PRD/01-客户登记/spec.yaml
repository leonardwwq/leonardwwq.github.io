  - { id: G-01-031, given: "待填写登记表 A，名称「测试A」；已开户登记表 F，名称「F-旧」，绑定账户 Acc1、关联客户 K，有一张已通过的规则配置审批单", when: "①对 A 点编辑，改名为「测试A-改」保存；②对 F 点编辑，把顶部登记表名称改为「F-新」保存", then: "①编辑弹窗只有登记表名称一项；保存后列表显示「测试A-改」，状态仍为待填写；②F 仍为已开户；本页「已提交审批」里 F 的审批单、02 账户 Acc1 编辑弹窗的登记表一栏、04 客户 K 客户材料的登记表行都显示「F-新」（R-01-039）" }
  - { id: G-01-032, given: "今天为 2026-10-21；待审核登记表 M，客户填的产品投放日期为 2026-10-18；待关联登记表 N", when: "①打开 M 的审核弹窗，不改日期直接点审核通过；②打开 N 的编辑弹窗，在日期选择器里选 2026-10-10 后保存", then: "①审核通过，M 变为待关联，不提示日期错误；②2026-10-10 可选，保存成功，不提示日期错误（R-01-015、R-01-018）" }
  - { id: G-01-035, given: "登记表 X 日预算为 5000，KPI要求为 3 行文本，已绑定账户 Acc1", when: "①本页打开 X 的详情；②在 02 预览 Acc1 的登记表；③本页打开 X 的编辑弹窗", then: "①②日预算显示 5,000.00，KPI要求 3 行完整显示、保留换行；③日预算输入框里不带千分位分隔符（R-01-010）" }
  - { id: G-01-023, given: 已开户的登记表，已绑定账户的投放类型为代投, when: 内部编辑登记表把投放类型改为自投并保存, then: 登记表状态仍为已开户；账户的投放类型仍为代投 }
  - { id: G-01-024, given: 状态待填写的登记表，客户保存过签约主体名称, when: 内部点详情, then: 只读展示客户保存的内容，无底部按钮 }
  - { id: G-01-025, given: 当前账号提交过 3 张规则配置审批单（审批中、已通过、已驳回各一）, when: 切换到已提交审批, then: 审批中那张排第一，其余按申请时间降序；操作对象列都显示「规则配置」；只有审批中那张有撤回；三张都有详情 }
