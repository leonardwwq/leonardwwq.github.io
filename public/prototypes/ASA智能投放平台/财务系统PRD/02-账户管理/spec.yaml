  - { id: T-02-003, title: "编辑账户信息弹窗：字段调整、只读项、投放类型可改、被删字段老值不动", depends_on: [], done_when: "G-02-014～G-02-017 通过" }
  - { id: T-02-004, title: "登记表预览（编辑弹窗 + 列表文件 icon 复用）", depends_on: [T-01-001], done_when: "G-02-018～G-02-020 通过" }
  - { id: T-02-005, title: "账户「销售」改为实时取所属客户的销售；销售的账户数据权限同步（含上线补授权 S-22）", depends_on: [], done_when: "G-02-013、G-02-024 通过；列表、筛选、导出、审批绑定的销售、数据授权都不再读账户旧销售值" }
  - { id: T-02-006, title: "账户「优化师」变更记录（添加时记初始值、编辑保存时记变更与生效时间）", depends_on: [T-02-002, T-02-003], done_when: "G-02-021、G-02-026 通过" }
  - { id: T-02-007, title: "已禁用用户的显示与保留（优化师 / 合作者 / 观察者）", depends_on: [T-02-003], done_when: "G-02-025 通过" }

decisions:
  - { id: D-02-01, point: "投放类型回填后能否改、改了是否审批", conclusion: "添加时回填作默认值、可改；编辑也可改，不走审批；不回写登记表", impact: "添加页、编辑弹窗", status: 已定 }
  - { id: D-02-02, point: "被删字段老账户已有值怎么处理", conclusion: "库里保留，前端不显示不能改，不迁移不清空；下游谁还在读已由技术核实（2026-10-21 技术答复 T20），改读新来源（R-02-015）", impact: "编辑弹窗、历史数据、下游 03/05/11", status: 已定 }
  - { id: D-02-03, point: "新账户的销售从哪来", conclusion: "账户不再维护销售；账户列表、高级筛选里的账户销售实时取所属客户的销售；提成按业务日历史归属（D-00-72），不实时取。2026-10-21 会议清单 D92-口径措辞收窄（A 档默认采纳）", impact: "账户列表销售列、高级筛选、04 客户销售字段", status: 已定 }
  - { id: D-02-04, point: "添加账户能选哪些登记表", conclusion: "所选客户名下、待开户、未绑账户的登记表，不限创建人", impact: "添加页", status: 已定 }
  - { id: D-02-05, point: "登记表预览看什么、谁能看", conclusion: "只读展示登记内容（同 01 详情），能打开编辑弹窗 / 看到该账户的人都能看，不受创建人隔离；历史上传文件沿用原预览；没有登记表显示「-」", impact: "编辑弹窗、账户列表", status: 已定 }
  - { id: D-02-06, point: "账户列表文件 icon 预览是否纳入", conclusion: "纳入，与编辑弹窗复用同一套预览，列表其他部分不动", impact: "账户列表", status: 已定 }
  - { id: D-02-07, point: "确认稿细节（我提议、用户认可）", conclusion: "未选登记表时投放类型不预选、换表重新回填；无待开户登记表时提示且不能添加；提交 guard 不满足则不建账户并提示重选；建账户 + 系统生成字段 + 登记表已开户 + 回写同成同败；软件名称/ID = 投放产品的应用名称/应用ID；本页不新增权限点", impact: "添加页、权限", status: 已定 }
  - { id: D-02-08, point: "客户换销售后销售对账户的数据权限", conclusion: "开户时按客户当前销售授权；换销售生效时授予新销售客户名下全部账户、收回旧销售因销售身份获得的授权（同时是优化师 / 合作者 / 观察者的保留）；上线补授权一次（S-22）。2026-10-21 用户定，会议清单 D23", impact: "数据权限、05 客户可见性、04", status: 已定 }
  - { id: D-02-09, point: "所属客户下拉范围", conclusion: "客户账户系统取自名下第一个账户、新客户为空；下拉 = 账户系统等于当前或为空的客户（照现状），不受 D-00-77 客户数据范围限制、列出全部客户（2026-10-21 用户确认改口：添加账户都由优化师操作、他们能看到全部客户，维持这个逻辑；index D-00-77 已列此例外）；去掉「无用户」图标；服务端补校验所属客户必填、账户系统一致。2026-10-21 用户定，会议清单 D72-客户过滤（技术答复 T17）、D73-图标（T18）、D88（T07）、D113（T05）", impact: "添加页", status: 已定 }
  - { id: D-02-10, point: "添加页切换账户系统是否改全局", conclusion: "只在本页生效，返回不切全局；添加成功后才按 R-02-013 切换。2026-10-21 用户定（A 档默认采纳），会议清单 D72-全局切换", impact: "添加页", status: 已定 }
  - { id: D-02-11, point: "优化师与合作者 / 观察者是否互斥", conclusion: "三者互斥，后选覆盖。2026-10-21 用户定（A 档默认采纳），会议清单 D73-互斥", impact: "添加页", status: 已定 }
  - { id: D-02-12, point: "已禁用用户怎么显示、编辑时保不保留", conclusion: "按 D-00-83：显示「姓名（已禁用）」；保存时原值保留、不算变更；改选只能选启用用户。本页落到优化师 / 合作者 / 观察者（账户列表、编辑弹窗、授权弹窗）。2026-10-21 用户定（A 档默认采纳），会议清单 D41-显示与保存", impact: "账户列表、编辑弹窗、授权弹窗", status: 已定 }
  - { id: D-02-13, point: "订单号是否唯一", conclusion: "不要求唯一，生成规则不改（下游不依赖唯一）。2026-10-21 用户定，会议清单 D114（技术答复 T19）", impact: "系统生成字段", status: 已定 }
  - { id: D-02-14, point: "上线迁移补建的「上线迁移补建（无附件）」行在 02 怎么显示", conclusion: "视同没有登记表：编辑弹窗登记表一栏显示「-」、没有预览，账户列表不显示文件 icon（R-02-021）。2026-10-21 用户确认（对应开放问题关闭）", impact: "编辑弹窗、账户列表", status: 已定 }
  - { id: D-02-15, point: "授权弹窗里客户的销售怎么显示、能否移除", conclusion: "客户当前的销售按「销售」只读显示、不能移除（同优化师）；可以再设为合作者或观察者，之后换销售时这个身份保留；移除合作者 / 观察者时，此人如果仍是客户销售，销售授权保留（R-02-027④）。2026-10-22 用户与技术确认，闭环清单 A15", impact: "授权弹窗、销售数据权限", status: 已定 }
  - { id: D-02-16, point: "旧「账户金额」接口及其导出", conclusion: "前端已无任何页面调用，本期下线（原 Q-02-04）。2026-10-22 用户与技术确认，闭环清单 E 组 Q-02-04", impact: "旧接口与导出", status: 已定 }

