  - { id: G-02-010, module: 添加账户, given: "所有必填项已填，登记表选 X；技术模拟创建账户那一步失败", when: "点添加并确认", then: "提示「操作失败」，页面保留已填内容；没有新账户；X 仍为待开户，未绑定账户；所属客户状态仍为待开户" }
