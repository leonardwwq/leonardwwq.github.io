  - { id: G-02-024, module: 销售, given: "客户「星河互娱」销售为李明，名下有账户 A（优化师王五，李明因销售身份已获授权）、B（合作者含李明）", when: "①以「星河互娱」添加账户 C 成功，李明登录看账户列表；②在客户管理把销售改为王芳并保存成功；③李明、王芳分别登录看账户列表", then: "①李明能看到 A、B、C；③王芳能看到 A、B、C；李明只能看到 B（作为合作者保留），看不到 A、C（R-02-027、R-02-011）" }
