  - { id: G-02-014, module: 编辑账户, given: "账户 A（已绑登记表 X）", when: "点行操作「编辑」", then: "弹窗显示 账户ID（灰显不可改）、账户名称、所属客户（灰显不可改）、登记表「X 的名称 + 预览」、产品分类、投放类型、优化师，均回显当前值；没有被删字段，也没有合作者、观察者" }
  - { id: G-02-015, module: 编辑账户, given: "账户 A 投放类型为自投，登记表 X 投放类型为自投", when: "编辑弹窗把投放类型改成代投并确认", then: "提示「操作成功」，弹窗关闭，账户 A 投放类型为代投；没有生成任何审批单；X 的投放类型仍为自投" }
  - { id: G-02-016, module: 编辑账户, given: "老账户 B 库里 授信额度 = 10,000.00、客户返点 = 3.00%", when: "编辑弹窗只改优化师并确认", then: "保存成功；弹窗里看不到授信额度、客户返点；库里这两个值仍为 10,000.00、3.00%（技术核验）" }
  - { id: G-02-017, module: 编辑账户, given: "账户 A 的编辑弹窗", when: "清空账户名称后点确认", then: "账户名称下提示必填，弹窗不关，不保存" }
