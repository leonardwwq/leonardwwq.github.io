  - { id: G-02-022, module: 添加账户, given: "全局账户系统为 A；客户「星河互娱」账户系统为 A，新客户「晨曦文旅」还没有账户系统，客户「海岸传媒」账户系统为 B", when: "进入添加账户页，选客户「星河互娱」、登记表 X、优化师乙；把账户系统切到 B；再点「返回」", then: "切到 B 后「账户选择」重新加载且为空选，所属客户与登记表被清空，优化师乙保留；所属客户下拉里有「海岸传媒」「晨曦文旅」，没有「星河互娱」；返回列表后全局账户系统仍为 A（R-02-003）" }
  - { id: G-02-023, module: 添加账户, given: "同 G-02-022 的三个客户；另有客户「远山科技」账户系统为 A，当前用户（非 sys）既不是它的销售、也不是它名下任何账户的优化师", when: "在账户系统 A 下展开所属客户下拉；选「晨曦文旅」和它的待开户登记表添加账户成功；再把账户系统切到 B 展开下拉", then: "A 下可选「星河互娱」「晨曦文旅」「远山科技」（远山科技不在当前用户的客户数据范围内也照常列出，D-00-77 例外），没有「海岸传媒」，选项不带图标；添加成功后「晨曦文旅」的账户系统为 A，切到 B 时下拉里不再有「晨曦文旅」（R-02-004、R-02-011）" }
  - { id: G-02-027, module: 添加账户, given: "客户「海岸传媒」账户系统为 B", when: "技术绕过页面，在账户系统 A 下以「海岸传媒」为所属客户调用添加账户；再不传所属客户调用一次", then: "两次都不创建账户，提示「所属客户与账户系统不匹配，请重新选择」；登记表状态不变（R-02-010）" }
