  - { id: G-02-018, module: 登记表预览, given: "账户 A 绑定登记表 X（商务甲创建）；优化师乙有编辑账户权限", when: "乙打开 A 的编辑弹窗点「预览」", then: "弹层只读展示 X 的登记内容（签约主体名称、投放产品、参考竞品、苹果账户邮箱、ASC关联邮箱、投放类型、产品投放日期、产品投放地区、日预算、KPI要求、三方归因平台、备注），没有编辑、保存按钮" }
  - { id: G-02-019, module: 登记表预览, given: "老账户 B 绑定的是历史上传文件「星河互娱登记表.pdf」；老账户 C 没有登记表", when: "分别打开 B、C 的编辑弹窗", then: "B 显示「星河互娱登记表.pdf」+ 预览，点预览按原方式打开文件；C 的登记表一栏显示「-」，没有预览" }
  - { id: G-02-020, module: 登记表预览, given: "账户 A 绑定登记表 X；账户 C 没有登记表", when: "在账户管理列表看 A、C 的账户名称，点 A 左侧文件 icon", then: "A 有文件 icon，点开与编辑弹窗里的预览内容一致；C 没有文件 icon" }
  # 优化师变更记录
  - { id: G-02-021, module: 优化师变更, given: "账户 A 的优化师为王五（上线后添加账户时设定）", when: "2026-10-15（UTC0）在编辑弹窗把 A 的优化师改为赵六，点确认保存成功；再只改 A 的账户名称并保存", then: "系统能查到 A 的优化师变更记录：变更前王五、变更后赵六、生效时间为第一次保存成功的时刻（技术查库核验）；第二次保存没有新增变更记录；11-提成中心里 A 的 2026-10-14 归王五、2026-10-15 起归赵六（R-11-003）" }
  - { id: G-02-026, module: 优化师变更, given: "账户 D 在 2026-10-10 起已有消耗；2026-10-15（UTC0）添加进系统，初始优化师赵六，所属客户销售李明", when: "看 06 结算期 2026-10 的账单、10 利润与 11 提成", then: "06、10 的 D 包含 2026-10-10 起的消耗；11 中 D 的 2026-10-10～10-14 归优化师赵六、销售李明（R-02-026）" }
  # 已禁用用户
  - { id: G-02-025, module: 已禁用用户, given: "账户 A 的优化师为王五，王五账号已禁用", when: "①打开 A 的编辑弹窗；②只改账户名称并确认；③再打开弹窗，展开优化师下拉，改选赵六并确认；④再展开优化师下拉", then: "①优化师显示「王五（已禁用）」；②保存成功，优化师仍为王五，没有新增优化师变更记录；③候选里没有王五，保存成功，记一条王五 → 赵六的变更；④候选里仍没有王五（R-02-028）" }

