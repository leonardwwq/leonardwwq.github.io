  - { id: G-02-007, module: 添加账户, given: "所有必填项已填，登记表选 X（待开户）", when: "点「添加」→ 二次确认点「确认」", then: "提示「操作成功」并跳进新账户内部；回到账户管理能看到该账户；01 客户登记表列表里 X 的状态为已开户，所属账户系统、绑定账户、绑定账户ID 显示为这个账户；所属客户原为待开户的，客户管理里变为待投放（再加第二个账户的情形见 G-04-002）" }
  - { id: G-02-008, module: 添加账户, given: "登记表 X 的投放产品为「星河消除 · 应用ID 1234567890」", when: "选 X 添加账户成功", then: "新账户的 公司/产品名称 = 星河消除，订单号 = hby1234567890，主要联系人姓名 = hby，主要联系人邮箱 = asa@hbyaso.com，结算联系人邮箱 = asabill@hbyaso.com（技术查库或接口核验）；添加页和编辑弹窗都看不到这 5 个字段" }
