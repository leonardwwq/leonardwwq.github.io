scope:
  in:
    - "添加账户页（版本记录 #2）：字段增删、所属客户 → 登记表级联、投放类型回填、提交校验与 guard、系统生成字段、触发登记表 待开户→已开户"
    - "编辑账户信息弹窗（版本记录 #1）：字段增删、只读项、投放类型可改"
    - "登记表预览：编辑弹窗与账户列表文件 icon 共用（D-02-06）"
    - "账户「销售」的取值来源（D-02-03）与销售对账户的数据权限（R-02-027）"
    - "已禁用用户在优化师 / 合作者 / 观察者上的显示与保留（R-02-028）"
    - "账户「优化师」变更记录（R-02-026，供 11 按业务日取值，无展示界面）"
    - "下线旧「账户金额」接口及其导出（D-02-16）"
  out:
    - "账户管理列表的其他部分（数据概览、搜索、高级筛选、导出、表头编辑、授权弹窗、账户内部页）：无改动，沿用；授权弹窗里客户销售的只读显示见 R-02-027④"
    - "客户登记表实体与状态机（归 01-客户登记，本页只触发 待开户→已开户）"
    - "客户实体、客户状态机、客户上的「销售」字段（归 04-客户管理；本页只触发 待开户→待投放，见 refs）"
    - "被删字段老值的迁移或清空（D-02-02：保留不动）；还在读老值的下游改从新来源取（R-02-015，技术已核实）"
    - "解绑登记表 / 更换登记表（本期没有，D-01-16）"
    - "编辑账户走审批（不走，D-02-01）"
    - "更换账户的所属客户、账户系统（本期不能改，R-02-017）"

roles:
  - { role: "内部用户（有添加账户权限）", can: ["打开添加账户页", "选择所属客户名下任一待开户登记表（不限创建人）", "添加账户"], cannot: ["选择非待开户或已绑账户的登记表"], source: "沿用现有「添加账户」权限点，本页不新增（R-02-025）" }
  - { role: "内部用户（有编辑账户权限）", can: ["打开编辑账户信息弹窗", "修改账户名称、产品分类、投放类型、优化师", "预览账户绑定的登记表"], cannot: ["修改账户ID、所属客户、登记表", "修改被删字段"], source: "沿用现有「编辑账户」权限点，本页不新增（R-02-025）" }
  - { role: "能看到该账户的内部用户", can: ["在账户列表点文件 icon 预览登记表"], cannot: ["在预览里编辑登记表"], source: "跟随账户的现有查看权限（D-02-05）" }

entities:
  - name: 账户
    key: account
    note: "只列本版动到的字段；其余字段沿用现有。key 为文档内称呼，落库沿用现有字段名，由技术对应"
    fields:
      - { key: account_id, label: 账户ID, type: string, required: true, rule: "来自「账户选择」所选的账户；编辑时只读（R-02-017）" }
      - { key: account_name, label: 账户名称, type: string, required: true, rule: "编辑弹窗可改（R-02-017）；添加时取所选账户的名称，沿用现有" }
      - { key: account_system, label: 账户系统, type: ref, required: true, rule: "R-02-003" }
      - { key: customer_id, label: 所属客户, type: ref, required: true, rule: "添加时必选（服务端同校验，R-02-010），之后只读（R-02-004、R-02-017）；存量取不到的由 S-21 补齐" }
      - { key: registration_id, label: 登记表, type: ref, required: false, rule: "v2.1.0 起新增账户必选，指向 01 的客户登记表；之后只读；老账户可能为空或指向历史上传文件（R-02-021）" }
      - { key: product_category, label: 产品分类, type: ref, required: true, rule: "下拉可搜索，取现有产品分类" }
      - { key: delivery_type, label: 投放类型, type: enum, required: true, enum: [代投, 自投], rule: "R-02-007、R-02-018" }
      - { key: optimizer, label: 优化师, type: ref, required: true, rule: "下拉可搜索，候选为启用用户（R-02-028）；与合作者、观察者互斥（R-02-014）；每次变化记录前后值与生效时间（R-02-026）；即审批「绑定的运营」解析来源与客户可见范围依据（D-00-76、D-00-77）" }
      - { key: collaborators, label: 合作者, type: list, required: false, rule: "仅添加页，R-02-014、R-02-028；编辑走授权弹窗（沿用）" }
      - { key: observers, label: 观察者, type: list, required: false, rule: "仅添加页，R-02-014、R-02-028；编辑走授权弹窗（沿用）" }
      - { key: company_product_name, label: 公司/产品名称, type: string, required: true, generated: true, rule: "R-02-012" }
      - { key: order_no, label: 订单号, type: string, required: true, generated: true, rule: "R-02-012" }
      - { key: primary_contact_name, label: 主要联系人姓名, type: string, required: true, generated: true, default: hby, rule: "R-02-012" }
      - { key: primary_contact_email, label: 主要联系人邮箱, type: string, required: true, generated: true, default: asa@hbyaso.com, rule: "R-02-012" }
      - { key: billing_contact_email, label: 结算联系人邮箱, type: string, required: true, generated: true, default: asabill@hbyaso.com, rule: "R-02-012" }
      - { key: sales, label: 销售, type: ref, required: false, generated: true, rule: "不在账户上维护，列表 / 筛选 / 导出实时取所属客户的销售（R-02-015）；数据权限按 R-02-027" }

refs:
  - { page: 01-客户登记, entity: 客户登记表, ids: [R-01-010, R-01-018, D-01-06, D-01-15, D-01-16], uses: "添加账户选中登记表并提交成功 → 触发 待开户→已开户（guard 由本页 R-02-010 定义）；同时写入 01 的 account_system、account_id；投放类型从 delivery_type 回填一次（D-01-06）；预览展示 R-01-010 的登记内容；一表一户、无解绑" }
  - { page: 04-客户管理, entity: 客户, ids: [R-04-004, R-04-006, R-04-007, R-04-064, D-04-12], uses: "客户销售变更生效时按 R-02-027 同步账户数据权限（时点同 R-04-064）；添加账户成功且所属客户为待开户时触发客户 待开户→待投放，与建账户同成同败（R-04-007，R-02-011 第⑤步）；新建客户审批中的客户不能被选为所属客户（R-04-006、D-04-12）；账户销售实时取客户的销售字段（R-04-004）" }
  - { page: 12-审批配置与审批中心, ids: [R-12-015, R-12-016], uses: "「绑定的销售」读客户销售、「绑定的运营」读本单涉及账户的优化师（D-00-76）；提交时快照，之后改优化师 / 授权不影响在途单（R-12-015）" }
  - { page: 06-账单与结算单, ids: [R-06-005], uses: "账户添加成功前已有消耗的日子照常计入账单（R-02-026）" }
  - { page: 11-提成中心, entity: 提成结果日明细, ids: [R-11-003, D-00-72], uses: "本页记录账户优化师每次变更的前后值与生效时间（R-02-026），供 11 按业务日取当日优化师；变更当天（UTC0）起归新人，上线前按上线时的值（D-00-72）" }

rules:
  # 添加账户页
  - { id: R-02-001, module: 添加账户, text: "账户管理列表点「添加账户」打开添加账户页（独立页面，面包屑「账户管理/添加账户」，底部按钮 返回 / 添加）；点「返回」回到账户管理列表，不保存已填内容" }
  - { id: R-02-002, module: 添加账户, text: "字段按顺序为：账户系统*、所属客户*、登记表*、账户选择*、产品分类*、投放类型*、优化师*、合作者、观察者；下拉都可搜索。以下字段不再展示：销售、授信额度、苹果返点、客户返点、新品截止日期、客情比例、公司/产品名称、订单号、主要联系人姓名、主要联系人邮箱、结算联系人邮箱（账户管理.html:9846）" }
  - { id: R-02-003, module: 添加账户, text: "账户系统默认填当前正在操作的账户系统。「账户选择」的可选账户在打开页面时和切换账户系统时重新查询，可选范围沿用现有实现（账户管理.html:9822）。在本页切换账户系统只在本页生效（D-02-10）：重新查询「账户选择」并清空已选账户；按 R-02-004 重新加载所属客户下拉，已选客户仍在新范围内就保留（登记表、投放类型随之保留），不在就清空所属客户和登记表、投放类型回到未选；产品分类、优化师、合作者、观察者保留。不改变全局账户系统；点「返回」回到列表时全局账户系统仍是进入前的那个。只有添加成功后才按 R-02-013 切换。" }
  - { id: R-02-004, module: 添加账户, text: "所属客户下拉的可选范围（D-02-09）：客户的账户系统等于本页所选账户系统，或客户还没有账户系统（新客户）。客户的账户系统取自它名下第一个账户：该客户第一个账户添加成功时写入（R-02-011 第⑥步），之后不再变。不受客户数据范围限制：有添加账户权限的用户（sys 与非 sys 一样）都列出全部满足上述账户系统条件的客户（D-00-77 例外；添加账户通常由优化师操作，2026-10-21 用户确认维持现状）。新建客户审批中的客户不在可选项里（R-04-006）。选项只显示客户名称，不带图标（现状里表示「客户尚未绑定账户系统」的「无用户」图标去掉）。切换所属客户时，清空已选的登记表，投放类型回到未选。" }
  - { id: R-02-005, module: 添加账户, text: "登记表与所属客户级联：未选所属客户时登记表下拉禁用，占位提示「请先选择所属客户」；选了客户后只列 关联客户 = 所选客户、状态 = 待开户、尚未绑定账户 的登记表，不限创建人（D-02-04）；选项显示「登记表名称（登记表ID）」，可按名称或 ID 搜索" }
  - { id: R-02-006, module: 添加账户, text: "所选客户名下没有符合 R-02-005 的登记表时，下拉展开显示「该客户暂无待开户的登记表」，无可选项；登记表为必填，因此无法添加" }
  - { id: R-02-007, module: 添加账户, text: "投放类型：未选登记表时两个选项都不选中；选中登记表后自动选中该登记表的投放类型（代投 / 自投），用户可手动改（D-02-01）；换选另一张登记表时按新登记表重新回填，覆盖手动修改" }
  - { id: R-02-008, module: 添加账户, text: "点「添加」先校验必填（账户系统、所属客户、登记表、账户选择、产品分类、投放类型、优化师），有缺失时在对应字段下提示「请选择{字段名}」，不弹二次确认" }
  - { id: R-02-009, module: 添加账户, text: "校验通过后二次确认「请确认信息是否正确？」（取消 / 确认）；点确认提交，请求处理中「添加」按钮显示加载且不可再点（账户管理.html:9822、9830）" }
  - { id: R-02-010, module: 添加账户, text: "提交 guard，也就是 01 登记表「待开户 → 已开户」的前置条件，按服务端最新数据判断：所选登记表状态仍是待开户、还没绑定任何账户、关联客户等于所选的所属客户。任一条不满足：不创建账户，登记表不变，提示「该登记表已被使用或状态已变化，请重新选择」，清空已选登记表并重新加载登记表下拉。服务端另校验（防止绕过页面直接调接口）：所属客户必填；所属客户的账户系统等于本次账户系统或为空（R-02-004；不按客户数据范围校验）。不满足时不创建账户，提示「所属客户与账户系统不匹配，请重新选择」，清空所属客户、登记表并重新加载所属客户下拉。" }
  - { id: R-02-011, module: 添加账户, text: "guard 通过后，下面八步同成同败：①创建账户（页面所填字段）；②写入系统生成字段（R-02-012）；③登记表状态 待开户 → 已开户；④在登记表上写入所属账户系统（account_system）、绑定账户ID（account_id）；⑤所属客户为待开户时，客户状态 待开户 → 待投放（流转与规则由 04 定义，见 R-04-007；客户已是其他状态则不变）；⑥所属客户还没有账户系统时，写入本次账户系统（R-02-004）；⑦记录优化师初始值（R-02-026）；⑧按所属客户当前销售授予该账户的数据权限（R-02-027）。任一步失败，八步都不生效，提示「操作失败」，页面保留已填内容。" }
  - { id: R-02-012, module: 添加账户, text: "系统生成字段（前端不展示、不能改）：公司/产品名称 = 所选登记表「投放产品」的应用名称；订单号 = 「hby」+ 投放产品的应用ID（如应用ID 1234567890 → hby1234567890）；主要联系人姓名 = hby；主要联系人邮箱 = asa@hbyaso.com；结算联系人邮箱 = asabill@hbyaso.com。只在添加时写一次，之后改登记表不同步（D-01-06）。订单号不要求唯一（D-02-13）：同一投放产品开多个账户时订单号相同，允许重复；订单号用作广告系列预算订单的默认值、08 苹果订单按订单号归集到账户（一个订单号对应多个账户时按消耗拆分，08 定义），都不依赖唯一。其余 4 个字段（公司/产品名称与 3 个联系人字段）存发票信息表（invoice），用途是新建 / 编辑广告系列时作为苹果 LOC 发票信息的默认值，沿用现有（Q-02-03 已关闭）。" }
  - { id: R-02-013, module: 添加账户, text: "添加成功后弱提醒「操作成功」，若该账户的账户系统与当前不同则切换过去，并跳转进该账户内部（账户管理.html:9822 第 3.5.3 条）" }
  - { id: R-02-014, module: 添加账户, text: "优化师、合作者、观察者三者互斥（D-02-11）：同一用户在其中一处被选中，就从另外两处移除（后选覆盖）。合作者、观察者是可搜索的复选下拉，优化师是可搜索的单选下拉；在合作者或观察者里选了当前优化师，优化师被清空，点添加时按 R-02-008 提示「请选择优化师」。优化师本身就能看到账户，互斥不减少任何人的可见范围。" }
  - { id: R-02-015, module: 销售, text: "账户不再维护「销售」：添加页、编辑弹窗都不展示。账户列表的销售列、高级筛选的销售、导出里的销售实时取账户所属客户的销售（D-02-03）；客户换了销售，这些地方跟着变。提成统计不实时取，按业务日的历史归属（R-11-003、D-00-72）。审批「绑定的销售」解析客户的销售（R-12-016），销售对账户的数据权限按 R-02-027。账户上的旧销售值保留不用（D-02-02），上述地方都不再读它。客户上的销售字段由 04 定义（R-04-004，原「商务」就是这个字段）。" }
  - { id: R-02-027, module: 销售, text: "销售对账户的数据权限（D-02-08）：①添加账户成功时，按所属客户当前销售授予该账户的数据权限（R-02-011 第⑧步；客户没有销售时不授予）。②客户销售变更生效时（04 直接保存成功、或客户信息变更审批通过，时点同 R-04-064），给新销售授予该客户名下全部账户的数据权限，同时收回旧销售因「客户销售」身份获得的授权；旧销售同时是某账户的优化师、合作者或观察者的，该账户的授权保留；销售改为空时只收回、不授予。③上线时按客户当前销售，给其名下全部账户补授权一次（S-22）。授权变化不改账户上的任何字段，也不影响在途审批单（R-12-015）。④授权弹窗里，客户当前的销售按「销售」只读显示、不能移除（同优化师）；可以再把他设为合作者或观察者，之后换销售时这个身份保留（按②保留授权）；移除合作者 / 观察者时，此人如果仍是客户销售，销售授权保留（D-02-15）。" }
  # 编辑账户信息弹窗
  - { id: R-02-016, module: 编辑账户, text: "账户列表行操作「编辑」打开「编辑账户信息」弹窗，按钮 关闭 / 确认（沿用入口）" }
  - { id: R-02-017, module: 编辑账户, text: "弹窗字段：账户ID（只读）、账户名称*（可改）、所属客户（只读）、登记表（只读，见 R-02-021）、产品分类*、投放类型*（代投 / 自投）、优化师*；打开时回显账户当前值。不展示 R-02-002 列出的被删字段，也不展示合作者、观察者（在「授权」弹窗里改，沿用）。所属客户、账户系统添加后不能改，本期没有更换入口。" }
  - { id: R-02-018, module: 编辑账户, text: "投放类型可改，点确认保存后直接生效，不走审批、不回写登记表；登记表后来改了投放类型也不同步到账户（D-02-01、D-01-06）" }
  - { id: R-02-019, module: 编辑账户, text: "点「确认」校验必填（账户名称、产品分类、投放类型、优化师），缺失时在字段下提示、不保存；保存成功关闭弹窗并弱提醒「操作成功」；失败提示「操作失败」，弹窗不关、保留输入；请求中「确认」按钮显示加载且不可再点。账户名称修改后的其他现有联动沿用" }
  - { id: R-02-020, module: 编辑账户, text: "被删字段（销售、授信额度、苹果返点、客户返点、新品截止日期、客情比例、公司/产品名称、订单号、主要联系人姓名、主要联系人邮箱、结算联系人邮箱）在库里的现有值，编辑保存时不修改、不清空（D-02-02）" }
  # 登记表预览
  - { id: R-02-021, module: 登记表预览, text: "编辑弹窗「登记表」一栏：绑的是 01 在线登记表 → 显示登记表名称 + 「预览」；绑的是历史上传文件 → 显示文件名 + 「预览」，预览沿用原文件预览；没有登记表 → 显示「-」，没有预览（D-02-05）。上线迁移给没有附件的存量账户补建的「上线迁移补建（无附件）」行（D-00-57，用于在 04 配规则）在本页视同没有登记表：显示「-」、没有预览，列表不显示文件 icon（D-02-14）。" }
  - { id: R-02-022, module: 登记表预览, text: "预览在线登记表：弹层只读展示这张登记表的登记内容，字段和展示格式和 01 的详情一致（R-01-010：日预算千分位 + 2 位小数，多行文本保留换行、不截断），取登记表当前的内容，登记表名称取当前名（R-01-039）；没有编辑、保存按钮，只能关闭。" }
  - { id: R-02-023, module: 登记表预览, text: "能打开编辑弹窗或能在列表看到该账户的人都可以预览，不受 01「只看自己创建的登记表」的限制（D-02-05）" }
  - { id: R-02-024, module: 登记表预览, text: "账户列表账户名称左侧的文件 icon 复用 R-02-021～R-02-023 的预览（D-02-06）；账户没有登记表时不显示 icon；列表其余部分不变" }
  # 权限
  - { id: R-02-025, module: 权限, text: "本页不新增权限点：添加账户、编辑账户沿用现有权限点；登记表预览跟随账户的查看权限。13-导航与权限汇总时记「02 无新增」（版本级约定：只出权限点、不预设角色；D-02-07）" }
  # 已禁用用户
  - { id: R-02-028, module: 已禁用用户, text: "已禁用用户（D-00-83、D-02-12）：账户的优化师、合作者、观察者里已禁用的用户，在账户列表、编辑弹窗、授权弹窗回显为「姓名（已禁用）」，不显示用户ID。编辑保存时原值原样保留，不算一次变更（不写 R-02-026 变更记录），必填校验视为已填。主动改选时，候选只有启用用户；改掉以后不能再选回已禁用的人。" }
  # 优化师变更记录
  - { id: R-02-026, module: 优化师变更, text: "账户「优化师」每次变化都记录一条：变更前的值、变更后的值、生效时间。添加账户成功时记初始值（变更前为空），生效时间为添加成功时刻，和 R-02-011 同成同败；编辑账户信息弹窗保存成功（R-02-019）且优化师和原值不同时记一次变更，生效时间为保存成功时刻。保存失败、或优化师没变（只改了其他字段）时不记录。变更当天（UTC0）起归新优化师；上线时存量账户没有变更历史，上线前的日子一律按上线时的优化师（D-00-72）。账户添加成功前已经有消耗的日子，06 账单、10 利润照常计入（R-06-005）；提成归属按添加成功时记下的初始优化师、当日所属客户的销售（R-04-064）。优化师变化同时影响审批「绑定的运营」的解析（只影响之后提交的单，R-12-015）和客户可见范围（D-00-76、D-00-77）。记录供 11 按业务日取当日优化师（R-11-003），本页不新增展示界面。" }

acceptance:
  # 添加账户
