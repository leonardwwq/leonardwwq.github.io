# 02-账户管理 · 机器可读规格
# 来源：html/账户管理.html:9846（V2.1.0 注释）、9822/9830（v2.0 沿用说明）、9277–9483（编辑账户信息弹窗）；html/添加账户.html:1828–2318；客户管理.html:1899；客户材料.html:3973 + 用户确认（见 decisions）

