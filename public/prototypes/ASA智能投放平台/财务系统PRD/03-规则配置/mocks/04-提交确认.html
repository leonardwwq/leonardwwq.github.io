<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MOCK · 规则配置 · 校验通过后</title>
<style>
:root{--line:#e5e7eb;--text:#111827;--sub:#6b7280;--bg:#f3f4f6;--new:#dc2626;--mod:#2563eb;--warn:#f59e0b;--brand:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);padding:0 0 64px}
.docbar{position:sticky;top:0;z-index:99;background:var(--brand);color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.docbar b{font-size:15px}.docbar span{opacity:.85;font-size:12px}
.canvas{background:#fff;margin:20px auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.canvas.pc{width:1440px;max-width:calc(100% - 40px)}
.canvas .hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.canvas .hd h1{font-size:16px}.canvas .bd{padding:20px 28px}
.state-tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.btn{display:inline-block;padding:6px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--text);background:#fff;width:120px;display:inline-block;min-height:30px;vertical-align:middle}
.input.ph{color:#9ca3af}.input.w60{width:64px}.input.w90{width:96px}.input.w240{width:260px}.input.w420{width:420px}
.input.err{border-color:var(--new);background:#fef2f2}.input.ro{background:#f3f4f6;color:var(--sub)}
.input[disabled],.dis .input{background:#f3f4f6;color:#9ca3af}
.err-tip{color:var(--new);font-size:12px;margin-top:2px}
.hint{font-size:12px;color:#b45309;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f9fafb;font-weight:600;color:var(--sub)}
.changed{position:relative;outline:2px dashed var(--new);outline-offset:3px;border-radius:4px}
.modified{position:relative;outline:2px dashed var(--mod);outline-offset:3px;border-radius:4px}
.removed{text-decoration:line-through;color:#9ca3af;background:#fef2f2;padding:0 4px;border-radius:3px}
[data-note]::before{content:attr(data-note);position:absolute;top:-11px;left:-11px;z-index:5;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:700}
.legend{width:1440px;max-width:calc(100% - 40px);margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px}
.legend h2{font-size:14px;margin-bottom:10px}
.legend li{list-style:none;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.legend li:last-child{border:0}
.badge{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-right:8px;font-weight:700}
.footbar{position:fixed;left:0;right:0;bottom:0;background:#111827;color:#d1d5db;font-size:12px;padding:8px 20px;display:flex;justify-content:space-between}
.radio{margin-right:18px;font-size:13px;white-space:nowrap}
.radio::before{content:"○ ";color:var(--sub)}.radio.on::before{content:"◉ ";color:var(--brand)}
.sec{font-size:15px;font-weight:700;margin:22px 0 12px}
.sec:first-child{margin-top:0}
.form{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;align-items:start;max-width:1100px}
.form .lb{text-align:right;font-size:13px;color:var(--sub);padding-top:5px}
.form .lb.req::before{content:"*";color:var(--new);margin-right:2px}
.link{color:var(--brand);text-decoration:underline}
.ops a{color:var(--brand);margin-right:10px;font-size:13px}
.ops a.off{color:#cbd5e1}
.circle{display:inline-block;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;text-align:center;line-height:20px;color:var(--sub);font-size:14px;margin-left:4px;vertical-align:middle}
.circle.off{color:#d1d5db;background:#f9fafb}
.tier{margin:6px 0;white-space:nowrap}
.sub{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;margin-left:6px}
.tag.on{background:#ecfdf5;color:#047857}.tag.wait{background:#eff6ff;color:#1d4ed8}
.lock{background:#f3f4f6;border:1px solid var(--line);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;display:inline-block}
.lock em{color:var(--brand);font-style:normal}
.collapse{font-size:15px;font-weight:700;margin:26px 0 12px}
.empty{padding:24px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:6px}
.foot{text-align:right;margin-top:24px}
.mask{background:rgba(17,24,39,.45);padding:60px 0;margin:-20px -28px}
.confirm{width:460px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.confirm .mh{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:600}
.confirm .mb{padding:18px 20px}.confirm .mf{padding:12px 20px;border-top:1px solid var(--line);text-align:right}
.confirm .mf .btn{margin-left:8px}
textarea.input{width:100%;height:72px;resize:none}
.kv{display:grid;grid-template-columns:120px 1fr 120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:12px}
.kv .k,.kv2 .k{color:var(--sub)}
.kv2{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;font-size:13px;max-width:900px}
.red{color:var(--new)}
.tl{display:flex;gap:40px;font-size:12px}.tl div b{display:block;font-size:13px}
.g{color:#047857}.gray{color:var(--sub)}
.skip{color:#9ca3af}
</style>
</head>
<body>
<div class="docbar"><b>提交审批 · 二次确认</b><span>本示意仅表达改动点，非最终视觉</span><span>关联：R-03-039 / G-03-020</span></div>
<div class="canvas pc">
<div class="hd"><h1>客户登记表/规则配置</h1><span class="state-tag">校验通过后</span></div>
<div class="bd">
<div class="mask"><div class="confirm changed" data-note="1"><div class="mh">提示</div><div class="mb"><p style="margin-bottom:12px">规则配置需进行审批，是否提交审批单？</p><div class="sub" style="margin-bottom:6px">备注</div><span class="input" style="width:100%;height:72px">11 月起服务费下调，已与客户确认</span></div><div class="mf"><span class="btn">取消</span><span class="btn primary">确定</span></div></div></div>
</div>
</div>
<div class="legend"><h2>改动点说明</h2><ul><li><span class="badge">1</span>确认框里的备注是审批发起备注（选填），进审批时间线「发起」记录；与表单里的规则备注不是同一个（R-03-039、D-03-15）</li></ul></div>
<div class="footbar"><span>MOCK · mocks/04-提交确认.html</span><span>v2.1.0 · 2026-10-19</span></div>
</body>
</html>
