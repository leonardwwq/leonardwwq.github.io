# 03-规则配置 · 机器可读规格（2026-10-19 用户已确认 D-03-01～20 与整体逻辑；2026-10-21 总控按会议清单 v2 回写）
# 来源：html/规则配置.html:2833/2841（V2.1 注释）、html/审批详情-客户登记表.html:2130–2378、html/费用管理.html:4848–4856 + 用户确认（见 decisions）+ 财务v2.1.0_会议清单v2（2026-10-21）
# 本页主管：规则配置（服务费、税费、返点、客情、备注、规则起始日期）实体、规则记录的生效判定（含以时刻 t 为准）、消耗首日（含冻结）与阶梯 / 统计方式（含按条款合并）的语义、规则展示格式。
# 本页不算钱：服务费、返点、客情的金额计算分别在 05 / 06 / 07，按本页规则取比例。

meta:
  feature: 规则配置
  product: ASA
  version: v2.1.0
  page: 03-规则配置
  date: 2026-10-21
  prd: PRD.md
  status: 待评审

scope:
  in:
    - "规则配置实体（规则记录）与生效判定：当前生效、某日以时刻 t 为准的适用规则、同起始日期覆盖"
    - "消耗首日（首次确定后冻结）、服务费时间区间、阶梯落档、按月 / 按日统计与按条款合并的语义（05 / 06 / 07 / 10 按此取比例）"
    - "规则配置页：页头信息行、服务费规则、税费规则、返点规则、客情规则、备注、规则起始日期、历史规则"
    - "提交「客户登记表—规则配置」审批、审批中锁定、重复提交拦截"
    - "审批结束后的规则写入"
    - "存量账户附件登记表（04 历史上传文件行与迁移占位行）的规则配置与上线前导入规则的承载（R-03-053）"
    - "规则配置审批详情的「审批内容」区（版本记录第 6 项）与变更高亮声明"
    - "规则展示格式（历史规则、审批内容区、04 客户详情规则配置表共用）"
  out:
    - "登记表列表与「规则配置」入口按钮本身、「已提交审批」tab（归 01，R-01-014、R-01-033～R-01-036）"
    - "客户列表行操作里的「规则配置」入口（原型残留，不做，D-01-03）；04 客户材料登记表行（含历史上传文件行）的入口按钮本身归 04（R-04-060）"
    - "审批详情通用框架、审批流、会签、撤回、作废、通知（归 12）"
    - "服务费、税费的金额计算与充值落档（归 05，D-00-51）；账单出账（归 06）；返点、客情金额计算与兑现（归 07，D-00-15、D-00-20、D-00-21）"
    - "账户上的苹果返点、客户返点、客情比例等老字段（保留不用，D-02-02）"
    - "规则草稿保存、规则删除或作废（原型没有）；存量规则批量导入的执行（技术，index S-1）"

roles:
  - { role: "登记表创建人", can: ["打开自己创建的登记表的规则配置页", "提交规则配置审批", "查看历史规则", "只读查看该登记表的规则配置审批详情"], cannot: [], source: "登记表 owner_user_id（R-01-008）；不单设权限点（D-03-16）" }
  - { role: "客户管理-读写用户", can: ["对数据范围内客户（D-00-77）的已关联登记表、附件登记表打开规则配置页（不限创建人）", "提交规则配置审批", "查看历史规则", "只读查看审批详情"], cannot: ["配置还没关联客户（待关联）的他人登记表", "配置数据范围外客户的登记表"], source: "现有权限点「客户管理-读写」（R-03-013、D-03-22）" }
  - { role: "客户管理-只读用户", can: ["只读查看数据范围内客户的规则配置审批详情（R-03-050）"], cannot: ["打开规则配置页"], source: "现有权限点「客户管理-只读」（D-03-23）" }
  - { role: "审批人", can: ["在审批详情通过 / 驳回"], cannot: ["修改审批内容"], source: "12 审批单快照（R-12-023）" }

entities:
  - name: 规则配置
    key: rule_config
    fields:
      - { key: rule_id, label: 规则ID, type: string, required: true, generated: true, rule: "唯一；生成方式由技术定" }
      - { key: registration_id, label: 所属登记表, type: ref, required: true, rule: "01 客户登记表或 04 附件登记表；一张登记表可有多条规则记录（R-03-001、R-03-053）" }
      - { key: start_date, label: 规则起始日期, type: date, required: true, tz: "UTC0", rule: "R-03-033（导入不受下限限制）；同一登记表内不重复（R-03-044）" }
      - { key: date_mode, label: 日期口径, type: enum, required: true, enum: [相对日期, 绝对日期], default: 相对日期, rule: "R-03-016；只作用于服务费时间区间" }
      - { key: service_fee_periods, label: 服务费规则, type: list, required: true, rule: "元素为「服务费时间区间」，至少 1 行（R-03-017～R-03-021）" }
      - { key: tax_rate, label: 税率, type: decimal, required: true, precision: 2, unit: "%", rule: "≥ 0 且 < 100（R-03-027）" }
      - { key: service_fee_tax_bearer, label: 服务费税费, type: enum, required: true, enum: [公司承担, 客户承担], default: 公司承担, rule: "R-03-028" }
      - { key: rebate, label: 返点规则, type: ref, required: true, rule: "一个「比例设置」，时间区间固定 消耗首日 - 第90天（R-03-029）" }
      - { key: kq_mode, label: 客情结算方式, type: enum, required: true, enum: [无客情, 首次消耗起 90 天, 按自然月每月返还], default: 无客情, rule: "R-03-030（D-03-11）" }
      - { key: kq_rate, label: 客情费用比例, type: ref, required: false, rule: "一个「比例设置」，无统计方式；kq_mode = 无客情时为空（R-03-031）" }
      - { key: remark, label: 备注, type: text, required: false, rule: "规则备注，与审批发起备注不同（R-03-032）" }
      - { key: source, label: 来源, type: enum, required: true, enum: [审批, 导入], generated: true, rule: "审批通过写入为「审批」，上线前批量导入为「导入」（R-03-001、R-03-053）" }
      - { key: source_approval_id, label: 来源审批单, type: ref, required: false, generated: true, rule: "来源 = 审批时为写入本条记录的那张已通过审批单（R-03-044）；导入为空" }
      - { key: approved_at, label: 审批通过时间（写入时间）, type: datetime, required: true, tz: "Asia/Shanghai", precision: 秒, generated: true, rule: "审批单变为已通过的时刻；导入为导入时刻；R-03-003 的 t 判定用它" }
      - { key: covered_at, label: 被覆盖时间, type: datetime, required: false, tz: "Asia/Shanghai", precision: 秒, generated: true, rule: "被同起始日期的新记录覆盖的时刻（R-03-004）" }
      - { key: record_state, label: 记录状态, type: enum, required: true, enum: [待生效, 生效中, 已结束, 已覆盖], generated: true, rule: "系统按日期计算，不能手动改（R-03-004、flows）" }
  - name: 服务费时间区间
    key: service_fee_period
    fields:
      - { key: seq, label: 行序, type: int, required: true, generated: true, rule: "从 1 起连续" }
      - { key: end_day, label: 右边界（第 N 天）, type: int, required: false, rule: "相对日期用；正整数，逐行严格递增；最后一行为空 = 永久（R-03-018）" }
      - { key: end_date, label: 右边界（日期）, type: date, required: false, tz: "UTC0", rule: "绝对日期用；≥ 规则起始日期，逐行严格递增；最后一行为空 = 永久（R-03-018）" }
      - { key: rate, label: 服务费率, type: ref, required: true, rule: "一个「比例设置」（R-03-021）" }
  - name: 比例设置
    key: rate_setting
    fields:
      - { key: calc_mode, label: 计费方式, type: enum, required: true, enum: [固定比例, 阶梯比例], default: 固定比例, rule: "R-03-021" }
      - { key: fixed_rate, label: 固定比例, type: decimal, required: false, precision: 2, unit: "%", rule: "calc_mode = 固定比例时必填；≥ 0，不设上限（R-03-022）" }
      - { key: stat_mode, label: 统计方式, type: enum, required: false, enum: [按月统计, 按日统计], default: 按月统计, rule: "服务费、返点的阶梯比例必填；客情没有此项（R-03-025）" }
      - { key: tiers, label: 阶梯, type: list, required: false, rule: "calc_mode = 阶梯比例时必填，至少 1 档，元素为「阶梯档」（R-03-023、R-03-024）" }
  - name: 阶梯档
    key: tier
    fields:
      - { key: lower, label: 区间下限, type: decimal, required: true, precision: 2, currency: "账户消耗原币", rule: "第一档固定 0；其余 = 上一档上限，自动带出不可改（R-03-023）" }
      - { key: upper, label: 区间上限, type: decimal, required: false, precision: 2, currency: "账户消耗原币", rule: "必须 > 下限；最后一档为空 = 不限（R-03-023、R-03-026）" }
      - { key: rate, label: 比例, type: decimal, required: true, precision: 2, unit: "%", rule: "≥ 0，不设上限（R-03-022）" }

flows:
  - entity: 规则配置
    states: [待生效, 生效中, 已结束, 已覆盖]
    initial: 生效中
    transitions:
      - { from: "无（审批通过 / 导入写入）", action: "写入且起始日期 > 今天", actor: 系统, to: 待生效, guard: "R-03-044、R-03-053；今天按 UTC0" }
      - { from: "无（审批通过 / 导入写入）", action: "写入且本条成为当前生效", actor: 系统, to: 生效中, guard: "R-03-003" }
      - { from: "无（审批通过 / 导入写入）", action: "写入且已有起始日期更晚、且 ≤ 今天的记录", actor: 系统, to: 已结束, guard: "R-03-002" }
      - { from: 待生效, action: "到起始日期（UTC0 00:00）", actor: 系统, to: 生效中, guard: "R-03-003" }
      - { from: 生效中, action: "起始日期更晚的记录开始生效", actor: 系统, to: 已结束, guard: "R-03-002" }
      - { from: 生效中, action: "同起始日期的新规则审批通过（记被覆盖时间）", actor: 系统, to: 已覆盖, guard: "R-03-044、R-03-004" }
      - { from: 待生效, action: "同起始日期的新规则审批通过（记被覆盖时间）", actor: 系统, to: 已覆盖, guard: "R-03-044、R-03-004" }
      - { from: 已结束, action: "同起始日期的新规则审批通过（记被覆盖时间）", actor: 系统, to: 已覆盖, guard: "R-03-044、R-03-004" }
    reverse:
      - { action: "删除 / 作废规则", actor: "—", allowed_from: [], note: "本期没有；要改只能追加新规则或用同起始日期覆盖（R-03-044）" }
      - { action: "驳回 / 撤回 / 作废审批单", actor: "审批人 / 申请人 / 持「审批配置」者", allowed_from: [], note: "审批中的内容还不是规则记录，驳回 / 撤回 / 作废不产生、不改动任何记录（R-03-045、D-00-79）" }

refs:
  - { page: 01-客户登记, entity: 客户登记表, ids: [R-01-008, R-01-014, R-01-017, R-01-019], uses: "登记表已删除的审批单按 R-01-017 显示（R-03-048、R-03-050）；入口在登记表列表 待关联 / 待开户 / 已开户 行（R-01-014、R-01-019）；创建人可访问（同 R-01-008）；审批内容区的公司名称 / 账户取登记表的 customer_id、account_system、account_id；消耗首日取 account_id 对应账户" }
  - { page: 04-客户管理, entity: 客户, ids: [R-04-050, R-04-051, R-04-060, R-04-066, R-04-067, R-04-073], uses: "审批内容区公司名称链接到客户详情；04 客户详情规则配置表按本页 R-03-003、R-03-037 取当前生效规则和格式；04 客户材料绑定行与历史上传文件行、迁移占位行（R-04-073）的「规则配置」入口（R-03-012、R-03-053）；计费模式生效口径 R-04-066、待生效展示 R-04-067（R-03-012、R-03-048）" }
  - { page: 07-返点管理, ids: [D-07-01, R-07-003, R-07-005, R-07-006, R-07-009], uses: "返点阶梯按扣 MAX 后的返点基数落档（R-03-009）；客情计提天数与当月取交集（R-03-010）；改消耗首日后未进单计提项重算（R-03-005）" }
  - { page: 12-审批配置与审批中心, entity: 审批单, ids: [R-12-001, R-12-016, R-12-017, R-12-018, R-12-025, R-12-030, R-12-031, R-12-034, R-12-036, R-12-043, R-12-044, R-12-045, R-12-046, R-12-047, R-12-049], uses: "提交「客户登记表—规则配置」审批（传 操作对象客户、本单账户、业务单据、发起备注）；提交提示按免审区分；按 已通过 / 已驳回 / 已撤回 写入或不写入规则；启用变更高亮；审批详情第②类查看判断；附件登记表的单在审批中心「全部审批」查看；最终通过执行失败 R-12-045（本页无失败情形）、作废 R-12-046、在途单提示句式 R-12-047、已禁用显示 R-12-049" }

rules:
  # —— 2.1 ——
  - { id: R-03-001, module: 规则记录, text: "规则配置挂在客户登记表上（在线登记表，或存量账户的附件登记表，R-03-053）：一张登记表可以有多条规则记录，每条有一个规则起始日期；规则记录有两种来源——「客户登记表—规则配置」审批通过时写入（来源「审批」，R-03-044），或上线前批量导入（来源「导入」，没有来源审批单，R-03-053）；审批中、已驳回、已撤回的提交内容只留在审批单的业务单据里，不是规则记录" }
  - { id: R-03-002, module: 规则记录, text: "每条规则记录的生效区间 = [本条规则起始日期, 起始日期比它晚的下一条记录的起始日期前一天]；没有更晚的记录时到永久；已覆盖的记录按 R-03-004 处理；日期一律按 UTC0 自然日（D-03-09）" }
  - { id: R-03-003, module: 规则记录, text: "某一天 d「以时刻 t 为准」的适用规则 = 该登记表在 t 之前已写入（审批通过或导入，按 approved_at）、且在 t 之前没有被覆盖的记录里，规则起始日期 ≤ d、起始日期最大的那一条；没有符合的记录则该日没有规则，下游一律按 0 算（D-00-57）。t 的取法：06 已出账月份的刷新、07 已出账月份的计提项、10 逐日拆分，一律以该账户该月账单的出账时刻为 t；未出账月份、页面展示、05 充值试算与提交都以当时时刻为 t（D-03-24）。「当前生效」= d 取今天（UTC0）、t 取当前时刻的适用规则（D-03-06）" }
  - { id: R-03-004, module: 规则记录, text: "记录状态由系统按日期计算、不能手动改：生效中 = 当前生效那条；待生效 = 起始日期晚于今天；已结束 = 起始日期早于当前生效那条；已覆盖 = 被同起始日期的新记录替换（记下被覆盖时间 covered_at），不在任何页面展示、不参与当前生效判定，但对被覆盖时间之前的 t 仍按 R-03-003 参与判定（已出账月份照旧用它）；写入它的审批单照常可查" }
  - { id: R-03-005, module: 规则记录, text: "消耗首日 = 登记表绑定账户（01 account_id；附件登记表为它对应的账户）按 UTC0 第一个消耗金额 > 0 的自然日，记为第 1 天；该登记表的所有规则记录共用这一个消耗首日，追加新规则不重新起算（D-03-01）。消耗首日第一次确定后就冻结，并记下确定时刻：之后补报或修正出更早的消耗，也不改首日；早于首日的日子服务费落第 1 行（R-03-006），返点、「首次消耗起 90 天」客情不计提（不在第 1～90 天内）；确需改首日由技术处理并留下记录，改后未进单的计提项按 07 R-07-009 重算（D-00-56）。存量账户的消耗首日取真实首次消耗日（UTC0，按历史报表），上线迁移时写入并冻结（D-03-29）。登记表还没绑定账户或账户还没有消耗时消耗首日未确定，相对日期的区间暂不对应任何日期" }
  - { id: R-03-006, module: 规则记录, text: "某一天落在服务费的哪一行时间区间：相对日期 → 先算该日是第 d 天（d = 该日 − 消耗首日 + 1），取 左边界 ≤ d ≤ 右边界 的那一行，早于消耗首日的日子（d ≤ 0）落第 1 行；绝对日期 → 取 左边界日期 ≤ 该日 ≤ 右边界日期 的那一行；超过倒数第二行右边界的都落在最后一行（永久）" }
  - { id: R-03-007, module: 规则记录, text: "返点只适用于消耗首日起第 1～90 天（含第 90 天）；第 91 天起、以及早于消耗首日的日子，该规则不产生返点；新规则起始日期晚于第 90 天时，它的返点比例不会被用到（D-03-01），页面弱提示、不拦（R-03-051）。返点金额怎么算归 07（D-00-15）" }
  - { id: R-03-008, module: 规则记录, text: "客情适用天数：无客情 → 不产生客情费用；首次消耗起 90 天 → 消耗首日起第 1～90 天（含第 90 天，早于首日不计提，D-00-21）；按自然月每月返还 → 本条规则生效区间内的每一天。客情金额怎么算归 07（D-00-20）" }
  - { id: R-03-009, module: 规则记录, text: "阶梯落档：区间左闭右开，下限 ≤ 金额 < 上限即落该档，最后一档无上限；金额用账户消耗的原币（D-03-03、D-03-04），落档用**未舍入的原始消耗合计**，不先把每天或每段舍入到 2 位再加（D-00-13）；返点阶梯按扣 MAX 后的返点基数落档（D-07-01）；不累进拆档，整段金额 × 所落那一档的比例（D-03-05）" }
  - { id: R-03-010, module: 规则记录, text: "统计方式：按月统计 = 以 UTC0 自然月为单位，把该月里同时落在同一段规则、同一行时间区间（返点为第 1～90 天）内的那几天消耗加总后落档（R-03-009），合计 × 档位比例；按日统计 = 每个 UTC0 自然日的消耗单独落档 × 档位比例（D-03-05、D-03-10）。「同一段规则」按条款切：同一账户同一个月里，相邻两条规则记录的某项条款完全相同时，这两段对该项合并成一段再落档——服务费看服务费规则（日期口径、各行右边界与比例设置）与税率，返点看返点比例设置，客情看客情结算方式与客情费用比例；条款不同才切开；时间区间行本身在月中切开时仍分别落档（D-00-55、D-03-10）。客情阶梯没有统计方式，一律按自然月口径落档（D-00-22），只取客情计提天数内的消耗（「首次消耗起 90 天」与当月取交集，见 07 R-07-003、R-07-005、R-07-006）。同一结算期只有一种计费模式（D-00-73），按月合计不按计费模式切开。统计方式不作用于充值：充值按本次到账净额落档、两档都成立取高档（D-00-51）" }
  - { id: R-03-011, module: 规则记录, text: "规则变化不回算：已出的账单、已完成的充值按发生时适用的规则冻结（D-00-12）；审批通过时刻晚于某月账单出账时刻的，该月按出账时刻适用的规则（R-03-003 以出账时刻为 t），之后该月刷新也不改用新规则，新规则只作用于还没出账的月份和之后的充值，历史规则里标「yyyy-mm 已出账，不适用」（R-03-052、D-03-08、D-03-24）；已封账 / 已冻结的账单不因补配或导入规则重算（D-00-57）" }
  # —— 2.2 ——
  - { id: R-03-012, module: 入口与访问, text: "入口有三个，打开的是同一个页面：①01 登记表列表的「规则配置」行操作（登记表为 待关联 / 待开户 / 已开户 时显示，R-01-014、R-01-019）；②04 客户材料「客户登记表」标签里绑定登记表行的「规则配置」（R-04-060）；③04 客户材料里存量账户的「历史上传文件」行（含迁移补建的占位行）的「规则配置」（R-03-053、D-00-57）。一次只配置这一张登记表；从哪个入口进来，页面内容、校验和提交都一样。面包屑和菜单高亮按入口区分：从 01 进来显示「客户登记表/规则配置」、高亮客户登记表；从 04 进来显示「客户管理/{公司名称}/规则配置」、高亮客户管理，点「{公司名称}」回到该客户的客户材料页（客户登记表标签）；直接打开页面地址时，当前用户有「客户登记管理」且是创建人、或登记表未关联客户时按 01 显示，否则按 04 显示（D-03-25）。标题下方一行信息（锁定态同样显示）：登记表名称（登记表ID）· 关联客户（未关联「暂未关联」）· 绑定账户「账户名称（orgid）」（未绑定「暂未关联」）· 计费模式（取客户当前生效值「预付款 / 后付款」，生效口径按 R-04-066；有待生效的计费模式变更时按 R-04-067 显示「{当前生效值}（{yyyy-mm-dd} 起改为{目标值}）」；未关联客户「-」）· 消耗首日 yyyy-mm-dd（今天 UTC0 是第 N 天；没绑账户或还没消耗显示「未确定」，R-03-005）" }
  - { id: R-03-013, module: 入口与访问, text: "能打开本页和提交审批的人：①该登记表的创建人（附件登记表没有创建人，不适用）；②有「客户管理-读写」权限点、且登记表关联的客户在其客户数据范围内的用户（sys 看全部；非 sys 须是该客户的「销售」或其名下任一账户的「优化师」，D-00-77），前提是登记表已关联客户（待开户 / 已开户 / 附件登记表），不要求是创建人（D-03-22）。待关联的登记表只有创建人能配。只有「客户管理-只读」的用户不能配置。不单设新权限点（D-03-16）；其他人直接访问页面地址显示「无权限访问」，不展示任何规则内容；服务端提交时同样校验" }
  - { id: R-03-014, module: 入口与访问, text: "登记表状态为 待填写 / 待审核 / 已过期 / 未通过 时直接访问本页，显示「该登记表当前状态不可配置规则」，不展示表单和历史规则；登记表已删除或不存在显示「登记表不存在」；服务端提交时同样拦截。附件登记表没有 01 的状态，不按本条拦截（R-03-053）" }
  - { id: R-03-015, module: 入口与访问, text: "打开页面（没有审批中的单）时：有当前生效规则 → 表单回填它的全部内容（含备注），规则起始日期留空；没有当前生效规则（含只有待生效记录）→ 用默认值：相对日期、服务费一行「消耗首日 - 永久」固定比例空、税率空、服务费税费「公司承担」、返点固定比例空、客情「无客情」、备注空、规则起始日期空（D-03-18）" }
  - { id: R-03-053, module: 入口与访问, text: "存量账户的附件登记表（04 客户材料「历史上传文件」行，一份历史附件只对应 1 个账户；没有附件的账户由上线迁移补一行「上线迁移补建（无附件）」占位行，R-04-073）也能配置规则，规则挂在这条附件登记表上（D-00-57、D-03-27）：从 04 该行的「规则配置」进入本页（R-03-012③），权限按 R-03-013②，不按 01 状态拦截（R-03-014）；页面、校验、提交、审批、写入与在线登记表一样；页头登记表名称显示附件文件名，占位行显示「上线迁移补建（无附件）」；消耗首日、本单账户取该行对应的账户。上线前批量导入的存量规则（index S-1，只支持固定比例）写在同一条附件登记表上，来源记「导入」、没有来源审批单，起始日期 = 该账户消耗首日（R-03-005）所在月的 1 日，用户另给更早日期的以用户给的为准，不受 R-03-033 下限限制，比例按 R-03-022、R-03-027 校验；导入范围包含已停止投放的账户；按账户逐条校验，校验失败的账户不导入并出清单，不整体回滚（D-03-29）。阶梯 / 分段规则上线后在本页配，必须在上线当月内提交，并在次月 2 日（UTC0）出账前审批通过；晚于这个时点的只对之后的月份生效（R-03-011），列入上线检查项（D-03-29）；已封账 / 已冻结的账单不因补配重算（R-03-011）。这类审批单不出现在 01「已提交审批」，申请人到审批中心「全部审批」查看（R-12-036）" }
  # —— 2.3 ——
  - { id: R-03-016, module: 服务费规则, text: "日期口径单选 相对日期 / 绝对日期，默认相对日期；只决定服务费时间区间用「第 N 天」还是日期，返点、客情的天数始终按消耗首日数（R-03-007、R-03-008）" }
  - { id: R-03-017, module: 服务费规则, text: "时间区间至少 1 行：第一行左边界固定——相对日期显示「消耗首日」，绝对日期显示规则起始日期（未选时显示「规则起始日期」，D-03-02）；第 2 行起左边界 = 上一行右边界 + 1 天，自动带出、不可改（相对显示「第 N+1 天」，上一行未填时显示「第 - 天」；绝对显示日期）；最后一行右边界固定「永久」；其余行右边界可填" }
  - { id: R-03-018, module: 服务费规则, text: "右边界校验（D-03-19）：相对日期 → 必填正整数天，第 N 天含当天，每行必须大于上一行右边界，否则提示「请输入正整数天数」「须大于上一行的天数」；绝对日期 → 必选日期（UTC0），第一行 ≥ 规则起始日期、之后每行晚于上一行右边界，否则提示「请选择日期」「不能早于规则起始日期」「须晚于上一行的结束日期」；规则起始日期未选时只提示起始日期" }
  - { id: R-03-019, module: 服务费规则, text: "每行有「增加行」「删除行」：增加行在本行后插入一行（本行原为最后一行时，本行右边界变为空输入框，新行成为最后一行「永久」）；删除行删掉本行（删的是最后一行时，上一行成为最后一行，右边界变回「永久」、原填值丢弃）；只剩一行时「删除行」禁用；行数不设上限" }
  - { id: R-03-020, module: 服务费规则, text: "切换日期口径时保留行数和每行的服务费率设置，清空所有行已填的右边界（D-03-19），不弹确认" }
  - { id: R-03-021, module: 服务费规则, text: "每行单独选计费方式 固定比例 / 阶梯比例，默认固定比例：固定比例只显示一个比例输入框；阶梯比例显示统计方式和阶梯表（R-03-023～R-03-026）；两种方式切换时页面内保留各自已填的值，提交时只提交当前选中的方式" }
  # —— 2.4 ——
  - { id: R-03-022, module: 比例与阶梯, text: "服务费率、返点比例、客情费用比例（含阶梯各档比例）都是百分比：必填，≥ 0，最多 2 位小数，不设上限（D-03-07、D-03-12）；输入框后显示「%」；不合格时提示「请输入不小于 0、最多 2 位小数的数字」；没有返点 / 不收服务费就填 0。税率另有上限，见 R-03-027" }
  - { id: R-03-023, module: 比例与阶梯, text: "阶梯表每档一行「下限 - 上限 比例%」：第一档下限固定 0；之后每档下限 = 上一档上限，自动带出不可改；最后一档上限固定显示「不限」；其余档上限必填，≥ 0、最多 2 位小数；金额是账户消耗原币，输入框不显示币种（D-03-03、D-03-04）；切到阶梯比例时默认 1 档「0 - 不限」" }
  - { id: R-03-024, module: 比例与阶梯, text: "每档右侧「+」在本档后插入一档（本档原为最后一档时，本档上限变为空输入框，新档成为最后一档「不限」），「−」删掉本档（删的是最后一档时上一档上限变回「不限」）；只剩一档时「−」禁用；档数不设上限" }
  - { id: R-03-025, module: 比例与阶梯, text: "服务费、返点的阶梯比例要选统计方式 按月统计 / 按日统计，默认按月统计（含义见 R-03-010）；统计方式旁有问号，悬浮说明「统计方式用于后付出账和返点；预付充值按单笔充值余额落档，不看统计方式（D-00-51）」；客情费用比例的阶梯不显示统计方式" }
  - { id: R-03-026, module: 比例与阶梯, text: "阶梯校验：上限必须大于本档下限，否则提示「区间上限须大于下限」；上限、比例为空时提示「请输入区间」「请输入比例」" }
  # —— 2.5 ——
  - { id: R-03-027, module: 税费规则, text: "税率一个输入框：必填，≥ 0 且 < 100，最多 2 位小数，输入框后显示「%」；为空提示「请输入税率」，负数或超过 2 位小数提示「请输入不小于 0、最多 2 位小数的数字」，≥ 100 提示「税率须小于 100%」；服务端提交时同样校验，上线前导入的规则也按此校验（D-03-12）" }
  - { id: R-03-028, module: 税费规则, text: "服务费税费单选 公司承担 / 客户承担，默认公司承担；客户承担时充值、取出的折算公式含「服务费率 × 税率」，公司承担时不含（费用管理.html:4848 §4.2.2），计算在 05" }
  # —— 2.6 ——
  - { id: R-03-029, module: 返点规则, text: "返点只有一行，时间区间固定显示「消耗首日 - 第90天」，不能增删、不能改；返点比例的计费方式、固定比例、阶梯、统计方式按 R-03-021～R-03-026，必填" }
  # —— 2.7 ——
  - { id: R-03-030, module: 客情规则, text: "客情结算方式必填单选：无客情 / 首次消耗起 90 天 / 按自然月每月返还，默认无客情（原型的「90天一次性结清」改名，D-03-11）" } # alias-ok
  - { id: R-03-031, module: 客情规则, text: "选无客情时不显示客情费用比例，也不提交；选另外两项时显示客情费用比例，计费方式 固定比例 / 阶梯比例（默认固定比例），必填，按 R-03-022～R-03-024、R-03-026，没有统计方式" }
  # —— 2.8 ——
  - { id: R-03-032, module: 备注与起始日期, text: "备注为规则备注：多行输入框、选填，长度上限沿用现有备注输入框；随规则写入、在历史规则和审批内容区展示；它不是审批发起备注，发起备注在提交确认框里另填（D-03-15）" }
  - { id: R-03-033, module: 备注与起始日期, text: "规则起始日期必填，日期选择器只能选「当月 1 号」及以后（当月按 UTC0 今天所在月），不设最晚日期；为空提示「请选择规则起始日期」；服务端提交时复核，早于当月 1 号提示「规则起始日期不能早于当月 1 号」。上线前导入的规则不受这条下限限制（R-03-053）" }
  - { id: R-03-034, module: 备注与起始日期, text: "选的起始日期与某条未覆盖的记录相同时，日期框下方提示「该起始日期已有规则，审批通过后将覆盖原规则」，不拦提交（D-03-21）" }
  - { id: R-03-051, module: 备注与起始日期, text: "消耗首日已确定（R-03-005）、所选规则起始日期晚于消耗首日起第 90 天的日期时，日期框下方弱提示（不拦提交）：「该起始日期已过返点期（止于 yyyy-mm-dd），本条返点比例不会生效」；客情结算方式为「首次消耗起 90 天」时再提示「该起始日期已过客情计提期（止于 yyyy-mm-dd），本条客情费用比例不会生效」；yyyy-mm-dd = 第 90 天的日期；消耗首日未确定时不提示；与 R-03-034 的提示可同时出现（D-03-25）" }
  # —— 2.9 ——
  - { id: R-03-035, module: 历史规则, text: "表单下方「历史规则」区默认收起，点标题展开 / 收起；列出该登记表全部未覆盖的记录（审批写入与导入），按规则起始日期降序；生效中、待生效的记录在起始日期旁打标签「生效中」「待生效」，已结束的不打标签；没有记录时展开显示「暂无历史规则」（D-03-13）" }
  - { id: R-03-036, module: 历史规则, text: "历史规则表列：规则起始日期、服务费规则、税率、服务费税费、返点规则、客情结算方式、客情费用比例、备注、审批通过时间、来源审批单（原型列名「规则配置」改为「返点规则」，D-03-21）；规则各列格式按 R-03-037；审批通过时间 yyyy-mm-dd hh:mm:ss（Asia/Shanghai），导入的记录显示「-」；来源审批单显示单号，点击新页打开 12 审批详情，导入的记录显示「导入」纯文本（D-03-26）" }
  - { id: R-03-037, module: 展示格式, text: "规则展示格式（历史规则、审批内容区、04 客户详情共用）：服务费规则每行时间区间一段，「区间：固定 x.xx%」或「区间：阶梯（按月统计 / 按日统计）」下面每档一行「[下限, 上限) x.xx%」、最后一档「[下限, 不限) x.xx%」；区间相对日期写「消耗首日 - 第30天」「第31天 - 永久」，绝对日期写「2026-11-01 - 2026-12-31」「2027-01-01 - 永久」；返点规则写「消耗首日 - 第90天：」加同样的固定 / 阶梯写法；税率「x.xx%」；服务费税费、客情结算方式写选项文字；客情费用比例无客情时「-」，固定「x.xx%」，阶梯「阶梯（按自然月）」加档位；金额千分位、2 位小数、不带币种；备注为空「-」；规则起始日期 yyyy-mm-dd" }
  - { id: R-03-052, module: 历史规则, text: "已出账标注：对一条来源为「审批」的记录，从它的起始日期所在月起，凡该账户该月账单（06）的出账时刻早于本条审批通过时刻的月份，本条不适用于该月（R-03-003、R-03-011），在起始日期旁灰字标「yyyy-mm 已出账，不适用」，连续多个月写「yyyy-mm～yyyy-mm 已出账，不适用」，与生效中 / 待生效标签并列；没有这种月份、导入的记录、登记表未绑定账户时不标（D-03-24）" }
  # —— 2.10 ——
  - { id: R-03-038, module: 提交审批, text: "页面底部「提交审批」：点击时校验全部必填和格式（R-03-018、R-03-022、R-03-026、R-03-027、R-03-029、R-03-031、R-03-033），任一不通过不提交，在对应输入框下方提示" }
  - { id: R-03-039, module: 提交审批, text: "校验通过后二次确认：「规则配置需进行审批，是否提交审批单？」+ 备注（发起备注，多行，选填）+ 取消 / 确定；确定后提交「客户登记表—规则配置」审批（R-12-001）：操作对象客户 = 登记表当前关联的客户，未关联（待关联）时不传；本单涉及账户 = 登记表当前绑定的账户（附件登记表为其对应账户），未绑定时不传（D-00-76）；审批流里「绑定的销售」按操作对象客户的销售解析（D-00-50），「绑定的运营」按本单账户的优化师解析（D-00-76），解析口径按 R-12-016，解析为空的节点按 R-12-016、R-12-017 跳过；业务单据 = 登记表 ID + 本次表单全部内容快照；发起备注 = 确认框里的备注。提交成功后的弱提示按 R-12-018（审批中「已提交审批」，免审直接通过「提交成功，无需审批，已生效」），本页不另写；审批中时页面刷新为锁定态（R-03-041）" }
  - { id: R-03-040, module: 提交审批, text: "提交内容与当前生效规则或同起始日期的记录完全一样时也允许提交，不拦（D-03-14）" }
  - { id: R-03-041, module: 提交审批, text: "同一张登记表同时最多 1 张审批中的规则配置单（D-03-17）；有审批中单时打开本页：顶部提示条按 R-12-047 在途单统一句式，本页 {对象} = 登记表、{审批类型} = 规则配置，句末补一句页面状态：「该登记表已有审批中的规则配置（审批单号 {SPxxxx}，申请人 {姓名}），请等审批结束或撤回后再操作。此处展示当前生效中的信息。」；单号可点、新页打开审批详情（没有查看资格的按 R-12-043 显示「无权限查看」），提示条不自动消失；申请人已禁用时显示「姓名（已禁用）」（R-12-049）；申请人可在审批详情撤回（R-12-031）；表单展示当前生效规则（没有则显示默认值）且全部禁用，「提交审批」隐藏；页头信息行与历史规则照常显示、可展开" }
  - { id: R-03-042, module: 提交审批, text: "服务端提交时复核：当前用户有配置权限（R-03-013）、登记表状态可配置（R-03-014）、税率 < 100（R-03-027）、规则起始日期不早于当月 1 号（R-03-033）、该登记表没有审批中的规则配置单；最后一项不满足时不创建审批单，按 R-12-047 用提示框（按钮「知道了」）提示「该登记表已有审批中的规则配置（审批单号 {SPxxxx}，申请人 {姓名}），请等审批结束或撤回后再操作」，单号可点" }
  - { id: R-03-043, module: 提交审批, text: "本页没有保存草稿；未提交的修改离开或刷新页面即丢失，不弹确认（原型只有「提交审批」按钮；不加离开确认，D-03-28）" }
  # —— 2.11 ——
  - { id: R-03-044, module: 审批结果, text: "审批单变为已通过（R-12-025）：按业务单据快照写入一条规则记录，来源「审批」，记下审批通过时刻（approved_at）与来源审批单；该登记表已有同起始日期的未覆盖记录时，新记录替换它，旧记录变为已覆盖并记下被覆盖时间（R-03-004）；写入后按 R-03-002～R-03-004 重新计算各记录状态，本页解除锁定。0 节点或全部节点被跳过时提交即通过、立即写入（R-12-018）（D-03-20）。最后一个审批人通过时本页不做业务复核，本审批类型没有算作业务执行失败的情形（R-12-045、D-00-79①），免审提交同样不会因业务原因失败；写入时的技术异常按 2.11.5 重试，保证最终写入" }
  - { id: R-03-045, module: 审批结果, text: "审批单变为已驳回或已撤回（含持「审批配置」权限点的人作废，审批单为「已撤回」，按撤回处理，R-12-046、D-00-79③）：不写入、不改动任何规则记录，本页解除锁定；撤回只校验申请人本人且单据审批中，不校验本页配置权限（D-00-79②）；原单不能修改重提，要再申请需在本页重新填写提交（R-12-034、D-03-20）" }
  - { id: R-03-046, module: 审批结果, text: "写入时不再校验规则起始日期是否早于当月 1 号：跨月才通过的照常按快照里的起始日期写入，已出账月份按 R-03-011 不重算、按出账时刻的规则（D-03-08、D-03-24）" }
  # —— 2.12 ——
  - { id: R-03-047, module: 审批内容, text: "审批信息区按 12（R-12-026），审批事项「客户登记表」、审批类型「规则配置」；审批内容区依次展示：公司名称、所属账户系统、关联账户、计费模式、服务费规则、服务费税费、税率、返点规则、客情结算方式、客情费用比例、规则起始日期、备注；规则相关各项取本单业务单据快照，格式按 R-03-037（原型「规则起始时间」统一为「规则起始日期」，D-03-21）" } # alias-ok
  - { id: R-03-048, module: 审批内容, text: "公司名称 = 登记表当前关联的客户名称，超链接，新页打开该客户的客户详情（R-04-050），未关联显示「暂未关联」纯文本；所属账户系统、关联账户「账户名称（orgid）」取登记表当前绑定的账户，未绑定都显示「暂未关联」；计费模式取查看时客户的当前计费模式（写法同 R-03-012 信息行，按 R-04-067），未关联显示「-」；这四项取查看时登记表的关联情况，不存进审批单快照。登记表已删除（R-01-017）的审批单：公司名称、所属账户系统、关联账户显示「暂未关联」，计费模式按未关联显示「-」（D-03-30）" }
  - { id: R-03-049, module: 审批内容, text: "启用 12 的变更高亮（R-12-030，口径 D-00-75）：本页声明的对象为「登记表规则」，比对基准 = 提交那一刻、新规则起始日期前一天适用的规则记录（按 R-03-003，t 取提交时刻），由本页提交时交给 12、随审批单快照保存，审批中和审批结束后回看都按这份基准比，所有查看者一致；参与比对 7 项：服务费规则、服务费税费、税率、返点规则、客情结算方式、客情费用比例、备注，按整项比对，不同的整项标红，标红格下方灰字「原：{原值}」（原值按 R-03-037 格式）；基准为空（新起始日期前一天没有适用规则）时都不标红、不显示「原」；规则起始日期、公司名称、所属账户系统、关联账户、计费模式不参与比对。提交时该登记表已有起始日期相同的未覆盖记录的，规则起始日期旁显示「将覆盖 yyyy-mm-dd 起的规则」（是否同日在提交时判定、随基准保存，回看一致）。审批中，若以当前时刻计、新起始日期前一天适用的规则已与基准不同，内容区顶部提示「提交后该登记表规则已有变更，当前生效值与本单比对基准不同」，审批结束后不显示（D-03-20）" }
  - { id: R-03-050, module: 审批内容, text: "审批详情第②类只读查看范围（R-12-043、R-12-044）：本页向 12 提供的「能否查看这张业务单据」判断 = 当前用户是该登记表的创建人，或有「客户管理-只读」「客户管理-读写」任一权限点、且登记表当前关联的客户在其客户数据范围内（sys 看全部；非 sys 须是该客户的销售或其名下任一账户的优化师，D-00-77；登记表未关联客户时只有创建人）（D-03-23）；登记表已删除的，创建人按删除时判断（D-03-30）" }

