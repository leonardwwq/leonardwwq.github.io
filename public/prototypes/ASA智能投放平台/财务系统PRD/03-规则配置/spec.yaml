decisions:
  - { id: D-03-01, point: "消耗首日", conclusion: "登记表绑定账户第一次有消耗那天（UTC0）；该登记表所有规则共用，追加新规则不重算；首次确定后冻结，补报更早消耗不改首日，早于首日的日子服务费落第 1 行、返点 / 90 天客情不计提，确需改首日由技术处理并留记录（2026-10-21 用户定，会议清单 D95）", impact: "R-03-005～R-03-008；05 / 06 / 07", status: 已定 }
  - { id: D-03-02, point: "绝对日期第一行左边界", conclusion: "固定 = 规则起始日期", impact: "R-03-017", status: 已定 }
  - { id: D-03-03, point: "阶梯区间", conclusion: "左闭右开、自动衔接：第一档从 0，下一档下限 = 上一档上限不可改，最后一档不限；服务费 / 返点 / 客情共用", impact: "R-03-009、R-03-023", status: 已定 }
  - { id: D-03-04, point: "阶梯金额币种", conclusion: "账户消耗原币", impact: "R-03-009、R-03-023", status: 已定 }
  - { id: D-03-05, point: "按月 / 按日统计", conclusion: "按月 = UTC0 自然月落在该区间的消耗合计落一档 × 该档；按日 = 每天各自落档 × 该档；都不累进；不作用于充值", impact: "R-03-009、R-03-010；06 / 07", status: 已定 }
  - { id: D-03-06, point: "当前生效", conclusion: "已通过且起始日期 ≤ 今天（UTC0）里起始日期最大的那条；未来起始的为待生效", impact: "R-03-003；04 R-04-051", status: 已定 }
  - { id: D-03-07, point: "必填与 0", conclusion: "服务费、税率、服务费税费、返点、客情结算方式都必填；比例允许 0；备注选填", impact: "R-03-022", status: 已定 }
  - { id: D-03-08, point: "跨月才通过", conclusion: "照常按申请的起始日期生效；已出账月份（06 刷新、07 已出账计提项、10 逐日拆分）一律按该月出账时刻适用的规则，不回改；已完成充值不重算（2026-10-21 用户定，会议清单 D08）", impact: "R-03-011、R-03-046；06 / 07 / 10", status: 已定 }
  - { id: D-03-09, point: "时区", conclusion: "起始日期、今天、当月 1 号、消耗首日一律 UTC0 日期", impact: "全页", status: 已定 }
  - { id: D-03-10, point: "被区间切开的月", conclusion: "按月统计只用该月落在该区间内那几天的消耗落档；同一月相邻两条规则某项条款完全相同（服务费看服务费规则与税率，返点看返点比例，客情看结算方式与比例）时合并成一段再落档，时间区间行月中切开仍分别落档（2026-10-21 用户定，会议清单 D93）", impact: "R-03-010；06 / 07", status: 已定 }
  - { id: D-03-11, point: "客情选项文案", conclusion: "「90天一次性结清」改为「首次消耗起 90 天」，另两项不变", impact: "R-03-030；07", status: 已定 } # alias-ok
  - { id: D-03-12, point: "比例上限", conclusion: "税率 ≥ 0 且 < 100、最多 2 位小数，≥ 100 提示「税率须小于 100%」、服务端同校验；服务费率、返点比例、客情费用比例仍不设上限（2026-10-21 用户定，会议清单 D25；原为全部不设上限）", impact: "R-03-022、R-03-027、R-03-042", status: 已定 }
  - { id: D-03-13, point: "历史规则表", conclusion: "列全部未覆盖的已通过 / 导入记录，标生效中 / 待生效；审批中 / 驳回 / 撤回不列", impact: "R-03-035", status: 已定 }
  - { id: D-03-14, point: "内容没改能否提交", conclusion: "不拦", impact: "R-03-040", status: 已定 }
  - { id: D-03-15, point: "规则备注与发起备注", conclusion: "两回事，提交确认框另填发起备注", impact: "R-03-032、R-03-039", status: 已定 }
  - { id: D-03-16, point: "权限点", conclusion: "不单设新权限点；登记表创建人可配置，已关联客户的登记表另允许数据范围内的「客户管理-读写」用户配置（D-03-22），靠审批把关", impact: "R-03-013；13", status: 已定 }
  - { id: D-03-17, point: "审批中并发与展示", conclusion: "同一登记表最多 1 张审批中单；有则顶部提示条（按 R-12-047 统一句式，带审批单号、申请人，单号可点，句末补「此处展示当前生效中的信息。」）、展示当前生效、禁用、隐藏提交；重复提交按 R-12-047 用提示框（知道了）（2026-10-21 用户定，会议清单 D40）", impact: "R-03-041、R-03-042", status: 已定 }
  - { id: D-03-18, point: "打开页面回填", conclusion: "回填当前生效规则，起始日期留空；没有当前生效时用原型默认值", impact: "R-03-015", status: 已定 }
  - { id: D-03-19, point: "区间右边界校验与切换口径", conclusion: "相对正整数天逐行递增；绝对 ≥ 起始日期逐行递增；切口径清空右边界", impact: "R-03-018、R-03-020", status: 已定 }
  - { id: D-03-20, point: "审批结果与高亮", conclusion: "通过写入（同起始日期覆盖），驳回 / 撤回不写入；启用变更高亮，基准 = 提交时新起始日期前一天适用的规则、随审批单保存，审批中与结束后一致；7 项参与比对，规则起始日期不标红、同日写「将覆盖 yyyy-mm-dd 起的规则」；标红下方灰字原值（2026-10-21 用户定，会议清单 D27、D77；原基准为当前生效、不另存快照）", impact: "R-03-044、R-03-045、R-03-049", status: 已定 }
  - { id: D-03-21, point: "文案统一", conclusion: "锁定提示（2026-10-21 起改按 R-12-047 统一句式，见 D-03-17；原代定文案作废）；审批详情「规则起始时间」→「规则起始日期」；历史规则列「规则配置」→「返点规则」；新增同起始日期覆盖提示、状态不可配置提示、提交确认文案。依据：与 12 审批状态、本页字段名一致，避免「规则配置」一词既指页面又指返点列。2026-10-21 用户确认（原代定转已定）", impact: "R-03-014、R-03-034、R-03-036、R-03-039、R-03-041、R-03-047", status: 已定 } # alias-ok
  - { id: D-03-22, point: "非创建人能否配置", conclusion: "能：已关联客户的登记表（含附件登记表），有「客户管理-读写」且该客户在其数据范围内（销售或名下账户优化师，sys 全部）即可配置，入口在 04 客户材料（R-04-060）。依据：用户 2026-10-19 确认放开；2026-10-21 用户定保留现状隔离（会议清单 D21、D-00-77），离职人员名下客户由 sys 改销售 / 优化师后交接", impact: "R-03-012、R-03-013、R-03-042；04", status: 已定 }
  - { id: D-03-23, point: "规则配置审批详情谁能只读看", conclusion: "登记表创建人，或有「客户管理-只读 / 读写」任一权限点、且登记表关联客户在其数据范围内的人（2026-10-21 用户定，会议清单 D21、D-00-77；原为不按客户范围隔离）", impact: "R-03-050；12 R-12-043 映射", status: 已定 }
  - { id: D-03-24, point: "以时刻 t 为准的适用规则", conclusion: "某日 d 只看 t 之前已写入、t 之前未被覆盖的记录；06 已出账月份刷新、07 已出账计提项、10 逐日拆分以该月出账时刻为 t，其余以当时时刻为 t；已覆盖记录对覆盖前时刻仍参与判定；历史规则加「审批通过时间」并标「yyyy-mm 已出账，不适用」（2026-10-21 用户定，会议清单 D08）", impact: "R-03-003、R-03-004、R-03-011、R-03-036、R-03-052；06 / 07 / 10", status: 已定 }
  - { id: D-03-25, point: "页头信息行、面包屑、过 90 天提示", conclusion: "标题下信息行：登记表名称（ID）· 关联客户 · 绑定账户 · 计费模式（客户当前）· 消耗首日（今天第 N 天）；面包屑与菜单高亮按入口区分（01 / 04）；起始日期晚于第 90 天弱提示返点（及 90 天客情）不会生效，不拦；统计方式旁问号说明（2026-10-21 用户定，会议清单 D74、D76、D94，A 档按推荐）", impact: "R-03-012、R-03-025、R-03-047、R-03-048、R-03-051", status: 已定 }
  - { id: D-03-26, point: "历史规则显示来源", conclusion: "历史规则表末尾加「审批通过时间」「来源审批单」两列，单号可点新页打开审批详情，导入的记录显示「-」「导入」（2026-10-21 用户定，会议清单 D75、D08）", impact: "R-03-036", status: 已定 }
  - { id: D-03-27, point: "存量账户规则承载", conclusion: "不补建占位登记表；存量账户在 04 客户材料的历史上传文件行（无附件的由迁移补一行「上线迁移补建（无附件）」）提供「规则配置」入口，与 03 同页同审批，规则挂在该行；上线前仍批量导入固定比例规则（来源「导入」），阶梯 / 分段上线后在页面配、首个月末结算前配完（2026-10-21 用户定，会议清单 D20、技术答复 T03；D-00-57；配置截止点 2026-10-22 改按 D-03-29）", impact: "R-03-001、R-03-012、R-03-013、R-03-014、R-03-033、R-03-053；04；S-1", status: 已定 }
  - { id: D-03-28, point: "离开页面是否确认", conclusion: "规则配置页离开或刷新时不弹确认，未提交的修改即丢失（R-03-043）。2026-10-21 用户确认", impact: "R-03-043", status: 已定 }
  - { id: D-03-29, point: "存量规则导入与上线月阶梯 / 分段截止点", conclusion: "存量账户消耗首日取真实首次消耗日（UTC0，按历史报表），迁移时写入并冻结；导入规则起始日期 = 消耗首日所在月的 1 日，用户另给更早日期的以用户给的为准；导入范围含已停止投放的账户；按账户逐条校验，失败的不导入并出清单，不整体回滚；阶梯 / 分段规则必须在上线当月内提交，并在次月 2 日（UTC0）出账前审批通过，晚于这个时点的只对之后的月份生效，列入上线检查项（原为「首个月末结算前配完」）。2026-10-22 用户与技术确认，闭环清单 A13、A14", impact: "R-03-005、R-03-053；index S-1；04", status: 已定 }
  - { id: D-03-30, point: "已删除登记表的审批单怎么显示、谁能看", conclusion: "审批内容区公司名称、所属账户系统、关联账户显示「暂未关联」；查看范围里的创建人按删除时判断；名称取删除时的名称并标「（已删除）」（01 R-01-017、R-01-035）。2026-10-22 用户与技术确认，闭环清单 B19", impact: "R-03-048、R-03-050；01", status: 已定 }

open_questions:
  - { id: Q-03-01, question: "【已关闭 2026-10-20】返点阶梯落档用的金额，是扣 MAX 广告系列消耗之前的消耗，还是扣完后的返点基数（D-00-15）？结论：返点阶梯按扣 MAX 后的返点基数落档（D-07-01，用户 2026-10-19 在 07 会话定），已落 R-03-009", owner: "用户（07 会话已收口）", blocks: "—", due: "—" }
  - { id: Q-03-02, question: "【已关闭 2026-10-21】存量账户 / 没绑定在线登记表的账户没有规则配置，或某日早于首条规则起始日期时，05 / 06 / 07 按什么取服务费率、税率、返点？结论：没有适用规则一律按 0（D-00-57）；存量账户规则挂附件登记表（R-03-053、D-03-27）", owner: "—", blocks: "—", due: "—" }
  - { id: Q-03-03, question: "【已关闭 2026-10-21】服务费有多行时间区间时，一笔充值按哪一行的服务费率落档？结论：按提交当天是消耗首日后第几天落行，没有首日按第一行（D-00-58）", owner: "—", blocks: "—", due: "—" }
  - { id: Q-03-04, question: "【已关闭 2026-10-21】D-03-21 的文案调整是否认可？结论：2026-10-21 用户确认认可，D-03-21 转已定", owner: "—", blocks: "—", due: "—" }
  - { id: Q-03-05, question: "【已关闭 2026-10-21】规则配置页离开时要不要像 01 外链填写页（会议清单 D70）一样弹离开确认？结论：2026-10-21 用户确认不弹，按 R-03-043（D-03-28）", owner: "—", blocks: "—", due: "—" }
