acceptance:
  # 2.1 客户实体与客户状态
  - { id: "G-04-001", module: "客户状态", given: "读写用户；客户「橙子出行科技有限公司」不存在", when: "添加客户：计费模式预付款、伙伴云签约主体 伙伴云、币种 人民币，销售选自己，点添加", then: "提示「添加成功」；列表出现该客户，客户状态 待开户；列表没有账期、客户来源、运营列" }
  - { id: "G-04-002", module: "客户状态", given: "客户「橙子出行」状态待开户；登记表「橙子出行 开户登记」「橙子出行 二期登记」都已关联该客户、状态待开户", when: "在 02 添加账户，所属客户选「橙子出行」、登记表选第一张并添加成功；再用第二张登记表为该客户添加第二个账户", then: "第一次添加后客户状态 待投放；第二次添加后仍为 待投放" }
  - { id: "G-04-003", module: "存量兼容", given: "上线日 2026-11-01；存量客户 A 名下账户 2026-10-20（UTC0）有消耗，签约主体原值「伙伴云科技」、币种原值「美元」，映射表分别映射为 伙伴云、USD；B 名下账户 2026-08 有过消耗、2026-10-02～2026-10-31 每天为 0，签约主体原值「某某主体」不在映射表；C 有 1 个账户、从没有过消耗；D 没有账户，签约主体、币种原值为空", when: "上线后打开客户列表和 B 的编辑页", then: "A 投放中、B 停止投放、C 待投放、D 待开户；A 显示 伙伴云、USD；B 的签约主体、C 和 D 的签约主体与币种都显示「-」，列表、编辑页都不出现「某某主体」原文" }  # alias-ok
  - { id: "G-04-004", module: "存量兼容", given: "存量预付款客户 D 的伙伴云签约主体、币种为空", when: "编辑 D 只改备注点确定；再补选 clic、USD 点确定", then: "第一次在伙伴云签约主体、币种下提示必填、不保存；第二次直接保存，提示「保存成功」，不生成审批单" }
  - { id: "G-04-034", module: "客户实体", given: "上线后添加的预付款客户 A、B，销售都是张三；客户信息变更审批流 节点1 指定用户周婷", when: "①2026-10-12 编辑 A，计费模式改后付款、账期 30、销售改李四，提交审批并确定；2026-10-15（UTC0）审批通过。②2026-10-15（UTC0）编辑 B，计费模式不变、只把销售改为李四，点确定", then: "A 审批中期间查不到销售变更记录；通过后记一条：变更前张三、变更后李四、生效时间为审批通过、新信息生效的时刻；B 记一条张三 → 李四，生效时间为保存成功时刻（技术查库核验）；11-提成中心里 A、B 的 2026-10-14 及以前归张三、2026-10-15 起归李四（R-11-003）；李四能在 02 看到 A、B 名下全部账户，张三（不是这些账户的优化师 / 合作者 / 观察者）看不到（R-04-072）" }
  - { id: "G-04-035", module: "客户状态", given: "客户 E 投放中，名下账户 E1、E2 最后一次消耗都在 2026-09-10（UTC0）；E1 在 2026-09-11 因余额不足被 05 停投；2026-10-15 E2 又有消耗", when: "分别查看 2026-09-12、2026-10-10、2026-10-11、2026-10-16 各日 UTC0 日结判定后的客户状态", then: "2026-09-12、2026-10-10 仍为投放中（05 停投不改客户状态；10-10 的窗口 09-10～10-09 含 09-10 的消耗）；2026-10-11 变为停止投放（窗口 09-11～10-10 全为 0）；2026-10-16 回到投放中" }
  - { id: "G-04-036", module: "客户状态", given: "客户 F 待投放，名下 1 个账户从没有过消耗；该账户 2026-10-12（UTC0）首次消耗 120.00", when: "2026-10-12 白天、2026-10-13 日结判定后分别查看客户列表，并把鼠标放到「客户状态」列头", then: "2026-10-12 白天 F 仍是待投放；2026-10-13 判定后变投放中；列头悬浮提示「投放中：近 30 天有消耗；停止投放：已连续 30 天无消耗」" }
  - { id: "G-04-039", module: "客户实体", given: "客户 A 的销售张三账号已禁用", when: "打开列表与客户详情；编辑 A 只改备注点确定；再打开编辑页销售下拉；改选李四保存后再次打开下拉", then: "列表、详情、编辑页回显「张三（已禁用）」，不显示用户 ID；第一次保存后销售仍是张三，没有新增销售变更记录（技术查库）；下拉候选里没有张三；改为李四后记一条变更记录，下拉里仍选不到张三" }
  # 2.2 列表
  - { id: "G-04-005", module: "客户列表", given: "只读用户，是客户 A、B 的销售；A 有 1 个合同、0 个历史上传登记表、1 个绑定登记表，合同终止时间 2027-09-30（不在即将到期范围）；B 的合同终止时间 2026-02-28（已过期）", when: "打开客户列表", then: "列依次为 R-04-013，没有运营列；行操作只有 详情、客户材料；没有添加客户按钮；A 的公司名称旁不显示「未上传客户登记表」，也不显示「未上传合同」；A 的合同终止时间正常显示，B 的标红；公司名称后没有「（点击查看详情）」" }
  # 2.3 添加
  - { id: "G-04-006", module: "添加客户", given: "读写用户打开添加客户", when: "选后付款不填账期点提交审批；账期分别填 0、1.5、30；再切回预付款；最后点返回", then: "页面面包屑为「客户管理/添加客户」；不填提示必填；0、1.5 提示格式错误；30 通过；切回预付款后账期输入框消失、按钮文字变回「添加」；点返回直接回到客户列表、不弹确认、不生成客户" }
  - { id: "G-04-007", module: "添加客户", given: "新建客户审批流为 节点1 绑定的销售、节点2 指定用户周婷；读写用户", when: "添加客户选后付款、账期 30、销售选 陈思远，点提交审批，确认框备注填「年框客户」并确定", then: "确认框文案为「后付款客户需进行审批，是否提交审批单？」；提示「已提交审批」；客户列表没有该客户；已提交审批出现一条 新建客户·审批中；审批详情节点 1 为 陈思远、节点 2 为 周婷，发起记录备注「年框客户」" }
  - { id: "G-04-008", module: "添加客户", given: "①同 G-04-007 但销售不选；②新建客户审批流为 0 节点", when: "分别提交审批", then: "①节点 1 显示「已跳过（未找到审批人）」，审批从节点 2 周婷开始，提示「已提交审批」；②提交即通过，提示「提交成功，无需审批，已生效」，客户马上出现在列表（销售为本人时）、状态待开户，已提交审批里该单为已通过" }
  - { id: "G-04-010", module: "添加客户", given: "新建客户「云帆教育」审批中", when: "在 02 添加账户的所属客户下拉搜「云帆」", then: "搜不到" }
  - { id: "G-04-038", module: "添加客户", given: "已有客户「星海网络科技有限公司」「Starfish Media」；审批中的新建客户单公司名称「云帆教育科技（杭州）有限公司」；存量客户 X、Y 都叫「伙伴云」（不同账户系统）", when: "①添加预付款客户「星海网络科技有限公司」；②添加「starfish media」；③添加「云帆教育科技（杭州）有限公司」；④编辑 X 只改备注点确定；⑤编辑 X 把公司名称改为「星海网络科技有限公司」点确定", then: "①③⑤公司名称下方提示「公司名称已存在」，不保存、不提交；②添加成功（区分大小写）；④保存成功" }
  # 2.4 编辑
  - { id: "G-04-011", module: "编辑客户", given: "预付款客户 A，销售 张三；客户信息变更审批流 节点1 绑定的销售、节点2 指定用户周婷", when: "2026-10-12 编辑 A：计费模式改后付款、账期 45、销售改 李四、公司别名改「橙子」，点提交审批并确定", then: "改计费模式时旁边出现「审批通过后的次月 1 日（UTC0）起生效」、按钮变「提交审批」；确认框文案「变更为后付款客户需进行审批，是否提交审批单？」；审批节点 1 为 张三；客户列表 A 仍显示预付款、销售 张三、原别名" }
  - { id: "G-04-012", module: "编辑客户", given: "G-04-011 的单审批中", when: "再次打开编辑 A，点提示条里的审批单号", then: "顶部提示条「该客户已有审批中的客户信息变更（审批单号 {G-04-011 的单号}，申请人 {申请人姓名}），请等审批结束或撤回后再操作」；显示预付款等旧值；所有输入框禁用；只有返回按钮；点单号新页打开该单审批详情" }
  - { id: "G-04-015", module: "编辑客户", given: "后付款客户 B（账期 30）；另一后付款客户 C", when: "2026-10-20 编辑 B 改为预付款点确定；编辑 C 只改备注点确定", then: "B 计费模式旁提示「保存后 2026-11-01（UTC0）起生效」，提示「保存成功」，列表显示「后付款（2026-11-01 起改为预付款）」，账期 30 保留到生效前；2026-11-01（UTC0）起 B 显示预付款、账期清空；C 直接保存；都不生成审批单" }
  - { id: "G-04-016", module: "编辑客户", given: "预付款客户 A 无审批中单；同一用户开了两个标签页的编辑 A", when: "两个标签页都改后付款，先后提交审批并确定", then: "第一次成功；第二次弹提示框「该客户已有审批中的客户信息变更（审批单号 {第一张单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，按钮「知道了」；只生成 1 张客户信息变更单" }
  - { id: "G-04-017", module: "编辑客户", given: "客户 A 有审批中的客户信息变更单", when: "打开 A 的付款主体弹窗修改并提交审批", then: "可正常编辑和提交，生成付款主体变更单" }
  - { id: "G-04-037", module: "编辑客户", given: "G-04-015 之后，B 有待生效变更（2026-11-01 起改为预付款）；预付款客户 D 的客户信息变更审批流 节点1 指定用户周婷", when: "①2026-10-25 编辑 B，只改备注点确定；②再编辑 B，把计费模式改回后付款点确定；③2026-10-25 编辑 D 改为后付款、账期 15 提交审批，2026-11-03 周婷通过", then: "①编辑页计费模式回显预付款并提示「2026-11-01（UTC0）起生效」，保存后待生效变更不变；②按钮为「确定」、不走审批，提示「保存成功」，待生效变更取消，列表显示后付款，账期 30 保留；③审批中审批内容区计费模式旁显示「审批通过后的次月 1 日（UTC0）起生效」；通过后列表显示「预付款（2026-12-01 起改为后付款）」，审批内容区显示「生效月：2026-12」；2026-12-01（UTC0）起 D 显示后付款、账期 15 天" }
  # 2.5 付款主体
  - { id: "G-04-018", module: "付款主体", given: "客户 A 当前生效付款主体 Starfish Ltd、星海网络科技有限公司", when: "①第 3 行留空点提交审批；②第 3 行填「 Starfish Ltd 」点提交审批；③删掉第 3 行、不做任何修改点提交审批；④把两行顺序对调点提交审批", then: "①第 3 行提示「请输入付款主体名称」；②提示「付款主体重复」；③④提示「付款主体未修改」；四次都不弹确认框" }
  - { id: "G-04-019", module: "付款主体", given: "客户 A 付款主体为 Starfish Ltd、星海网络科技有限公司；客户 B 已有付款主体 Starfish Ltd", when: "把 A 的第 2 行改为「Starfish HK Ltd」点提交审批并确定，再打开 A 的付款主体弹窗", then: "B 的同名不算重复，提交成功，确认框文案「变更付款主体需进行审批，是否提交审批单？」；再打开时顶部提示条「该客户已有审批中的付款主体变更（审批单号 {本单单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，显示原两条，输入框禁用，没有 +、−、提交审批；客户详情付款主体仍为原两条" }
  # 2.6 审批结果
  - { id: "G-04-009", module: "审批结果", given: "G-04-007 的新建客户审批单", when: "陈思远、周婷依次通过；另一张同样提交的单被驳回", then: "通过的那张：客户出现在列表，状态待开户，字段与提交内容一致；驳回的那张：列表没有该客户，重新打开添加客户表单为空" }
  - { id: "G-04-013", module: "审批结果", given: "G-04-011 的单", when: "2026-10-15 张三、周婷依次通过", then: "A 的销售 李四、别名「橙子」立即生效，账期 45 天随审批通过立即保存（2026-11-01 前 A 仍为预付款、不使用账期）；列表计费模式显示「预付款（2026-11-01 起改为后付款）」；2026-11-01（UTC0）起 A 显示后付款；编辑页解锁；02 中 A 名下账户的销售显示 李四" }
  - { id: "G-04-014", module: "审批结果", given: "G-04-011 的单", when: "张三驳回（或申请人撤回）", then: "A 的基础信息不变；编辑页解锁；已提交审批中该单为 已驳回（已撤回），没有撤回、重新提交入口" }
  - { id: "G-04-020", module: "审批结果", given: "G-04-019 的单", when: "审批通过", then: "客户详情付款主体变为 Starfish Ltd、Starfish HK Ltd；弹窗解锁" }
  - { id: "G-04-040", module: "审批对接", given: "付款主体变更审批流 节点1 绑定的运营、节点2 指定用户周婷；新建客户审批流 节点1 绑定的运营、节点2 指定用户周婷；客户 A 名下账户 A1（优化师王敏）、A2（优化师赵磊）、A3（优化师王敏）", when: "提交 A 的付款主体变更；另添加一个后付款客户提交审批", then: "付款主体变更单节点 1 为会签，名单王敏、赵磊（去重），两人都通过才进入节点 2；新建客户单节点 1「已跳过（未找到审批人）」，从节点 2 周婷开始；添加、编辑客户页面、列表、详情、审批内容区都没有「运营」字段" }
  - { id: "G-04-045", module: "审批结果", given: "客户 A 的客户信息变更审批中，本单把公司名称改为「青柠科技有限公司」（提交时没有重名），最后一个节点是周婷；之后有人添加了预付款客户「青柠科技有限公司」并成功", when: "周婷点通过并确定", then: "确认框显示「公司名称「青柠科技有限公司」已存在，请驳回后重新提交」，审批单仍为审批中，周婷这次通过不记录；A 的基础信息不变、编辑页仍锁定；审批详情审批信息区出现「最近一次通过未执行」记录" }
  # 2.7 审批内容
  - { id: "G-04-021", module: "审批内容", given: "客户 A 当前付款主体 Starfish Ltd、星海网络科技有限公司；审批中的付款主体变更提交为 Starfish Ltd、Starfish HK Ltd", when: "审批人打开审批详情", then: "审批内容区显示公司名称（链接）和付款主体：Starfish Ltd 正常、Starfish HK Ltd 标红、星海网络科技有限公司在末尾灰色删除线；点公司名称新页打开 A 的客户详情" }
  - { id: "G-04-022", module: "审批内容", given: "存量客户 D 币种为空（映射不了已置空）、预付款；提交客户信息变更：币种 USD、计费模式后付款、账期 30", when: "审批人打开审批详情；审批通过后再打开", then: "计费模式「后付款」标红，下方灰字「原：预付款」，旁边显示「审批通过后的次月 1 日（UTC0）起生效」；账期「30」、币种「USD」不标红（原值为空），也没有「原：」；未改字段正常显示；通过后回看，标红与「原：预付款」不变，计费模式旁改为「生效月：yyyy-mm」" }
  - { id: "G-04-023", module: "审批内容", given: "一张审批中的新建客户单", when: "打开审批详情", then: "审批内容区展示全部基础信息、没有运营；公司名称不是链接；没有任何标红" }
  - { id: "G-04-024", module: "审批内容", given: "孙磊、吴迪、周婷都不在某张客户 A 的客户信息变更单的审批流里；孙磊只有「客户管理-只读」且是 A 的销售；吴迪只有「客户管理-只读」，既不是 A 的销售、也不是其名下账户的优化师；周婷两个客户管理权限点都没有", when: "三人分别打开该审批详情链接", then: "孙磊能看到审批信息和审批内容，没有任何操作按钮；吴迪、周婷看到「无权限查看」" }
  # 2.8 已提交审批
  - { id: "G-04-025", module: "已提交审批", given: "当前账号提交过 新建客户（已通过）、客户信息变更（审批中）、付款主体变更（已驳回）、免审直接通过的付款主体变更各一张；另一账号提交过一张", when: "切到已提交审批", then: "只有本账号的 4 张，免审那张为已通过；审批中那张排第一；操作对象依次显示类型名；只有审批中那张有撤回；都有详情，点详情新页打开审批详情；搜客户名称能筛出对应单" }
  - { id: "G-04-026", module: "已提交审批", given: "当前账号一张审批中的付款主体变更单", when: "点撤回并确定", then: "确认文案按 R-12-033；状态变为已撤回；该客户付款主体不变、弹窗解锁" }
  - { id: "G-04-042", module: "已提交审批", given: "刘佳提交了客户 A 的付款主体变更（审批中）后被收回「客户管理-读写」，只剩「客户管理-只读」；刘佳另有一张客户 B 的客户信息变更单（审批中）", when: "①刘佳在已提交审批 tab 撤回 A 的单；②持「审批配置」的周婷在审批详情作废 B 的单（原因「重复提交」）", then: "①撤回按钮照常显示，撤回成功，A 的付款主体不变；②B 的基础信息不变、编辑页解锁，刘佳的已提交审批里该单不再是审批中、没有撤回按钮" }
  # 2.9 客户详情
  - { id: "G-04-027", module: "客户详情", given: "今天 2026-10-19；客户 A 有 3 个账户：账户1 绑定登记表 X，X 有三条已通过规则（起始 2026-09-01、2026-10-01、2026-11-01）和一张审批中的规则配置单；账户2 是老账户，对应的历史上传文件行挂着上线导入的一条规则（起始 2026-01-01）；账户3 绑定登记表 Y，Y 只有一条已通过、起始 2026-12-01 的规则；A 有审批中的客户信息变更", when: "从列表点详情", then: "新页打开；基础信息为当前生效值（不含审批中的修改、没有运营）；规则配置 3 行：账户1 显示起始 2026-10-01 那条（不显示 2026-11-01 的待生效规则和审批中的），列名「返点规则」，格式按 R-03-037；账户2 显示起始 2026-01-01 那条；账户3 除账户名称外都显示「-」" }
  # 2.10 客户材料
  - { id: "G-04-028", module: "客户材料", given: "当前账号创建的登记表：P（待关联）、Q（待开户）、R（待审核）；别的启用账号（持「客户管理-读写」）创建的 S（待关联）", when: "在客户 A 的客户材料 → 客户登记表 点添加登记表，展开绑定登记表下拉", then: "只有 P；弹窗没有上传入口" }
  - { id: "G-04-029", module: "客户材料", given: "同 G-04-028", when: "选 P、对应合同选一份合同，点确定", then: "提示「添加成功」；列表新增一行 P，创建时间为 P 的创建时间、上次修改时间「-」、对应账户「-」，操作为 详情、编辑、规则配置；01 登记表列表里 P 变为待开户，关联客户显示 A" }
  - { id: "G-04-030", module: "客户材料", given: "同一账号在两个标签页分别打开客户 A、客户 B 的添加登记表，都选了 P", when: "先在 A 点确定，再在 B 点确定", then: "A 绑定成功；B 提示「该登记表状态已变化，请重新选择」，下拉刷新后没有 P" }
  - { id: "G-04-031", module: "客户材料", given: "客户 A 的登记表标签有历史上传文件 F（对应账户 CZ-ASA-02，没有规则）和绑定登记表 P（P 由另一账号创建，状态已开户）", when: "用另一个读写账号（A 的销售）打开，分别看 F、P 的操作，点 P 的详情、编辑、规则配置", then: "F 有预览、编辑、删除、规则配置；P 有详情、编辑、规则配置；P 详情只读展示登记内容；P 编辑弹窗里登记表不可换，只能改对应合同；点 P 的规则配置打开 P 的规则配置页（同 01 入口），面包屑「客户管理/{A 的公司名称}/规则配置」，能看到表单并提交审批；列表没有文件类型、文件大小列" }
  - { id: "G-04-033", module: "客户材料", given: "登记表 P 由已离职同事刘洋创建（账号已禁用），已关联客户 A、状态已开户；王浩有「客户管理-读写」，是 A 名下账户的优化师，没有「客户登记管理」", when: "王浩进客户 A 的客户材料 → 客户登记表，点 P 的「规则配置」，填好后提交审批并确定，再从通知链接或审批中心「全部审批」打开这张单", then: "打开 P 的规则配置页，提交成功，审批单申请人为王浩；王浩在审批详情页能看到这张单并可撤回；审批通过后客户 A 详情里该账户的规则配置变为新规则（R-04-051）" }
  - { id: "G-04-043", module: "客户材料", given: "客户 A：历史文件 F（对应账户 CZ-ASA-02，挂着上线导入的规则）、历史文件 H（没有对应账户）；账户 CZ-ASA-03 没有附件，迁移补了占位行；客户 B 名下只有一个迁移占位行；读写用户是 A、B 的销售", when: "看 A 的三行操作；点 F 的规则配置提交一条新规则；把鼠标放到 F 的删除上；看 B 在客户列表的提醒 icon", then: "F 有预览、编辑、规则配置，删除置灰并悬浮「该登记表已配置规则，不能删除」；H 有预览、编辑、删除，没有规则配置；占位行名称「上线迁移补建（无附件）」、对应账户 CZ-ASA-03，只有规则配置；F 的规则配置打开 03 同一页面并提交规则配置审批；B 的公司名称旁提示「未上传客户登记表」" }
  - { id: "G-04-044", module: "客户材料", given: "刘洋（账号已禁用）创建的待关联登记表 L；张敏（启用，持「客户管理-读写」）创建的待关联登记表 S；赵琳（启用，没有「客户管理-读写」）创建的待关联登记表 M；王浩有「客户管理-读写」，是客户 A 的销售", when: "王浩在 A 的添加登记表下拉里查看，选 L 点确定", then: "下拉里有「L 的名称（L 的 ID）· 刘洋（已禁用）」和「M 的名称（M 的 ID）」，没有 S；绑定成功，L 变为待开户、关联客户 A" }
  # 2.11 权限
  - { id: "G-04-032", module: "权限", given: "用户只有「客户管理-只读」，是客户 A 的销售", when: "进客户 A 的客户材料；再直接调用添加登记表接口；再直接打开 P 的规则配置页地址", then: "看不到添加登记表、编辑、删除、规则配置按钮（含历史文件行），能预览 F、看 P 的详情；接口返回无权限；规则配置页显示「无权限访问」（R-03-013）" }
  - { id: "G-04-041", module: "权限", given: "非 sys 用户刘佳有「客户管理-读写」；客户 A 销售刘佳；客户 B 销售张三、名下账户 B1 优化师刘佳；客户 C 销售张三、名下账户优化师王敏；sys 账号有「客户管理-只读」", when: "刘佳打开客户列表；直接打开 C 的客户详情、客户材料地址；直接调用 C 的编辑接口；sys 打开客户列表；之后把 C 的账户优化师改为刘佳（02），刘佳刷新列表", then: "刘佳列表只有 A、B；C 的客户详情、客户材料显示「无权限访问」；编辑接口返回无权限；sys 看到 A、B、C；优化师改为刘佳后刘佳能看到 C" }

tasks:
  - { id: "T-04-001", title: "客户实体字段调整：新增伙伴云签约主体 / 币种 / 账期 / 客户来源 / 付款主体 / 客户状态，前端移除 4 个旧字段与运营，存量映射与兼容，已禁用销售显示", depends_on: [], done_when: "R-04-001～R-04-004、R-04-011、R-04-069 落地；G-04-003、G-04-004、G-04-039 通过" }
  - { id: "T-04-002", title: "客户状态机：初始状态、02 添加账户触发 待开户→待投放、每日按消耗判定投放中 / 停止投放、存量按历史消耗推导、列头提示", depends_on: ["T-04-001"], done_when: "G-04-001～G-04-003、G-04-035、G-04-036 通过；02 能调用待开户→待投放并与建账户同成同败" }
  - { id: "T-04-003", title: "客户列表（字段、行操作、提醒 icon、合同终止时间标红、tab 切换）", depends_on: ["T-04-001"], done_when: "G-04-005 通过" }
  - { id: "T-04-004", title: "添加客户（独立页面；预付直接添加、后付提交新建客户审批；公司名称重名校验）", depends_on: ["T-04-001", "T-12-004"], done_when: "G-04-006～G-04-008、G-04-010、G-04-038 通过" }
  - { id: "T-04-005", title: "编辑客户（独立页面；预付改后付提交客户信息变更、直接保存、锁定、重复单拦截）", depends_on: ["T-04-001", "T-12-004"], done_when: "G-04-011、G-04-012、G-04-015～G-04-017 通过" }
  - { id: "T-04-006", title: "付款主体弹窗（编辑、校验、提交付款主体变更、锁定）", depends_on: ["T-04-001", "T-12-004"], done_when: "G-04-018、G-04-019 通过" }
  - { id: "T-04-007", title: "三类审批提交参数（含本单涉及账户）与结束回调处理（已通过 / 已驳回 / 已撤回 / 作废、执行失败回滚）", depends_on: ["T-04-004", "T-04-005", "T-04-006", "T-12-006"], done_when: "G-04-009、G-04-013、G-04-014、G-04-020、G-04-026、G-04-040、G-04-045 通过" }
  - { id: "T-04-008", title: "客户审批详情「审批内容」区（字段、公司名称链接、按提交快照高亮与原值、付款主体条目比对、生效说明）与查看权限判断", depends_on: ["T-12-007"], done_when: "G-04-021～G-04-024 通过" }
  - { id: "T-04-009", title: "已提交审批 tab（含免审单，撤回不看权限点）", depends_on: ["T-12-005"], done_when: "G-04-025、G-04-026、G-04-042 通过" }
  - { id: "T-04-010", title: "客户详情页（基础信息、规则配置表、付款主体）", depends_on: ["T-04-001"], done_when: "G-04-027 通过" }
  - { id: "T-04-011", title: "客户材料·客户登记表标签（绑定登记表、guard 与创建人已禁用例外、绑定行详情 / 编辑 / 规则配置、历史文件行规则配置与删除限制、迁移占位行）", depends_on: ["T-04-001", "T-01-001", "T-03-003"], done_when: "G-04-028～G-04-031、G-04-033、G-04-043、G-04-044 通过" }
  - { id: "T-04-012", title: "权限点校验（只读 / 读写的按钮显隐与服务端校验）", depends_on: ["T-04-003"], done_when: "G-04-005、G-04-024、G-04-032 通过" }
  - { id: "T-04-013", title: "客户「销售」变更记录与账户数据授权同步触发（新建客户记初始值、直接保存与客户信息变更审批通过时记变更与生效时间）", depends_on: ["T-04-004", "T-04-005", "T-04-007"], done_when: "G-04-034 通过" }
  - { id: "T-04-014", title: "客户数据范围隔离（列表、详情、客户材料、编辑、写接口、审批详情第②类）", depends_on: ["T-04-003"], done_when: "G-04-024、G-04-041 通过" }
  - { id: "T-04-015", title: "计费模式次月 1 日生效：待生效记录、生效时刻自动切换、取消 / 保留、各处展示", depends_on: ["T-04-005", "T-04-007"], done_when: "G-04-013、G-04-015、G-04-022、G-04-037 通过" }

decisions:
  - { id: "D-04-01", point: "客户审批驳回后怎么重提", conclusion: "同撤回：原单结束、不能原单重提；新建客户驳回不生成客户，回添加客户重新填且不预填；变更类保持当前生效值、解除锁定，改完提交新单", impact: "R-04-035～R-04-037", status: "已定" }
  - { id: "D-04-02", point: "哪些改动必须走审批、何时生效", conclusion: "照原型：基础信息只有预付款→后付款走客户信息变更审批，本次其他改动随单一起审；后付改预付或计费模式不变直接保存；付款主体任何改动都审。2026-10-21 用户定（会议清单 D02）：计费模式变更从确定时刻（审批通过 / 保存）的次月 1 日（UTC0）生效（D-00-73），其余字段照旧通过或保存即生效；风险：后付款客户改账期、币种、签约主体直接生效（币种、签约主体本期不影响任何财务单据与计算，2026-10-22 闭环清单 D 组）", impact: "R-04-023、R-04-024、R-04-031、R-04-036、R-04-066", status: "已定" }
  - { id: "D-04-03", point: "历史上传登记表文件", conclusion: "预览、编辑（可重新上传、改对应合同）、删除原样沿用；以后新增只能绑定不能上传；现有实现交技术核实；2026-10-21 起有对应账户的行另有规则配置（D-04-28）", impact: "R-04-055、R-04-056", status: "已定" }
  - { id: "D-04-04", point: "绑定方式登记表行的操作", conclusion: "详情（只读，同 01 详情）+ 编辑（登记表锁定、只改对应合同）+ 规则配置（D-04-24）；没有删除 / 解绑", impact: "R-04-060", status: "已定" }
  - { id: "D-04-05", point: "新建客户审批的动态审批人", conclusion: "「绑定的销售」按提交表单里选的销售解析；没选则跳过该节点。2026-10-21 用户定（会议清单 D29）：客户不再有运营字段，新建客户没有账户，「绑定的运营」解析为空跳过（D-00-76）。风险：申请人选销售即决定审批人（12 要求新建客户审批流至少一个指定用户节点，会议清单 D117）", impact: "R-04-034", status: "已定" }
  - { id: "D-04-06", point: "客户详情的规则配置表", conclusion: "要做：只读，每个账户一行，取该账户对应登记表（含历史上传文件行、迁移占位行）的当前生效规则（按 R-03-003，待生效与审批中的不展示）；列名与格式按 R-03-037；没有则「-」", impact: "R-04-051", status: "已定" }
  - { id: "D-04-07", point: "存量客户新必填字段为空", conclusion: "显示「-」，下次编辑必须补齐才能保存；补齐不触发审批", impact: "R-04-011", status: "已定" }
  - { id: "D-04-08", point: "伙伴云签约主体枚举", conclusion: "伙伴云 / clic；详情示例里的「click」是笔误", impact: "R-04-002", status: "已定" }
  - { id: "D-04-09", point: "已提交审批「详情」打开什么", conclusion: "新页打开该审批单的审批详情（原型写客户详情，与 01 一致处理）", impact: "R-04-048", status: "已定" }
  - { id: "D-04-10", point: "销售与商务", conclusion: "同一字段，商务是旧叫法；04 统一叫销售；12「绑定的销售」解析此字段（D-00-50）", impact: "R-04-004、R-04-034、12", status: "已定" }
  - { id: "D-04-11", point: "付款主体变更里被删条目怎么展示", conclusion: "列表末尾灰色删除线列出；新增条目标红", impact: "R-04-042", status: "已定" }
  - { id: "D-04-12", point: "新建客户审批中的客户", conclusion: "视为不存在：不进客户列表、不能被 02 选为所属客户、不能被绑定登记表；公司名称算占用（D-04-25）", impact: "R-04-006、02-账户管理", status: "已定" }
  - { id: "D-04-13", point: "两类变更审批能否并存", conclusion: "基础信息与付款主体互不影响，可各有一张审批中", impact: "R-04-027", status: "已定" }
  - { id: "D-04-14", point: "付款主体校验", conclusion: "至少 1 条；空行提示；去首尾空格后完全相同为重复；与生效内容完全一致不能提交。2026-10-21 用户定（会议清单 D78，A 档）：「完全一致」按集合比较、不看顺序，只调顺序视为未修改", impact: "R-04-029、R-04-030", status: "已定" }
  - { id: "D-04-15", point: "账期格式与切换", conclusion: "正整数天；切到预付款隐藏；后付改预付生效时清空（随 D-04-02 次月生效）", impact: "R-04-003", status: "已定" }
  - { id: "D-04-16", point: "客户状态怎么判定、存量怎么初始化", conclusion: "2026-10-21 用户定（会议清单 D22）：现有系统没有开启投放状态机，原映射作废；投放中 / 停止投放按消耗判定：最近 30 个完整自然日（UTC0）内任一账户有消耗 → 投放中，全部账户连续 30 天无消耗 → 停止投放，每日 UTC0 日结后判定；05 停投不直接改客户状态；存量按历史消耗推导一次（D-00-07、S-8）", impact: "R-04-008、R-04-010、R-04-065", status: "已定" }
  - { id: "D-04-17", point: "客户状态是否回退", conclusion: "本期不回到待开户 / 待投放，没有解绑；名下账户增减、停投都只按消耗判定（D-04-16）", impact: "R-04-009", status: "已定" }
  - { id: "D-04-18", point: "绑定登记表下拉范围", conclusion: "当前账号创建的、状态待关联的登记表，可按名称 / ID 搜索。2026-10-21 用户定（会议清单 D24）例外：创建人账号已禁用的待关联登记表，持「客户管理-读写」的人也能看到并绑定，显示创建人（已禁用）", impact: "R-04-057、R-04-058", status: "已定" }
  - { id: "D-04-19", point: "绑定行的时间与账户", conclusion: "上次修改时间取登记表编辑时间，没有则「-」；对应账户取 02 绑定的账户", impact: "R-04-059", status: "已定" }
  - { id: "D-04-20", point: "已提交审批的操作对象", conclusion: "显示 12 的审批类型名 新建客户 / 客户信息变更 / 付款主体变更；原型的「规则配置」是残留", impact: "R-04-046", status: "已定" }
  - { id: "D-04-21", point: "两个权限点的功能边界", conclusion: "只读：看列表、详情、客户材料、已提交审批、审批详情；读写：再加添加、编辑、付款主体提交、客户材料增删改与规则配置。2026-10-21 用户定（会议清单 D81）：撤回不再算读写权限，只校验申请人本人 + 单据审批中（D-00-79②），推翻原「只读不能撤回」", impact: "R-04-048、R-04-062、R-04-063", status: "已定" }
  - { id: "D-04-22", point: "变更类审批的动态审批人", conclusion: "「绑定的销售」按提交时客户当前生效的销售解析，本单改销售也由原销售审（12 R-12-015 推导，用户认可）。2026-10-21 用户定（会议清单 D29）：「绑定的运营」解析提交时客户名下全部账户的优化师（去重、只取启用用户），多人会签（D-00-76）", impact: "R-04-034", status: "已定" }
  - { id: "D-04-23", point: "差异高亮的比对基准", conclusion: "2026-10-21 用户定（会议清单 D27，推翻原「按当前生效值比、不另存快照」）：基准 = 提交那一刻的生效值，随审批单快照保存、后端统一给出，审批中与结束后回看一致；标红格下方灰字「原：{原值}」；付款主体删除线展示不变（D-00-75）", impact: "R-04-041、R-04-042", status: "已定" }
  - { id: "D-04-24", point: "客户材料里的规则配置入口", conclusion: "客户材料的绑定登记表行增加「规则配置」，与 01 入口打开同一个 03 规则配置页；有「客户管理-读写」就能配置，不要求是登记表创建人；客户列表行的入口仍不做（D-01-03）。2026-10-21 用户定（会议清单 D21、D20）：入口受客户数据范围限制（D-00-77），离职人员名下客户由 sys 改销售 / 优化师后交接；有对应账户的历史上传文件行、迁移占位行也有该入口（D-00-57、D-04-28）", impact: "R-04-060、R-04-062、R-04-063；03 R-03-012、R-03-013；01 D-01-03", status: "已定" }
  - { id: "D-04-25", point: "公司名称重名口径", conclusion: "2026-10-21 用户定（会议清单 D26-名称占用，技术答复 T11）：新建、改名都查同租户全部客户，按原文全等（区分大小写、不去空格）；审批中的新建客户名称也算占用；同一公司在不同账户系统开两个客户须加后缀；存量已重名的不强制改名（由我代定，依据：只在名称有修改时校验，与现状一致）；最后通过时重名算执行失败（D-00-79①）", impact: "R-04-068、R-04-071", status: "已定" }
  - { id: "D-04-26", point: "待生效计费模式的展示与再次编辑", conclusion: "2026-10-21 用户定（会议清单 D02-待生效文案，A 档）：列表、详情显示「X（yyyy-mm-dd 起改为 Y）」，编辑页与审批内容区显示生效说明。再次编辑的细则由我代定（依据 D02「同一客户只能有一条待生效变更，再改就覆盖」）：编辑页回显待生效目标值，不改则保留，改回生效值即取消；风险：用户只改别的字段不会误取消", impact: "R-04-066、R-04-067", status: "已定" }
  - { id: "D-04-27", point: "添加 / 编辑客户的形态", conclusion: "2026-10-21 用户定（会议清单 D80，A 档）：独立页面，面包屑「客户管理/添加客户」「客户管理/编辑客户」；点返回回到列表、不保存、不弹离开确认；与 02 添加账户页一致", impact: "R-04-017、R-04-022", status: "已定" }
  - { id: "D-04-28", point: "历史上传文件行的规则配置", conclusion: "2026-10-21 用户定（会议清单 D20，技术答复 T03）：存量账户的规则挂在历史上传文件行，行上加「规则配置」，与 03 同页同审批；没有附件的账户迁移补「上线迁移补建（无附件）」占位行；上线前仍批量导入固定比例规则（S-1）。由我代定：没有对应账户的历史文件行不显示规则配置；挂着规则的行不能删除（防止删行后账户规则丢失按 0 计）；占位行只有规则配置、不计入登记表数量提醒", impact: "R-04-015、R-04-051、R-04-055、R-04-060、R-04-073", status: "已定" }
  - { id: "D-04-29", point: "已禁用用户的显示与保留", conclusion: "2026-10-21 用户定（会议清单 D41，A 档，D-00-83）：显示「姓名（已禁用）」；编辑保存原值保留、不算变更；改选只能选启用用户", impact: "R-04-069、R-04-064", status: "已定" }
  - { id: "D-04-30", point: "签约主体、币种存量与下游用途", conclusion: "2026-10-21 用户定（会议清单 D79、D115）：能明确映射的映射为枚举，其余置空、原值另存不展示，映射表用户逐项确认（S-9）；所有页面只按枚举显示，上线前清洗完；签约主体本期只做客户档案，05～11 不读取，为空不拦截", impact: "R-04-011", status: "已定" }
  - { id: "D-04-31", point: "客户数据范围", conclusion: "2026-10-21 用户定（会议清单 D21，与原推荐「放开」相反）：保留现状隔离，非 sys 只能看、改自己是销售或名下任一账户优化师的客户，sys 看全部（D-00-77）；原依据 D-12-26「现有权限不隔离」前提不成立；离职人员名下客户由 sys 改销售 / 优化师后交接。新建客户单的审批详情查看按提交内容里的销售判断（原由我代定，2026-10-22 用户与技术确认，闭环清单 B12）", impact: "R-04-043、R-04-052、R-04-061～R-04-063", status: "已定" }
  - { id: "D-04-32", point: "客户列表合同终止时间标红、公司名称后缀", conclusion: "会议清单附 1 N12 按推荐落（评审确认）：合同终止时间只在即将到期（同勾选口径）或已过期时标红，不整列标红；去掉公司名称后的「（点击查看详情）」。若评审确认整列标红是 v2.0 线上现状、业务依赖，则改为保留", impact: "R-04-013", status: "评审确认" }
  - { id: "D-04-33", point: "预付改后付审批通过后账期何时生效", conclusion: "2026-10-22 用户与技术确认，闭环清单 A12：删去 R-04-036 的「连同账期」；账期随审批通过立即保存，计费模式生效前客户仍为预付款、不使用账期；后付改预付时账期在计费模式生效时清空", impact: "R-04-003、R-04-036、G-04-013", status: "已定" }
  - { id: "D-04-34", point: "创建人没有「客户管理-读写」的待关联登记表谁来绑定", conclusion: "2026-10-22 用户与技术确认，闭环清单 B18：D-04-18 例外扩大为「创建人已禁用，或创建人当前没有『客户管理-读写』」，满足任一条件时持「客户管理-读写」的人可以绑定这张待关联登记表；已知限制：创建人被收回「客户登记管理」后删不了自己创建的登记表（R-01-037）", impact: "R-04-057、R-04-058、G-04-028、G-04-044", status: "已定" }

