# 04-客户管理 · 机器可读规格
# 来源：html/客户管理.html:1891/1899/3040/3049、html/客户详情.html:2118、html/添加客户.html:2116、html/编辑客户.html:1880/2116/2124、
#       html/客户材料.html:3965/3973、html/审批详情-客户管理.html:2472 + 用户确认（见 decisions）；2026-10-21 按会议清单 v2 回写；2026-10-22 按闭环问题清单回写
# 本页主管：「客户」实体与客户状态机（02-账户管理 引用）；三类客户审批（新建客户 / 客户信息变更 / 付款主体变更）的提交、审批内容区、结果处理；
#           客户材料里「绑定登记表」动作（触发 01 登记表 待关联→待开户，guard 在本页 R-04-058）。
# 审批通用部分（审批单状态机、会签、撤回、作废、通知、审批详情框架）一律引用 12，不重写。

meta:
  feature: 客户管理
  product: ASA
  version: v2.1.0
  page: 04-客户管理
  date: 2026-10-22
  prd: PRD.md
  status: 待评审

scope:
  in:
    - "客户实体字段调整（新增 伙伴云签约主体 / 币种 / 账期 / 客户来源；删除 银行账号 / 所属银行 / 服务费率 / 税点 / 运营）与客户状态机定义（按消耗判定，02 引用）；客户「销售」变更记录（R-04-064，无展示界面）"
    - "客户列表（客户信息 tab）：字段、行操作、客户状态列头提示、数据范围"
    - "添加客户（独立页面）：预付款直接添加，后付款提交「新建客户」审批；公司名称重名校验"
    - "编辑客户（独立页面）：预付改后付提交「客户信息变更」审批，其余直接保存；计费模式次月 1 日生效与待生效展示；审批中锁定"
    - "付款主体弹窗：编辑与提交「付款主体变更」审批；审批中锁定"
    - "三类客户审批的提交参数（含本单涉及账户）、审批详情「审批内容」区、审批结束后客户数据处理、执行失败情形"
    - "「已提交审批」tab"
    - "客户详情页（基础信息 / 规则配置 / 付款主体，只读）"
    - "客户材料：客户登记表标签改为绑定在线登记表；历史上传文件兼容；绑定行、有对应账户的历史文件行、迁移占位行的「规则配置」入口（跳 03）"
    - "客户管理两个权限点的功能边界与客户数据范围（D-00-77）"
  out:
    - "客户列表行操作的「规则配置」入口（原型残留，不做，D-01-03）；规则配置入口改放客户材料登记表行（R-04-060）"
    - "规则配置页与规则配置审批内容（归 03-规则配置）；客户详情只读引用"
    - "审批单状态机、审批人解析与会签、撤回、作废、通知、审批详情通用框架（归 12-审批配置与审批中心）"
    - "添加账户动作本身、账户优化师字段、销售的账户数据授权规则（归 02-账户管理）"
    - "计费模式切换后的余额抵扣、上期预付欠费（D-00-73，归 05、06）"
    - "解绑登记表、解绑账户、客户状态回到待开户 / 待投放（本期没有，D-01-16、D-04-17）"
    - "内部编辑登记表同步到客户（不同步，D-01-06）"
    - "客户材料「合同」标签（本期无改动，沿用）"
    - "删除客户（原型无此操作，沿用现状）"
    - "新增权限点、把权限点分配给角色（版本级约定：只出权限点；本页只写两个现有权限点的边界）"

roles:
  - { role: "客户管理-只读", can: ["查看数据范围内的客户列表、客户详情、客户材料（列表、预览、下载、登记表详情）", "查看已提交审批 tab", "只读查看数据范围内的三类客户审批详情", "撤回自己提交的审批中单（不看权限点，D-00-79②）"], cannot: ["添加客户", "编辑客户", "提交付款主体", "客户材料增删改与规则配置"], source: "现有权限点「客户管理-只读」（D-04-21、D-00-77）" }
  - { role: "客户管理-读写", can: ["只读权限的全部", "添加客户", "编辑客户", "提交付款主体变更", "客户材料添加登记表 / 编辑 / 删除历史文件 / 规则配置 / 合同增删改（均在数据范围内）"], cannot: ["撤回他人提交的审批单"], source: "现有权限点「客户管理-读写」（D-04-21、D-00-77）" }
  - { role: "sys 账号", can: ["按所持权限点操作全部客户"], cannot: [], source: "D-00-77" }
  - { role: "审批人", can: ["在审批详情里审批客户三类审批单"], cannot: [], source: "12 审批单快照（R-12-023）" }

entities:
  - name: 客户
    key: customer
    fields:
      - { key: "customer_id", label: "客户ID", type: "string", required: true, generated: true, rule: "沿用现有生成规则；01 登记表列表的「客户ID」即此值" }
      - { key: "billing_mode", label: "计费模式", type: "enum", required: true, enum: ["预付款", "后付款"], rule: "沿用现有字段；切换规则见 R-04-021、R-04-023、R-04-024；变更次月 1 日（UTC0）生效（R-04-066、D-00-73）" }
      - { key: "pending_billing_mode", label: "待生效计费模式", type: "object", required: false, rule: "新增；目标计费模式 + 生效日（次月 1 日 UTC0）；同一客户最多一条（R-04-066、R-04-067）" }
      - { key: "payment_term_days", label: "账期", type: "int", required: false, unit: "天", rule: "R-04-003：后付款（含待生效后付款）时必填、正整数；预付改后付随审批通过立即保存、计费模式生效前不使用；后付改预付生效时清空（D-04-33）" }
      - { key: "company_name", label: "公司名称", type: "string", required: true, rule: "沿用现有；同租户全部客户 + 审批中新建客户单内原文全等不重名（R-04-068）" }
      - { key: "company_alias", label: "公司别名", type: "string", required: false, rule: "沿用现有" }
      - { key: "our_contract_entity", label: "伙伴云签约主体", type: "enum", required: true, enum: ["伙伴云", "clic"], rule: "R-04-002；存量映射 / 置空见 R-04-011；本期只做客户档案，05～11 不读取；与 01 登记表的 contract_entity（签约主体名称，自由文本）不是同一字段" }
      - { key: "currency", label: "币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "R-04-002（版本级约定）；存量映射 / 置空见 R-04-011" }
      - { key: "sales_user_id", label: "销售", type: "ref", required: false, rule: "沿用现有「商务」字段，统一改叫销售（R-04-004）；下拉可搜索，候选为启用用户；已禁用的显示与保留见 R-04-069（D-00-83）；12「绑定的销售」解析此字段（D-00-50）；02 账户销售实时取此字段（D-02-03）；每次变化记录前后值与生效时间（R-04-064）；变更生效时同步账户数据授权（R-04-072）" }
      - { key: "contract_start", label: "合同起始时间", type: "date", required: false, rule: "沿用现有（表单里叫「起始时间」）" }
      - { key: "contract_end", label: "合同终止时间", type: "date", required: false, rule: "沿用现有（表单里叫「终止时间」）；与起始时间的先后校验沿用现有；列表标红见 R-04-013" }
      - { key: "source", label: "客户来源", type: "string", required: false, rule: "新增；单行输入框，不限制格式；列表不展示" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "沿用现有" }
      - { key: "payers", label: "付款主体", type: "list", required: false, rule: "字符串列表，保持录入顺序，顺序仅影响展示；只能通过付款主体变更审批修改（R-04-028～R-04-032、R-04-037）；下游单据按快照（R-04-070）" }
      - { key: "status", label: "客户状态", type: "enum", required: true, enum: ["待开户", "待投放", "投放中", "停止投放"], default: "待开户", rule: "见 flows；取代原「开启投放」字段（R-04-005）；投放中 / 停止投放按消耗判定（R-04-008）" }
      - { key: "created_at", label: "创建时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "沿用现有；后付款新建客户为审批通过时刻" }
      # 删除字段：bank_account（银行账号）、bank_name（所属银行）、service_fee_rate（服务费率）、tax_rate（税点）——前端不再展示和录入，库表 v67 已删；
      #           ops_user_id（运营）——停用，存量值不迁移，运营 = 账户优化师（D-00-76，S-24）

flows:
  - entity: 客户
    states: [待开户, 待投放, 投放中, 停止投放]
    initial: 待开户
    transitions:
      - { from: "无（新客户）", action: "预付款添加成功", actor: "内部用户（读写）", to: "待开户", guard: "R-04-018、R-04-019" }
      - { from: "无（新客户）", action: "新建客户审批已通过", actor: "系统（12 结束回调）", to: "待开户", guard: "R-04-035" }
      - { from: "待开户", action: "添加账户且所属客户为本客户", actor: "内部用户（在 02-账户管理）", to: "待投放", guard: "R-04-007：与 02 建账户同成同败" }
      - { from: "待投放", action: "最近 30 个完整自然日内名下任一账户有消耗 > 0", actor: "系统（每日 UTC0 日结后判定）", to: "投放中", guard: "R-04-008、D-00-07" }
      - { from: "投放中", action: "名下全部账户连续 30 个完整自然日（UTC0）消耗都为 0", actor: "系统（每日 UTC0 日结后判定）", to: "停止投放", guard: "R-04-008、D-00-07；05 停投不直接触发" }
      - { from: "停止投放", action: "最近 30 个完整自然日内名下任一账户有消耗 > 0", actor: "系统（每日 UTC0 日结后判定）", to: "投放中", guard: "R-04-008、D-00-07" }
    reverse:
      - { action: "解绑账户 / 回退到待开户或待投放", actor: "—", allowed_from: [], note: "本期没有，状态不回退（R-04-009、D-04-17）" }
      - { action: "删除客户", actor: "—", allowed_from: [], note: "原型无此操作，不在本期范围" }

refs:
  - { page: "01-客户登记", entity: "客户登记表", ids: ["R-01-008", "R-01-010", "R-01-019"], uses: "客户材料「绑定登记表」触发 待关联 → 待开户 并写入 customer_id（guard 见 R-04-058）；绑定行「详情」复用 R-01-010 的只读详情内容与格式，但不受 R-01-008 创建人隔离；一表只关联一个客户、本期无解绑（D-01-15、D-01-16）" }
  - { page: "02-账户管理", entity: "账户", ids: ["R-02-004", "R-02-015", "R-02-017", "R-02-027"], uses: "客户「运营」= 账户优化师（D-00-76），优化师决定客户数据范围（R-04-061）；所属客户下拉不受客户数据范围限制（R-02-004，D-00-77 例外）；账户销售取客户销售，销售变更时同步账户数据授权（R-04-072，规则归 02）" }
  - { page: "03-规则配置", entity: "规则配置", ids: ["R-03-003", "R-03-012", "R-03-013", "R-03-037", "R-03-042", "R-03-053"], uses: "客户详情规则配置表：按 R-03-003 取每个账户对应登记表（含历史上传文件行、迁移占位行）的当前生效规则，各列格式按 R-03-037（R-04-051）；客户材料各行「规则配置」打开 03 规则配置页，页面内容、面包屑、权限与提交审批按 R-03-012、R-03-013（R-04-060）" }
  - { page: "05-费用管理", entity: "账户额度", ids: ["R-05-014"], uses: "05 余额不足停投不直接改客户状态，客户状态只按消耗判定（R-04-008）" }
  - { page: "12-审批配置与审批中心", entity: "审批单", ids: ["R-12-016", "R-12-017", "R-12-018", "R-12-025", "R-12-030", "R-12-031", "R-12-032", "R-12-033", "R-12-034", "R-12-035", "R-12-043", "R-12-045", "R-12-046", "R-12-047", "R-12-049"], uses: "提交新建客户 / 客户信息变更 / 付款主体变更三类审批（传 操作对象客户、本单涉及账户、业务单据、发起备注）；提交提示按 R-12-018；审批内容区与高亮声明（基准 D-00-75）；执行失败与作废（D-00-79）；按 已通过 / 已驳回 / 已撤回 处理客户数据；已提交审批撤回；审批详情第②类查看范围" }
  - { page: "11-提成中心", entity: "提成结果日明细", ids: ["R-11-003", "D-00-72"], uses: "本页记录客户销售每次变更的前后值与生效时间（R-04-064），供 11 按业务日取当日销售；变更当天（UTC0）起归新人，上线前按上线时的值（D-00-72）" }

rules:
  # —— 2.1 客户实体与客户状态 ——
  - { id: "R-04-001", module: "客户实体", text: "客户基础信息新增 伙伴云签约主体、币种、账期、客户来源 4 个字段；删除 银行账号、所属银行、服务费率、税点 4 个字段：添加、编辑、列表、详情、审批详情都不再展示，也不能录入（库表 v67 已删这 4 列，历史值不可恢复，无计算依赖）；新增「客户状态」取代原「开启投放」字段；客户上的「运营」字段停用，列表、添加 / 编辑、详情、审批内容区都不再有，存量值不迁移（D-00-76，S-24），运营即名下账户的优化师（02）" }
  - { id: "R-04-002", module: "客户实体", text: "伙伴云签约主体为必填单选：伙伴云 / clic（D-04-08）；币种为必填单选：人民币 / USD / USDT（版本级约定）；两者都没有默认值" }
  - { id: "R-04-003", module: "客户实体", text: "账期在计费模式为后付款（含待生效的后付款，R-04-066）时显示且必填，只能填正整数，单位「天」；表单里计费模式切到预付款时账期输入框隐藏；预付改后付的账期随审批通过立即保存，计费模式生效前客户仍为预付款、不使用账期（R-04-036、D-04-33）；后付改预付的变更生效时账期清空，生效前保留（D-04-15）" }
  - { id: "R-04-004", module: "客户实体", text: "原「商务」字段统一改叫「销售」，是同一个字段：客户列表列名、添加 / 编辑表单、客户详情、审批详情都写「销售」（D-04-10）；12 动态选项「绑定的销售」解析客户的销售字段（D-00-50）；「绑定的运营」解析本单涉及账户的优化师（D-00-76），本页传哪些账户见 R-04-034" }
  - { id: "R-04-005", module: "客户状态", text: "客户状态只有 待开户 / 待投放 / 投放中 / 停止投放 四个，只由系统按 flows 流转，所有页面都不能手动修改；客户列表展示该字段，添加、编辑客户页面不展示" }
  - { id: "R-04-006", module: "客户状态", text: "客户在两种情况下产生，初始状态都为待开户：预付款添加成功（R-04-019）；后付款「新建客户」审批已通过（R-04-035）。新建客户审批中的客户视为不存在：不出现在客户列表、不能在 02 添加账户里被选为所属客户、不能被绑定登记表（D-04-12）；但它的公司名称算占用（R-04-068）" }
  - { id: "R-04-007", module: "客户状态", text: "02-账户管理添加账户成功、且所属客户状态为待开户时，客户状态变为待投放，与 02 的建账户动作同成同败；客户已是待投放 / 投放中 / 停止投放时再添加账户，状态不变" }
  - { id: "R-04-008", module: "客户状态", text: "待投放 → 投放中、投放中 ⇄ 停止投放由系统按名下账户的消耗判定（D-00-07）：每天 UTC0 日结后判定一次，用判定时已同步的消耗数据，看最近 30 个完整自然日（UTC0，截至前一日）。窗口内名下任一账户有某日消耗 > 0 → 投放中（待投放、停止投放都转入，投放中保持）；当前为投放中、且窗口内名下全部账户每天消耗都为 0（即连续 30 个完整自然日无消耗）→ 停止投放；待投放且窗口内无消耗 → 保持待投放。05 余额不足停投（R-05-014）、账户暂停投放都不直接改客户状态，只按本条的消耗结果变化" }
  - { id: "R-04-009", module: "客户状态", text: "本期客户状态不回到待开户或待投放：没有解绑账户的操作；名下账户增减、停投，都只按 R-04-008 的消耗判定，不另改状态（D-04-17）" }
  - { id: "R-04-010", module: "存量兼容", text: "上线时存量客户的客户状态按历史消耗推导一次，取代原「开启投放」映射（D-00-07，S-8）：名下没有账户 → 待开户；有账户、上线前最近 30 个完整自然日（UTC0）内有消耗 → 投放中；有账户、曾有过消耗但这 30 天都无消耗 → 停止投放；有账户、从没有过消耗 → 待投放；上线后按 R-04-008 每日判定（D-04-16）" }
  - { id: "R-04-011", module: "存量兼容", text: "存量客户的伙伴云签约主体、币种原为自由文本：上线前能明确映射成枚举的映射为枚举，映射不了的置空，原值另存备查、界面不展示（映射表由技术导出两列去重取值、用户逐项确认，S-9）；所有页面（列表、详情、编辑、审批详情）一律按枚举显示，没有枚举值显示「-」，不显示原文；清洗在上线前完成，不设过渡态；后付款存量客户的账期为空时同样显示「-」。下次编辑客户时这些必填项为空的必须补齐才能保存或提交；只补齐这些字段、计费模式不是预付改后付时，直接保存生效、不走审批（D-04-07、D-04-30）。伙伴云签约主体本期只做客户档案，05～11 不读取，为空不拦截任何财务操作（D-04-30）" }
  - { id: "R-04-064", module: "客户实体", text: "客户「销售」每次变化都记录一条：变更前的值、变更后的值、生效时间（销售改为空或从空改为有值也算变化）。生效时间取销售真正生效的时刻：①新建客户以客户生效时刻记初始值（变更前为空）：预付款为添加成功时刻（R-04-019），后付款为新建客户审批通过、客户创建的时刻（R-04-035）；②编辑客户直接保存（R-04-024）且改了销售的，以保存成功时刻为准；③客户信息变更审批（R-04-023）里改了销售的，以审批通过、新信息生效的时刻为准（R-04-036）。审批中的修改不算变更（D-00-09），审批被驳回 / 撤回、保存失败、销售没变（含已禁用销售原样保留，R-04-069）时都不记录。变更当天（UTC0）起归新销售；上线前不回填历史，上线前的日子一律按上线时的销售（D-00-72）。记录供 11 按业务日取当日销售（R-11-003），本页不新增展示界面；同一生效时刻按 R-04-072 / R-02-027 同步销售的账户数据授权" }
  - { id: "R-04-069", module: "客户实体", text: "客户的销售是已禁用账号时，列表、详情、审批内容区、编辑页下拉回显都显示「姓名（已禁用）」，不显示用户 ID；编辑保存时原值原样保留，不算一次销售变更；用户主动改选时候选只有启用用户，改掉以后不能再选回这个已禁用的人（D-00-83、D-04-29）；「绑定的销售」解析到已禁用账号时按 12 解析为空、该节点跳过（R-12-016）；审批详情里的显示按 R-12-049" }
  - { id: "R-04-072", module: "客户实体", text: "客户销售变更生效时（生效时刻同 R-04-064 ②③），同步销售对该客户名下账户的数据授权：新销售获得名下全部账户的数据权限，旧销售因「客户销售」身份获得的授权收回（他同时是这些账户的优化师 / 合作者 / 观察者的保留）；授权规则与上线补授权（S-22）按 R-02-027，本页只提供触发时点；授权失败不影响销售变更本身，由技术沿用现有重试方案补齐" }
  # —— 2.2 客户列表 ——
  - { id: "R-04-012", module: "客户列表", text: "客户管理页顶部有「客户信息 / 已提交审批」两个切换，默认客户信息；客户信息页的搜索框（含搜索历史）、「显示合同即将到期客户」勾选、「添加客户」按钮沿用现有；列表只列当前用户数据范围内的客户（R-04-061）" }
  - { id: "R-04-013", module: "客户列表", text: "列表字段依次为：公司名称、伙伴云签约主体、所属账户系统、币种、计费模式、客户别名、销售、账户列表、客户状态、合同起始时间、合同终止时间、备注、操作（没有「运营」列，D-00-76）；公司名称列与操作列固定；账期、客户来源不在列表展示；空值显示「-」。合同终止时间只在命中「即将到期」（与「显示合同即将到期客户」勾选同一口径，天数沿用现有）或已过期时标红，其余正常显示；公司名称后不加「（点击查看详情）」，详情走行操作（D-04-32）" }
  - { id: "R-04-014", module: "客户列表", text: "行操作为 详情、客户材料、编辑、付款主体，所有客户状态都显示：详情 = 新页打开客户详情（2.9）；客户材料 = 进入客户材料页（2.10），取代原「合同」「客户登记表」两个入口；编辑 = 编辑客户（2.4）；付款主体 = 打开付款主体弹窗（2.5）。客户列表不放「规则配置」入口（D-01-03），规则配置入口在客户材料的登记表行（R-04-060）" }
  - { id: "R-04-015", module: "客户列表", text: "公司名称旁的提醒 icon 沿用 v2.0：没有任何合同时提示「未上传合同」；客户登记表数量（历史上传文件 + 绑定的在线登记表合计，迁移占位行不计，R-04-073）为 0 时提示「未上传客户登记表」" }
  - { id: "R-04-016", module: "客户列表", text: "排序沿用现有；分页 10 / 50 / 100 / 300 条每页，展示总条数" }
  - { id: "R-04-065", module: "客户列表", text: "「客户状态」列头带问号，悬浮提示「投放中：近 30 天有消耗；停止投放：已连续 30 天无消耗」（R-04-008）" }
  # —— 2.3 添加客户 ——
  - { id: "R-04-017", module: "添加客户", text: "添加客户为独立页面，面包屑「客户管理/添加客户」；点「返回」回到客户列表，不保存已填内容，不弹离开确认（D-04-27）。字段顺序：计费模式、账期（仅后付款）、公司名称、公司别名、伙伴云签约主体、币种、销售、起始时间、终止时间、客户来源、备注；按钮 返回 / 添加（后付款时为「提交审批」）" }
  - { id: "R-04-018", module: "添加客户", text: "点添加或提交审批时校验：计费模式、公司名称、伙伴云签约主体、币种必填，后付款时账期必填且为正整数（R-04-003）；公司名称不能重名（R-04-068）；其余字段的长度与格式沿用现有；不通过时不提交，在对应字段下方提示" }
  - { id: "R-04-019", module: "添加客户", text: "计费模式为预付款时按钮为「添加」，校验通过后直接创建客户（状态待开户），弱提示「添加成功」，返回客户列表，新客户出现在列表中（不在本人数据范围的除外，R-04-061）" }
  - { id: "R-04-020", module: "添加客户", text: "计费模式为后付款时按钮变为「提交审批」，校验通过后二次确认：「后付款客户需进行审批，是否提交审批单？」+ 备注（多行输入框，选填）+ 取消 / 确定；确定后提交「客户管理—新建客户」审批（R-04-033），按 12 返回的审批单状态弱提示（R-12-018：审批中为「已提交审批」，免审通过为「提交成功，无需审批，已生效」），返回客户列表；审批中不创建客户（R-04-006）" }
  - { id: "R-04-021", module: "添加客户", text: "在添加页切换计费模式时，按钮文字在「添加」与「提交审批」之间实时切换，账期按 R-04-003 显隐；新客户的计费模式在客户创建时即生效，不适用 R-04-066 的次月生效" }
  - { id: "R-04-068", module: "添加客户", text: "公司名称重名校验（D-04-25）：添加客户（添加、提交审批）和编辑客户（确定、提交审批）时，公司名称为新填或与当前生效值不同才校验；与同租户全部客户的公司名称、以及审批中的新建客户单里的公司名称按原文全等比较（区分大小写，不去掉空格），相同即重名，不提交，公司名称下方提示「公司名称已存在」；服务端同样校验。同一公司在不同账户系统开两个客户时，公司名称须加后缀区分。存量客户里已经重名的不强制改名，公司名称不改时照常保存。客户信息变更里改的公司名称在审批中不算占用，最后通过时若已重名按 R-04-071 处理" }
  # —— 2.4 编辑客户 ——
  - { id: "R-04-022", module: "编辑客户", text: "编辑客户为独立页面，面包屑「客户管理/编辑客户」，返回规则同 R-04-017；字段与顺序同 R-04-017，打开时回显客户当前生效的值（计费模式有待生效变更时回显待生效的目标值，R-04-066）；按钮 返回 / 确定（预付改后付时为「提交审批」）；校验同 R-04-018" }
  - { id: "R-04-023", module: "编辑客户", text: "客户当前生效计费模式为预付款、本次改为后付款时：按钮变为「提交审批」，计费模式旁提示「审批通过后的次月 1 日（UTC0）起生效」；点后二次确认「变更为后付款客户需进行审批，是否提交审批单？」+ 备注（选填）+ 取消 / 确定；确定后提交「客户管理—客户信息变更」审批，本次页面上的全部修改随单一起审，审批通过前都不生效；按 12 返回的审批单状态弱提示（R-12-018）并返回列表（D-04-02）；通过后的生效方式见 R-04-036" }
  - { id: "R-04-024", module: "编辑客户", text: "不属于 R-04-023 的保存（后付改预付、取消待生效变更、计费模式没改）：按钮为「确定」，校验通过后直接保存，不走审批，弱提示「保存成功」（D-04-02）；计费模式以外的字段保存即生效；后付改预付的计费模式按 R-04-066 次月生效，计费模式旁提示「保存后 {次月 1 日 yyyy-mm-dd}（UTC0）起生效」；币种、伙伴云签约主体修改后立即生效，本期不影响任何财务单据与计算" }
  - { id: "R-04-025", module: "编辑客户", text: "同一客户的基础信息同一时间最多只有 1 张审批中的「客户信息变更」单；有审批中单时打开编辑客户，页面顶部提示条按 R-12-047：「该客户已有审批中的客户信息变更（审批单号 {审批单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，单号可点、新页打开审批详情（没有查看资格按 R-12-043 显示「无权限查看」）；展示当前生效值，所有输入框禁用，「确定 / 提交审批」按钮隐藏，只保留返回" }
  - { id: "R-04-026", module: "编辑客户", text: "提交或保存时服务端再判一次：该客户已有审批中的同类单（基础信息为客户信息变更，付款主体为付款主体变更）时，拒绝本次保存或提交，不生成第二张单，弹提示框「该客户已有审批中的{客户信息变更 / 付款主体变更}（审批单号 {审批单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，按钮「知道了」，单号可点（句式按 R-12-047，本页对象为「该客户」，审批类型取客户信息变更 / 付款主体变更）" }
  - { id: "R-04-027", module: "编辑客户", text: "基础信息（客户信息变更）与付款主体（付款主体变更）两类审批互不影响：一类有审批中单时，另一类仍可正常编辑和提交（D-04-13）" }
  - { id: "R-04-066", module: "编辑客户", text: "计费模式变更从确定时刻的次月 1 日 00:00（UTC0）起生效（D-00-73）：预付改后付以审批通过时刻为准（例：2026-10-25 提交、2026-11-03 通过 → 2026-12-01 起后付款），后付改预付以保存成功时刻为准；生效前客户仍按原计费模式，同一结算期只有一种计费模式；到生效时刻由系统自动切换，账期按 R-04-003 处理；生效后的余额、欠费处理按 D-00-73（05、06 定义）。同一客户同时最多一条待生效的计费模式变更：编辑页计费模式回显待生效的目标值；本次保存的计费模式与回显值相同视为没改，待生效变更保留；改回当前生效值时直接保存并取消待生效变更（计费模式旁提示「保存后取消 {yyyy-mm-dd} 起改为{目标值}的变更」）；当前生效值为预付款、没有待生效变更、本次改为后付款时走 R-04-023（D-04-26）" }
  - { id: "R-04-067", module: "编辑客户", text: "有待生效计费模式时：客户列表计费模式列、客户详情显示「{当前生效值}（{yyyy-mm-dd} 起改为{目标值}）」；编辑页计费模式旁提示「{yyyy-mm-dd}（UTC0）起生效」；客户信息变更审批内容区的计费模式旁，审批中显示「审批通过后的次月 1 日（UTC0）起生效」，已通过显示「生效月：yyyy-mm」（按通过时刻算），已驳回 / 已撤回不显示；05、07 等其他页面怎么显示客户计费模式按各页规则" }
  # —— 2.5 付款主体弹窗 ——
  - { id: "R-04-028", module: "付款主体", text: "付款主体弹窗回显客户当前生效的付款主体，每条一行输入框，按生效顺序排列；没有付款主体时显示一个空行；每行右侧「+」在该行下方插入一个空行，「−」删除该行，只剩一行时「−」不可用；输入不限格式，长度沿用默认" }
  - { id: "R-04-029", module: "付款主体", text: "点「提交审批」时校验：去掉首尾空格后至少有 1 条非空；存在空行时该行提示「请输入付款主体名称」；去掉首尾空格后两条完全相同视为重复，提示「付款主体重复」；重复只在本客户内校验，不同客户之间不校验（D-04-14）" }
  - { id: "R-04-030", module: "付款主体", text: "去掉首尾空格后，提交的付款主体集合与当前生效的相同（不看顺序）时不能提交，提示「付款主体未修改」；有增删改时，按提交顺序整体替换（R-04-037）（D-04-14）" }
  - { id: "R-04-031", module: "付款主体", text: "校验通过后二次确认「变更付款主体需进行审批，是否提交审批单？」+ 备注（选填）+ 取消 / 确定；确定后提交「客户管理—付款主体变更」审批（R-04-033），内容为提交后的完整付款主体列表；按 12 返回的审批单状态弱提示（R-12-018），关闭弹窗；付款主体的任何改动都必须走审批，没有直接保存（D-04-02）" }
  - { id: "R-04-032", module: "付款主体", text: "该客户有审批中的付款主体变更单时打开弹窗：顶部提示条按 R-12-047：「该客户已有审批中的付款主体变更（审批单号 {审批单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，单号可点、新页打开审批详情（没有查看资格按 R-12-043 显示「无权限查看」）；输入框禁用，「+」「−」与「提交审批」隐藏" }
  - { id: "R-04-070", module: "付款主体", text: "付款主体的删除、改名只影响之后新提交单据的选项；已提交和已完成的单据（05、06、07、09 等）按各自提交时的快照显示，不受影响" }
  # —— 2.6 审批提交与结果处理 ——
  - { id: "R-04-033", module: "审批对接", text: "三类审批提交时传给 12：审批类型（客户管理—新建客户 / 客户信息变更 / 付款主体变更）、操作对象客户（R-04-034）、本单涉及账户（R-04-034）、业务单据 = 本次提交的完整内容快照（新建客户与客户信息变更为全部基础信息字段，付款主体变更为完整付款主体列表）、发起备注 = 二次确认框里填的备注" }
  - { id: "R-04-034", module: "审批对接", text: "审批人解析参数：新建客户 = 申请中的这个新客户，「绑定的销售」按提交表单里选的销售解析，表单没选则该动态节点按 R-12-017 跳过（D-04-05）；本单没有账户，「绑定的运营」解析为空、该节点跳过（D-00-76）。客户信息变更、付款主体变更 = 本客户，「绑定的销售」按提交那一刻客户当前生效的销售解析，即使本单正在修改销售，也由修改前的销售审批（D-04-22）；本单涉及账户 = 提交那一刻客户名下全部账户，「绑定的运营」解析这些账户的优化师（去重、只取启用用户，没有账户时为空跳过），解析出多人按 D-00-43 会签。新建客户时客户尚未生效：提交时把表单里的销售作为审批解析参数，不建临时客户（闭环清单 B12）" }
  - { id: "R-04-035", module: "审批结果", text: "新建客户审批结束（R-12-025）：已通过 → 按提交内容创建客户，状态待开户，出现在客户列表；已驳回 / 已撤回（含被作废，R-04-071）→ 不创建客户，提交内容只留在审批单里；要重新申请需回添加客户重新填写，表单不预填（D-04-01）；命中 0 节点或全部跳过时提交即通过，客户立即创建（R-12-018）" }
  - { id: "R-04-036", module: "审批结果", text: "客户信息变更审批结束：已通过 → 用提交内容整体覆盖客户当前生效的基础信息，计费模式按 R-04-066 以通过时刻的次月 1 日（UTC0）生效，账期与其余字段通过即生效（账期随审批通过立即保存，计费模式生效前客户仍为预付款、不使用账期，R-04-003、D-04-33），编辑页解除锁定；已驳回 / 已撤回（含被作废）→ 客户基础信息保持不变，编辑页解除锁定；原单不能修改重提，需在编辑客户重新修改再提交新单（D-04-01）" }
  - { id: "R-04-037", module: "审批结果", text: "付款主体变更审批结束：已通过 → 用提交的完整列表整体替换当前生效的付款主体，弹窗解除锁定；已驳回 / 已撤回（含被作废）→ 付款主体保持不变，弹窗解除锁定；原单不能修改重提，需重新编辑再提交新单（D-04-01）" }
  - { id: "R-04-071", module: "审批结果", text: "最后一个审批人通过时按 R-04-035～R-04-037 执行；执行失败按 R-12-045 回滚（D-00-79①：审批单保持审批中、这次通过不记录、确认框显示原因）。本页算执行失败的情形只有一种：新建客户、或客户信息变更改了公司名称，通过那一刻公司名称已与其他客户重名（R-04-068），原因「公司名称「{名称}」已存在，请驳回后重新提交」；其余变化（审批期间名下账户、优化师、销售变化等）都不算失败，照常执行。持「审批配置」权限点的人作废本页审批中的单时（R-12-046），客户数据按「已撤回」处理（D-00-79③）" }
  # —— 2.7 审批详情 · 审批内容区 ——
  - { id: "R-04-038", module: "审批内容", text: "新建客户、客户信息变更的审批内容区展示本单提交的全部基础信息，两列排布：公司名称、公司别名、伙伴云签约主体、币种、计费模式（客户信息变更旁另显示生效说明，R-04-067）、账期（后付款时显示，单位天）、销售、起始时间、终止时间、客户来源、备注；空值显示「-」；没有「运营」（D-00-76）" }
  - { id: "R-04-039", module: "审批内容", text: "付款主体变更的审批内容区展示 公司名称、付款主体（按提交顺序每条一行）" }
  - { id: "R-04-040", module: "审批内容", text: "客户信息变更、付款主体变更的「公司名称」为超链接，新页打开该客户的客户详情（展示当前生效内容，R-04-050）；新建客户的公司名称是纯文本，不做链接" }
  - { id: "R-04-041", module: "审批内容", text: "客户信息变更启用 12 的变更高亮，比对 R-04-038 列出的全部基础信息字段，基准 = 提交那一刻客户的生效值，随审批单快照保存、由后端统一给出（D-00-75）：与基准不同的字段值标红，标红格下方灰字「原：{原值}」；基准为空的不标红，也不显示「原」；审批中、审批结束后回看一致（D-04-23）；审批中客户的生效值已与基准不同时，内容区顶部按 D-00-75 提示；新建客户不启用高亮" }
  - { id: "R-04-042", module: "审批内容", text: "付款主体变更按条目比对提交那一刻生效的付款主体（基准同 R-04-041）：提交列表里新增的条目标红；基准有、提交里没有的条目，在列表末尾以灰色删除线列出；未变的条目正常显示（D-04-11）；审批结束后回看照样（D-04-23）" }
  - { id: "R-04-043", module: "审批内容", text: "三类客户审批详情的第②类只读查看范围（R-12-043）：有「客户管理-只读」或「客户管理-读写」任一权限点，且该客户在本人数据范围内（R-04-061）；新建客户单的客户还不存在，按本单提交内容里的销售是否为本人判断；sys 看全部；本页向 12 提供的「能否查看该业务单据」判断只看这两条" }
  # —— 2.8 已提交审批 tab ——
  - { id: "R-04-044", module: "已提交审批", text: "已提交审批只展示当前登录账号提交的三类客户审批单（新建客户、客户信息变更、付款主体变更），含免审直接通过的单（状态已通过）；不按客户数据范围过滤" }
  - { id: "R-04-045", module: "已提交审批", text: "搜索框按审批单号、客户名称包含匹配；状态筛选 全部 / 审批中 / 已通过 / 已驳回 / 已撤回，默认全部" }
  - { id: "R-04-046", module: "已提交审批", text: "列表字段：审批单号、操作对象、操作客户、所属账户系统、申请人、申请时间（yyyy-mm-dd hh:mm:ss）、审批状态、操作；操作对象显示审批类型名 新建客户 / 客户信息变更 / 付款主体变更（原型的「基础信息配置」「付款主体」「规则配置」不用，D-04-20）；操作客户显示本单提交内容里的公司名称；所属账户系统取客户当前的，新建客户显示「-」" }
  - { id: "R-04-047", module: "已提交审批", text: "排序：审批中置顶，其余按申请时间降序；分页 10 / 50 / 100 / 300 条每页" }
  - { id: "R-04-048", module: "已提交审批", text: "行操作：所有状态都有「详情」，新页打开这张单的审批详情（D-04-09）；审批中的单都有「撤回」，只校验申请人本人 + 单据审批中，不看客户管理权限点（D-00-79②、D-04-21）；撤回的确认文案、后果与通知按 12 §2.4（R-12-032～R-12-035），撤回后客户数据按 R-04-035～R-04-037 处理" }
  # —— 2.9 客户详情 ——
  - { id: "R-04-049", module: "客户详情", text: "客户详情一律新页打开，入口：客户列表「详情」、客户审批详情里的公司名称链接；标题「客户管理/客户详情」；页面只读，没有操作按钮" }
  - { id: "R-04-050", module: "客户详情", text: "客户详情只展示客户当前生效的内容，审批中的修改不展示；有待生效计费模式时按 R-04-067 显示；分三块：基础信息（字段同 R-04-038，另加客户状态）、规则配置（R-04-051）、付款主体（按生效顺序每条一行，没有显示「-」）" }
  - { id: "R-04-051", module: "客户详情", text: "规则配置表：客户名下每个账户一行，列为 账户名称、规则起始日期、服务费规则、税率、服务费税费、返点规则、客情结算方式、客情费用比例、备注；取值为该账户对应登记表（绑定的在线登记表、对应该账户的历史上传文件行或迁移占位行，D-00-57）的当前生效规则，判定按 R-03-003（已通过、规则起始日期 ≤ 今天 UTC0 里起始日期最大的那条），起始日期在未来的待生效规则、审批中的提交都不展示（D-04-06）；各列格式按 R-03-037；账户对应的登记表没有当前生效规则（含只有待生效记录）时，账户名称以外各列显示「-」；客户没有账户时表格显示「暂无账户」" }
  - { id: "R-04-052", module: "客户详情", text: "打开的客户不存在（例如新建客户被驳回后无客户）时显示「客户不存在」；没有任一客户管理权限点、或客户不在本人数据范围（R-04-061）时显示「无权限访问」" }
  # —— 2.10 客户材料 ——
  - { id: "R-04-053", module: "客户材料", text: "客户材料页标题「客户管理/{公司名称}」，有「合同」「客户登记表」两个标签，默认合同；合同标签本期不改，沿用现有" }
  - { id: "R-04-054", module: "客户材料", text: "客户登记表标签：搜索框按登记表名称包含匹配；列表字段 登记表名称、创建时间、上次修改时间、对应账户、操作；不再展示文件类型、文件大小；排序沿用现有；分页 10 / 50 / 100 / 300 条每页" }
  - { id: "R-04-055", module: "客户材料", text: "历史上传的登记表文件保留：登记表名称显示原文件名（旁边下载 icon 沿用），创建时间、上次修改时间、对应账户沿用原值，行操作 预览 / 编辑 / 删除 与原来一致，编辑可重新上传替换文件、修改对应合同（D-04-03；现有实现沿用）；有对应账户的行另有「规则配置」（R-04-060）；挂着规则的行（有已通过的规则或审批中的规则配置单）不能删除：「删除」置灰，悬浮提示「该登记表已配置规则，不能删除」（D-04-28）" }
  - { id: "R-04-056", module: "客户材料", text: "「添加登记表」改为绑定在线登记表，不再支持上传：弹窗字段 *绑定登记表（单选下拉，可搜索）、对应合同（选填，组件与可选范围沿用现有）；按钮 确定" }
  - { id: "R-04-057", module: "客户材料", text: "绑定登记表下拉只列状态为待关联、还没关联客户的登记表，且满足其一：当前登录账号创建的（D-04-18）；创建人账号已禁用，或创建人当前没有「客户管理-读写」的（D-04-18 例外，会议清单 D24；2026-10-22 扩大，D-04-34）。选项显示「登记表名称（登记表ID）」，创建人已禁用的显示「登记表名称（登记表ID）· {创建人}（已禁用）」；可按名称或 ID 搜索；没有可选项时下拉显示「暂无可绑定的登记表（仅本账号创建、或创建人已禁用 / 没有「客户管理-读写」的待关联登记表可绑定）」" }
  - { id: "R-04-058", module: "客户材料", text: "点确定时服务端校验 guard：登记表仍为待关联、尚未关联任何客户、创建人是当前账号，或创建人账号已禁用、或创建人当前没有「客户管理-读写」（D-04-34），当前账号有「客户管理-读写」，且本客户是已生效客户、在本人数据范围内；通过后以下动作同成同败：①在登记表上写入关联客户（customer_id）；②登记表状态 待关联 → 待开户（01 流转）；③本客户的登记表标签新增一行；弱提示「添加成功」并关闭弹窗。guard 不满足时不绑定，提示「该登记表状态已变化，请重新选择」并刷新下拉" }
  - { id: "R-04-059", module: "客户材料", text: "绑定方式的行：登记表名称取该登记表的当前名称（01 改名后跟着变），创建时间取自该登记表；上次修改时间取登记表的编辑时间（= 01 的 edited_at，仅内部编辑 / 审核保存，不含客户在填写页的保存），从未编辑过显示「-」；对应账户为 02 添加账户时绑定的账户名称，未绑定显示「-」（D-04-19）" }
  - { id: "R-04-060", module: "客户材料", text: "绑定方式的行操作为「详情」「编辑」「规则配置」，没有删除和解绑（D-04-04、D-01-16）：详情 = 只读弹窗，内容与展示格式同 01 登记表详情（R-01-010），能进入本客户材料页的人都能看，不受登记表创建人隔离；编辑 = 弹窗里登记表只读显示「登记表名称（登记表ID）」不可更换，只能修改对应合同，点确定保存；规则配置 = 打开这张登记表的规则配置页，和 01 登记表列表的「规则配置」是同一个页面（R-01-019），页面内容、校验、提交审批按 03（R-03-012），从本页进入时面包屑与菜单高亮也按 R-03-012（客户管理/{公司名称}/规则配置）。有对应账户的历史上传文件行、迁移占位行同样有「规则配置」，打开同一个页面、走同样的审批，规则挂在这一行上（D-00-57、R-03-053）；没有对应账户的历史上传文件行没有「规则配置」。显示条件：有「客户管理-读写」且客户在本人数据范围内，不要求是登记表创建人（R-03-013、D-04-24）" }
  - { id: "R-04-073", module: "客户材料", text: "上线迁移时，没有历史上传文件的存量账户各补一行迁移占位行（D-00-57）：登记表名称「上线迁移补建（无附件）」，创建时间为迁移时间，上次修改时间「-」，对应账户为该账户；行操作只有「规则配置」（没有文件，不提供预览、编辑、删除）；不计入 R-04-015 的登记表数量。上线前批量导入的固定比例规则（S-1）挂在该账户的历史上传文件行或占位行上，阶梯 / 分段规则上线后从这里配，须在上线当月内提交，并在次月 2 日（UTC0）出账前审批通过；晚于此的只作用于之后的月份（D-00-57，闭环清单 A14）" }
  # —— 2.11 权限 ——
  - { id: "R-04-061", module: "权限", text: "客户管理只用现有两个权限点「客户管理-只读」「客户管理-读写」，本页不新增权限点（版本级约定：只出权限点）。数据按客户范围隔离（D-00-77，D-04-31）：非 sys 用户在客户列表、客户详情、客户材料、编辑客户、付款主体、规则配置入口、客户审批详情第②类查看（R-04-043）里，只能看、改自己是该客户「销售」、或是其名下任一账户「优化师」的客户；sys 看全部；范围按当前的销售、优化师实时判断，变了随之变。两个权限点都没有的用户不能进入客户管理、客户详情、客户材料，直接访问显示「无权限访问」；有权限点但客户不在范围内时，列表不出现，直接打开该客户的客户详情、客户材料、编辑地址显示「无权限访问」，写接口服务端拒绝。离职人员名下的客户由 sys 改销售（本页编辑客户）或改账户优化师（02）后交接给新人。依赖客户可见性的其他页面（03、05、12）按各页规则引用本条；02 所属客户下拉不受客户数据范围限制（R-02-004，D-00-77 例外）" }
  - { id: "R-04-062", module: "权限", text: "只有「客户管理-只读」时：可看客户列表、客户详情、客户材料（列表、历史文件预览与下载、绑定登记表详情）、已提交审批 tab、三类客户审批详情（均在数据范围内）；不显示 添加客户、编辑、付款主体、添加登记表、客户材料里的编辑、删除与「规则配置」、合同的增删改按钮（D-04-21）" }
  - { id: "R-04-063", module: "权限", text: "有「客户管理-读写」时：只读能做的全部，加上 添加客户、编辑客户、付款主体提交、客户材料的添加 / 编辑 / 删除 / 规则配置、合同增删改（均在数据范围内）；以上写操作服务端同样按权限点和数据范围校验（规则配置页的服务端校验见 R-03-013、R-03-042）；撤回不看这两个权限点（R-04-048）；现状读接口比 R-04-062 宽的，随 19 个权限点一起按 R-04-062、R-04-063 收紧" }

