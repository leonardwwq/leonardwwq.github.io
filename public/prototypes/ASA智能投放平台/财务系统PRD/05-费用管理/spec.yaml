# 05-费用管理 · 机器可读规格（2026-10-19 用户确认三轮问答与代定清单；同日补提成规则生效日期与历史提成规则；2026-10-20 总控代改：09 / 13 / 07 对齐，关闭原开放问题第 5、6 条；2026-10-21 总控代改：按会议清单 v2 回写）
# 来源：html/费用管理.html:4848/4856/4864（V2.1 注释）、html/费用明细.html:3612、html/审批详情-费用管理.html + 用户确认（见 decisions）
# 本页主管：账户余额与分桶、授信额度与停投判定、充值 / 退款 / 余额分配的计费口径、费用单据（5 类审批的业务单据）、提成规则、交易明细。
# 本页不定义：规则配置（03）、客户（04）、审批引擎（12）、账单与费用明细 tab 的口径（06）、收付款单（09）、提成计算（11）。
# 公共前置：预付款客户「星海网络科技有限公司」（客户别名 星海，币种 人民币，销售 张伟，付款主体 Starfish Ltd、星海网络科技有限公司）；账户 A「星海-iOS-US」（orgid 4521873，消耗币种 USD，优化师 周宁）绑定登记表的规则：起始 2026-10-01（另有 2026-09-01 起同内容的旧规则），相对日期，第 1 行「消耗首日 - 第30天」固定 8.00%，第 2 行「第31天 - 永久」阶梯 [0, 10,000.00) 5.00%、[10,000.00, 不限) 3.00%，税率 6.00%，服务费税费 客户承担，消耗首日 2026-09-12；账户 B「星海-iOS-JP」（orgid 4521906，消耗币种 USD）规则固定 4.00%、税率 6.00%、公司承担；今天 2026-10-19（UTC0，A 第 38 天）；当日日汇率 1 USD = 7.1234 人民币；各用例操作人都有「费用管理（查看）」；操作人 王敏 有「账户费用管理」「提成规则管理」「客户管理-读写」，能看 A、B

meta:
  feature: 费用管理
  product: ASA
  version: v2.1.0
  page: 05-费用管理
  date: 2026-10-19
  prd: PRD.md
  status: 待评审
scope:
  in:
    - "账户余额（动态计算）、分桶、锁定与可用余额、负余额（欠费）"
    - "授信额度、剩余额度、停投判定与通知、可用天数提醒"
    - "充值 / 退款 / 余额分配的计费口径：取规则、落行、正算 / 反算落档、舍入、结算币种与汇率、提交锁定"
    - "费用管理页：费用信息列表、已提交审批 tab"
    - "弹窗：账户充值、充值退款、余额分配、调整额度、提成规则配置"
    - "5 类审批（账户充值、充值退款、额度调整、余额分配、提成规则配置）的提交、复核、结果处理与审批内容区"
    - "费用明细页：入口与 tab、交易明细（本页主管）"
    - "提成规则（销售 / 优化师）的配置、生效日期、版本与历史提成规则"
  out:
    - "费用明细 tab 的账单口径、账单状态、出账、导出（归 06，D-05-01）"
    - "收款单 / 付款单的确认收款、确认汇款、确认到账（归 09）"
    - "提成金额计算与展示（归 11，D-00-37～D-00-41）"
    - "规则配置本身（归 03）；付款主体的编辑与审批（归 04，本页只调起）"
    - "审批引擎、审批详情通用框架、撤回、通知渠道（归 12）"
    - "费用信息「导出」（原型：本期先不做）"
    - "停投的执行动作（沿用后端现有逻辑）；自动恢复投放（本期不做，靠人工，D-05-46）"

roles:
  - { role: "有「账户费用管理」权限点的用户", can: ["充值", "退款", "余额分配", "调整额度"], cannot: ["操作没有查看权限的账户"], source: "新增权限点（费用管理.html:4848 §3.1.6，D-05-37；13 汇总）" }
  - { role: "申请人", can: ["撤回自己提交的审批中单（只校验本人且审批中，不校验业务权限点，D-00-79②）"], cannot: [], source: "12" }
  - { role: "有「审批配置」权限点的用户", can: ["作废任何审批中的单，效果同撤回（D-00-79③）"], cannot: [], source: "12、13" }
  - { role: "有「提成规则管理」权限点的用户", can: ["提成规则配置", "只读查看提成规则配置审批详情"], cannot: [], source: "新增权限点（D-05-37）" }
  - { role: "有「费用管理（查看）」且能看到某账户的用户", can: ["在费用管理看到该客户与该账户", "进费用明细页看该账户的账单与交易", "只读查看涉及该账户的 4 类费用审批详情"], cannot: ["看他没有权限的账户", "没有「费用管理（查看）」时看不到两页菜单"], source: "「费用管理（查看）」（D-00-78）+ 现有账户查看权限（R-05-035）" }
  - { role: "审批人", can: ["在审批详情通过 / 驳回"], cannot: ["修改审批内容"], source: "12 审批单快照（R-12-023）" }
  - { role: "有「收付款中心」权限点的用户", can: ["只读查看账户充值、充值退款、额度调整、余额分配的审批详情（R-05-086）"], cannot: ["通过 / 驳回 / 撤回", "不能因此进入费用管理操作，也不能看到无权限账户的列表数据"], source: "13（R-13-050、D-00-71）" }

entities:
  - name: 账户资金
    key: account_funds
    note: "计算值，不由人录入；key 为文档内称呼，落库方式由技术定"
    fields:
      - { key: "balance", label: "账户余额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "R-05-001；后付款结算期的消耗不扣（R-05-003、R-05-118）" }
      - { key: "locked", label: "锁定金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "R-05-008" }
      - { key: "available", label: "可用余额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "R-05-008" }
      - { key: "credit_remaining", label: "剩余额度", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "R-05-013" }
  - name: 分桶
    key: balance_bucket
    note: "每笔资金入账一桶；页面不展示"
    fields:
      - { key: "bucket_id", label: "分桶ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "source", label: "来源", type: "enum", required: true, enum: ["账户充值", "余额分配转入", "返点余额抵扣", "账单结转"], rule: "R-05-004；存量期初余额 > 0 的建期初桶（§4.1、R-05-005）" }
      - { key: "source_doc", label: "来源单据", type: "ref", required: true, rule: "审批单号（返点抵扣为 07 的审批单）" }
      - { key: "arrived_at", label: "入账时间", type: "datetime", required: true, tz: "UTC0", precision: "秒", generated: true, rule: "先进先出排序依据（R-05-006）" }
      - { key: "amount", label: "入账金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "R-05-004" }
      - { key: "fee_rate", label: "服务费率快照", type: "decimal", required: true, precision: 2, unit: "%", rule: "R-05-005" }
      - { key: "tax_rate", label: "税率快照", type: "decimal", required: true, precision: 2, unit: "%", rule: "R-05-005" }
      - { key: "fee_tax_bearer", label: "服务费税费承担方快照", type: "enum", required: true, enum: ["公司承担", "客户承担"], rule: "R-05-005" }
  - name: 账户额度
    key: account_credit
    note: "每个账户最多一条生效中"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "credit", label: "额度", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "≥ 0，0 = 无额度（R-05-064）" }
      - { key: "expire_date", label: "额度有效期", type: "date", required: false, tz: "UTC0", rule: "仅预付款期间设置；空 = 长期（R-05-011、R-05-118⑤）" }
      - { key: "state", label: "额度状态", type: "enum", required: true, enum: ["生效中", "已到期", "充值清零", "已替换"], generated: true, rule: "flows 账户额度" }
      - { key: "source_approval_id", label: "来源审批单", type: "ref", required: true, generated: true, rule: "R-05-082" }
  - name: 费用单据
    key: fee_doc
    note: "审批单的业务单据快照（R-05-080）；不单独设状态（D-05-35）"
    fields:
      - { key: "approval_id", label: "审批单号", type: "ref", required: true, rule: "12 审批单" }
      - { key: "type", label: "审批类型", type: "enum", required: true, enum: ["账户充值", "充值退款", "额度调整", "余额分配", "提成规则配置"], rule: "R-05-076" }
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "04 客户；操作对象客户" }
      - { key: "payer", label: "付款主体 / 收款主体", type: "string", required: false, rule: "充值必填（付款主体，R-05-042）；退款必填（收款主体，R-05-050）" }
      - { key: "involved_accounts", label: "本单涉及账户", type: "list", required: true, rule: "传给审批引擎解析「绑定的运营」（R-05-080、D-00-76）" }
      - { key: "settle_currency", label: "结算币种", type: "enum", required: false, enum: ["人民币", "USD", "USDT"], rule: "充值、退款必填（R-05-024）" }
      - { key: "calc_mode", label: "计算方式", type: "enum", required: false, enum: ["充值金额计算", "应收金额计算"], rule: "仅充值（R-05-043）" }
      - { key: "fx_rate", label: "汇率", type: "decimal", required: false, precision: 4, rule: "1 账户币种 = x 结算币种，日汇率四舍五入到 4 位；同币种为 1（R-05-024、D-00-74）" }
      - { key: "fx_date", label: "汇率日期", type: "date", required: false, tz: "UTC0", rule: "实际取到的日汇率日期（R-05-024）" }
      - { key: "lines", label: "账户行", type: "list", required: true, rule: "元素为「费用单据行」" }
      - { key: "total_account_ccy", label: "总计（账户币种）", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "应收 / 应退金额总计（R-05-047、R-05-054）" }
      - { key: "total_settle_ccy", label: "总计（结算币种）", type: "decimal", required: false, precision: 2, currency: "结算币种", rule: "R-05-025" }
      - { key: "vouchers", label: "打款凭证", type: "list", required: false, rule: "仅充值，≤ 10 个、每个 ≤ 5MB（R-05-048）" }
      - { key: "commission_rules", label: "提成规则", type: "ref", required: false, rule: "仅提成规则配置：提交的两套规则与生效日期（R-05-067、R-05-108）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "同时为发起备注（R-05-080）" }
  - name: 费用单据行
    key: fee_doc_line
    note: "一个账户一行；余额分配分取出、转入两侧"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "side", label: "方向", type: "enum", required: false, enum: ["取出", "转入"], rule: "仅余额分配" }
      - { key: "net_amount", label: "净额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "充值金额 / 退款余额 / 取出余额 / 充值余额" }
      - { key: "tax", label: "税费", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "R-05-021、R-05-027" }
      - { key: "fee", label: "服务费", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "R-05-021、R-05-022" }
      - { key: "fee_tax", label: "服务费税费", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "R-05-021" }
      - { key: "gross_amount", label: "含费金额", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "应收 / 应退 / 实际金额" }
      - { key: "rule_snapshot", label: "规则快照", type: "text", required: false, rule: "规则起始日期、服务费行、落档、服务费率、税率、承担方（R-05-029）；退款 / 取出为分桶倒推明细（R-05-027）" }
      - { key: "credit", label: "额度", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "仅额度调整" }
      - { key: "expire_date", label: "额度有效期", type: "date", required: false, tz: "UTC0", rule: "仅额度调整、预付款" }
      - { key: "credit_before", label: "提交时生效额度", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "仅额度调整；变更高亮比对基准（R-05-104、D-00-75）" }
      - { key: "expire_date_before", label: "提交时生效有效期", type: "date", required: false, tz: "UTC0", rule: "仅额度调整、预付款；比对基准（R-05-104）" }
      - { key: "available_at_submit", label: "提交时可用余额", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "退款、余额分配（R-05-103、R-05-105）" }
  - name: 提成规则版本
    key: commission_rule_set
    note: "每次提成规则配置审批通过按业务单据快照写入一版；只追加或按同生效日期覆盖，不删除（R-05-075）"
    fields:
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "04 客户" }
      - { key: "effective_date", label: "生效日期", type: "date", required: true, tz: "UTC0", rule: "提交时选，当月 1 号及以后（R-05-108）；审批通过后按所选日期生效（R-05-075）" }
      - { key: "state", label: "版本状态", type: "enum", required: true, enum: ["待生效", "生效中", "已结束", "已覆盖"], generated: true, rule: "按日期计算，不能手动改（R-05-110）" }
      - { key: "sales_rules", label: "销售规则", type: "list", required: true, rule: "元素为「提成规则」，可为空" }
      - { key: "optimizer_rules", label: "优化师规则", type: "list", required: true, rule: "元素为「提成规则」，可为空" }
      - { key: "source_approval_id", label: "来源审批单", type: "ref", required: true, generated: true, rule: "R-05-082" }
  - name: 提成规则
    key: commission_rule
    fields:
      - { key: "seq", label: "规则序号", type: "int", required: true, generated: true, rule: "从 1 连续（R-05-069）" }
      - { key: "accounts", label: "适用账户", type: "list", required: true, rule: "同一套内不重复（R-05-070）" }
      - { key: "calc_mode", label: "计算方式", type: "enum", required: true, enum: ["毛利阶梯计算", "服务费百分比"], default: "毛利阶梯计算", rule: "R-05-071" }
      - { key: "tiers", label: "阶梯", type: "list", required: true, rule: "下限 / 上限（人民币，2 位小数）/ 比例（%，2 位小数），至少 1 档（R-05-072）" }
      - { key: "cap", label: "提成上限", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "空 = 不封顶（R-05-073）" }
  - name: 交易明细
    key: transaction
    note: "一笔业务一行；06、07 也写入本实体（R-05-094）"
    fields:
      - { key: "txn_id", label: "交易ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "04 客户" }
      - { key: "type", label: "交易类型", type: "enum", required: true, enum: ["账户充值", "余额退款", "余额分配", "结算单支付", "余额抵扣账单", "客户返点", "客情费用"], rule: "R-05-095" }
      - { key: "initiated_at", label: "发起时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", rule: "审批单申请时间（R-05-097）" }
      - { key: "finance_id", label: "财务ID", type: "string", required: false, rule: "09 收付款单编号（R-09-004、R-05-097）" }
      - { key: "recharge_amount", label: "充值金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "R-05-097；不动余额的交易类型存 0、页面显示「-」（R-05-096）" }
      - { key: "payable_amount", label: "应付金额", type: "decimal", required: false, precision: 2, currency: "结算币种", rule: "R-05-097；余额抵扣账单无（显示「-」）" }
      - { key: "received_amount", label: "实收金额", type: "decimal", required: false, precision: 2, currency: "结算币种", rule: "09 回写；余额退款 = 付款单到账金额，记负数（R-05-085）" }
      - { key: "handling_fee", label: "手续费", type: "decimal", required: false, precision: 2, currency: "结算币种", rule: "09 回写（D-00-32）；余额退款显示「-」（R-05-085）" }
      - { key: "payment_vouchers", label: "打款凭证", type: "list", required: false, rule: "R-05-097" }
      - { key: "arrival_vouchers", label: "到账凭证", type: "list", required: false, rule: "09 回写" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "弹窗备注" }
      - { key: "account_changes", label: "账户列表", type: "list", required: true, rule: "每账户 ± 金额（R-05-097）" }
      - { key: "approval_id", label: "关联审批单号", type: "ref", required: true, rule: "R-05-100" }
      - { key: "bill_ref", label: "关联账单", type: "ref", required: false, rule: "仅结算单支付、余额抵扣账单（06，R-05-097）" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["待完成", "已完成", "已撤回"], generated: true, rule: "flows 交易明细" }
      - { key: "completed_at", label: "完成时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "变已完成的时间" }

flows:
  - entity: 交易明细
    states: [待完成, 已完成, 已撤回]
    initial: 待完成
    transitions:
      - { from: "无", action: "账户充值 / 充值退款审批通过；06 结算单、07 现金返还审批通过", actor: 系统, to: 待完成, guard: "R-05-082、R-05-095" }
      - { from: "无", action: "余额分配审批通过；07 预付返点余额抵扣审批通过；06 后付结算单余额抵扣审批通过；账单结转充进余额", actor: 系统, to: 已完成, guard: "R-05-082、R-05-095" }
      - { from: 待完成, action: "09 收款单确认收款 / 付款单确认到账（已完成）", actor: 系统, to: 已完成, guard: "R-05-085；付款单确认汇款后仍待完成（R-09-042）" }
      - { from: 待完成, action: "sys 兜底撤回充值收款单（待完成）/ 退款付款单（待汇出）", actor: sys, to: 已撤回, guard: "R-05-085、D-00-69" }
    reverse:
      - { action: "收付款单作废或退回", actor: "—", allowed_from: [], note: "本期不做（D-00-69）；只有 sys 兜底撤回两种情形，见 transitions（R-05-085）" }
  - entity: 提成规则版本
    states: [待生效, 生效中, 已结束, 已覆盖]
    initial: 待生效
    transitions:
      - { from: "无（审批通过写入）", action: "写入且生效日期 > 今天", actor: 系统, to: 待生效, guard: "R-05-075；今天按 UTC0" }
      - { from: "无（审批通过写入）", action: "写入且生效日期 ≤ 今天，且没有生效日期更晚、≤ 今天的版本", actor: 系统, to: 生效中, guard: "R-05-075" }
      - { from: "无（审批通过写入）", action: "写入且已有生效日期更晚、且 ≤ 今天的版本", actor: 系统, to: 已结束, guard: "R-05-110" }
      - { from: 待生效, action: "到生效日期（UTC0 00:00）", actor: 系统, to: 生效中, guard: "R-05-075" }
      - { from: 生效中, action: "生效日期更晚的版本开始生效", actor: 系统, to: 已结束, guard: "R-05-110" }
      - { from: "待生效 / 生效中 / 已结束", action: "同生效日期的新版本审批通过", actor: 系统, to: 已覆盖, guard: "R-05-075" }
    reverse:
      - { action: "撤销 / 作废版本", actor: "—", allowed_from: [], note: "本期没有；要改只能选同一生效日期再提一版覆盖（D-05-41）" }
  - entity: 账户额度
    states: [生效中, 已到期, 充值清零, 已替换]
    initial: 生效中
    transitions:
      - { from: "无", action: "额度调整审批通过", actor: 系统, to: 生效中, guard: "R-05-082；额度为 0 时写入即视为无额度" }
      - { from: 生效中, action: "有效期当天 UTC0 23:59:59 过后", actor: 系统, to: 已到期, guard: "R-05-011；预付期设的有效期，切换后付后照常（R-05-118⑤）" }
      - { from: 生效中, action: "该账户一笔账户充值到账", actor: 系统, to: 充值清零, guard: "R-05-011，仅预付款；充值单在额度生效后提交，且到账后可用余额 > 0" }
      - { from: 生效中, action: "新的额度调整审批通过", actor: 系统, to: 已替换, guard: "R-05-082" }
    reverse:
      - { action: "驳回 / 撤回 / 作废额度调整", actor: "审批人 / 申请人 / 审批配置持点人", allowed_from: [], note: "审批中的内容不是额度，不改动额度（R-05-083）；最后通过时有效期已过则回滚（R-05-082）" }

