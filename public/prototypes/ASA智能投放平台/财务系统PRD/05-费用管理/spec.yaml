decisions:
  - { id: D-05-01, point: "费用明细 tab 与 06 的边界", conclusion: "05 画入口、tab、三层展开与按账户权限过滤；列口径、账单状态、出账、导出内容引用 06", impact: "R-05-093；06", status: "已定" }
  - { id: D-05-02, point: "账户余额怎么算", conclusion: "动态计算 = 资金进出 − 累计消耗；历史消耗会被修正（如 10-21 发现 10-18 的消耗变了），余额随之变，不做冲正单据；实现方式由技术定", impact: "R-05-001", status: "已定" }
  - { id: D-05-03, point: "后付款客户", conclusion: "后付款（以当前结算期的计费模式为准，D-00-73）不能充值、退款、余额分配（按钮隐藏）；调整额度照常（没有有效期）；预付改后付后留下的分桶照常显示余额，用于后付结算单余额抵扣、不退（D-05-47）", impact: "R-05-003、R-05-038、R-05-118", status: "已定（2026-10-21 用户定，会议清单 D02 改写）" }
  - { id: D-05-04, point: "客户币种的含义", conclusion: "客户「币种」= 客户给我们结算的币种；账户消耗币种可以不同（如中国客户投出海产品）", impact: "R-05-002、R-05-024", status: "已定" }
  - { id: D-05-05, point: "交易明细生成时机", conclusion: "审批通过即生成：经 09 收付款的为「待完成」，09 完成后变「已完成」；余额分配、预付返点余额抵扣生成即「已完成」", impact: "R-05-082、R-05-095", status: "已定" }
  - { id: D-05-06, point: "退款 / 取出的锁定", conclusion: "提交即锁定，驳回 / 撤回释放，审批通过扣减；汇出、到账只改交易明细状态", impact: "R-05-007、R-05-082", status: "已定" }
  - { id: D-05-07, point: "分桶扣减顺序", conclusion: "消耗、退款、取出一律先进先出", impact: "R-05-006、R-05-007", status: "已定" }
  - { id: D-05-08, point: "提成规则生效与上限", conclusion: "生效日期由提交人选（UTC0 日期），只能选当月 1 号及以后，同 03 规则起始日期；审批通过后按所选日期生效，跨月才通过也按所选日期（用户 2026-10-19：本月提成本来就没算完，不算回算）；提成上限 = 每人每自然月按该条规则算出的提成封顶。原「审批通过当天生效」作废", impact: "R-05-073、R-05-075、R-05-108；11；D-00-41 措辞（已上报总控）", status: "已定" }
  - { id: D-05-09, point: "余额与金额币种", conclusion: "余额、充值金额、退款余额、取出余额、额度都用账户消耗币种", impact: "R-05-002", status: "已定" }
  - { id: D-05-10, point: "结算币种", conclusion: "充值弹窗加「结算币种」；金额按账户币种算，再按日汇率（D-00-74，锁 4 位）转成结算币种的应收", impact: "R-05-024、R-05-025", status: "已定" }
  - { id: D-05-11, point: "同一客户的账户币种", conclusion: "同一客户下所有账户消耗币种相同，不处理混币种", impact: "R-05-002", status: "已定" }
  - { id: D-05-12, point: "负余额、授信额度与停投", conclusion: "余额可为负 = 欠费；授信额度 = 客户打款慢时我们给的兜底；剩余额度用完要停投 + 通知，停投沿用后端现有逻辑", impact: "R-05-009、R-05-014", status: "已定" }
  - { id: D-05-13, point: "弹窗里新增付款主体", conclusion: "「新增」= 打开 04 付款主体弹窗提交付款主体变更审批，通过前不能选", impact: "R-05-042；04", status: "已定" }
  - { id: D-05-14, point: "提交到到账之间规则 / 区间变化", conclusion: "提交时锁定全部计算结果，到账不重算；按用户授权已改 D-00-58（原「到账当天」→「提交当天」）", impact: "R-05-018、R-05-029；index D-00-58", status: "已定" }
  - { id: D-05-15, point: "应收反算哪档都不成立", conclusion: "该行标红不能提交，提示可填范围；按充值金额计算不受影响", impact: "R-05-020", status: "已定" }
  - { id: D-05-16, point: "退款结算币种", conclusion: "同充值：结算币种默认客户币种、可改，取日汇率（D-00-74），提交时锁定", impact: "R-05-024", status: "已定" }
  - { id: D-05-17, point: "后付款剩余额度", conclusion: "max(0, 额度 − 未结清消耗)；未结清消耗只算原始消耗（不含服务费、税费、服务费税费），范围 = 尚未「已结算」的后付账单 + 尚未出账、且所属结算期为后付款的日子（含出账日前的上月；切换前最后一个预付月出账前由分桶覆盖，不计入）；额度 > 0 且剩余额度 ≤ 0 停投", impact: "R-05-013、R-05-014；06", status: "已定（2026-10-21 用户定，会议清单 D06，与推荐「含费」不同；2026-10-22 用户与技术确认，闭环清单 A08：未出账日子限定为后付结算期）" }
  - { id: D-05-18, point: "停投通知与可用天数提醒", conclusion: "停投通知销售 + 优化师；另按前一天消耗预估可用天数，不足 7 天、不足 3 天各提醒一次", impact: "R-05-015、R-05-016", status: "已定" }
  - { id: D-05-19, point: "反算尾差", conclusion: "B 与三项各自四舍五入，和输入差出的尾差全部计入服务费，输入值为准；服务费率为 0 的行也可能出现 ±0.01 服务费，接受", impact: "R-05-022", status: "已定（2026-10-21 用户定，会议清单 D98，由代定转已定）" }
  - { id: D-05-20, point: "哪些入账清零额度", conclusion: "只有「账户充值」到账可能清零额度，且须满足 D-00-53 的条件（额度生效后才提交、到账后可用余额 > 0）；余额分配转入、返点余额抵扣、后付返点结转额不清零。依据：D-00-53 原文写的是充值到账", impact: "R-05-011", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-21, point: "返点余额抵扣分桶的费率", conclusion: "按服务费率 0、税率 0 入桶，退款 / 取出时不再乘费率", impact: "R-05-005；07", status: "已定（用户确认 2026-10-19）" }
  - { id: D-05-22, point: "「+ 新增付款主体」谁看得到", conclusion: "只有「客户管理-读写」的用户看得到；没有的人按 R-05-042 提示找有权限的同事", impact: "R-05-042", status: "已定（2026-10-21 用户定，会议清单 D31-路由与按钮、D45）" }
  - { id: D-05-23, point: "退款列名", conclusion: "原型「账户余额」改为「可用余额」，与上限口径一致", impact: "R-05-051、R-05-056", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-24, point: "后付款额度为 0", conclusion: "视为不限制、不因额度停投；后端现状（额度 0 也停投）按本条改", impact: "R-05-014", status: "已定（2026-10-21 用户定，会议清单 技术答复 T13 后补充决定）" }
  - { id: D-05-25, point: "列表排序的币种", conclusion: "昨日消耗合计直接按数值排，不折算", impact: "R-05-036", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-26, point: "余额分配同一账户", conclusion: "不能既取出又转入", impact: "R-05-058", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-27, point: "额度没改能否提交", conclusion: "不能，提示「额度未修改」", impact: "R-05-065", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-28, point: "提成两套规则怎么提交", conclusion: "销售、优化师一起提交一张单，通过后整份替换。依据：审批详情原型一张单同时展示两套", impact: "R-05-067", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-29, point: "提成适用账户的选项范围", conclusion: "该客户全部账户，不按操作人的账户查看权限过滤。依据：整份替换时避免误删他看不到的账户", impact: "R-05-070", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-30, point: "提成弹窗隐藏的「投放应用」面板", conclusion: "原型残留，不做", impact: "R-05-074", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-31, point: "弹窗备注与发起备注", conclusion: "弹窗里的备注即发起备注，同时在审批内容区展示，不再另弹备注框", impact: "R-05-080", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-32, point: "费用明细页标题", conclusion: "原型「费用中心/费用明细」统一为「费用管理/费用明细」", impact: "R-05-092", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-33, point: "充值审批内容的费率展示", conclusion: "原型隐藏的费率表并入账户列表（每行带规则起始日期、服务费率、税率、承担方）", impact: "R-05-102", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-34, point: "审批内容区按权限隐藏账户行", conclusion: "不隐藏，审批要看全单。依据：R-12-044 由业务包决定", impact: "R-05-107", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-35, point: "费用单据是否单独设状态", conclusion: "不设：审批阶段看 12 审批单状态，通过后看交易明细状态（同 D-00-60 做法）", impact: "entities 费用单据", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-36, point: "停投 / 提醒文案", conclusion: "按 notifications 段模板", impact: "R-05-015、R-05-016", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-38, point: "没有适用规则时的充值 / 余额分配", conclusion: "按 0 费率计算，分桶快照也是 0，照常提交，弹窗与审批内容区都不加提示（用户 2026-10-19：静默按 0）；出账、返点也按 0（D-00-57 已由 06 会话改）", impact: "R-05-005、R-05-017、R-05-049；「服务费」悬浮显示 0.00% 属数值展示，不算提示（会议清单 D44）", status: "已定" }
  - { id: D-05-39, point: "提成规则与当前生效相同能否提交", conclusion: "允许，不拦（同 03 D-03-14）。依据：有了待生效版本后，可能要用原内容按某日期覆盖未来版本；原「提成规则未修改」拦截作废", impact: "R-05-074", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-40, point: "历史提成规则放哪", conclusion: "弹窗表单下方默认收起的「历史提成规则」区，同 03 历史规则", impact: "R-05-111、R-05-112", status: "已定（用户 2026-10-19）" }
  - { id: D-05-41, point: "待生效版本能否撤销", conclusion: "不能；要改就选同一个生效日期再提一版覆盖（原「或更早日期接替」不成立，更早的版本到期仍会被待生效版本接替）", impact: "R-05-110、R-05-117；flows 提成规则版本", status: "已定（用户 2026-10-19；2026-10-21 措辞按会议清单 D99 修正）" }
  - { id: D-05-37, point: "权限点", conclusion: "「账户费用管理」（充值、退款、余额分配、调整额度）、「提成规则管理」（提成规则配置）只控制写操作；费用管理、费用明细两页按「费用管理（查看）」权限点显示（D-00-78），页面内数据按账户查看权限展示", impact: "R-05-035、R-05-038；13", status: "已定（费用管理.html:4848 §3.1.6；2026-10-21 按 D-00-78 补查看点）" }
  - { id: D-05-42, point: "收付款单编号与作废", conclusion: "交易明细「财务ID」即 09 收付款单编号（R-09-004）；收付款单作废 / 退回本期不做（D-00-69）；sys 兜底撤回只有充值收款单待完成、退款付款单待汇出两种，按 R-05-085 回退，交易明细加状态「已撤回」", impact: "R-05-085、R-05-095、R-05-097；flows 交易明细", status: "已定（2026-10-21 用户定，会议清单 D32；原 2026-10-20 结论补 sys 撤回）" }
  - { id: D-05-43, point: "费用管理、费用明细两页的页面访问", conclusion: "两页按「费用管理（查看）」权限点显示菜单，没有就无菜单、直接访问显示「无权限访问」；页面内数据按账户查看权限过滤；「账户费用管理」「提成规则管理」只控制写操作（D-00-78；原「对登录用户常显」作废）", impact: "R-05-035、R-05-038；13", status: "已定（2026-10-21 用户定，会议清单 D86）" }
  - { id: D-05-44, point: "付款单完成回写到余额退款交易明细的列", conclusion: "实收金额 = 到账金额，打款凭证 = 付款单打款凭证，到账凭证 = 付款单到账凭证，完成时间 = 付款单完成时间，手续费显示「-」。依据：R-09-071 回写字段、交易明细各列由 05 定；付款差额只在 09 记录（D-10-05）。风险：交易明细看不到汇出金额与差额，要到 09 付款单查", impact: "R-05-085、R-05-097", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-45, point: "有审批中的提成规则单时能否查看", conclusion: "打开只读弹窗：展示当前生效版本、全部禁用、隐藏生效日期与提交，历史提成规则照常可展开；其余四类仍不打开弹窗（原开放问题第 7 条关闭）", impact: "R-05-077、R-05-111", status: "已定（2026-10-21 用户定，会议清单 D48）" }
  - { id: D-05-46, point: "停投判定时机与恢复投放", conclusion: "停投条件按 R-05-014（后付额度 0 不停投、未结清按原始消耗、不另扣未到款，后端按此改）；锁定与释放、到账、额度变化与到期、消耗更新时即时判断，另有定时兜底；不自动恢复投放，释放锁定后可用资金 > 0 时通知销售与优化师人工恢复（原开放问题第 2 条关闭）", impact: "R-05-014、R-05-078、R-05-083；notifications", status: "已定（2026-10-21 用户定，会议清单 D42、技术答复 T13）" }
  - { id: D-05-47, point: "预付改后付对本页余额的细节（D-00-73 之下）", conclusion: "①后付期间仍不显示退款，剩余分桶只用于后付结算单余额抵扣；②按 R-06-074 冻结、转入后付账单的欠费消耗移出账户余额（冻结时不属于任何分桶的那部分消耗从余额计算中剔除，D-05-50），避免改回预付后被新分桶再覆盖一次；③在途账户充值照常到账成桶，按 D-00-73① 保留；④余额抵扣不足全部分桶时，最后一桶按快照费率反算取用本金：余额抵扣金额以剩余应收为准，最后一桶本金 = round2(所需金额 ÷ 倍率)、不超过该桶剩余，尾差计入该账户行余额抵扣的服务费，同 R-05-022（2026-10-22 用户与技术确认，闭环清单 B02）。依据：D-00-73 与会议清单 D02 用户方案只写了充值、余额分配隐藏和余额抵扣，未写退款与欠费在余额里的去向；风险：后付期间客户要退剩余余额只能等改回预付。2026-10-21 用户确认维持：改后付后「退款」仍隐藏、剩余余额只用于后付结算单余额抵扣（①）；审批期间客户改为后付的充值单照常通过到账、不算执行失败（③、R-05-082）", impact: "R-05-003、R-05-009、R-05-118", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-05-48, point: "退款 / 取出与充值的提交复核", conclusion: "退款、取出改为服务端预算后在确认框回显新金额，金额变了不拒单、请用户再确认；充值与转入侧计算变化时就地重载标黄、不关弹窗；只有汇率变时确认是否按新汇率提交（原「关闭弹窗重新打开」作废）", impact: "R-05-026、R-05-052、R-05-059、R-05-114", status: "已定（2026-10-21 用户定，会议清单 D07、D35，A 档按推荐）" }
  - { id: D-05-49, point: "额度调整的写入范围与有效期过期", conclusion: "只把额度或有效期改了的账户写进单，通过时只写单内账户；最后通过时单内账户有效期已早于通过当天，按 D-00-79① 回滚，提示驳回后重新提交", impact: "R-05-080、R-05-082、R-05-104", status: "已定（2026-10-21 用户定，会议清单 D43、D26）" }
  - { id: D-05-50, point: "预付改后付前后的分桶覆盖与欠费冻结（D-00-73 之下）", conclusion: "①生效后，切换前最后一个预付月在出账判结清或冻结之前，分桶照常按先进先出覆盖它，包括期间补报的消耗、释放的锁定分桶、新到账的充值；欠费冻结之后的消耗以及生效月起的消耗不再被分桶覆盖；②冻结时，不属于任何分桶的那部分消耗从余额计算中剔除（原「余额的负数部分归 0」作废）；已冻结转入后付账单、或已结算冻结的切换前月份，之后的消耗修正不再进余额、也不再参与分桶覆盖，线下处理；③冻结的欠费在下一张后付账单生成时挂上，挂上前客户又改回预付的，解除冻结，欠费退回余额，原账单重新按 R-06-022 判结清；④生效时还在审批中的 07 预付返点余额抵扣，通过后按提交时的快照成桶（0 费率），之后按 R-05-118① 保留", impact: "R-05-001、R-05-003、R-05-006、R-05-009、R-05-013、R-05-118；06 R-06-074", status: "已定（2026-10-22 用户与技术确认，闭环清单 A06、A07、A08、B03）" }
  - { id: D-05-51, point: "计费模式切换时的授信额度", conclusion: "切换生效时额度值、有效期、来源审批单原样保留；预付期设的有效期照常到期清零；后付期不新设有效期；跨切换生效才通过的额度调整，按通过那一刻的计费模式写入，是后付就丢弃有效期；改回预付后判断「额度生效之后才提交的充值」时，额度生效时刻仍取原审批通过时刻", impact: "R-05-011、R-05-012、R-05-062、R-05-118⑤", status: "已定（2026-10-22 用户与技术确认，闭环清单 A09）" }
  - { id: D-05-52, point: "费用审批详情第②类查看资格", conclusion: "账户充值、充值退款、额度调整、余额分配按账户查看权限看详情时，要求同时持「费用管理（查看）」；申请人和快照里的审批人不受影响（R-12-043①）", impact: "R-05-086；12 R-12-043；13", status: "已定（2026-10-22 用户与技术确认，闭环清单 B10）" }
  - { id: D-05-53, point: "存量数据处理（index S-2～S-5）", conclusion: "①期初余额基准日 = 上线月 1 日 00:00（UTC0），与 S-18 共用同一个配置；期初余额 ≤ 0 的账户不建期初桶，余额从 0 起，负数部分出清单交财务线下追收；期初桶费率快照按 0；迁移核对完成前停投开关保持关闭；②老额度按上线时刻生效的长期额度导入，之后按 R-05-011 的条件清零；③过渡期的旧资金记录不导入，交易明细从上线起记，旧记录看旧报表；④上线前导入的提成规则不受 R-05-108「最早当月 1 号」限制，生效日期 = 上线月 1 日，关联审批单号显示「上线导入」，S-5 数据由商务按客户提供两套规则清单", impact: "§4.1～§4.4、R-05-005、R-05-010、R-05-108、R-05-112；Q-05-01", status: "已定（2026-10-22 用户与技术确认，闭环清单 C01、C02、C03）" }

open_questions:
  - { id: Q-05-01, question: "存量数据剩余待定项（第 4 节标「待定」处）：期初余额来源（旧系统余额 / 财务台账）与导入出错的重导方式（4.1），各项的提供 / 执行 / 核对人与量级；导入方式、期初余额基准日与费率快照、老额度、旧资金记录、提成规则导入已于 2026-10-22 按闭环清单 C01～C03 定（D-05-53，index §7 S-2～S-5）", owner: "用户 + 财务 + 商务；技术负责人（量级、导入方式）", blocks: "T-05-001、T-05-002", due: "—" }
