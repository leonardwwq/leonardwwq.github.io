rules:
  # —— 余额与分桶 ——
  - { id: R-05-001, module: 余额与分桶, text: "账户余额 = 该账户已到账的资金入账合计 − 已扣减的资金出账合计 − 截至当前的累计消耗；累计消耗只算该账户计费模式为预付款的结算期里的消耗（计费模式按结算期，D-00-73），后付款结算期的消耗不扣余额；消耗按最新消耗数据动态计算，历史某天的消耗被修正（如 10-21 发现 10-18 的消耗变了）时，余额随之变化，不另做冲正单据（D-05-02）；例外：预付改后付生效后，切换前的预付结算期已按 R-06-074 冻结欠费、或账单已结算冻结的，此后该结算期的消耗修正不再进入余额，也不再参与分桶覆盖，线下处理（R-05-118②、§5 已知限制）；计算实现由技术定" }
  - { id: R-05-002, module: 余额与分桶, text: "余额、充值金额、退款余额、取出余额、额度一律用账户消耗币种（D-05-09）；同一客户下所有账户消耗币种相同（D-05-11），正常流程不会产生同一客户多币种，02 开户时服务端校验客户与账户的账户系统一致（会议清单 D88）；账户消耗币种 = 账户所属账户系统的币种（技术答复 T07，原开放问题第 4 条关闭）；客户上的「币种」是客户给我们结算的币种，只用作充值 / 退款结算币种的默认值（R-05-028）" }
  - { id: R-05-003, module: 余额与分桶, text: "预付款客户的账户计余额、产生分桶，可充值、退款、余额分配。后付款客户（以当前结算期的计费模式为准，D-00-73）不能充值、退款、余额分配（D-05-03），账户不再产生新的分桶（在途单与结转见 R-05-118；生效时仍在审批中的 07 预付返点余额抵扣通过后照常成桶，R-05-118③）；仍有未用完分桶（账户余额 > 0）的账户，列表「账户余额」照常显示，否则显示「-」；剩余分桶按 R-05-118 用于后付结算单余额抵扣" }
  - { id: R-05-004, module: 余额与分桶, text: "资金入账有四种，每一笔按账户各生成一个「分桶」：①账户充值，09 收款单确认收款时到账（R-05-085）；②余额分配转入，审批通过时到账；③预付客户返点余额抵扣，07 审批通过时到账（D-00-19）；④账单结转：后付返点结转额挂起期间新出账的账单为预付款时，结转额充进对应账户余额（R-06-078、D-00-81）。分桶的入账时间 = 到账时间，金额 = 该账户本次进入余额的金额" }
  - { id: R-05-005, module: 余额与分桶, text: "每个分桶带一份费率快照（服务费率、税率、服务费税费承担方），退款、取出、余额抵扣时按它倒推（R-05-027）：账户充值、余额分配转入 = 提交时锁定的那套（R-05-029），提交当天没有适用规则时快照为服务费率 0、税率 0（R-05-017）；返点余额抵扣、账单结转 = 服务费率 0、税率 0（D-05-21），先去覆盖欠费时同样按 0（会议清单 D100，税务口径待财务确认）；上线前存量期初余额 > 0 的账户按 §4.1 建期初桶，快照按服务费率 0、税率 0（闭环清单 C01，D-05-53）" }
  - { id: R-05-006, module: 余额与分桶, text: "消耗从分桶里先进先出扣：按入账时间从早到晚，先扣满最早一桶再扣下一桶；入账时间相同按入账先后（D-05-07）；只扣预付款结算期的消耗（R-05-001），后付款期间分桶不被消耗扣，改回预付款后剩余分桶恢复按本条先进先出扣（D-00-73）；预付改后付生效后，切换前最后一个预付月在出账判结清或欠费冻结之前，分桶照常按本条覆盖该月消耗（含期间补报的消耗；释放的锁定分桶、新到账的充值同样参与），欠费冻结之后的该月消耗以及生效月起的消耗不再被分桶覆盖（R-05-118①、D-05-50）" }
  - { id: R-05-007, module: 余额与分桶, text: "退款、余额分配取出在提交审批时，06 后付结算单的余额抵扣在结算单提交时（D-00-73），按先进先出从「未锁定且尚有剩余」的分桶里锁定对应金额（D-05-06）：锁定部分不再被消耗占用，也不参与 06 预付账单的覆盖判定（D-00-11）；审批驳回、撤回或作废时释放；审批通过时从这些分桶里正式扣减（退款审批通过即扣，不等 09 确认汇出），扣减位置固定，之后消耗修正也不改它" }
  - { id: R-05-008, module: 余额与分桶, text: "锁定金额 = 该账户所有审批中的退款单、余额分配单与后付结算单余额抵扣锁定的合计；可用余额 = 账户余额 − 锁定金额；退款余额、取出余额的上限都是可用余额（D-00-52、D-00-54）" }
  - { id: R-05-009, module: 余额与分桶, text: "余额可以为负，为负即欠费（D-05-12）：消耗超出全部未锁定分桶的部分不属于任何分桶；之后新入账的分桶按先进先出先被这部分消耗占用。消耗修正导致余额变负时，不回退已完成的退款、余额分配。某日消耗是否已被分桶覆盖 = 本条与 R-05-006 先进先出的结果（锁定中的分桶不参与），06 据此逐张判断预付账单是否结清（D-00-11）；预付改后付后按 R-06-074 冻结欠费时，不属于任何分桶的那部分消耗按 R-05-118② 从余额计算中剔除" }
  - { id: R-05-118, module: 余额与分桶, text: "计费模式切换对余额的影响（D-00-73）：客户计费模式变更从确定时刻的次月 1 日（UTC0）生效（R-04-066）。预付改后付生效后：①该客户各账户未锁定的剩余分桶保留，生效月起的消耗不再扣它（R-05-006），账户余额照常显示（R-05-003）；切换前最后一个预付月在出账判结清或欠费冻结之前，分桶照常按先进先出覆盖该月消耗，包括期间补报的消耗、释放的锁定分桶、新到账的充值，欠费冻结之后不再覆盖（D-05-50）；06 生成后付结算单时按 R-06-076 自动带出「余额抵扣」（每账户上限为剩余应收，按先进先出取分桶，按 R-05-027 换算；余额抵扣金额以剩余应收为准，最后一桶本金 P = round2(所需金额 ÷ 该桶倍率)、不超过该桶剩余，倍率 = 1 + 税率 + 服务费率 + 服务费率 × 税率（公司承担时不加末项，R-05-021），税费、服务费、服务费税费按 R-05-027 正算，与所需金额的尾差计入该账户行余额抵扣的服务费，同 R-05-022；D-05-47④）；结算单提交时锁定所取分桶（R-05-007），审批通过时扣减，「余额抵扣账单」交易明细由 06 结算单审批通过时调用 05 写入（R-05-095），驳回、撤回、作废时释放；抵不完的留到下一张后付账单。②按 R-06-074 冻结欠费时，该账户该月不属于任何分桶的那部分消耗从余额计算中剔除，之后入账的分桶不再被它占用，这部分改由后付账单收取（D-05-47）；冻结的欠费在该客户下一张后付账单生成时挂上（R-06-074），挂上前客户又改回预付款的，解除冻结，欠费退回余额（这部分消耗重新计入余额，按 R-05-009 由分桶先进先出覆盖），原账单由 06 重新按 R-06-022 判结清；已冻结转入后付账单、或已结算冻结的切换前预付结算期，之后的消耗修正不再进入余额，也不再参与分桶覆盖，线下处理（§5 已知限制）（D-05-50）。③生效时仍在审批中的退款、余额分配照常走完，驳回、撤回释放的分桶按①保留；仍在途的账户充值照常走完，到账后成桶按①保留，后付款额度不因充值清零（R-05-012，D-05-47）；生效时仍在审批中的 07 预付返点余额抵扣，通过后按提交时的快照成桶（服务费率 0、税率 0），之后按①保留（D-05-50）。④改回预付款生效后，剩余分桶恢复按先进先出被消耗扣，可照常充值、退款、余额分配。⑤授信额度：切换生效时额度值、有效期、来源审批单原样保留；预付期设的有效期照常到期清零（R-05-011）；后付期不新设有效期（R-05-062）；跨切换生效才通过的额度调整，按通过那一刻客户当前结算期的计费模式写入，是后付款就丢弃有效期、只写额度，通过时为后付、有效期被丢弃的，不做 R-05-082 的有效期校验；改回预付款后按 R-05-011 判断「额度生效之后才提交的充值」时，额度生效时刻仍取写入该额度的原审批通过时刻（D-05-51）" }
  # —— 额度与停投 ——
  - { id: R-05-010, module: 额度与停投, text: "每个账户最多一条当前生效额度，额度只能通过「额度调整」审批写入（R-05-082）；没有额度或额度为 0 = 没有授信额度。账户上原有的「授信额度」老字段保留不用（D-02-02），存量老额度按 §4.2 导入（D-05-53）" }
  - { id: R-05-011, module: 额度与停投, text: "预付款账户的额度有效期为空 = 长期有效；有效期到期（UTC0 有效期当天 23:59:59 之后）额度自动清零（预付期设的有效期，切换为后付款后照常到期清零，R-05-118⑤）；「账户充值」到账时，只有该充值单是在当前额度生效之后才提交的、且到账后该账户可用余额 > 0，额度才清零，否则额度保留，直到之后有一笔满足条件的充值到账或有效期到期（D-00-53）。余额分配转入、返点余额抵扣、账单结转不清零额度（D-05-20）；改回预付款后，「在当前额度生效之后才提交」中的额度生效时刻仍取写入该额度的原审批通过时刻（R-05-118⑤）" }
  - { id: R-05-012, module: 额度与停投, text: "后付款期间不新设额度有效期（R-05-062），额度不因充值清零；没有有效期的额度不会自动清零，预付期设的有效期切换为后付款后照常到期清零（R-05-118⑤）" }
  - { id: R-05-013, module: 额度与停投, text: "剩余额度：预付款 = max(0, 额度 + min(可用余额, 0))，即余额为正时等于额度，欠费后按欠费额递减；后付款 = max(0, 额度 − 未结清消耗)，不显示负数。未结清消耗按账户算、只算原始消耗（不含服务费、税费、服务费税费，不扣返点，不看结算单改过的应付）= 该账户在流转计费模式为后付款（R-06-012，即该结算期的计费模式，D-00-73）且尚未「已结算」的账单里的消耗，加上该账户尚未出账、且所属结算期计费模式为后付款的日子的消耗（含出账日前的上月日子）；切换前最后一个预付月在出账前由分桶覆盖（R-05-118①），不计入后付未结清消耗；承接了「上期预付欠费」（D-00-73②）的后付账单，其中欠费的消耗部分同样计入，直到该账单已结算；账单状态按 06（D-00-59、D-05-17）" }
  - { id: R-05-014, module: 额度与停投, text: "停投条件（D-05-12）：预付款账户 可用余额 + 额度 ≤ 0；后付款账户 额度 > 0 且剩余额度 ≤ 0（未结清消耗按 R-05-013 的原始消耗）；后付款账户额度为 0 视为不限制、不因额度停投（D-05-24）；不另扣其他未到款项。判断时机：锁定与释放（退款、余额分配、后付结算单余额抵扣的提交、驳回、撤回、作废）、到账、额度写入与到期、消耗数据更新时即时判断，另有定时兜底（D-05-46）。满足条件时触发停投，停投执行动作沿用后端现有逻辑；条件不再满足时不自动恢复投放，由人工恢复（D-05-46，通知见 R-05-083）。停投不直接改客户状态，客户状态按 D-00-07 由消耗判定" }
  - { id: R-05-015, module: 额度与停投, text: "触发停投时通知该客户的销售和该账户的优化师（D-05-18），通知渠道按 12（R-12-039），文案见 notifications「停投通知」；同一账户一次停投只通知一次" }
  - { id: R-05-016, module: 额度与停投, text: "可用天数提醒：每个 UTC0 自然日拿到前一天消耗后计算一次 可用天数 = 可用资金 ÷ 昨日消耗（预付款可用资金 = 可用余额 + 额度；后付款只算额度 > 0 的账户，可用资金 = 剩余额度）；可用天数首次 < 7 时提醒一次，首次 < 3 时再提醒一次，同一天同时跨过两条线只发「不足 3 天」；可用天数回到 ≥ 7（或 ≥ 3）后对应那条线重新计数；昨日消耗为 0 或已停投不提醒（D-05-18）。收件人、渠道同 R-05-015，文案见 notifications「可用天数提醒」" }
  # —— 计费口径 ——
  - { id: R-05-017, module: 计费口径, text: "取哪条规则：账户通过所绑登记表（02 registration_id）取 03 的规则，用「提交当天（UTC0）」的适用规则（R-03-003）。没有适用规则（账户没绑在线登记表，或提交当天早于第一条规则起始日期）时，服务费率、税率一律按 0 计算，该行税费、服务费、服务费税费均为 0.00，应收 / 实际金额 = 充值金额 / 充值余额；照常可提交，页面不另加提示（D-00-57、D-05-38）" }
  - { id: R-05-018, module: 计费口径, text: "服务费取哪一行时间区间：按提交当天是该账户消耗首日后的第几天，用 R-03-006 落行；账户还没有消耗首日时用第一行（D-00-58）" }
  - { id: R-05-019, module: 计费口径, text: "正算落档（已知充值金额 / 充值余额 B）：在该行服务费率里，固定比例直接用；阶梯比例用本次这一笔、这一个账户的 B 按 R-03-009 落档（左闭右开，不累进），「按月 / 按日统计」不作用于此（D-00-51）" }
  - { id: R-05-020, module: 计费口径, text: "反算落档（已知应收金额，或余额分配转入的实际金额 Y）：从最高档往最低档逐档试，按该档费率算 B = Y ÷（1 + 税率 + 服务费率 + 服务费率 × 税率）（公司承担服务费税费时不加最后一项），B 按 R-05-022 先舍入，落在该档 [下限, 上限) 内即用该档；高档、低档都成立时取高档（D-00-51，按到账净额判档，原「按应付判档」作废）；没有一档成立时该行标红、不能提交，提示「该金额无法对应服务费阶梯，可填小于 {甲} 或不小于 {乙}」（D-05-15）：甲 = 低档能成立的最大应收 + 0.01，乙 = 高档能成立的最小应收，由服务端试算接口按分求出返回，前端只展示（会议清单 D04）" }
  - { id: R-05-021, module: 计费口径, text: "金额拆分（每个账户一行）：税费 = B × 税率；服务费 = B × 服务费率；服务费税费 = B × 服务费率 × 税率（客户承担），公司承担时为 0（R-03-028）；应收 / 实际金额 = B + 税费 + 服务费 + 服务费税费" }
  - { id: R-05-022, module: 计费口径, text: "舍入：B、税费、服务费、服务费税费各自四舍五入到 2 位小数（D-00-13）；正算时应收 = 四项舍入后相加。反算时 B 先舍入，再按 R-05-021 算三项并舍入，四项之和与输入的 Y 差出的尾差全部计入服务费，Y 以输入为准；服务费率为 0 的行也照此计入，可能出现 ±0.01 的服务费（D-05-19）" }
  - { id: R-05-023, module: 计费口径, text: "所有金额输入框只接受数字和一个小数点：负号、字母输不进去，小数第 3 位按不下去；粘贴或自动填充的非法内容不写入，保留原值，并就地标红「请输入不小于 0、最多 2 位小数的金额」；任何情况下都不静默四舍五入或截断。其他校验（超过可用余额、反算无解等）一律在对应框就地标红（D-00-82）" }
  - { id: R-05-024, module: 计费口径, text: "结算币种（充值、退款弹窗）：必选，下拉单选 人民币 / USD / USDT，默认取客户的币种，客户币种为空时没有默认值（R-04-011）；客户币种修改后立即生效，只影响之后新打开的弹窗默认值。与账户消耗币种相同时汇率为 1，不显示汇率；不同时显示「汇率：1 {账户币种} = x {结算币种}（yyyy-mm-dd）」：x = 提交当天（UTC0）的日汇率四舍五入到 4 位小数，显示与计算都用这 4 位；当天没有向前取最近一天，日期显示实际取到的那一天；汇率与汇率日期随单进快照（D-00-74、D-00-62、D-05-10、D-05-16）" }
  - { id: R-05-025, module: 计费口径, text: "结算币种总额 = 账户币种总额 × 4 位汇率（R-05-024），四舍五入到 2 位小数；取不到任何汇率时不能提交，提示「未取到 {账户币种}→{结算币种} 汇率，请稍后再试」" }
  - { id: R-05-026, module: 计费口径, text: "账户充值、余额分配转入侧：弹窗打开时按当天规则与汇率实时计算展示，提交时服务端按提交时刻重新计算。规则、落行、落档变化导致结果与页面展示不同时，不创建审批单、弹窗不关，按最新数据就地重载：用户输入的金额、结算币种、付款主体、凭证、备注保留；值没变的行原样保留；值变了的计算格标黄「系统计算值已由 X 变为 Y」；顶部提示「数据已更新，请核对后重新提交」，用户再点一次提交才建单。只有汇率不同时先不建单，弹确认框「汇率已更新为 1 {账户币种} = x {结算币种}（yyyy-mm-dd），换算后金额 Y，是否按新汇率提交？」，确定后按新汇率建单（D-05-48）。退款与余额分配取出侧按 R-05-114" }
  - { id: R-05-027, module: 计费口径, text: "退款、取出按分桶倒推（D-00-52、D-00-54）：按 R-05-007 先进先出锁定的每个分桶部分 P，用该分桶的费率快照算 P × 税率、P × 服务费率、P × 服务费率 × 税率；一个账户内各分桶的同类金额先相加再四舍五入到 2 位；应退金额 / 实际金额 = 退款余额 / 取出余额 + 税费 + 服务费 + 服务费税费。前端只展示账户合计，不展示分桶；这里与 06 按段 / 按天舍入不同是有意的，因为分桶不展示（D-00-13）。提交前的服务端预算与回显见 R-05-114" }
  - { id: R-05-028, module: 计费口径, text: "客户的「币种」字段由 04 维护（R-04-002），本页只读取作结算币种默认值；改了客户币种不影响已提交的单" }
  - { id: R-05-029, module: 计费口径, text: "提交的那一刻锁定全部计算结果：适用规则与起始日期、服务费行、落档、费率、税费、服务费、服务费税费、充值金额 / 充值余额、汇率（4 位）与汇率日期、结算币种总额都写进审批单业务单据快照；之后不论规则、汇率、消耗首日怎么变，到账时都按快照执行，不重算（D-05-14、D-00-58）" }
  - { id: R-05-113, module: 计费口径, text: "试算时机与状态：金额输入框失焦或回车时触发试算（由服务端计算）；试算期间该行计算列显示「计算中」，「提交审批」置灰；试算失败时该行标红「试算失败，请重试」并清空旧结果；焦点还在输入框里就直接点「提交审批」的，先跑完这次试算再走校验，这次点击不作废（会议清单 D34）" }
  # —— 费用信息 ——
  - { id: R-05-030, module: 费用信息, text: "费用管理页顶部「费用信息 / 已提交审批」两个切换，默认费用信息；页面标题「费用管理」" }
  - { id: R-05-031, module: 费用信息, text: "搜索框按公司名称或账户名称包含匹配，命中账户名称时展示该客户及其下全部可见账户；「所属账户系统」下拉默认全部，选项为现有账户系统列表；「计费模式」下拉 全部 / 预付款 / 后付款，默认全部；「导出」本期不做，不显示" }
  - { id: R-05-032, module: 费用信息, text: "列表一个客户一条：客户级列 公司名称（超长省略，悬浮显示全称）、所属账户系统、计费模式、客户别名、销售；客户下按行列账户：账户名称、授信额度、剩余额度、账户余额、投放类型、投放状态、昨日消耗、今日消耗、本月消耗、累计花费；右侧客户级操作列。「计费模式」显示当前结算期的计费模式，有待生效的计费模式变更时显示为「{当前生效值}（{yyyy-mm-dd} 起改为{目标值}）」，同 R-04-067，如「预付款（2026-12-01 起改为后付款）」；「销售」为已禁用账号时显示「姓名（已禁用）」（D-00-83）；「计费模式」筛选按当前结算期的计费模式（D-00-73）" }
  - { id: R-05-033, module: 费用信息, text: "账户级金额列一律账户消耗币种、千分位、2 位小数、后缀币种代码（如「12,000.00 USD」，人民币显示「人民币」，D-00-08）：授信额度 = 当前生效额度（R-05-010），没有为「0.00」；剩余额度按 R-05-013；账户余额按 R-05-001，后付款账户按 R-05-003（有剩余分桶时显示余额，否则「-」），负数前加「-」并标红；锁定金额 > 0 时账户余额悬浮「其中锁定 {x}、可用 {y} {币种}」；昨日 / 今日 / 本月消耗按 UTC0 自然日 / 自然月，累计花费 = 该账户全部历史消耗，消耗数据来源沿用现有" }
  - { id: R-05-034, module: 费用信息, text: "投放类型显示 自投 / 代投（02 delivery_type）；投放状态 开启 / 暂停，沿用现有账户投放状态" }
  - { id: R-05-035, module: 费用信息, text: "数据权限跟账户查看权限走：用户对某客户下任一账户有查看权限才展示该客户，且只展示他有权限的账户；一个账户都没权限的客户、名下没有账户的客户都不出现（费用管理.html:4848 §3.1.3）；本页按账户查看权限过滤，不另按 D-00-77 的客户范围过滤；客户销售对其名下账户的查看权限按 02 的销售授权（R-02-027：开户时授权、换销售生效时同步，上线补授一次）。费用管理、费用明细（含交易明细）两页按「费用管理（查看）」权限点显示菜单，没有该点就没有菜单、直接访问显示「无权限访问」（D-00-78、D-05-43）；「账户费用管理」「提成规则管理」只控制对应写操作" }
  - { id: R-05-036, module: 费用信息, text: "排序：客户按其下可见账户昨日消耗合计降序，合计相同按公司名称升序；客户内账户按昨日消耗降序；不同客户币种不同时直接按数值比较，不折算（D-05-25）" }
  - { id: R-05-037, module: 费用信息, text: "分页 10 / 50 / 100 / 300 条每页，默认 10；一个客户算一条" }
  - { id: R-05-038, module: 费用信息, text: "客户级操作：费用明细（能看到该客户即可见）；充值、退款、余额分配、调整额度（有「账户费用管理」权限点才显示）；提成规则配置（有「提成规则管理」权限点才显示）；「账户费用管理」「提成规则管理」都以有「费用管理（查看）」为前提，没有查看点时即使有写权限点也看不到页面、服务端同样拒绝（D-13-01）；当前结算期为后付款的客户不显示充值、退款、余额分配（R-05-003）；没权限的按钮直接隐藏，服务端按 R-05-079 复核" }
  - { id: R-05-039, module: 费用信息, text: "点「费用明细」在当前页跳转到该客户的费用明细页（2.12）" }
  - { id: R-05-040, module: 费用信息, text: "没有可见客户、或筛选后没有结果时，列表显示「暂无数据」" }
  # —— 账户充值 ——
  - { id: R-05-041, module: 账户充值, text: "账户充值弹窗字段依次：公司名称（只读）、付款主体*、结算币种*、计算方式*、账户列表*、应收金额总计、打款凭证、备注；底部「提交审批」" }
  - { id: R-05-042, module: 账户充值, text: "付款主体为必选单选，选项 = 该客户当前生效的付款主体（04 R-04-028）；下拉底部「+ 新增付款主体」，旁边灰字「需审批通过后可选」，点击打开 04 的付款主体弹窗，按 R-04-029～R-04-032 提交「付款主体变更」审批，成功后弱提示「已提交审批，审批通过后重新打开本弹窗即可选择」，审批通过前新主体不在选项里（D-05-13）；只有有「客户管理-读写」的用户看得到「+ 新增付款主体」（R-04-063，D-05-22）。客户没有付款主体时：有「客户管理-读写」的提示「该客户暂无付款主体，请先新增」，没有的提示「该客户暂无付款主体，请联系有客户管理读写权限的同事在客户管理中新增」；该客户有审批中的付款主体变更单时，下拉下方灰字「有 1 张付款主体变更审批中，通过后可选（审批单号 {SPxxxx}）」。退款弹窗的「收款主体」同样适用（R-05-050）" }
  - { id: R-05-043, module: 账户充值, text: "计算方式单选 充值金额计算 / 应收金额计算，默认充值金额计算；切换时清空账户列表里已填的金额" }
  - { id: R-05-044, module: 账户充值, text: "账户列表按 R-05-115 列出账户，每个账户一行；金额框留空或填 0 表示本次不给该账户充值" }
  - { id: R-05-115, module: 账户充值, text: "弹窗账户范围与排序：账户充值、充值退款、余额分配（取出与转入两侧）、调整额度弹窗的账户行 = 该客户下当前用户有查看权限的全部账户，含已停用、投放暂停的账户，已停用账户在名称后标灰字「已停用」；5 个弹窗的账户行（含提成规则适用账户选项，R-05-070）按账户名称升序（会议清单 D49）" }
  - { id: R-05-045, module: 账户充值, text: "充值金额计算：列为 账户名称 / 充值金额（输入）/ 税费 / 服务费 / 服务费税费 / 应收金额；填充值金额后按 R-05-017～R-05-022 正算其余四列，试算时机按 R-05-113；「服务费」单元格悬浮显示「服务费率 x.xx%（第 N 行，[下限, 上限)；固定比例显示「固定」）/ 税率 y.yy% / 服务费税费{客户承担 / 公司承担}」，数据取自试算结果，无适用规则的行显示「服务费率 0.00% / 税率 0.00% / -」（会议清单 D44）。充值金额 = 本次进入该账户余额的金额" }
  - { id: R-05-046, module: 账户充值, text: "应收金额计算：列为 账户名称 / 应收金额（输入）/ 税费 / 服务费 / 服务费税费 / 充值金额；填应收金额后按 R-05-020～R-05-022 反算，试算时机按 R-05-113，「服务费」悬浮同 R-05-045；反算无解按 R-05-020 标红" }
  - { id: R-05-047, module: 账户充值, text: "列表下方展示：应收金额总计（账户币种）= 各行应收金额之和；结算币种与账户币种不同时再展示「汇率」与「应收金额总计（结算币种）」（R-05-024、R-05-025）；前端只展示服务端返回的 2 位金额，不自己再舍入，合计用展示值相加（D-00-13）；任一行输入非法或反算无解时，应收金额总计显示「—（有错误行，暂不计算）」，提交时按该行提示拦截；应收金额总计必须 > 0，否则提交时提示「请至少为一个账户填写充值金额」" }
  - { id: R-05-048, module: 账户充值, text: "打款凭证选填，最多 10 个文件、每个 ≤ 5MB、格式不限；一次选择超出剩余名额时按选择顺序保留到总数 10 个，其余不上传，提示「最多上传 10 个文件，超出部分未上传」；超过 5MB 的文件不上传并提示「单个文件不能超过 5MB」（D-00-14）" }
  - { id: R-05-049, module: 账户充值, text: "某个账户行没有适用规则时按 R-05-017 以 0 费率计算：税费、服务费、服务费税费显示 0.00，与正常行一样可提交，不显示任何提示；「服务费」悬浮照常显示 0.00%，不另提示（D-05-38）" }
  # —— 充值退款 ——
  - { id: R-05-050, module: 充值退款, text: "充值退款弹窗字段依次：公司名称（只读）、收款主体*（选项与规则同 R-05-042，下拉底部入口仍叫「+ 新增付款主体」，会议清单 D37）、结算币种*（R-05-024）、账户列表*、可退余额、应退金额总计、备注；没有凭证字段" }
  - { id: R-05-051, module: 充值退款, text: "账户列表列：账户名称 / 可用余额 / 退款余额（输入）/ 税费 / 服务费 / 服务费税费 / 应退金额；「可用余额」按 R-05-008（原型列名「账户余额」改为「可用余额」，D-05-23）；可用余额 ≤ 0 的账户退款余额框禁用；账户范围与排序按 R-05-115" }
  - { id: R-05-052, module: 充值退款, text: "列表右上「可退余额：{合计} {账户币种}」= 各账户 max(可用余额, 0) 之和；点「全部」把每个可用余额 > 0 的账户的退款余额按当前可用余额回填，并把该行标为「全部退款」；提交时服务端按提交时刻最新可用余额取值（≤ 0 的账户跳过），确认框回显实际退款额（R-05-114）；用户手动改了该行金额就取消「全部退款」标记" }
  - { id: R-05-053, module: 充值退款, text: "退款余额留空或 0 = 该账户不退；填了的必须 ≤ 该账户可用余额，超出时该框标红，提示「不能超过可用余额 {金额}」，不能提交（D-00-52）；至少一个账户退款余额 > 0，否则提示「请至少为一个账户填写退款余额」" }
  - { id: R-05-054, module: 充值退款, text: "每行税费、服务费、服务费税费、应退金额按 R-05-027 计算，试算时机按 R-05-113；列表下方展示应退金额总计（账户币种），结算币种不同时加汇率与应退金额总计（结算币种）；前端不二次舍入，合计用展示值相加（D-00-13）" }
  # —— 余额分配 ——
  - { id: R-05-055, module: 余额分配, text: "余额分配弹窗字段依次：公司名称（只读）、取出余额账户列表*、充值余额账户列表*、可分配实际金额、备注；标题右侧问号悬浮说明（R-05-061）" }
  - { id: R-05-056, module: 余额分配, text: "取出余额账户列表列：账户名称 / 可用余额 / 取出余额（输入）/ 税费 / 服务费 / 服务费税费 / 实际金额（D-00-54；「可用余额」同 R-05-051）；取出余额留空或 0 = 不取；填了的必须 > 0 且 ≤ 可用余额，超出提示「不能超过可用余额 {金额}」；可用余额 ≤ 0 的账户取出余额框禁用（同 R-05-051）；实际金额按 R-05-027，试算时机按 R-05-113" }
  - { id: R-05-057, module: 余额分配, text: "充值余额账户列表列：账户名称 / 账户余额 / 实际金额（输入）/ 税费 / 服务费 / 服务费税费 / 充值余额（D-00-54）；「账户余额」锁定悬浮同 R-05-033；填实际金额后按 R-05-017～R-05-022 反算充值余额（试算时机 R-05-113），反算无解按 R-05-020；「服务费」悬浮同 R-05-045。每行实际金额框旁有「填入剩余」，点后该行实际金额 = 该行当前值 + 可分配实际金额，可分配实际金额 ≤ 0 时置灰；只有一个可转入的账户（输入框未禁用）时自动带入可分配实际金额并随取出侧变化同步，用户手改后不再跟随；填入后照常按 R-05-020 反算，无解照常标红（会议清单 D46）" }
  - { id: R-05-058, module: 余额分配, text: "两个列表的账户范围与排序按 R-05-115；同一个账户不能既取出又转入，在一边填了金额后另一边该账户的输入框禁用（D-05-26）" }
  - { id: R-05-059, module: 余额分配, text: "可分配实际金额 = 取出列表实际金额之和 − 充值列表实际金额之和，实时显示；提交时必须等于 0.00，否则提示「可分配实际金额须为 0，当前为 {金额}」（D-00-14）；提交时服务端重算出的取出实际金额合计与页面不同时，差额按 R-05-114 并入转入行" }
  - { id: R-05-060, module: 余额分配, text: "至少一个账户取出余额 > 0 且至少一个账户实际金额 > 0，否则提示「请填写取出和转入的账户」" }
  - { id: R-05-061, module: 余额分配, text: "问号悬浮说明：「提交前请确认「可分配实际金额」为 0，大于或小于 0 均无法提交。」「「实际金额」可手动填写，填写后系统自动算出「充值余额」：实际金额 ÷（1 + 税率 + 服务费率 + 服务费率 × 税率），服务费税费由公司承担时不含最后一项。」「点「填入剩余」可把可分配实际金额补进该行。」「转入按提交当天的规则折算，阶梯按本次每个账户的充值余额落档；取出按每笔余额充值时的规则分别计算。」「金额统一四舍五入到 2 位小数。」「提交审批后取出的余额将被锁定。」（原型「若有区间规则统一使用上边界」改为按 D-00-51 表述）" }
  # —— 调整额度 ——
  - { id: R-05-062, module: 调整额度, text: "调整额度弹窗：标题「调整额度 · {客户别名}（{计费模式}）」，客户别名为空时用公司名称；账户列表*（账户范围与排序按 R-05-115，每行 账户名称、额度（输入，前缀币种代码）、额度有效期（日期，仅当前结算期为预付款的客户显示；跨切换生效才通过的按 R-05-118⑤ 写入））、备注；底部「提交审批」" }
  - { id: R-05-063, module: 调整额度, text: "打开时回填每个账户当前生效的额度与有效期，没有额度回填 0.00、有效期为空" }
  - { id: R-05-064, module: 调整额度, text: "额度必填，≥ 0、最多 2 位小数、不设上限，填 0 = 取消额度（D-00-53），输入框口径同 R-05-023（D-00-82）；额度有效期选填，只能选今天（UTC0）及以后，额度为 0 时有效期框禁用并清空；最后通过时有效期已早于通过当天的处理见 R-05-082" }
  - { id: R-05-065, module: 调整额度, text: "所有账户的额度与有效期都与当前生效完全相同时不能提交，提示「额度未修改」（D-05-27）" }
  # —— 提成规则 ——
  - { id: R-05-066, module: 提成规则, text: "提成规则挂在客户上：每个客户一份，分「销售」「优化师」两套，每套 0 到多条规则；某账户在销售套里命中的规则用于该客户销售的提成，在优化师套里命中的规则用于该账户优化师的提成；提成金额怎么算、归谁、怎么展示归 11（D-00-38～D-00-41）" }
  - { id: R-05-067, module: 提成规则, text: "提成规则配置弹窗顶部「销售 / 优化师」两个切换，默认销售；两套一起编辑、一起提交成一张「提成规则配置」审批单，审批通过后整份替换该客户的两套规则（D-05-28）" }
  - { id: R-05-068, module: 提成规则, text: "打开时回填该客户当前生效版本（R-05-110）的两套规则，生效日期留空；没有当前生效版本（从没配过，或只有待生效版本）时每套各有 1 条空规则「提成规则1」。选了生效日期后，表单按该日期适用的版本（R-05-075）重新回填，没有适用版本时回填空规则；表单已经改过时先确认「将按 {日期} 适用的版本重新回填，当前修改会丢失」，取消则日期恢复原值、表单不动；回填后日期框下提示「已按 {日期} 适用的版本（{审批单号}）回填」（会议清单 D18-a）" }
  - { id: R-05-117, module: 提成规则, text: "待生效提示：该客户有待生效版本时，弹窗顶部提示「该客户有待生效的提成规则（{yyyy-mm-dd} 起），如需修改，请选择该生效日期提交，审批通过后覆盖」，有多个待生效版本时按生效日期升序列出（D-05-41，会议清单 D99）" }
  - { id: R-05-069, module: 提成规则, text: "每条规则标题「提成规则N」右侧「+」在最后追加一条空规则、「−」删除本条，删除后从 1 重排编号；每套可以删到 0 条，0 条时显示「暂无规则」和「+ 添加规则」；条数不设上限" }
  - { id: R-05-070, module: 提成规则, text: "适用账户必填复选，选项为该客户下全部账户（不按当前用户的账户查看权限过滤，避免整份替换时误删他看不到的账户，D-05-29），按账户名称升序，已停用账户名称后标灰字「已停用」、排在最后、不剔除；同一套里各条规则的适用账户不能重复，重复时提示「适用账户与提成规则{N}重复：{账户名称}」；每套底部灰字「以下账户未适用任何规则：{账户名称}」（全部账户都有规则时不显示），不拦提交，客户新开账户不另通知；没有被任何规则选中的账户不产生该角色的提成" }
  - { id: R-05-116, module: 提成规则, text: "空规则：适用账户未选、阶梯比例未填、提成上限为空的规则视为空规则，提交时忽略、不进审批单；只填了一部分的规则照常按必填校验在对应框标红、不能提交（会议清单 D18-c）" }
  - { id: R-05-071, module: 提成规则, text: "计算方式必填单选：毛利阶梯计算（基数 = 毛利，D-00-34）/ 服务费百分比（基数 = 服务费，不含税，D-00-39），默认毛利阶梯计算；选项后显示「单位：人民币」" }
  - { id: R-05-072, module: 提成规则, text: "每条规则一张阶梯表「下限 - 上限 比例%」，交互与校验同 03 的阶梯（R-03-023、R-03-024、R-03-026）：第一档下限 0、下一档下限 = 上一档上限、最后一档上限「不限」、左闭右开、至少 1 档；区间金额为人民币；比例 ≥ 0、最多 2 位小数、不设上限；阶梯怎么落档按 D-00-40（同一人、同一角色、同一月、同一版本内同一条规则的基数合计落一档、不累进），由 11 计算" }
  - { id: R-05-073, module: 提成规则, text: "提成上限选填，人民币，≥ 0、最多 2 位小数；为空 = 不封顶；含义 = 每个人每个自然月按这条规则算出的提成最多到该金额（D-05-08）；规则身份 = 一个版本里的一条规则，月中换版本时各版本分别封顶（D-00-40）；上限框旁释义「每人每自然月按本条规则封顶（人民币）；月中换版本时各版本分别封顶」" }
  - { id: R-05-074, module: 提成规则, text: "两套规则与当前生效版本或同生效日期的版本完全相同时也允许提交，不拦（D-05-39）；原型弹窗里隐藏的「投放应用（应用名称 / 应用ID）」面板是残留，不做（D-05-30）" }
  - { id: R-05-075, module: 提成规则, text: "提成规则版本：审批通过（R-12-025）时按业务单据快照写入一个版本，生效日期 = 提交时所选日期，写入时不再校验是否早于当月 1 号（跨月才通过的照常按所选日期写入）；该客户已有同生效日期、未覆盖的版本时，新版本替换它，旧版本变为已覆盖。某日适用版本 = 该客户未覆盖的版本里，生效日期 ≤ 该日、生效日期最大的那一个；没有则该日没有提成规则，不产生提成。生效日期早于审批通过当天时，从生效日期起的提成由 11 按新版本重算，已算完人员月的金额变化由 11 记变化记录、不锁（D-05-08、D-00-41）；版本只追加或覆盖，旧版本保留供 11 回溯" }
  - { id: R-05-108, module: 提成规则, text: "弹窗底部「生效日期」必填，销售、优化师两套共用一个；日期选择器只能选「当月 1 号」及以后（当月按 UTC0 今天所在月），不设最晚日期；为空提示「请选择生效日期」；所选日期早于今天（UTC0）时日期框下灰字「生效日期早于今天，审批通过后将从 {日期} 起按新规则重算提成」，不拦（会议清单 D19）；服务端提交时复核，早于当月 1 号提示「生效日期不能早于当月 1 号」（同 03 规则起始日期 R-03-033，D-05-08）；上线前导入的提成规则不受「最早当月 1 号」限制，生效日期 = 上线月 1 日（与 index S-18 同一个上线月配置），关联审批单号显示「上线导入」（§4.4，D-05-53）" }
  - { id: R-05-109, module: 提成规则, text: "选的生效日期与该客户某个未覆盖的版本相同时，日期框下方提示「该生效日期已有提成规则，审批通过后将覆盖原规则」，不拦提交；表单按该日期适用的版本回填（R-05-068）" }
  - { id: R-05-110, module: 提成规则, text: "版本状态由系统按日期计算、不能手动改（今天按 UTC0）：生效中 = 以今天计的适用版本（R-05-075）；待生效 = 生效日期晚于今天；已结束 = 生效日期早于生效中那一版；已覆盖 = 被同生效日期的新版本替换，不在历史提成规则展示、不参与适用判定，写入它的审批单照常可查。待生效版本不能撤销，要改就选同一个生效日期再提一版覆盖（D-05-41，提示见 R-05-117）" }
  - { id: R-05-111, module: 历史提成规则, text: "弹窗表单下方「历史提成规则」区默认收起，点标题展开 / 收起；列出该客户全部未覆盖的版本，按生效日期降序；生效中、待生效的版本在生效日期旁打标签「生效中」「待生效」，已结束的不打标签；没有版本时展开显示「暂无历史提成规则」（同 03 历史规则 R-03-035，D-05-40）；有审批中提成规则单时只读打开的弹窗里照常可展开（R-05-077）" }
  - { id: R-05-112, module: 历史提成规则, text: "历史提成规则表列：生效日期（yyyy-mm-dd）、销售规则、优化师规则、关联审批单号；销售 / 优化师规则的文字格式同审批内容区（R-05-106），某套 0 条显示「无」；点关联审批单号新页打开写入该版本的审批单详情（查看判断按 R-05-086），上线导入的版本显示「上线导入」（R-05-108）；历史区只读、没有回填按钮，按所选生效日期回填见 R-05-068" }
  - { id: R-05-119, module: 提成规则, text: "提供给 11 的提成规则数据（11 X-4）：①版本写入时每条规则的序号（「提成规则N」）随版本固定，作为该版本内规则的稳定标识，之后不再变；编辑表单里删除后从 1 重排（R-05-069）只影响新提交的版本，跨版本本就不算同一条规则（D-00-40）；②每个未覆盖版本的生效区间 = [本版生效日期, 下一个生效日期更晚的未覆盖版本的生效日期)，最后一版到「不限」，按 R-05-075 计算；③该客户审批中的提成规则配置单的审批单号与所选生效日期，供 11 显示「规则审批中」提示（会议清单 D19）" }
  # —— 提交审批 ——
  - { id: R-05-076, module: 提交审批, text: "本页 5 种审批类型（R-12-001）：账户充值、充值退款、额度调整、余额分配、提成规则配置，审批事项都是「费用管理」" }
  - { id: R-05-077, module: 提交审批, text: "同一客户、同一审批类型同时最多 1 张审批中的单（D-00-14）：已有时点对应按钮不打开弹窗，弹提示框「该客户已有审批中的{审批类型}（审批单号 {单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，点「知道了」关闭，单号可点、新页打开审批详情（句式与形态按 R-12-047）。例外：提成规则配置有审批中单时打开只读弹窗：顶部提示条「该客户提成规则有状态为审批中的修改未通过，此处展示当前生效中的信息。（审批单号 {单号}，申请人 {姓名}）」（形态按 R-12-047），两套回填当前生效版本且全部禁用，生效日期框与「提交审批」隐藏，历史提成规则照常可展开（D-05-45）。不同类型互不影响（退款、余额分配可同时审批中，各自锁定按 R-05-008 叠加）" }
  - { id: R-05-078, module: 提交审批, text: "点「提交审批」先做本弹窗的全部前端校验（有试算未完成时先等试算，R-05-113），任一不通过不提交，在对应位置提示；通过后弹二次确认框，标题「提示」（取消 / 确定）：账户充值、额度调整、提成规则配置为「{审批类型}需进行审批，是否提交审批单？」；充值退款、余额分配的确认框内容按 R-05-114 由服务端预算后回显；按服务端预算任一账户「提交后可用余额 + 额度 ≤ 0」时确认框加一句「提交后 {账户名称} 可用资金将 ≤ 0，账户会立即停投；审批驳回或撤回后不会自动恢复投放，需人工恢复。」（会议清单 D42）" }
  - { id: R-05-079, module: 提交审批, text: "确定后服务端复核：权限点（R-05-038）、当前结算期计费模式（R-05-003）、同类型审批中单（R-05-077）、所选付款主体 / 收款主体仍在客户当前生效的付款主体里（否则提示「付款主体已变更，请重新选择」，会议清单 D116）、提成规则生效日期不早于当月 1 号（R-05-108）、可用余额（R-05-053、R-05-056，按服务端最新数据）、汇率与计算结果（充值与转入侧 R-05-026，退款与取出侧 R-05-114）；任一不满足不创建审批单并提示对应文案，弹窗不关、已填内容保留；带在途单号的提示同 R-05-077；同一弹窗连续点击只提交一次，请求中按钮显示加载" }
  - { id: R-05-114, module: 提交审批, text: "退款 / 取出服务端预算与确认框回显（D-05-48）：充值退款、余额分配点提交审批后，先做前端校验，再由服务端按最新分桶预算（不建单）；确认框（标题「提示」）回显每个账户的退款 / 取出余额、税费、服务费、服务费税费、应退 / 实际金额和合计（余额分配另回显转入侧各行与可分配实际金额），与弹窗不同的行标黄并写「金额已按最新余额重算」；点确定后服务端再算一次：退款 / 取出余额 ≤ 最新可用余额、且结果与确认框一致时建单，不一致时刷新确认框请用户再确认，不关闭弹窗、不清空内容。标「全部退款」的行按提交时刻最新可用余额取值（R-05-052）。余额分配取出实际金额合计与页面不同时，差额并入转入侧最后一次点过「填入剩余」的那一行，没有这样的行时并入实际金额最大的转入行，再按 R-05-020 反算并在确认框回显；并入后该行反算无解时不建单，提示「取出金额已变化为 {x}，请调整转入金额后重新提交」，弹窗内容保留（会议清单 D07）" }
  - { id: R-05-080, module: 提交审批, text: "复核通过后提交审批（R-12-014）：操作对象客户 = 本客户；本单涉及账户（供「绑定的运营」按账户优化师解析，D-00-76）= 充值、退款、余额分配中填了金额的账户，额度调整的单内账户，提成规则配置为该客户名下全部账户；业务单据 = 弹窗全部内容 + R-05-029 的计算快照 + 提交时各账户可用余额；额度调整只把额度或有效期与提交时当前生效值不同的账户写进业务单据（服务端按提交时刻判断），并带上这些账户提交时的生效额度与有效期作为比对基准（R-05-104、D-00-75）；发起备注 = 弹窗里的「备注」（同时作为业务备注在审批内容区展示，D-05-31）。成功后按返回的审批单状态弱提示（文案按 R-12-018），关闭弹窗、刷新列表" }
  - { id: R-05-081, module: 提交审批, text: "退款、余额分配提交成功即按 R-05-007 锁定，并按 R-05-014 即时判断停投；其他类型提交不动余额" }
  - { id: R-05-082, module: 提交审批, text: "审批单变为已通过（R-12-025）时：账户充值 → 生成 09 的收款单（应收 = 应收金额总计（结算币种））并写一条「待完成」交易明细，余额此时不变；充值退款 → 审批通过即从锁定分桶扣减余额（不等 09 确认汇出）、生成 09 的付款单（应付 = 应退金额总计（结算币种））、写一条「待完成」交易明细；余额分配 → 取出部分扣减、转入部分按 R-05-004 到账（新分桶），写一条「已完成」交易明细；额度调整 → 只写入单内账户的额度与有效期（含额度为 0 的取消），单外账户的额度不动（包括审批期间被充值清零或已到期的）；提成规则配置 → 按 R-05-075 写入版本（按所选生效日期生效）（D-05-05）。生成收付款单时按 R-09-001、R-09-002 带：付款主体 / 收款主体、币种（= 本单结算币种）、备注（弹窗备注）、申请人、申请时间；账户充值另带打款凭证与账户行（本单每个填了金额的账户及其应收金额，账户币种）。最后一个审批人通过时业务执行失败按 R-12-045 回滚（D-00-79①）；本页只有一种执行失败：额度调整单内任一账户的额度有效期早于通过当天（UTC0），原因「额度有效期 yyyy-mm-dd 已过，请驳回后重新提交」（D-05-49；通过时为后付、有效期被丢弃的不做此校验，R-05-118⑤）；其余情形通过时不复核、不算失败：账户充值审批期间客户计费模式已改为后付款的照常通过（在途单照常走完，R-05-118），退款 / 取出已在提交时锁定，提成规则不复核生效日期" }
  - { id: R-05-083, module: 提交审批, text: "审批单变为已驳回、已撤回或已作废（作废效果同撤回，R-12-046、D-00-79③）：退款、余额分配释放锁定；其余类型不动任何数据；原单不能修改重提，要再申请需重新打开弹窗填写（R-12-034）。释放后若该账户当前处于停投、且可用余额 + 额度 > 0，通知该客户销售和该账户优化师（渠道同 R-05-015），文案见 notifications「可恢复投放」；不自动恢复投放（D-05-46）" }
  - { id: R-05-084, module: 提交审批, text: "审批流 0 节点或全部节点被跳过时提交即已通过（R-12-018），立即按 R-05-082 处理，提交提示按 R-05-080；免审单照常有单号、出现在已提交审批（R-05-087），状态为已通过" }
  - { id: R-05-085, module: 提交审批, text: "09 收款单确认收款（已完成）时：按快照给每个账户充值到账（生成分桶，R-05-004、R-05-005），预付款账户按 R-05-011 判断是否清零额度，对应交易明细改为「已完成」并回写实收金额、手续费、到账凭证、完成时间。09 付款单确认汇款后为「待完成」，此时余额退款交易明细仍为「待完成」、不回写（R-09-042）；付款单「已完成」（确认到账，D-00-33）时按 R-09-071 回写，交易明细改为「已完成」，各列取值：实收金额 = 到账金额（记负数，与应付同号），打款凭证 = 付款单打款凭证，到账凭证 = 付款单到账凭证，完成时间 = 付款单完成时间，手续费显示「-」（付款差额只在 09 记录，D-10-05；D-05-44）。收付款单本期不作废、退回（D-00-69）；sys 兜底撤回（不对前端暴露、记日志，R-09-076、D-00-69）只有两种：①充值收款单待完成时撤回：充值不到账、不生成分桶、额度不清零，交易明细该笔变「已撤回」；②退款付款单待汇出时撤回：把审批通过时已扣的退款余额按原分桶快照加回原分桶，交易明细该笔变「已撤回」，并按 R-05-014 即时判断停投（D-05-42）" }
  - { id: R-05-086, module: 提交审批, text: "审批详情第②类只读查看判断（R-12-043、R-12-044）：账户充值、充值退款、额度调整、余额分配 = 当前用户持「费用管理（查看）」且对单内任一账户有查看权限，或当前用户有「收付款中心」权限点（只读，不显示通过 / 驳回 / 撤回，R-13-050、D-00-71）；提成规则配置 = 当前用户有「提成规则管理」权限点；申请人与快照里的审批人不受本条影响（R-12-043①，D-05-52）" }
  # —— 已提交审批 ——
  - { id: R-05-087, module: 已提交审批, text: "已提交审批只展示当前登录账号提交的本页 5 类审批单（同 04 R-04-044 做法），含免审单（状态已通过）" }
  - { id: R-05-088, module: 已提交审批, text: "搜索框按审批单号、公司名称包含匹配；状态筛选 全部 / 审批中 / 已通过 / 已驳回 / 已撤回，默认全部" }
  - { id: R-05-089, module: 已提交审批, text: "列表字段：审批单号、操作对象（审批类型名：账户充值 / 充值退款 / 额度调整 / 余额分配 / 提成规则配置）、操作客户（公司名称）、所属账户系统（客户当前的）、申请人、申请时间（yyyy-mm-dd hh:mm:ss，Asia/Shanghai）、审批状态、操作" }
  - { id: R-05-090, module: 已提交审批, text: "排序：审批中置顶，其余按申请时间降序；分页 10 / 50 / 100 / 300 条每页，默认 10；没有数据显示「暂无数据」" }
  - { id: R-05-091, module: 已提交审批, text: "行操作：所有状态都有「详情」，新页打开该单审批详情；只有审批中有「撤回」，撤回范围、确认文案、后果与通知按 12（R-12-032～R-12-035），只校验申请人本人且单据审批中，不校验业务权限点（D-00-79②）；撤回或被作废后数据按 R-05-083 处理" }
  # —— 费用明细页 ——
  - { id: R-05-092, module: 费用明细页, text: "费用明细页标题「费用管理/费用明细」，标题下显示公司名称；顶部「费用明细 / 交易明细」两个切换，默认费用明细；只展示这一个客户的数据（原型标题「费用中心」统一为「费用管理」，D-05-32）" }
  - { id: R-05-093, module: 费用明细页, text: "「费用明细」tab 就是 06 的账单按本客户展示：三层展开（结算期 → 账户 → 订单号）、各列口径、账单状态（D-00-59）、导出内容、排序都按 06 定义；具体展示规则见 R-06-032：单客户、只读、不显示「生成结算单」，没有搜索和客户级列，保留结算期与状态筛选；本页只规定入口、tab 与第二层只展示当前用户有查看权限的账户（D-05-01）" }
  - { id: R-05-094, module: 费用明细页, text: "交易明细是本页主管的实体：记录一个客户每一笔会动钱或动余额的业务，一笔业务一行；生成时机见 R-05-082、R-05-085，06（结算单支付，写入口径见 R-06-051）、07（客户返点、客情费用）按自己的审批结果写入本实体" }
  - { id: R-05-095, module: 费用明细页, text: "交易类型：账户充值、余额退款、余额分配（05 写入）；结算单支付（06 写入，R-06-051：结算单审批通过时写入、待完成，09 确认收款后变已完成；充值金额显示「-」）；余额抵扣账单（06 结算单审批通过时调用 05 写入，按 R-05-118 扣减剩余分桶，生成即已完成，R-06-076、D-00-73）；客户返点、客情费用（07 写入；后付款客户的返点余额抵扣不写交易明细，R-07-056、D-07-18；合计为 0 的返点 / 客情单不写交易明细；账单结转充进余额时由 06 写一条「客户返点」，备注「yyyy-mm 账单结转」，生成即已完成，R-06-078、D-00-81）。每行状态 待完成 / 已完成 / 已撤回：资金要经 09 收付款的（账户充值、余额退款、结算单支付、现金返还的返点 / 客情）生成时为待完成，随 09 收付款单完成变已完成，sys 兜底撤回时变已撤回（R-05-085）；不经 09 的（余额分配、余额抵扣账单、预付返点余额抵扣、账单结转）生成即已完成（D-05-05）" }
  - { id: R-05-096, module: 费用明细页, text: "交易明细列表列：发起时间、交易类型、财务ID、充值金额、应付金额、实收金额、手续费、打款凭证、到账凭证、备注、账户列表、关联审批单号、关联账单、状态、完成时间；不适用的格显示「-」；不动余额的交易类型（结算单支付，R-06-051）充值金额存 0、页面显示「-」；金额格一律千分位、2 位小数、后缀币种代码（充值金额用账户消耗币种，应付、实收、手续费用该行结算币种，人民币显示「人民币」），负数前加「-」，不标红（会议清单 D47）" }
  - { id: R-05-097, module: 费用明细页, text: "05 写入的三类取值：发起时间 = 审批单申请时间；充值金额：账户充值 = 本单各账户充值金额之和（正），余额退款 = −本单各账户退款余额之和，余额分配固定为 0（页面显示 0.00，各账户变动看账户列表）；应付金额 = 应收 / 应退金额总计（结算币种；退款为负，余额分配为 0）；实收金额、手续费、到账凭证、完成时间由 09 回写（账户充值的手续费口径 D-00-32；余额退款各列按 R-05-085，实收与应付同号记负数）；打款凭证 = 充值弹窗上传的凭证，退款由 09 回写（R-05-085）；账户列表每个账户一行「{账户名称} +/- {金额} {币种}」；备注 = 弹窗备注；财务ID = 对应 09 收付款单的编号（R-09-004）。余额抵扣账单（06 结算单审批通过时调用 05 写入）：充值金额 = −各账户扣减的分桶金额之和（账户消耗币种），应付金额、实收金额、手续费显示「-」，账户列表每账户「{账户名称} -{金额} {币种}」，关联审批单号 = 该结算单的审批单，关联账单 = 被抵扣的账单。关联账单只有结算单支付、余额抵扣账单有" }
  - { id: R-05-098, module: 费用明细页, text: "交易明细可见范围：单内任一账户当前用户有查看权限即展示该行，账户列表只列他有权限的账户" }
  - { id: R-05-099, module: 费用明细页, text: "交易明细顶部两个筛选：「交易类型」全部 + 7 类（R-05-095），「状态」全部 / 待完成 / 已完成，默认都为全部，已撤回的行只在状态「全部」下出现；不做导出。按发起时间降序；时间格式 yyyy-mm-dd hh:mm:ss（Asia/Shanghai）；分页 10 / 50 / 100 / 300 条每页，默认 10；没有记录或筛选无结果显示「暂无交易记录」" }
  - { id: R-05-100, module: 费用明细页, text: "点关联审批单号新页打开该审批单详情（12 统一的审批详情页），能否查看按 R-12-043；凭证按钮统一叫「查看」：图片和 PDF 新页预览，其他格式直接下载；多个文件时弹出文件列表逐个查看（会议清单 D47）" }
  # —— 审批内容 ——
  - { id: R-05-101, module: 审批内容, text: "审批信息区按 12（R-12-026），审批事项「费用管理」，审批类型为本单类型；审批内容区按类型展示，全部取业务单据快照（R-05-080），公司名称为超链接、新页打开客户详情（R-04-050），所属账户系统取客户当前的" }
  - { id: R-05-102, module: 审批内容, text: "账户充值内容区：公司名称、所属账户系统、付款主体、结算币种、计算方式、账户列表（账户名称 / 规则起始日期 / 服务费率 / 税率 / 服务费税费承担方 / 充值金额 / 税费 / 服务费 / 服务费税费 / 应收金额）、应收金额总计（账户币种）、汇率（含汇率日期，R-05-024）与应收金额总计（结算币种）（币种不同时）、打款凭证（文件名，按 R-05-100 查看）、备注（原型隐藏的费率表并入账户列表，D-05-33）；提交时没有适用规则的行，规则起始日期显示「-」、服务费率与税率显示 0.00%，不加其他提示（D-05-38）" }
  - { id: R-05-103, module: 审批内容, text: "充值退款内容区：公司名称、所属账户系统、收款主体、结算币种、账户列表（账户名称 / 提交时可用余额 / 退款余额 / 税费 / 服务费 / 服务费税费 / 应退金额）、应退金额总计（账户币种）、汇率（含汇率日期）与应退金额总计（结算币种）（币种不同时）、备注" }
  - { id: R-05-104, module: 审批内容, text: "额度调整内容区：公司名称、所属账户系统、账户列表（只列单内账户，R-05-080：账户名称 / 额度 / 额度有效期，后付款不显示有效期列）、备注；启用 12 变更高亮（R-12-030，额度调整以「原值 → 新值」并排代替标红格下的「原：」灰字）：比对基准 = 提交那一刻该账户的生效额度与有效期，随审批单快照保存，审批中与审批结束后回看一致、所有查看者一致（D-00-75）；每格显示「原值 → 新值」，与原值不同的格标红；提交时没有额度的视为原值为空，不标红、只显示新值；审批中该账户当前生效额度已与基准不同时（如审批期间充值清零），内容区顶部提示「提交后该账户额度已有变更，当前生效值与本单比对基准不同」" }
  - { id: R-05-105, module: 审批内容, text: "余额分配内容区：公司名称、所属账户系统、取出余额账户列表（账户名称 / 提交时可用余额 / 取出余额 / 税费 / 服务费 / 服务费税费 / 实际金额）、充值余额账户列表（账户名称 / 提交时账户余额 / 服务费率 / 税率 / 实际金额 / 税费 / 服务费 / 服务费税费 / 充值余额；费率取提交快照，无适用规则显示 0.00%，会议清单 D96）、备注；只列填了金额的账户" }
  - { id: R-05-106, module: 审批内容, text: "提成规则配置内容区：公司名称、所属账户系统、销售规则、优化师规则（每条「提成规则N」：适用账户名称用顿号分隔、计算方式、阶梯每档一行「[下限, 上限) x.xx%」最后一档「[下限, 不限) x.xx%」、提成上限「¥x.xx」或「不封顶」；某套 0 条时显示「无」）、生效日期（yyyy-mm-dd）、备注；文字展示，不用输入框；不启用变更高亮" }
  - { id: R-05-107, module: 审批内容, text: "账户充值、充值退款、余额分配的账户列表只列本单填了金额的账户；内容区展示单内全部账户行，不按查看者的账户权限隐藏（D-05-34）；金额格式同 R-05-033" }

notifications:
  - { event: "账户触发停投（R-05-014）", to: ["客户的销售", "账户的优化师"], channel: "按 12（R-12-039）", template: "【停投提醒】{公司名称}-{账户名称}（{所属账户系统}）可用资金已用完，账户已停投。当前余额 {账户余额} {币种}，授信额度 {授信额度} {币种}。{链接}" }
  - { event: "可用天数首次 < 7 / < 3（R-05-016）", to: ["客户的销售", "账户的优化师"], channel: "按 12（R-12-039）", template: "【余额提醒】{公司名称}-{账户名称}（{所属账户系统}）按昨日消耗 {昨日消耗} {币种} 估算，可用资金 {可用资金} {币种} 预计不足 {7 / 3} 天，请及时充值或调整额度。{链接}" }
  - { event: "退款 / 余额分配驳回、撤回、作废释放锁定后，账户停投中且可用资金 > 0（R-05-083）", to: ["客户的销售", "账户的优化师"], channel: "按 12（R-12-039）", template: "{公司名称}-{账户名称} 的{审批类型}单已{驳回 / 撤回 / 作废}，可用资金恢复为 {x} {币种}，可人工恢复投放。{链接}" }
  # {链接} 指向费用管理页并定位到该客户；停投、可用天数文案按 D-05-36（2026-10-21 用户确认），可恢复投放文案按会议清单 D42

nonfunctional:
  security:
    - "提交、撤回在服务端按 R-05-079 复核权限点、计费模式、审批中单、规则、可用余额、汇率与计算结果，前端隐藏按钮不算权限控制"
    - "列表、交易明细、审批详情查看都按账户查看权限在服务端过滤（R-05-035、R-05-098、R-05-086）"
  audit:
    - "分桶、交易明细只追加不删除；每个分桶、额度、提成规则版本都能追溯到来源审批单"
  consistency:
    - "充值、退款、余额分配一律按 R-05-017～R-05-029 计算，前后端同一口径；规则判定调用 03（T-03-002），不另写"

acceptance:
  # 公共前置：预付款客户「星海网络科技有限公司」（客户别名 星海，币种 人民币，销售 张伟，付款主体 Starfish Ltd、星海网络科技有限公司）；账户 A「星海-iOS-US」（orgid 4521873，消耗币种 USD，优化师 周宁）绑定登记表的规则：起始 2026-10-01（另有 2026-09-01 起同内容的旧规则），相对日期，第 1 行「消耗首日 - 第30天」固定 8.00%，第 2 行「第31天 - 永久」阶梯 [0, 10,000.00) 5.00%、[10,000.00, 不限) 3.00%，税率 6.00%，服务费税费 客户承担，消耗首日 2026-09-12；账户 B「星海-iOS-JP」（orgid 4521906，消耗币种 USD）规则固定 4.00%、税率 6.00%、公司承担；今天 2026-10-19（UTC0，A 第 38 天）；当日日汇率 1 USD = 7.1234 人民币；各用例操作人都有「费用管理（查看）」；操作人 王敏 有「账户费用管理」「提成规则管理」「客户管理-读写」，能看 A、B
  # 余额与分桶
  - { id: G-05-001, module: 余额与分桶, given: "公共前置；账户 A 分桶 ①2026-09-15 到账 3,000.00（第 4 天提交，快照 服务费 8.00%、税率 6.00%、客户承担）②2026-10-14 提交、2026-10-16 到账 12,000.00（第 33 天，落第 2 行第 2 档，快照 3.00%、6.00%、客户承担）；截至 2026-10-18 累计消耗 2,000.00 USD", when: "打开费用管理看账户 A", then: "账户余额 13,000.00 USD；分桶①剩 1,000.00、②剩 12,000.00（技术自测核对，页面不展示分桶）" }
  - { id: G-05-002, module: 余额与分桶, given: "G-05-001 的数据", when: "2026-10-21 消耗数据修正：10-18 的消耗由 300.00 改为 800.00", then: "账户 A 余额自动变为 12,500.00 USD，不产生任何交易明细；分桶①剩 500.00、②仍 12,000.00" }
  - { id: G-05-003, module: 余额与分桶, given: "G-05-001 的数据；王敏为 A 提交退款 4,000.00 USD 审批中", when: "查看 A 的可用余额；再打开余额分配看取出列表", then: "锁定 4,000.00（分桶①1,000.00 + 分桶②3,000.00）；可用余额 9,000.00；余额分配取出列表 A 的可用余额显示 9,000.00 USD" }
  - { id: G-05-004, module: 余额与分桶, given: "预付账户 A 余额 -500.00 USD（欠费）", when: "一笔 2,000.00 的账户充值到账", then: "余额变为 1,500.00；新分桶先被那 500.00 的超出消耗占用、剩 1,500.00" }
  - { id: G-05-062, module: 余额与分桶, given: "G-05-003 的数据（A 退款 4,000.00 审批中）", when: "王敏看费用信息列表 A 行，悬浮账户余额", then: "账户余额仍显示 13,000.00 USD；悬浮「其中锁定 4,000.00、可用 9,000.00 USD」" }
  - { id: G-05-072, module: 余额与分桶, given: "星海 2026-10-25 提交预付改后付，2026-11-03 审批通过；A 当时只剩分桶②5,000.00（快照 3.00% / 6.00% / 客户承担），没有在途单", when: "11 月查看列表；2026-12-01（UTC0）起再看；12 月 A 消耗 8,000.00；2027-01-02 出账后 12 月账单 A 行可结算应收 8,000.00，生成结算单并审批通过", then: "11 月计费模式显示「预付款（2026-12-01 起改为后付款）」，操作列仍有充值、退款、余额分配；12-01 起显示「后付款」，没有充值、退款、余额分配，A 账户余额仍显示 5,000.00 USD，12 月消耗不扣它；结算单 A 行自动带出余额抵扣 5,459.00（5,000.00 + 税费 300.00 + 服务费 150.00 + 服务费税费 9.00），提交时 A 锁定 5,000.00，通过后 A 余额为 0、列表显示「-」，交易明细新增「余额抵扣账单·已完成」，充值金额 -5,000.00 USD" }
  - { id: G-05-073, module: 余额与分桶, given: "星海账户 B 余额 -2,000.00（10 月消耗中 2,000.00 没被分桶覆盖，10 月账单待结算，11 月 B 无消耗）；预付改后付 2026-12-01 生效；之后又改回预付款，2027-02-01 生效", when: "12-01 起看 B；2027-02 起 B 一笔 1,000.00 账户充值到账", then: "12-01 起 B 的欠费按 D-00-73 转入第一张后付账单（06 核对），B 账户余额不再显示负数（显示「-」）；改回预付后 1,000.00 到账，B 余额 1,000.00，不被那 2,000.00 先占用" }
  # 额度与停投
  - { id: G-05-005, module: 额度与停投, given: "账户 A 余额 13,000.00，当前生效额度 5,000.00、有效期 2026-10-31", when: "查看列表；到 2026-11-01 UTC0 再看", then: "10 月内授信额度 5,000.00 USD、剩余额度 5,000.00 USD；2026-11-01 起授信额度 0.00 USD、剩余额度 0.00 USD" }
  - { id: G-05-006, module: 额度与停投, given: "账户 A 当前生效额度 5,000.00（2026-10-01 生效，长期），余额 -1,200.00", when: "查看列表；然后一笔 2026-10-05 提交的账户充值 3,000.00 到账；另一种情况改为余额分配转入 3,000.00", then: "欠费时剩余额度 3,800.00 USD；账户充值到账后可用余额 1,800.00 > 0，授信额度变 0.00、余额 1,800.00；余额分配转入时额度仍为 5,000.00" }
  - { id: G-05-007, module: 额度与停投, given: "账户 A 可用余额 -4,800.00、额度 5,000.00；第二天消耗 300.00", when: "当天消耗数据更新后系统即时判断", then: "可用余额 + 额度 = -100.00 ≤ 0 → A 停投；张伟（销售）和 周宁（优化师）各收到一条停投通知；同一次停投不重复通知" }
  - { id: G-05-008, module: 额度与停投, given: "后付客户「橙子出行科技有限公司」账户「橙子-iOS-CN」（人民币）额度 100,000.00；9 月账单待结算，其中消耗 60,000.00（加上服务费、税费后 63,600.00）；10 月截至目前未出账消耗 38,000.00", when: "查看列表", then: "账户余额「-」；授信额度 100,000.00 人民币；剩余额度 2,000.00 人民币（只算原始消耗，不算服务费、税费）；操作列只有 费用明细、调整额度、提成规则配置" }
