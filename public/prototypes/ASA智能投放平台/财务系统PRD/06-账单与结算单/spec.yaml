  - { id: T-06-001, title: "账单生成与金额口径：未出账实时、2 日出账、一个结算期一种计费模式、预付分桶折算（锁定不覆盖、0 费率分桶）、后付按 03 分段落档、无规则按 0、返点与结转额、应收 / 总计 / 可结算应收（R-06-001～R-06-013）", depends_on: [T-03-002, T-05-001], done_when: "G-06-001、G-06-004、G-06-006、G-06-034 通过；给 10 的接口：账户行逐日的消耗、服务费、税费、服务费税费可按 UTC0 自然日取到（R-10-003、R-10-011）；账户行上 07 返点、挂入结转额、上期预付欠费、余额抵扣分开可取；预付扣减段的分桶快照费率可取；每张结算单的默认应付、应付、各账户行本次应收、审批通过时间可取" }
  - { id: T-06-002, title: "渠道统计金额与消耗差额：订单行取数、归期与币种折算、税费显示、订单号去重与共享标注、08 数据接入、不锁定（R-06-014～R-06-018）", depends_on: [T-06-001], done_when: "G-06-002、G-06-003、G-06-032 通过" }
  - { id: T-06-003, title: "账单状态机、刷新与锁定、预付逐张结清、欠费副标与通知、07 扣减月份可选判断与占用（R-06-019～R-06-024、R-06-075）", depends_on: [T-06-001], done_when: "G-06-005、G-06-008～G-06-011、G-06-025 通过" }
  - { id: T-06-004, title: "账单信息列表：页面权限点、搜索筛选、三层展开、副标与提示、排序分页、权限过滤、费用明细 tab 复用（R-06-025～R-06-032）", depends_on: [T-06-001, T-06-003], done_when: "G-06-012～G-06-015、G-06-031～G-06-033 通过" }
  - { id: T-06-005, title: "生成结算单弹窗、提交审批与服务端复核（就地重载、汇率确认、在途提示）、待结算返点提示（R-06-040～R-06-049、R-06-079）", depends_on: [T-06-003, T-04-006, T-12-004], done_when: "G-06-016～G-06-021、G-06-029、G-06-030 通过" }
  - { id: T-06-006, title: "审批结果处理：生成 09 收款单、写交易明细、0 元直接已结算、驳回 / 撤回 / 作废解锁（R-06-050～R-06-053）", depends_on: [T-06-005, T-05-010, T-12-006], done_when: "G-06-022、G-06-023 通过" }
  - { id: T-06-007, title: "已提交审批 tab（执行状态）与审批内容区（R-06-060～R-06-073）", depends_on: [T-06-005, T-12-005, T-12-007], done_when: "G-06-017、G-06-022～G-06-024 通过" }
  - { id: T-06-008, title: "预付改后付：上期预付欠费冻结与转入、原预付账单随承接账单结清；后付结算单余额抵扣的试算、分桶锁定 / 释放 / 扣减（R-06-074、R-06-076）", depends_on: [T-06-003, T-06-005, T-04-006, T-05-001], done_when: "G-06-007、G-06-026 通过" }
  - { id: T-06-009, title: "可结算应收为负时应付 0、结转额生成、按账户拆分、挂载 / 挂起 / 转预付充余额（R-06-077、R-06-078）", depends_on: [T-06-005, T-06-006, T-05-001], done_when: "G-06-027、G-06-028 通过" }

decisions:
  - { id: D-06-01, point: "账单粒度", conclusion: "客户 × UTC0 自然月一张，三层：结算期 → 账户 → 订单号；币种 = 账户消耗币种", impact: "R-06-001～R-06-003", status: "已定" }
  - { id: D-06-02, point: "应收公式", conclusion: "账户行应收 = 消耗 + 服务费 + 税费 + 服务费税费 − 客户返点；总计 = 各账户应收之和，不去重", impact: "R-06-011", status: "已定" }
  - { id: D-06-03, point: "预付账单的服务费、税费", conclusion: "按当月消耗从哪些分桶扣的，用分桶费率快照折算；欠费部分按当日 03 规则暂算", impact: "R-06-007", status: "已定" }
  - { id: D-06-04, point: "渠道统计金额", conclusion: "自接苹果：账户行 = 本账户订单「总计」之和（共享订单各算一次），第一层 = 本账单内订单号去重后加总；其他上游渠道没有订单号，第一层 = 账户行相加；去重只在同一张账单内", impact: "R-06-015、R-06-016", status: "已定（用户原话：渠道统计金额就是把下面订单号金额去重加总）" }
  - { id: D-06-05, point: "消耗差额", conclusion: "= 消耗 − 渠道统计金额，内部对账用，不影响应收", impact: "R-06-014、R-06-017", status: "已定" }
  - { id: D-06-06, point: "出账后数据变了", conclusion: "待结算且无审批中结算单时跟着刷新；结算单提交即按快照锁定；驳回 / 撤回 / 作废解锁；已结算后冻结", impact: "R-06-019、R-06-020", status: "已定" }
  - { id: D-06-07, point: "预付怎么结清", conclusion: "逐张账单判断：该结算期消耗全部被分桶先进先出覆盖（锁定中的不算）即已结算，与其他月份、其他账户无关；出账时判一次，之后覆盖关系变化和每个 UTC0 日再判；未结清副标「欠费 x，待充值」；预付不显示生成结算单", impact: "R-06-021～R-06-023、R-06-075", status: "已定（2026-10-21 用户定，会议清单 D03；原「全部账户余额 ≥ 0 一起结清」作废）" }
  - { id: D-06-08, point: "没有适用规则", conclusion: "费率按 0，照常出账结算，静默、页面不提示（与 05 D-05-38 一致）；用户授权本会话直接改 index D-00-57（充值、账单、返点全部按 0）", impact: "R-06-009；index D-00-57；05、07", status: "已定（用户原话：费率按 1 算……我允许你直接改这个）；index 已改" }
  - { id: D-06-09, point: "应付金额能否改", conclusion: "能改，不设上限；应付 ≠ 默认时备注必填；输入框下显示默认值与「已调整」差额，审批内容区同样显示", impact: "R-06-044、R-06-046、R-06-071", status: "已定（2026-10-21 用户定，会议清单 D54；原「备注始终选填」作废）" }
  - { id: D-06-10, point: "账期、订单数据、导出", conclusion: "本版不用账期；订单号层沿用现有数据；本期不做导出", impact: "scope；R-06-028、R-06-030", status: "已定" }
  - { id: D-06-11, point: "客户返点列", conclusion: "后付 = 07 纳入本月扣减且审批通过的返点 + 挂上的结转额，时间范围 = 返点所属消耗日期段 /「yyyy-mm 结转」；预付显示「-」", impact: "R-06-010", status: "已定" }
  - { id: D-06-12, point: "计费模式与流转", conclusion: "一个结算期只有一种计费模式（D-00-73 次月 1 日生效），账单按该结算期的计费模式流转；不再按天分段、不再有预付日子扣除（关闭 Q-06-03）", impact: "R-06-004、R-06-012、R-06-013", status: "已定（2026-10-21 用户定，会议清单 D02；原「月中按天分段」作废）" }
  - { id: D-06-13, point: "未出账账单", conclusion: "当月（及 2 日出账前的上月）显示「未出账」行，金额实时，无操作；状态筛选补「未出账」「待支付」", impact: "R-06-001、R-06-026", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-14, point: "搜索、排序、分页", conclusion: "搜索公司名称 / 客户别名 / 账户名称 / orgId（账户只在可见范围匹配）；结算期降序、同期按总计降序；10 / 50 / 100 / 300", impact: "R-06-026、R-06-029", status: "已定（2026-10-21 用户定，会议清单 D53）" }
  - { id: D-06-15, point: "权限点与可见性", conclusion: "页面按「账单管理（查看）」显示（D-00-78）；新增「生成结算单」权限点；可见性跟账户查看权限；第一层显示整张账单金额，第二层只列有权限账户；看不全账户时生成结算单置灰并说明", impact: "R-06-025、R-06-031、R-06-040；13", status: "已定（2026-10-21 用户定，会议清单 D86、D50）" }
  - { id: D-06-16, point: "原型残留", conclusion: "勾选框、导出按钮、注释里的交易明细不做；标题「账单中心」统一为「账单管理」", impact: "R-06-025、R-06-030", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-17, point: "渠道两列是否锁定", conclusion: "不锁定，任何状态都随数据更新", impact: "R-06-018", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-18, point: "锁定后消耗修正", conclusion: "不回改账单、不补差", impact: "R-06-020", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-19, point: "舍入", conclusion: "按段（后付按日统计时按天、预付按分桶扣减段）各项四舍五入到 2 位再加总；中间值可存更高精度但不能代替舍入点；阶梯落档用未舍入的原始消耗合计（D-00-13）", impact: "R-06-006～R-06-008", status: "已定（2026-10-21 用户定，会议清单 D01）" }
  - { id: D-06-20, point: "预付欠费部分", conclusion: "先按 03 规则暂算，新分桶覆盖后改按新分桶快照重算", impact: "R-06-007", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-21, point: "结算单弹窗默认值", conclusion: "结算币种默认客户币种（下拉）；付款主体同 05；应付默认 =（预估应收 − 余额抵扣）× 汇率，可改、≥ 0；换币种重带默认值", impact: "R-06-042～R-06-045", status: "已定（2026-10-21 用户定，会议清单 D54、D02、附 1 N1）" }
  - { id: D-06-22, point: "预付欠费通知", conclusion: "出账时一次，发客户的销售；文案见 notifications", impact: "R-06-021", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-23, point: "返点与结算单并发", conclusion: "有选了本月扣减、合计 > 0、审批中的返点单时生成结算单置灰并带单号；同一账单同时最多 1 张审批中的抵扣单；07 只能选无审批中结算单的待结算后付账单，只在 07 提交时校验，最后通过不再复核；0 元抵扣单不占用", impact: "R-06-024、R-06-040；07", status: "已定（2026-10-21 用户定，会议清单 D50、D10、D57）" }
  - { id: D-06-24, point: "计费模式变更从哪天算", conclusion: "从确定时刻的次月 1 日（UTC0）起生效，结算期中途不切换（D-00-73）", impact: "R-06-004", status: "已定（2026-10-21 用户定，会议清单 D02；原「变更当天算新模式」作废）" }
  - { id: D-06-25, point: "费用明细 tab", conclusion: "复用本页账单信息、单客户、只读、不带生成结算单", impact: "R-06-032；05", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-26, point: "已提交审批列", conclusion: "在原型列基础上加公司名称、结算期、执行状态", impact: "R-06-061", status: "已定（执行状态列 2026-10-21 按会议清单 D51 加；2026-10-21 用户确认，由代定转已定）" }
  - { id: D-06-27, point: "预付改后付的余额与欠费", conclusion: "改后付后剩余未锁定分桶保留、不再被消耗扣，后付账单生成结算单时按账户自动带出余额抵扣（退款口径，上限为剩余应收，先扣返点再扣余额，算到款）；切换前未结清的预付欠费冻结，作为「上期预付欠费（yyyy-mm）」并入第一张后付账单，承接账单结清时原账单一起结清", impact: "R-06-074、R-06-076、R-06-051", status: "已定（2026-10-21 用户定，会议清单 D02 用户方案 + 技术补充 4 条）" }
  - { id: D-06-28, point: "返点抵扣后账单为负", conclusion: "可结算应收 < 0 时应付固定 0.00、只读；超出部分在通过时生成结转额，按可结算应收为负的账户行占比拆（2026-10-22 改，D-06-40），挂到最早一张后付待结算未锁定账单，没有就挂起；下一张出账账单为预付时按 0 费率充进余额；人工改 0 不结转", impact: "R-06-077、R-06-078、R-06-010", status: "已定（2026-10-21 用户定，会议清单 D09；原 D-00-67「由人改应付」作废）" }
  - { id: D-06-29, point: "0 元结算单", conclusion: "应付为 0.00 的结算单审批通过即已结算，不生成收款单（与 07 一致）", impact: "R-06-051", status: "已定（2026-10-21 用户定，会议清单技术答复后补充决定、D-00-80）" }
  - { id: D-06-30, point: "复核失败与汇率变化", conclusion: "不再要求关闭重开：数据变了就地重载并标黄、保留用户已填内容；提交当天汇率不同时弹确认后按新汇率建单；复核补付款主体仍有效；在途提示带单号", impact: "R-06-043、R-06-048", status: "已定（2026-10-21 用户定，会议清单 D35、D40、D116）" }
  - { id: D-06-31, point: "订单数据口径", conclusion: "自接苹果 = 从苹果同步订单、按订单号结算的账户系统；LOC 按账单月份、CC 按交易日落月；币种不同按截止日 / 交易日日汇率折算；人民币体系税费照实、USD 体系税费「-」；第三层首列订单号；共享订单分两种标注（关闭 Q-06-02）", impact: "R-06-014、R-06-015、R-06-028", status: "已定（2026-10-21 用户定，会议清单 D13、D103，技术答复 T09）" }
  - { id: D-06-32, point: "展示补充", conclusion: "未出账悬浮数据截至时间；状态副标（结算单审批中 / 收款单待完成）、「已锁定」；生成结算单置灰带原因；已提交审批加执行状态列；审批内容区加执行结果行", impact: "R-06-027、R-06-040、R-06-061、R-06-071", status: "已定（2026-10-21 用户定，会议清单 D39、D50、D51）" }
  - { id: D-06-33, point: "第二层账户行", conclusion: "隐藏条件加「渠道统计金额为 0 或「-」且无订单行」；第一层渠道统计金额只来自列出的账户行；第二层按消耗降序、同额按名称升序", impact: "R-06-002、R-06-016、R-06-028、R-06-031", status: "已定（2026-10-21 用户定，会议清单 D52）" }
  - { id: D-06-34, point: "提示与说明", conclusion: "预付账户行返点余额 0 费率悬浮说明；生成结算单时有待结算客户返点的黄条提示（不拦）；消耗差额表头问号说明", impact: "R-06-028、R-06-079、R-06-027", status: "已定（2026-10-21 用户定，会议清单 D100、D101、D102；D100 税务口径待财务确认）" }
  - { id: D-06-35, point: "回写时按理解代定", conclusion: "余额抵扣合计封顶时从最大的账户行减回；最后一个预付月份出账时判结清后再冻结；承接账单顺延；余额抵扣只在客户当前生效为后付款时带出；0 元结算单不写「结算单支付」交易明细", impact: "R-06-074、R-06-076、R-06-051", status: "已定（2026-10-21 用户确认，Q-06-06 关闭）" }
  - { id: D-06-36, point: "账单从哪个月起出", conclusion: "只出结算期 ≥ 上线月的账单；上线月与 07 计提、08、10、11 共用 index S-18 的同一个配置；上线月之前的结算期不出账单（S-16 定掉，Q-06-01 关闭）", impact: "R-06-001；§3 存量；migration", status: "已定（2026-10-22 用户与技术确认，闭环清单 A01）" }
  - { id: D-06-37, point: "切换前最后一个预付月还能否被分桶覆盖", conclusion: "预付改后付生效后，切换前最后一个预付月在出账判结清或冻结之前，分桶照常按先进先出覆盖它，包括期间补报的消耗、释放的锁定分桶、新到账的充值；欠费冻结之后的消耗、生效月起的消耗不再被分桶覆盖", impact: "R-06-074 ①", status: "已定（2026-10-22 用户与技术确认，闭环清单 A06）" }
  - { id: D-06-38, point: "冻结欠费的两个口子", conclusion: "①已冻结转入后付账单、或已结算冻结的切换前月份，之后的消耗修正不再进余额、不参与分桶覆盖，线下处理（index §2.9）；②冻结的欠费在下一张后付账单生成时挂上，挂上前原账单副标「欠费待转入下一张后付账单」；挂上前客户又改回预付的，解除冻结、欠费退回余额，原账单重新按 R-06-022 判结清", impact: "R-06-074 ②③④、R-06-075、R-06-020", status: "已定（2026-10-22 用户与技术确认，闭环清单 A07）" }
  - { id: D-06-39, point: "欠费暂算的落档基数", conclusion: "欠费暂算时用该段全部消耗落档取比例（按日统计时用当天全部消耗），比例只乘欠费部分；欠费部分各项各自四舍五入到 2 位", impact: "R-06-007、R-06-074 ②、R-06-075", status: "已定（2026-10-22 用户与技术确认，闭环清单 A10）" }
  - { id: D-06-40, point: "结转额拆分口径", conclusion: "按原账单里可结算应收为负的账户行、按负数大小占比拆（index D-00-81 同步）", impact: "R-06-078、D-06-28", status: "已定（2026-10-22 用户与技术确认，闭环清单 A11）" }
  - { id: D-06-41, point: "出账时结转入桶与判结清的先后", conclusion: "出账时先把挂起的结转额入桶，再判结清，再决定发不发欠费通知", impact: "R-06-021、R-06-078", status: "已定（2026-10-22 用户与技术确认，闭环清单 B04）" }
  - { id: D-06-42, point: "手续费分摊权重为负", conclusion: "本次应收 ≤ 0 的账户行分摊权重按 0，本次应收照原值记录", impact: "R-06-051 ②", status: "已定（2026-10-22 用户与技术确认，闭环清单 B05）" }
  - { id: D-06-43, point: "审批详情第②类查看", conclusion: "对单内任一账户有查看权限之外，还要同时持「账单管理（查看）」；申请人和快照里的审批人不受影响", impact: "R-06-073", status: "已定（2026-10-22 用户与技术确认，闭环清单 B10）" }
  - { id: D-06-44, point: "复核时返点抵扣单 / 可见账户变化", conclusion: "R-06-040 ②③ 在复核时任一成立就不建单，提示框显示对应的置灰原因原文，单号可点", impact: "R-06-048 ⑤", status: "已定（2026-10-22 用户与技术确认，闭环清单 B16）" }
  - { id: D-06-45, point: "零消耗只有渠道金额的客户", conclusion: "不生成账单，渠道金额在 08 / 10 查看，作为已知限制写进 §2.1.5 与 index §2.9", impact: "R-06-001、§2.1.5", status: "已定（2026-10-22 用户与技术确认，闭环清单 B17）" }
  - { id: D-06-46, point: "引用 05 / 08 的同步口径", conclusion: "余额抵扣以剩余应收为准，最后一桶本金与尾差按 R-05-118 ①（B02）；LOC 截止日期晚于今天时先按最近一天汇率暂折，截止日当天汇率入库后重折一次、之后不再变，同 R-08-017（B07）", impact: "R-06-076、R-06-015", status: "已定（2026-10-22 用户与技术确认，闭环清单 B02、B07）" }
  - { id: D-06-47, point: "结算时间时区", conclusion: "展示统一用北京时间（Asia/Shanghai），存储统一用时间戳（06 bill.settled_at、07 accrual_item.settled_at 一致）；R-06-020 的已知限制收进 index §2.9", impact: "字段 settled_at、R-06-020", status: "已定（2026-10-22 用户与技术确认，闭环清单 D 组）" }

