# 06-账单与结算单 · 机器可读规格（2026-10-19 用户三轮问答 + 代定清单确认「可以的」；2026-10-21 总控代改：按会议清单 v2 回写；2026-10-22 总控代改：按闭环问题清单回写）
# 来源：html/账单管理.html:3931（V2.1 注释）、:1828–3923（列表 / 弹窗 / 已提交审批）、html/审批详情-账单管理.html:1828–3064 + 用户确认（见 decisions）+ 《财务v2.1.0_会议清单v2》决策
# 本页主管：账单（客户 × UTC0 自然月）及其状态机、账单金额口径（含渠道统计金额去重、上期预付欠费、结转额）、结算单（「账单管理—生成结算单」审批的业务单据，含返点抵扣 / 余额抵扣两种抵扣行）。
# 本页不定义：规则配置（03）、客户（04）、余额 / 分桶 / 交易明细（05）、返点金额（07）、渠道统计金额的抓取与上传（08）、收款单（09）、审批引擎（12）。
# 公共前置：后付款客户「橙子出行科技有限公司」（币种 人民币，销售 李娜，所属账户系统 苹果ASA（自接苹果，USD 体系，订单没有税费字段），付款主体 橙子出行科技有限公司、Orange Mobility Ltd）；账户 C「橙子-iOS-CN」（orgid 5130021，消耗币种 USD）规则 2026-09-01 起：固定服务费 5.00%、税率 6.00%、服务费税费 客户承担；账户 D「橙子-iOS-HK」（orgid 5130048，消耗币种 USD）规则 2026-09-01 起：阶梯 按月统计 [0, 10,000.00) 4.00%、[10,000.00, 不限) 3.00%，税率 6.00%，公司承担；2026-09 消耗 C 20,000.00、D 12,000.00；07 已审批通过一笔 C 的返点 300.00 USD（纳入扣减月份 2026-09，返点所属消耗 2026-09-01 至 2026-09-30）；苹果订单 PR-0901 总计 12,000.00（只在 C 下）、PR-0902 总计 8,000.00（C、D 下都有）、PR-0903 总计 4,000.00（只在 D 下）；2026-10-05 日汇率 1 USD = 7.1234 人民币（已四舍五入到 4 位）；操作人 王敏 有「生成结算单」权限点，能看 C、D；以下用户除特别说明外都有「账单管理（查看）」权限点；样例假设上线月（index S-18）不晚于 2026-08

meta:
  feature: 账单与结算单
  product: ASA
  version: v2.1.0
  page: 06-账单与结算单
  date: 2026-10-22
  prd: PRD.md
  status: 待评审
scope:
  in:
    - "账单：客户 × UTC0 自然月，三层（结算期 → 账户 → 订单号），每月 2 日出上月账单；一个结算期只有一种计费模式（D-00-73）"
    - "账单金额口径：消耗、服务费、税费、服务费税费、客户返点（含结转额）、上期预付欠费、应收 / 总计 / 可结算应收；预付按分桶快照、后付按 03 规则"
    - "渠道统计金额与消耗差额（自接苹果按订单号去重）"
    - "账单状态机（未出账 / 待结算 / 待支付 / 已结算）、出账后刷新与锁定、预付逐张结清与欠费通知、预付改后付时欠费冻结转入"
    - "账单管理页：账单信息 tab、已提交审批 tab"
    - "生成结算单弹窗（返点抵扣、余额抵扣、可结算应收为负时结转）、「账单管理—生成结算单」审批的提交、结果处理、审批内容区"
    - "05 费用明细页「费用明细」tab 的账单口径（R-05-093 指向本页）"
  out:
    - "导出（账单信息顶部与行操作的「导出」，本期不做，D-06-10）"
    - "账期（天）的任何计算（本版不用，D-06-10）"
    - "收款单的生成后流程、确认收款、手续费（归 09，D-00-32）"
    - "返点金额计算与兑现（归 07）；本页只展示已纳入本月扣减的返点与结转额"
    - "渠道统计金额的抓取、上传、审批（归 08）；本页只取数展示"
    - "交易明细实体、分桶锁定与扣减本身（归 05）；本页写入「结算单支付」，余额抵扣由 05 写「余额抵扣账单」"
    - "审批引擎、撤回、作废、通知渠道、审批详情通用框架（归 12）"

roles:
  - { role: "有「账单管理（查看）」权限点的用户", can: ["看到账单管理菜单与页面"], cannot: [], source: "D-00-78（R-06-025）" }
  - { role: "有「生成结算单」权限点的用户（依赖「账单管理（查看）」，D-13-01）", can: ["对能看到账单内全部账户的后付款待结算账单生成结算单"], cannot: ["对预付款账单生成结算单", "修改账单金额"], source: "新增权限点（D-06-15；13 汇总）" }
  - { role: "申请人本人", can: ["撤回自己提交的审批中结算单（不校验业务权限点）"], cannot: [], source: "D-00-79（R-06-062）" }
  - { role: "有「审批配置」权限点的用户", can: ["在审批详情作废审批中的结算单（效果同撤回）"], cannot: [], source: "D-00-79（R-06-052）" }
  - { role: "能看到某账户的用户", can: ["在账单管理看到含该账户的客户账单", "在第二层看到该账户行与其订单号", "同时持「账单管理（查看）」时只读查看含该账户的结算单审批详情（R-06-073）"], cannot: ["看他没有权限的账户行"], source: "沿用现有账户查看权限（R-06-031）" }
  - { role: "审批人", can: ["在审批详情通过 / 驳回"], cannot: ["修改审批内容"], source: "12（R-12-023 按钮、R-12-030 审批内容由业务包定义）" }
  - { role: "系统", can: ["每月 2 日出账", "刷新未锁定账单", "预付逐张结清", "预付改后付时冻结欠费并转入", "挂载结转额", "发欠费通知"], cannot: [], source: "R-06-001、R-06-019～R-06-022、R-06-074、R-06-078" }

entities:
  - name: 账单
    key: bill
    note: "一个客户一个 UTC0 自然月一张；key 为文档内称呼，落库方式由技术定"
    fields:
      - { key: "bill_id", label: "账单ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "04 客户" }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "yyyy-mm（UTC0 自然月），展示为「yyyy-mm-01 至 yyyy-mm-最后一天」（R-06-001）" }
      - { key: "currency", label: "账单币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "= 该客户账户消耗币种（同一客户相同，D-05-11）（R-06-003）" }
      - { key: "billing_mode", label: "流转计费模式", type: "enum", required: true, enum: ["预付款", "后付款"], generated: true, rule: "该结算期的计费模式（一个结算期只有一种，D-00-73），已出账、未出账一样（R-06-004、R-06-012）" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["未出账", "待结算", "待支付", "已结算"], generated: true, rule: "flows 账单（D-00-59）" }
      - { key: "consumption", label: "消耗金额", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-005" }
      - { key: "fee", label: "服务费", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-006～R-06-009" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-006～R-06-009" }
      - { key: "fee_tax", label: "服务费税费", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-006～R-06-009" }
      - { key: "rebate", label: "客户返点", type: "decimal", required: false, precision: 2, currency: "账单币种", generated: true, rule: "R-06-010（含挂上的结转额）；预付款为空" }
      - { key: "channel_amount", label: "渠道统计金额", type: "decimal", required: false, precision: 2, currency: "账单币种", generated: true, rule: "R-06-014～R-06-016；未取到为空" }
      - { key: "consumption_diff", label: "消耗差额", type: "decimal", required: false, precision: 2, currency: "账单币种", generated: true, rule: "R-06-017" }
      - { key: "total", label: "总计", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-011；不含上期预付欠费" }
      - { key: "settle_base", label: "可结算应收", type: "decimal", required: true, precision: 2, currency: "账单币种", generated: true, rule: "R-06-013；结算单「预估应收金额」取它" }
      - { key: "generated_at", label: "出账时间", type: "datetime", required: false, tz: "UTC0", precision: "秒", generated: true, rule: "R-06-001" }
      - { key: "locked_by", label: "锁定来源审批单", type: "ref", required: false, generated: true, rule: "R-06-020" }
      - { key: "arrears_moved_to", label: "欠费转入账单", type: "ref", required: false, generated: true, rule: "预付账单欠费冻结后转入的后付账单（R-06-074）" }
      - { key: "pending_carryover", label: "待结转金额", type: "decimal", required: false, precision: 2, currency: "账单币种", generated: true, rule: "已生成、尚未挂上的结转额（R-06-078）" }
      - { key: "settled_at", label: "结算时间", type: "datetime", required: false, tz: "存储为时间戳；展示北京时间 Asia/Shanghai", precision: "秒", generated: true, rule: "变已结算的时间（D-06-47）" }
  - name: 账单账户行
    key: bill_account_line
    note: "一个账户一行；展示条件见 R-06-002"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "consumption", label: "消耗金额", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "R-06-005" }
      - { key: "fee", label: "服务费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "R-06-006～R-06-009" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "R-06-006～R-06-009" }
      - { key: "fee_tax", label: "服务费税费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "R-06-006～R-06-009" }
      - { key: "prepaid_segments", label: "预付扣减段", type: "list", required: false, rule: "预付账单每个分桶扣减段：分桶、扣减消耗 P、服务费率、税率、服务费税费承担方快照（R-06-007）；供 10 算公司承担服务费税费" }
      - { key: "zero_rate_consumption", label: "0 费率分桶覆盖的消耗", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "预付账单返点余额等 0 费率分桶覆盖的消耗，服务费格悬浮展示（R-06-028）" }
      - { key: "channel_amount", label: "渠道统计金额", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "R-06-014、R-06-015" }
      - { key: "consumption_diff", label: "消耗差额", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "R-06-017" }
      - { key: "rebate", label: "客户返点", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "R-06-010 = rebate_from_07 + carryover_in" }
      - { key: "rebate_from_07", label: "07 扣减返点", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "07 纳入本月扣减、合计 > 0 的返点（R-06-010 ①）" }
      - { key: "carryover_in", label: "挂入的结转额", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "R-06-010 ②、R-06-078；与 07 返点分开记录，10 收入 / 成本不重复计" }
      - { key: "rebate_ranges", label: "返点时间范围", type: "list", required: false, rule: "元素「yyyy-mm-dd 至 yyyy-mm-dd」或「yyyy-mm 结转」（R-06-010）" }
      - { key: "prior_arrears", label: "上期预付欠费", type: "list", required: false, rule: "元素：来源结算期 yyyy-mm、冻结金额（账单币种）；计入账户行可结算应收（R-06-074、R-06-013）" }
      - { key: "receivable", label: "应收金额", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "R-06-011" }
      - { key: "settle_base", label: "账户行可结算应收", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "= 应收金额 + 上期预付欠费（R-06-013）；页面不单列" }
      - { key: "no_rule_days", label: "无适用规则的日子", type: "list", required: false, rule: "R-06-009" }
  - name: 账单订单行
    key: bill_order_line
    note: "第三层，只有自接苹果的账户有；字段与数据来源沿用现有苹果 PR 单据数据（D-06-10、D-06-31）"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "order_no", label: "订单号", type: "string", required: true, rule: "苹果 PR 单据号，第三层首列；同一订单号可出现在多个账户下，共享标注见 R-06-015" }
      - { key: "payment_ref", label: "付款参考编号", type: "string", required: false, rule: "可点击下载，沿用现有" }
      - { key: "invoice_file", label: "账单", type: "string", required: false, rule: "可点击下载，沿用现有" }
      - { key: "bill_type", label: "账单类型", type: "string", required: false, rule: "沿用现有" }
      - { key: "advertiser", label: "产品或广告主", type: "string", required: false, rule: "沿用现有" }
      - { key: "description", label: "描述", type: "text", required: false, rule: "沿用现有" }
      - { key: "receipt", label: "发票", type: "string", required: false, rule: "点击新页打开，沿用现有" }
      - { key: "due_date", label: "截止日期", type: "date", required: false, tz: "沿用现有", rule: "LOC 订单币种折算用截止日期当天日汇率（R-06-015）" }
      - { key: "subtotal", label: "小计", type: "decimal", required: false, precision: 2, currency: "订单币种", rule: "沿用现有" }
      - { key: "order_tax", label: "税费", type: "decimal", required: false, precision: 2, currency: "订单币种", rule: "有税费字段照实展示；没有（USD 体系、老数据为空）显示「-」、总计 = 小计（R-06-028）" }
      - { key: "order_total", label: "总计", type: "decimal", required: true, precision: 2, currency: "订单币种", rule: "渠道统计金额取这一列，币种与账户不同时取折算值（R-06-015）" }
  - name: 结算单
    key: settlement
    note: "「账单管理—生成结算单」审批单的业务单据快照；不单独设状态（D-00-60）；两种抵扣行名称固定「返点抵扣」「余额抵扣」"
    fields:
      - { key: "approval_id", label: "审批单号", type: "ref", required: true, rule: "12 审批单" }
      - { key: "bill_id", label: "账单", type: "ref", required: true, rule: "一张账单最多 1 张在途（D-00-61）" }
      - { key: "est_receivable", label: "预估应收金额", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "= 账单可结算应收（R-06-013、R-06-041）" }
      - { key: "consumption", label: "消耗金额", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "账单快照" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "账单快照" }
      - { key: "fee", label: "服务费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "账单快照" }
      - { key: "fee_tax", label: "服务费税费", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "账单快照" }
      - { key: "rebate_offset", label: "返点抵扣", type: "decimal", required: true, precision: 2, currency: "账单币种", rule: "= 账单客户返点合计快照（R-06-010）；不计到款" }
      - { key: "prior_arrears", label: "上期预付欠费", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "R-06-074 快照" }
      - { key: "balance_offset_lines", label: "余额抵扣", type: "list", required: false, rule: "按账户：金额、取用的分桶与各分桶扣减余额（R-06-076）；计入到款" }
      - { key: "carryover", label: "结转额", type: "decimal", required: false, precision: 2, currency: "账单币种", rule: "可结算应收为负时 = −可结算应收（R-06-077）" }
      - { key: "settle_currency", label: "结算币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "R-06-042" }
      - { key: "fx_rate", label: "汇率", type: "decimal", required: true, precision: 4, rule: "1 账单币种 = x 结算币种；日汇率四舍五入 4 位，显示与计算一致；同币种为 1（R-06-043，D-00-74）" }
      - { key: "fx_date", label: "汇率日期", type: "date", required: false, tz: "UTC0", rule: "实际取到汇率的日期，币种不同时有（R-06-043）" }
      - { key: "default_payable", label: "默认应付金额", type: "decimal", required: true, precision: 2, currency: "结算币种", rule: "=（预估应收 − 余额抵扣）× 汇率；可结算应收为负时 0.00（R-06-044、R-06-077）" }
      - { key: "payable", label: "应付金额", type: "decimal", required: true, precision: 2, currency: "结算币种", rule: "可改、≥ 0、不设上限（R-06-044）" }
      - { key: "payer", label: "付款主体", type: "string", required: true, rule: "R-06-045" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "应付 ≠ 默认时必填；同时为发起备注（R-06-046）" }
      - { key: "line_receivables", label: "各账户行本次应收", type: "list", required: true, rule: "= 账户行可结算应收 − 余额抵扣（R-06-051）；09 手续费分摊权重、10 取数" }
      - { key: "approved_at", label: "审批通过时间", type: "datetime", required: false, tz: "UTC0", precision: "秒", generated: true, rule: "审批通过时记；0 元结算单的账单结算时间取它（R-06-051 ③）" }
      - { key: "accounts", label: "涉及账户", type: "list", required: true, rule: "本账单第二层全部账户，传给审批引擎解析「绑定的运营」（D-00-76）" }
      - { key: "bill_snapshot", label: "账单快照", type: "list", required: true, rule: "提交时账单第一、二层全部金额（R-06-049）" }

flows:
  - entity: 账单
    states: [未出账, 待结算, 待支付, 已结算]
    initial: 未出账
    transitions:
      - { from: "无", action: "该客户本月第一天有任一账户消耗数据", actor: 系统, to: 未出账, guard: "R-06-001" }
      - { from: 未出账, action: "次月 2 日（UTC0）出账", actor: 系统, to: 待结算, guard: "R-06-001；全月没有任何账户数据不出账、不展示" }
      - { from: 未出账, action: "次月 2 日出账，流转计费模式为预付款且本账单消耗全部被分桶覆盖", actor: 系统, to: 已结算, guard: "R-06-021（D-00-11）" }
      - { from: 待结算, action: "预付款：本账单消耗全部被分桶覆盖（逐张判断）", actor: 系统, to: 已结算, guard: "R-06-022（D-00-11）" }
      - { from: 待结算, action: "预付款且欠费已转入：承接的后付账单变已结算", actor: 系统, to: 已结算, guard: "R-06-074（D-00-73）" }
      - { from: 待结算, action: "后付款：结算单审批通过且应付 > 0（生成收款单）", actor: 系统, to: 待支付, guard: "R-06-051（D-00-59）" }
      - { from: 待结算, action: "后付款：结算单审批通过且应付 = 0.00（不生成收款单）", actor: 系统, to: 已结算, guard: "R-06-051（D-00-80）" }
      - { from: 待支付, action: "09 收款单确认收款（已完成）", actor: 系统, to: 已结算, guard: "R-06-053（D-00-59、D-00-32）" }
    reverse:
      - { action: "结算单驳回 / 撤回 / 作废", actor: "审批人 / 申请人 / 「审批配置」持有人", allowed_from: [待结算], note: "账单留在待结算、解除锁定、释放余额抵扣分桶、不生成结转额，按最新数据刷新，可重新生成（R-06-052，D-00-61、D-00-79）" }
      - { action: "收款单作废 / 退回", actor: "—", allowed_from: [待支付], note: "本期不做（D-00-69，Q-06-05 已关闭）：收款单不作废、不退回，账单不回退；客户一直不付时账单一直待支付、不能重新生成结算单（R-09-075、R-06-053）" }

