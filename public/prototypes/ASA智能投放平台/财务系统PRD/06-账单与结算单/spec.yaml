nonfunctional:
  security:
    - "生成结算单、撤回、作废在服务端按 R-06-040、R-06-048、D-00-79 复核，前端隐藏按钮不算权限控制"
    - "账单列表、费用明细 tab、审批详情查看按账户查看权限在服务端过滤（R-06-031、R-06-073）；搜索账户名称 / orgId 只在可见账户里匹配（R-06-026）"
  audit:
    - "结算单快照只追加不改；账单的每次锁定、解锁、状态变化、欠费冻结转入、结转挂载都能追溯到审批单或收款单"
  consistency:
    - "后付账单的规则判定与落档调用 03（T-03-002），预付账单的分桶扣减、余额抵扣的分桶锁定 / 扣减调用 05（T-05-001），不另写"

acceptance:
  # 公共前置见文件头
  - { id: G-06-001, module: 金额口径, given: "公共前置", when: "2026-10-02 出账后在账单管理展开橙子 2026-09 账单", then: "C 行：消耗 20,000.00、服务费 1,000.00、税费 1,200.00、服务费税费 60.00、客户返点 300.00、应收 21,960.00 USD，返点时间范围「2026-09-01 至 2026-09-30」；D 行：消耗 12,000.00、服务费 360.00（按月落第 2 档 3.00%）、税费 720.00、服务费税费 0.00、客户返点「-」、应收 13,080.00 USD；第一层总计 35,040.00 USD，状态待结算" }
  - { id: G-06-002, module: 渠道统计金额, given: "公共前置", when: "同上查看渠道统计金额与消耗差额，并展开 C、D 的第三层", then: "C 行渠道统计金额 20,000.00（PR-0901 + PR-0902）、消耗差额 0.00；D 行 12,000.00（PR-0902 + PR-0903）、0.00；第一层渠道统计金额 24,000.00（PR-0902 只算一次）、消耗差额 8,000.00；第三层首列为订单号，C、D 下都列出 PR-0902，C 下标注「与 橙子-iOS-HK 共享，各账户全额列示，第一层只算一次」、D 下标注「与 橙子-iOS-CN 共享，各账户全额列示，第一层只算一次」；苹果ASA 为 USD 体系，订单税费显示「-」、小计 = 总计；总计不受影响仍为 35,040.00" }
  - { id: G-06-003, module: 渠道统计金额, given: "三方渠道客户「蓝鲸游戏」账户 E、F 2026-09 消耗 5,000.00、3,000.00 USD，08 尚未入账", when: "查看账单；之后 08 上传审批通过 E 4,950.00、F 3,000.00", then: "上传前 E、F 与第一层渠道统计金额、消耗差额都显示「-」，账户行没有展开箭头；上传后 E 4,950.00 / 差额 50.00，F 3,000.00 / 0.00，第一层 7,950.00 / 50.00；若此时账单已待支付，这两列照样更新，其他金额不变" }
