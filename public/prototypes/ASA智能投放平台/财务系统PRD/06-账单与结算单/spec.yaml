rules:
  - { id: R-06-001, module: 账单与出账, text: "账单按「客户 × UTC0 自然月」一张，结算期展示「yyyy-mm-01 至 yyyy-mm-最后一天」。当月从该客户第一天有任一账户消耗数据起就有一张「未出账」账单，金额随消耗实时变化；次月 2 日（UTC0）系统自动出账，账单变「待结算」，出账时刻由技术定；全月没有任何账户消耗数据的客户不生成账单（账单管理.html:3931 §2.4.1，D-06-13）。只出结算期 ≥ 上线月的账单，上线月与 07 计提、08、10、11 共用一个配置（index S-18；S-16 定为只从上线月起），上线月之前的结算期不出账单（D-06-36）。已知限制：客户全月零消耗、只有苹果订单或 08 入账时同样不生成账单，渠道金额在 08 / 10 查看（§2.1.5、index §2.9，D-06-45）" }
  - { id: R-06-002, module: 账单与出账, text: "第二层每个账户一行；同时满足以下条件的账户不展示：消耗、服务费、税费、服务费税费、客户返点、上期预付欠费都为 0，渠道统计金额为 0 或「-」，且没有订单行（D-06-33）；客户返点不为 0 的账户照常展示，应收为负也展示（R-06-011）；05 费用明细 tab、结算单弹窗明细、审批快照用同一口径" }
  - { id: R-06-003, module: 账单与出账, text: "账单币种 = 该客户账户的消耗币种（同一客户下所有账户相同，D-05-11）；账单里所有金额都用账单币种，千分位、2 位小数、后缀币种代码，格式同 R-05-033；前端只展示服务端返回的 2 位金额，不做二次舍入（D-00-13）；结算币种换算只发生在结算单（R-06-043）" }
  - { id: R-06-004, module: 账单与出账, text: "一个结算期只有一种计费模式：该结算期的计费模式 = 该结算期第一天（UTC0）客户生效的计费模式；04 的计费模式变更从确定时刻的次月 1 日（UTC0）起生效（预付改后付以审批通过时刻、后付改预付以保存时刻为准，D-00-73、R-04-023、R-04-024），结算期中途不切换（R-04-066），账单内不再按天区分预付日子、后付日子（D-06-12、D-06-24）" }
  - { id: R-06-005, module: 金额口径, text: "消耗金额 = 该账户本结算期内每个 UTC0 自然日的消耗之和，消耗数据来源沿用现有；历史消耗被修正时按 R-06-019 / R-06-020 决定账单变不变" }
  - { id: R-06-006, module: 金额口径, text: "账户行三项费用：流转计费模式为预付款的账单按 R-06-007 算，后付款的按 R-06-008 算；第一层各金额 = 本账单全部账户行（含当前用户看不到的）之和，渠道统计金额例外（R-06-016）；舍入点按 D-06-19（D-00-13）：中间值可以存更高精度，但不能拿高精度值直接加总代替舍入点" }
  - { id: R-06-007, module: 金额口径, text: "预付款账单：按 05 的先进先出（R-05-006），本结算期消耗从哪些分桶扣、各扣了多少 P，就用该分桶的费率快照（R-05-005）算：服务费 = P × 服务费率，税费 = P × 税率，服务费税费 = P × 服务费率 × 税率（快照为客户承担时；公司承担为 0）；锁定中的分桶（审批中的退款、余额分配、余额抵扣占住的，R-05-007）不参与覆盖；返点余额等 0 费率分桶覆盖的消耗服务费、税费按 0，覆盖欠费时同样按 0（D-05-21）；超出全部可用分桶的欠费消耗（R-05-009）先按该日 03 规则用 R-06-008 的算法暂算（阶梯落档时用该段全部消耗落档取比例，按日统计时用当天全部消耗，比例只乘欠费部分；欠费部分的各项各自四舍五入到 2 位，D-06-39），之后有新分桶按先进先出覆盖它时，改按新分桶的快照重算（账单待结算、未锁定、欠费未转入后付账单时生效，R-06-019，D-06-03、D-06-20）；每个分桶的扣减段各自四舍五入到 2 位再相加（D-06-19）" }
  - { id: R-06-008, module: 金额口径, text: "后付款账单：逐日取 03 的适用规则（R-03-003；已出账月份重算时以该月出账时刻为 t，R-06-019）与服务费时间区间行（R-03-005、R-03-006；消耗首日首次确定后冻结，早于首日的日子落第 1 行，D-00-56）；把适用条款相同（服务费规则与税率完全相同，D-00-55）且落在同一行时间区间里的连续日子归成一段：固定比例 → 服务费 = 段内消耗 × 比例；阶梯 + 按月统计 → 段内消耗加总后按 R-03-009 落档 × 档位比例（落档用未舍入的原始消耗合计，D-00-13）；阶梯 + 按日统计 → 每天单独落档 × 比例（R-03-010）；税费 = 消耗 × 该段税率；服务费税费 = 服务费 × 税率（客户承担，R-03-028），公司承担为 0；按段（按日统计时按天）各项四舍五入到 2 位后相加（D-06-19）" }
  - { id: R-06-009, module: 金额口径, text: "没有适用规则的日子（账户没有任何规则配置，或早于第一条规则起始日期）服务费率、税率按 0：服务费、税费、服务费税费为 0，照常出账、照常结算，不标异常、页面不加提示（D-00-57、D-06-08）；按 0 计的日期范围记在账户行的「无适用规则的日子」里供技术排查与 S-1 导入核对，页面不展示" }
  - { id: R-06-010, module: 金额口径, text: "客户返点（后付款账单）= 以下两项之和，按账户加到对应账户行：①07 里「纳入扣减月份」选了本结算期、审批已通过、合计 > 0 的客户返点（R-07-036、R-07-037）；②挂到本账单的结转额（R-06-078）；两项在账户行上分开记录（结转额不是本月新增的返点成本，10 不重复计），账户行应收因此可为负（D-07-16）。「返点时间范围」= ①所属的消耗日期段每段一行「yyyy-mm-dd 至 yyyy-mm-dd」，②每笔一行「yyyy-mm 结转」（yyyy-mm 为来源账单结算期）；都没有显示「-」。预付款的返点在 07 审批通过时直接充进余额（D-00-19），流转计费模式为预付款的账单「客户返点」「返点时间范围」都显示「-」（D-06-11、D-00-18）" }
  - { id: R-06-011, module: 金额口径, text: "账户行 应收金额 = 消耗金额 + 服务费 + 税费 + 服务费税费 − 客户返点；第一层「总计」= 各账户行应收金额之和（不去重，D-06-02）；账户行应收、总计、可结算应收都可能为负（返点按账户加，D-07-16；审批期间账单变小，D-00-67），生成结算单时可结算应收为负的按 R-06-077 结转" }
  - { id: R-06-012, module: 金额口径, text: "账单走哪条流转按「流转计费模式」= 该结算期的计费模式（R-06-004，已出账、未出账一样）：预付款走 R-06-021，后付款走结算单（R-06-040 起）（D-06-12）" }
  - { id: R-06-013, module: 金额口径, text: "可结算应收：账户行可结算应收 = 该账户行应收金额 + 该账户挂到本账单的上期预付欠费（R-06-074）；账单可结算应收 = 各账户行可结算应收之和，没有上期预付欠费时 = 总计。结算单的「预估应收金额」、07 纳入扣减月份的比较（R-06-024）都取账单可结算应收" }
  - { id: R-06-074, module: 金额口径, text: "上期预付欠费：客户预付款改后付款生效后（D-00-73），流转计费模式为预付款、仍未结清的账单，把欠费冻结并入该客户第一张后付款账单：①冻结时点：生效时已出账且待结算的，在生效时刻冻结；生效时还没出账的（切换前最后一个预付月份），按 R-06-021 出账时判一次，没结清就在出账时冻结；生效后到该月出账判结清或冻结之前，分桶照常按先进先出覆盖该月消耗，包括期间补报的消耗、释放的锁定分桶、新到账的充值；欠费冻结之后的消耗、生效月起的消耗不再被分桶覆盖（D-06-37）；②冻结金额按账户算 = 该账户未被分桶覆盖的消耗 + 这部分按 R-06-007 暂算的服务费、税费、服务费税费（落档与舍入按 R-06-007），冻结后不再随分桶覆盖、消耗修正变化；已冻结转入后付账单、或已结算冻结的切换前月份，之后的消耗修正不再进入余额，也不再参与分桶覆盖，不改账单，线下处理（index §2.9，D-06-38）；③承接账单 = 该客户生效月的账单（该月没有账单时顺延到之后第一张后付款账单），在承接账单生成时挂上（冻结时承接账单已生成的即刻挂上）：对应账户行加一项「上期预付欠费（yyyy-mm）」= 冻结金额，每个来源结算期一行，计入账户行可结算应收（R-06-013），不计入总计，账户行当月没有消耗也照常展示；④原预付账单保持「待结算」、金额冻结；挂上前状态副标显示「欠费待转入下一张后付账单」，挂上后改为「欠费已转入 yyyy-mm 账单」，冻结期间不按 R-06-022 判结清；承接账单变「已结算」时（R-06-051 ③、R-06-053）一起变「已结算」并记结算时间（D-06-27）；挂上前客户又改回预付款（改回预付生效时承接账单仍未生成）的，解除冻结，欠费退回余额，原账单重新按 R-06-022 判结清（D-06-38）" }
  - { id: R-06-014, module: 渠道统计金额, text: "渠道统计金额与消耗差额只是内部对账用，不影响任何应收（D-06-05）；数据来源：自接苹果的账户系统（系统从苹果同步订单、按订单号结算的账户系统，由账户系统配置决定，D-06-31）取第三层订单数据，其他上游渠道取 08 按「账户 × 结算期」提供的上传来源渠道统计金额（R-08-018 的总计，R-08-090；D-00-24、D-00-26）；还没有数据时显示「-」，数据到了自动更新（§2.4 注）" }
  - { id: R-06-015, module: 渠道统计金额, text: "自接苹果：LOC 订单按「账单月份」落到 UTC0 自然月，没有账单月份的 CC 订单按交易日落月；订单币种与账户消耗币种不同时，LOC 订单按截止日期当天、CC 订单按交易日当天的日汇率（D-00-74）折成账户币种后计入；截止日期晚于今天时先按最近一天的日汇率暂折，截止日当天汇率入库后重折一次，之后不再变（同 08 R-08-017，D-06-46）；账户行渠道统计金额 = 该账户下本结算期订单行「总计」（折算后）之和；同一订单号挂在多个账户下时，每个账户下都展示一次、各自计入本账户行（D-06-04）；共享订单在订单号旁标注：同一张账单内共享写「与 {账户名称} 共享，各账户全额列示，第一层只算一次」，与其他客户的账户共享写「与其他客户账户 {账户名称} 共享，本账单全额计入」（D-06-31）" }
  - { id: R-06-016, module: 渠道统计金额, text: "第一层渠道统计金额只来自本账单列出的账户行（含当前用户看不到的，按 R-06-002 的展示条件）：自接苹果 = 这些账户下全部订单行按订单号去重后的「总计」之和，因此可能小于账户行之和；其他上游渠道（没有订单号）= 各账户行直接相加；去重范围只在同一张账单内（同客户、同结算期），不跨客户、不跨结算期（D-06-04）" }
  - { id: R-06-017, module: 渠道统计金额, text: "消耗差额 = 本层消耗金额 − 本层渠道统计金额（账户行用账户行的，第一层用第一层去重后的）；渠道统计金额为「-」时消耗差额也为「-」（D-06-05）；表头说明见 R-06-027" }
  - { id: R-06-018, module: 渠道统计金额, text: "渠道统计金额、消耗差额不受锁定：任何状态下都随订单数据或 08 数据更新（D-06-17）" }
  - { id: R-06-019, module: 刷新与锁定, text: "未锁定的账单随最新数据刷新：未出账；以及待结算且没有审批中结算单的账单。触发刷新的变化：消耗修正、07 返点纳入本月扣减审批通过、预付分桶覆盖关系变化（R-06-007）、结转额挂上（R-06-078）、上期预付欠费并入（R-06-074）；已出账月份重算时以该月出账时刻为 t 取适用规则（R-03-003、D-03-24），出账后才通过的规则不回改该月；刷新只重算金额，不改变状态（D-06-06）" }
  - { id: R-06-020, module: 刷新与锁定, text: "结算单提交成功时，账单第一、二层金额（渠道两列除外）锁定为结算单快照（R-06-049），页面展示快照值，第一层总计旁标「已锁定」，悬浮「金额为结算单提交时的快照」；驳回 / 撤回 / 作废时解除锁定、按最新数据刷新；审批通过后一直锁定（待支付、已结算）。预付款账单变已结算时按当时的金额冻结。锁定或冻结后的消耗修正不回改账单，也不补差（D-06-06、D-06-18）；已知限制（收进 index §2.9）：预付账单已结算冻结后再有消耗修正，只改 05 的余额、不改账单，两边金额可能不一致；预付改后付的切换前月份按 R-06-074 ② 处理（消耗修正不进余额、线下处理）" }
  - { id: R-06-021, module: 刷新与锁定, text: "预付款账单出账时判一次结清：出账时有挂起的结转额要入桶的（R-06-078），先入桶，再判结清、决定是否发欠费通知（D-06-41）；该结算期内全部消耗都已被分桶按先进先出覆盖（锁定中的分桶不参与覆盖，R-06-007）→ 直接变「已结算」；否则保持「待结算」、按 R-06-075 显示欠费副标，并给客户的销售发一次欠费通知（D-00-11、D-06-22）；只看本张账单，与其他月份、其他账户的余额无关" }
  - { id: R-06-022, module: 刷新与锁定, text: "预付款「待结算」账单（欠费未转入后付账单的）在之后每次分桶覆盖关系变化（充值到账、余额分配、返点余额抵扣、锁定释放、消耗修正）以及每个 UTC0 自然日再判一次，满足 R-06-021 的结清条件即变「已结算」并冻结；逐张判断，早月份先结清不用等晚月份（D-00-11、D-06-07）" }
  - { id: R-06-023, module: 刷新与锁定, text: "预付款账单不显示「生成结算单」，任何状态都不能生成结算单（D-06-07）" }
  - { id: R-06-024, module: 刷新与锁定, text: "可被 07 选为「纳入扣减月份」的账单（R-07-036）：流转计费模式为后付款、状态待结算、没有审批中的结算单、没有被其他审批中且合计 > 0 的客户返点单选为扣减月份（同一张账单同一时间最多 1 张，D-00-18）；未出账月份不可选；本次返点 ≤ 该账单当前可结算应收（D-00-18），只校验整单合计，账户行应收因此为负也允许（D-07-16）；选项与可结算应收由服务端下发；只在 07 提交时校验，最后一个审批人通过时不再复核、照常生效（D-00-67），之后生成结算单时可结算应收为负的按 R-06-077 结转；通过后返点按账户加到对应账户行（R-07-037、R-06-010）" }
  - { id: R-06-075, module: 刷新与锁定, text: "预付款待结算账单的状态副标：有未被分桶覆盖的消耗时显示「欠费 x {账单币种}，待充值」，x = 未被分桶覆盖的消耗 + 其按 R-06-007 暂算的服务费、税费、服务费税费之和（落档与舍入按 R-06-007），随覆盖关系变化；欠费已冻结、承接账单还没挂上的显示「欠费待转入下一张后付账单」，已转入后付账单的显示「欠费已转入 yyyy-mm 账单」（R-06-074）（D-00-11）" }
  - { id: R-06-025, module: 账单信息, text: "页面标题「账单管理」，两个切换「账单信息 / 已提交审批」，默认账单信息（原型标题「账单中心」统一为「账单管理」，D-06-16）；菜单与页面按「账单管理（查看）」权限点显示：没有该点不显示菜单，直接访问按 R-13-005 在内容区显示「无权限访问」、保留当前地址；「生成结算单」权限点依赖该查看点，服务端同样校验（D-13-01）；有该点的用户看到哪些账单仍按 R-06-031 过滤（D-00-78、D-06-15）" }
  - { id: R-06-026, module: 账单信息, text: "搜索框按公司名称、客户别名、账户名称、orgId 包含匹配，占位「搜索公司名称 / 客户别名 / 账户名称 / orgId」；账户名称和 orgId 只在当前用户有查看权限的账户里匹配，由服务端过滤；命中账户时展示该账单，第二层照常列全部可见账户，不是只列命中的那个（D-06-14）；筛选：所属账户系统（全部 + 现有账户系统列表，原型里的登记表状态选项是复制残留）、结算期（全部 + 有账单的结算期，降序，由服务端返回；「全部」就是全部历史，不加隐含时间窗）、状态（全部 / 未出账 / 待结算 / 待支付 / 已结算），默认全部（D-06-13）" }
  - { id: R-06-027, module: 账单信息, text: "第一层每张账单一行，列依次：结算期、公司名称（左固定）‖ 所属账户系统、计费模式、客户别名、销售、消耗金额、服务费、税费、服务费税费、客户返点、渠道统计金额、消耗差额、总计、状态 ‖ 操作（右固定）；计费模式列显示该结算期的计费模式（= 流转计费模式，已出账、未出账一样，R-06-012）；所属账户系统、客户别名、销售取客户当前值；「消耗差额」表头带问号，悬浮「= 消耗金额 − 渠道统计金额。渠道统计金额取渠道总计（含税，上传类已扣渠道返点），仅内部对账，差额不为 0 不一定是数据有误」；状态列：「未出账」旁悬浮「金额为实时预估，随消耗数据更新，数据截至 yyyy-mm-dd hh:mm（UTC0）」（截至时间取消耗数据最近一次同步的时间，技术取不到时去掉后半句）；待结算且有审批中结算单时副标「结算单审批中」，点击新页打开审批详情；待支付时副标「收款单待完成」（纯文本）；预付款待结算的副标按 R-06-075；有待结转金额时「客户返点」旁显示「待结转 {金额}」（R-06-078）；锁定时总计旁「已锁定」（R-06-020）；公司名称过长省略、悬浮显示全称（D-06-32）" }
  - { id: R-06-028, module: 账单信息, text: "点第一层行（含未出账）展开第二层账户行，按消耗金额降序、相同按账户名称升序（D-06-33）；列依次：账户名称、消耗金额、服务费、税费、服务费税费、渠道统计金额、消耗差额（表头问号同 R-06-027）、客户返点、上期预付欠费（本账单有时才出这一列，R-06-074）、应收金额、返点时间范围；预付款账单中有 0 费率分桶覆盖消耗的账户行，服务费格悬浮「其中 {x} 消耗由返点余额抵扣，按 0 费率计」（D-05-21、D-06-34）；点有订单的账户行展开第三层订单行，列依次：订单号、付款参考编号、账单、账单类型、产品或广告主、描述、发票、截止日期、小计、税费、总计（沿用现有）；税费：账户系统有税费字段的（人民币体系）照实展示，没有税费字段的（USD 体系，老数据为空）显示「-」、总计 = 小计，不用「总计 − 小计」反推；订单币种与账户币种不同时总计旁显示折算值（R-06-015，D-06-31）；没有订单数据的账户（三方渠道）不显示展开箭头（§2.4.3）" }
  - { id: R-06-029, module: 账单信息, text: "排序：结算期降序，同一结算期按总计降序；分页按第一层 10 / 50 / 100 / 300 条每页，默认 10；没有数据显示「暂无账单」（§2.5，D-06-14）" }
  - { id: R-06-030, module: 账单信息, text: "第一层操作列只有「生成结算单」，按 R-06-040 隐藏或置灰；原型的「导出」按钮（顶部与行内）和勾选框本期不做（D-06-10、D-06-16）" }
  - { id: R-06-031, module: 账单信息, text: "数据权限跟账户查看权限走：用户对账单里任一账户有查看权限才展示该账单；第二层只列他有权限的账户；第一层金额始终是整张账单的（结算按整张出，D-00-61），有看不到的账户时在第二层末尾显示「另有 N 个账户无查看权限」，N 只数按 R-06-002 会展示的账户（D-06-15）" }
  - { id: R-06-032, module: 账单信息, text: "05 费用明细页的「费用明细」tab（R-05-093）= 本页账单信息按单个客户展示：没有搜索和公司名称、所属账户系统、客户别名、销售列，结算期筛选与状态筛选保留，三层、列口径、副标、权限与本页相同；只读，不显示「生成结算单」；该 tab 的页面准入按 05（D-06-25）" }
  - { id: R-06-040, module: 生成结算单, text: "「生成结算单」按钮：没有「账单管理（查看）」或「生成结算单」权限点（D-13-01）、流转计费模式为预付款、或状态不是待结算时不显示；其余情况显示，下列任一条件成立时置灰并悬浮显示原因，同时有多条时只显示优先级最高的一条：①「该账单已有审批中的结算单 {审批单号}」；②「有审批中的返点抵扣单 {审批单号}，审批结束后可生成」（07 选了本结算期扣减、合计 > 0、仍在审批中的客户返点单，D-06-23、R-07-053）；③「另有 N 个账户无查看权限，不能生成」（D-06-15）；单号可点，新页打开审批详情（D-06-32）" }
  - { id: R-06-041, module: 生成结算单, text: "生成结算单弹窗：标题「生成结算单」，右上角 ✕ 关闭，底部只有「提交审批」；只读信息 公司名称、结算期、预估应收金额（= 账单可结算应收，R-06-013）、消耗金额、税费、服务费、服务费税费、返点抵扣（= 账单客户返点合计，R-06-010）、上期预付欠费（有时）、余额抵扣（有时，R-06-076）（账单币种；两种抵扣行名称固定为「返点抵扣」「余额抵扣」）；可结算应收为负时显示结转提示（R-06-077）；下方带本账单第一、二层只读明细（同 R-06-027、R-06-028，有余额抵扣时账户行多一列「余额抵扣」，不带勾选框）" }
  - { id: R-06-042, module: 生成结算单, text: "结算币种（原型字段名「结算货币」，统一叫结算币种，D-00-68）：必选，下拉单选 人民币 / USD / USDT，默认客户的币种，客户币种为空时没有默认值（R-04-011）；原型占位里的「美元」不做（D-00-08）" } # alias-ok
  - { id: R-06-043, module: 生成结算单, text: "结算币种与账单币种相同时汇率为 1、不显示汇率；不同时显示「汇率：1 {账单币种} = x {结算币种}（yyyy-mm-dd）」，x = 当天（UTC0）日汇率四舍五入到 4 位，显示与计算都用这 4 位；日期 = 实际取到的那天（当天没有、向前取最近一天时显示那一天）（D-00-74、D-00-62）；提交时服务端按提交当天重新取并锁定，与弹窗不同时按 R-06-048 ② 请用户确认；汇率与汇率日期随单进快照；取不到任何汇率时不能提交，提示「未取到 {账单币种}→{结算币种} 汇率，请稍后再试」" }
  - { id: R-06-044, module: 生成结算单, text: "应付金额（结算币种）：必填，默认 = （预估应收金额 − 余额抵扣）× 汇率，四舍五入到 2 位；可以改，不设上限；输入按 D-00-82：输入框只接受数字和一个小数点：负号、字母输不进去，小数第 3 位按不下去；粘贴或自动填充的非法内容不写入、保留原值，并就地标红「请输入不小于 0、最多 2 位小数的金额」；任何情况下都不静默四舍五入或截断；输入框下显示「默认 {默认应付} {结算币种}」，应付 ≠ 默认时再显示「已调整 {应付 − 默认}」（带正负号）；切换结算币种时按新汇率重新带出默认值、覆盖已改的值（D-06-09、D-06-21）；预估应收金额为负时按 R-06-077 固定 0.00、只读" }
  - { id: R-06-045, module: 生成结算单, text: "付款主体：必选，下拉单选，选项 = 该客户当前生效的付款主体；「+ 新增付款主体」、客户没有付款主体、有审批中的付款主体变更、新增提交后的提示与「需审批通过后可选」灰字，做法全部同 05 R-05-042（调起 04 付款主体弹窗、走付款主体变更审批、通过前不在选项里、仅「客户管理-读写」可见）（D-06-21）" }
  - { id: R-06-046, module: 生成结算单, text: "备注：多行，长度上限沿用现有备注输入框；应付金额 ≠ 默认应付时必填，未填提示「修改了应付金额，请在备注中说明原因」，其余情况选填；即审批发起备注，同时在审批内容区展示（同 D-05-31 做法，D-06-09）" }
  - { id: R-06-047, module: 生成结算单, text: "点「提交审批」校验结算币种、应付金额、付款主体、备注（R-06-046），不通过在对应位置提示；通过后二次确认，标题「提示」（同 R-05-078），文案「生成结算单需进行审批，是否提交审批单？」（取消 / 确定）" }
  - { id: R-06-048, module: 生成结算单, text: "确定后服务端复核：「账单管理（查看）」与「生成结算单」权限点、R-06-040 的全部条件、所选付款主体仍在客户当前生效的付款主体里、汇率、账单金额与余额抵扣与弹窗展示一致。①账单或余额抵扣在弹窗打开期间变了：不建单、弹窗不关，按最新数据就地重载：保留结算币种、付款主体、备注；值没变的行原样保留，值变了的行标黄「系统计算值已由 X 变为 Y」；应付金额用户没改过的跟随新默认值，改过的保留用户填的值；顶部提示「数据已更新，请核对后重新提交」，用户再点一次提交才建单；②提交当天汇率与弹窗不同：不建单，返回新汇率，弹确认「汇率已更新为 1 {账单币种} = x {结算币种}（yyyy-mm-dd），换算后金额 {Y}，是否按新汇率提交？」，Y = 按新汇率算的默认应付；用户改过应付的保留其值，确认框里同时列出新的默认值；点确定后按新汇率建单（D-06-30）；③付款主体已不在选项里：提示「付款主体已变更，请重新选择」；④已有在途结算单（句式按 R-12-047）：审批中的用提示框（「知道了」）「该账单已有审批中的生成结算单（审批单号 {单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，已通过、收款单未完成的「该账单已有处理中的结算单（收款单 {财务ID}，待完成），待收款完成后再操作」；单号可点、新页打开审批详情，无查看权限按 R-12-043；⑤R-06-040 ②③ 任一在复核时成立（弹窗打开期间出现审批中的返点抵扣单、可见账户变化）：不建单，提示框显示对应的置灰原因原文，单号可点（D-06-44）；同一弹窗连续点击只提交一次，请求中按钮显示加载" }
  - { id: R-06-049, module: 生成结算单, text: "复核通过后提交「账单管理—生成结算单」审批（R-12-001、R-12-014）：操作对象客户 = 本客户；涉及账户 = 本账单第二层全部账户（D-00-76）；业务单据 = 弹窗全部内容 + 汇率与汇率日期 + 默认应付金额 + 余额抵扣明细（每个账户取用的分桶与金额，R-06-076）+ 结转额（有时，R-06-077）+ 账单第一、二层全部金额快照（含当前用户看不到的账户行）；发起备注 = 备注。成功后按 12 R-12-018 给弱提示（审批中「已提交审批」；免审直接通过「提交成功，无需审批，已生效」）、关闭弹窗、账单按 R-06-020 锁定、余额抵扣的分桶锁定（R-06-076）" }
  - { id: R-06-076, module: 生成结算单, text: "余额抵扣（后付）：生成结算单时客户当前生效的计费模式为后付款、且账单可结算应收 > 0 时，系统按账户自动带出「余额抵扣」，只读：每个账户 = min(该账户行可结算应收（< 0 按 0）, 该账户未锁定分桶按退款口径 R-05-027 折算的应退金额)；按先进先出取分桶，分桶余额与应退金额之间的换算同 R-05-027；余额抵扣金额以剩余应收为准，最后一个分桶只取够抵的部分，取用本金与尾差按 R-05-118 ①（本金 = round2(所需金额 ÷ 倍率)，不超过该桶剩余；尾差计入服务费，同 R-05-022，D-06-46）；余额抵扣之和不超过账单可结算应收，超出时从余额抵扣最大的账户行减回（相同按账户名称升序取第一个）（D-06-35）；返点抵扣（= 客户返点，R-06-010）先扣，余额抵扣在其后；提交成功时锁定所取分桶（同退款，R-05-007），驳回、撤回、作废时释放；审批通过时扣减这些分桶，并按 05 写一条「余额抵扣账单」交易明细（取值以 R-05-095、R-05-097 为准：充值金额 = −扣减的分桶金额之和，应付、实收、手续费显示「-」，关联账单 = 被抵扣的本账单）；余额抵扣算客户已付款（计入到款），与返点抵扣（不计到款）分开记录；抵不完的余额留在分桶里供下一张后付账单；客户改回预付后剩余分桶恢复先进先出（D-00-73、D-06-27）" }
  - { id: R-06-077, module: 生成结算单, text: "可结算应收为负：生成结算单时账单可结算应收 < 0 → 应付金额固定 0.00、只读，不做余额抵扣，不要求备注；结转额 = −可结算应收（账单币种）；弹窗与审批内容区显示「本次抵扣 {返点抵扣 − 结转额}，剩余 {结转额} 结转至下期」；结转额在审批通过时生成（R-06-078），驳回、撤回、作废不生成；只有这一种情况能产生结转，人工把正数应付改成 0 不产生结转（D-00-81、D-06-28）" }
  - { id: R-06-079, module: 生成结算单, text: "待结算返点提示：打开生成结算单弹窗时，该客户在 07 还有状态为「待结算」的客户返点计提项的，顶部黄条提示「该客户还有待结算的客户返点 {合计} {币种}（{结算期，多个用「、」分隔}），生成结算单后不能再抵扣本账单，可在返点管理里抵扣其他账单或现金打款」，合计取 07 计提项金额（R-07-011）；只提示、不拦提交（D-06-34）" }
  - { id: R-06-050, module: 审批结果, text: "审批流 0 节点或全部节点被跳过时提交即通过（R-12-018），立即按 R-06-051 处理" }
  - { id: R-06-051, module: 审批结果, text: "审批单变为已通过（R-12-025）时：①余额抵扣 > 0 的按 R-06-076 扣减分桶；有结转额的按 R-06-078 处理；②应付金额 > 0：生成一张 09 收款单（交易类型 结算单支付，应收 = 应付金额，币种 = 结算币种，付款主体，关联本结算单与账单；另带账单第二层每个账户行及其本次应收 = 账户行可结算应收 − 余额抵扣，即扣完返点抵扣、余额抵扣、含上期预付欠费后的剩余应收（账单币种，作为 09 手续费分摊权重，R-09-002；本次应收 ≤ 0 的账户行分摊权重按 0，本次应收照原值记录，D-06-42））；按 R-05-094 写一条「结算单支付」交易明细（待完成）：发起时间 = 申请时间，充值金额显示「-」（余额不变），应付金额 = 应付金额（结算币种），账户列表每个账户一行「{账户名称} {本次应收} {账单币种}」，关联审批单号、关联账单 = 本结算期，备注 = 备注；账单变「待支付」（D-00-59）；③应付金额 = 0.00（返点抵满、结转、余额抵扣抵满、人工改为 0）：不生成收款单、不写「结算单支付」交易明细，账单直接变「已结算」，结算时间 = 审批通过时间（D-00-80、D-06-29）；每张结算单都记审批通过时间，与默认应付（= 改前应收，已扣返点抵扣、余额抵扣）、应付、各账户行本次应收一起供 10 取数；④按 R-12-045 列明本包的最终通过执行失败情形：没有——通过时不复核账单金额、付款主体与分桶（分桶提交时已锁定），技术异常按 12 处理（D-00-79）" }
  - { id: R-06-052, module: 审批结果, text: "审批单变为已驳回、已撤回或被作废（作废效果同撤回，R-12-046、D-00-79）：账单留在「待结算」、解除锁定、释放余额抵扣锁定的分桶、不生成结转额、按最新数据刷新，「生成结算单」重新可用；原单不能修改重提（R-12-034）" }
  - { id: R-06-053, module: 审批结果, text: "09 收款单确认收款（已完成）时：账单变「已结算」并记结算时间（欠费转入本账单的预付账单一起变已结算，R-06-074）；对应交易明细由 05 按 R-05-095 变已完成；实收、手续费由 09 记录（D-00-32）。本期收款单不作废、不退回（D-00-69）；已知限制：客户一直不付时收款单一直待完成，账单一直「待支付」、不能重新生成结算单（R-09-075、D-00-61）" }
  - { id: R-06-078, module: 审批结果, text: "结转额挂载：审批通过时把结转额按原账单里可结算应收为负的账户行、按各行可结算应收负数大小占比拆到账户（D-06-40），四舍五入到 2 位，尾差给负数最大的那行；每个账户的结转额挂到该客户最早一张流转计费模式为后付款、待结算、未锁定的账单（不挂未出账账单），计入该账户行「客户返点」、返点时间范围加一行「yyyy-mm 结转」（R-06-010），目标账单按 R-06-019 刷新；当时没有这样的账单就挂起，原账单「客户返点」旁显示「待结转 {金额}」；挂起期间一旦出现符合条件的后付账单（新出账，或被驳回 / 撤回解锁）就挂上；挂起期间新出账的账单流转计费模式为预付款时，结转额在出账时按 0 费率充进该账户余额（05 入桶来源「账单结转」，R-05-004），先入桶再按 R-06-021 判结清、决定是否发欠费通知（D-06-41），由本页写一条「客户返点」交易明细（已完成，备注「yyyy-mm 账单结转」，各列取值按 R-05-095、R-05-097）；目标账单之后生成结算单时可结算应收又为负的，按 R-06-077 继续结转；已知限制：客户之后再没有账单时结转额一直挂起（D-00-81、D-06-28）" }
  - { id: R-06-060, module: 已提交审批, text: "已提交审批只展示当前登录账号提交的「生成结算单」审批单（含免审直接通过的单，R-12-018）；搜索框按审批单号、公司名称包含匹配；状态筛选 全部 / 审批中 / 已通过 / 已驳回 / 已撤回，默认全部" }
  - { id: R-06-061, module: 已提交审批, text: "列：审批单号、操作对象（生成结算单）、公司名称、结算期、申请人（已禁用时按 R-12-049 显示「姓名（已禁用）」）、申请时间（yyyy-mm-dd hh:mm:ss，Asia/Shanghai）、审批状态、执行状态、操作（D-06-26）；执行状态只有已通过的单有值：「收款单待完成」「已收款」（收款单状态按 09 R-09-073 按审批单号取）、「已结清（0 元）」，其余显示「-」（D-06-32）；审批中置顶，其余按申请时间降序；分页 10 / 50 / 100 / 300，默认 10；没有数据显示「暂无数据」" }
  - { id: R-06-062, module: 已提交审批, text: "行操作：所有状态都有「详情」，新页打开审批详情（12 统一的审批详情页，按审批单号打开）；只有审批中有「撤回」，只校验申请人本人与单据审批中、不校验「生成结算单」权限点（D-00-79）；撤回确认文案、后果与通知按 12（R-12-032～R-12-035），撤回后按 R-06-052 处理" }
  - { id: R-06-070, module: 审批内容, text: "审批详情标题「账单管理/审批详情」，审批信息区按 12（R-12-026），审批事项「账单管理」、审批类型「生成结算单」；内容区全部取业务单据快照（R-06-049）" }
  - { id: R-06-071, module: 审批内容, text: "内容区依次：公司名称（超链接，新页打开客户详情 R-04-050）、结算期、所属账户系统（客户当前的）、预估应收金额、消耗金额、税费、服务费、服务费税费、返点抵扣、上期预付欠费（有时）、余额抵扣（有时）（账单币种）、结转提示「本次抵扣 X，剩余 Y 结转至下期」（有时）、结算币种、汇率（币种不同时，「1 {账单币种} = x {结算币种}（yyyy-mm-dd）」）、默认应付金额、应付金额（结算币种；≠ 默认时旁边标红「已调整 {应付 − 默认}」，同 R-07-068 做法）、付款主体、备注（空显示「-」）；下面是账单第一、二层快照表（有时含上期预付欠费、余额抵扣列），第三层订单行取当前数据；审批通过后内容区底部显示执行结果「收款单：{财务ID} · {待完成 / 已完成}」，应付为 0 的显示「已结清（0 元，不生成收款单）」（D-06-32；展示位置随 12 统一审批详情页）" }
  - { id: R-06-072, module: 审批内容, text: "内容区展示单内全部账户行，不按查看者的账户权限隐藏（同 D-05-34 做法）；不启用 12 的变更高亮（R-12-030）" }
  - { id: R-06-073, module: 审批内容, text: "第②类只读查看（R-12-043、R-12-044）：对单内任一账户有查看权限、且持「账单管理（查看）」的人（D-06-43）；另外有「收付款中心」权限点的人也可只读查看（R-13-050、D-00-71）；申请人与快照里的审批人不受影响" }

notifications:
  - { event: "预付款账单出账时未结清（R-06-021）", to: ["客户的销售"], channel: "按 12（R-12-039）", template: "【欠费提醒】{公司名称} {结算期} 账单已出，有未被余额覆盖的消耗：{账户名称} 欠费 {x} {币种}（多个账户逐个列出）。请尽快安排充值。{链接}" }
