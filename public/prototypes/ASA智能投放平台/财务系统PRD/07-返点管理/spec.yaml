  - { id: G-07-054, module: 审批结果, given: "王敏把 C 9 月返点改成 35,000.00，余额抵扣到 2026-09（可结算应收 35,340.00）提交，审批流 1 个节点；之后 D 9-25 消耗修正 −1,000.00，账单可结算应收变 34,250.00", when: "审批人点「审批通过」", then: "不复核、不提示，审批单照常变已通过；C 9 月返点「已结算」，橙子 9 月账单 C 行客户返点 35,000.00、账户行应收 -12,740.00，账单可结算应收 -750.00；之后生成结算单按 G-06-027：应付 0.00、「本次抵扣 34,250.00，剩余 750.00 结转至下期」" }
  - { id: G-07-055, module: 审批结果, given: "「返点管理—客户返点」审批流未配置（0 节点）", when: "王敏提交 D 9 月返点 90.00 现金打款", then: "提交即已通过，弱提示「提交成功，无需审批，已生效」；立即生成付款单、交易明细，D 9 月返点直接「待打款」" }
  - { id: G-07-056, module: 提交与复核, given: "公共前置；王敏、赵磊（假设能看 C、D）同时打开橙子客户返点弹窗，各勾一行、都选余额抵扣、纳入扣减月份 2026-09", when: "王敏先提交成功，赵磊后提交；之后赵磊重新打开弹窗看纳入扣减月份", then: "只有王敏那张建单；赵磊看到「所选月份账单已不可扣减，请重新选择」；重新打开后选项「2026-09（已有审批中的扣减单 {王敏的单号}）」置灰不可选" }
  - { id: G-07-057, module: 提交与复核, given: "接 G-07-033（合计 400.00 USD、现金打款、人民币）；弹窗 2026-10-05 打开，2026-10-06 的日汇率为 7.1301", when: "2026-10-06 00:20（UTC0）提交并确定", then: "不建单，确认框「汇率已更新为 1 USD = 7.1301 人民币（2026-10-06），换算后金额 2,852.04，是否按新汇率提交？」；确定后建单，单内汇率 7.1301、汇率日期 2026-10-06、应付 2,852.04 人民币" }
  - { id: G-07-060, module: 已提交审批, given: "王敏提交了 2 张单（1 张审批中、1 张已通过），赵磊提交了 1 张；王敏提交后被收回了「返点结算」权限点", when: "王敏打开「已提交审批」，对审批中那张点「撤回」并确定", then: "只看到自己的 2 张，审批中那张置顶，已通过那张执行状态有值；王敏仍能撤回，撤回后该单变已撤回，所含计提项回到待结算，弹窗里重新可选" }
  - { id: G-07-070, module: 审批内容, given: "接 G-07-031 用现金打款人民币提交（C 300.00、D 改成 100.00）", when: "审批人打开审批详情", then: "标题「返点管理/审批详情」、审批类型 客户返点；内容区 计费模式 后付款、返点方式 现金打款、返点金额 400.00 USD、汇率「1 USD = 7.1234 人民币（2026-10-05）」、应付金额 2,849.36 人民币、收款主体；计提项表结算期行系统计算返点合计 390.00、返点金额合计 400.00；C 行返点金额 300.00 正常显示，D 行系统计算返点 90.00、返点金额 100.00 标红带「已调整」；D 行客户返点比例「2026-09-01 至 2026-09-30：阶梯（按月统计）」加两档、后带「（规则起始 2026-09-01）」" }
  - { id: G-07-071, module: 审批内容, given: "接 G-07-070；赵磊只能看 C，不是申请人也不是审批人", when: "赵磊打开该审批详情链接", then: "只读打开，C、D 两行都展示，不显示通过 / 驳回 / 撤回；只能看星海账户的人打开显示「无权限查看」；只能看星海账户、但有「收付款中心」权限点的人可只读打开，C、D 两行都展示，不显示通过 / 驳回 / 撤回" }

tasks:
  - { id: T-07-001, title: "计提项计算：计提天数（只算有适用规则的日子）、按条款分段、MAX 扣减（按当天出价策略）、落档与统计方式、舍入、客情天数（R-07-001～R-07-008）", depends_on: [T-03-002], done_when: "G-07-001～G-07-007 通过；上线起记录广告系列出价策略变更（S-23）" }
  - { id: T-07-002, title: "计提项状态机、随数据重算、提交冻结、完成口径输出给 10 / 11（R-07-009～R-07-019）", depends_on: [T-07-001, T-06-001], done_when: "G-07-010～G-07-012 通过" }
  - { id: T-07-003, title: "返点信息列表：页面权限点、搜索筛选、三层展开、汇总与处理中金额、进度列、权限过滤、排序分页、按钮显示（R-07-020～R-07-029）", depends_on: [T-07-002], done_when: "G-07-020～G-07-026 通过" }
  - { id: T-07-004, title: "客户返点弹窗：勾选与展开、逐行改金额（D-00-82 输入）、合计与「—」、返点方式、纳入扣减月份与占用置灰、结算币种与汇率、收款主体、合计为 0、空态、前端校验（R-07-030～R-07-044、R-07-072）", depends_on: [T-07-002, T-06-003], done_when: "G-07-030～G-07-038 通过" }
  - { id: T-07-005, title: "客情费用弹窗（R-07-045～R-07-048）", depends_on: [T-07-004], done_when: "G-07-040 通过" }
  - { id: T-07-006, title: "提交审批与服务端复核（就地重载、汇率确认、并发占用）、审批结果处理：写分桶 / 交易明细、计入账单、生成 09 付款单、付款单已完成回写、驳回 / 撤回 / 作废；最终通过不复核（R-07-050～R-07-061）", depends_on: [T-07-004, T-07-005, T-05-001, T-12-004, T-12-005, T-12-006], done_when: "G-07-050～G-07-057 通过" }
  - { id: T-07-007, title: "已提交审批 tab（执行状态）与两类审批内容区（执行结果、规则起始标注）、查看判断（R-07-062～R-07-071）", depends_on: [T-07-006, T-12-007], done_when: "G-07-060、G-07-070、G-07-071 通过" }
  - { id: T-07-008, title: "给 10 的逐日接口：计提项逐日金额（R-10-004、R-10-011）", depends_on: [T-07-001, T-07-002], done_when: "10 能按账户 × UTC0 自然日取到客户返点、客情费用计提项的逐日金额，连同计提项实际金额 / 系统计算金额与状态（R-07-017、R-07-018），供 10 按 R-10-012 拆分" }

decisions:
  - { id: D-07-01, point: "返点阶梯落档金额（03 Q-03-01）", conclusion: "用扣 MAX 后的返点基数落档", impact: "R-07-004；03 Q-03-01 可关", status: "已定（用户 2026-10-19）" }
  - { id: D-07-02, point: "什么时候能结", conclusion: "该月账单次月 2 日出账后才可结算；之前只展示预估", impact: "R-07-013", status: "已定（用户）" }
  - { id: D-07-03, point: "一张单包含什么", conclusion: "同一客户可勾多个结算期、多个账户；每个「账户 × 月」整笔进单，不拆", impact: "R-07-032、R-07-015", status: "已定（用户）" }
  - { id: D-07-04, point: "金额能否改", conclusion: "返点金额、客情费用都可以任意改（用户：都是成本，按实际的来）；下游按实际金额", impact: "R-07-033、R-07-018；06、10、11", status: "已定（用户）" }
  - { id: D-07-05, point: "客情怎么兑现", conclusion: "只能现金打款，走 09 付款单；客情弹窗加付款主体", impact: "R-07-045～R-07-047", status: "已定（用户）" }
  - { id: D-07-06, point: "结算币种", conclusion: "两个弹窗都有结算币种（下拉），按提交当天日汇率四舍五入 4 位换算并锁定，汇率后带取数日期；提交当天汇率与弹窗不同时弹确认后按新汇率建单（D-00-74、D-00-62）", impact: "R-07-039、R-07-040、R-07-051", status: "已定（用户；2026-10-21 用户定，会议清单 D35、D36 补精度、日期与确认交互）" }
  - { id: D-07-07, point: "结完后数据修正", conclusion: "已提交 / 已结的按提交时金额冻结，不补差", impact: "R-07-010", status: "已定（用户）" }
  - { id: D-07-08, point: "改金额的粒度", conclusion: "每个「账户 × 月」行单独改，默认带系统计算值；合计自动加总", impact: "R-07-033", status: "已定（用户）" }
  - { id: D-07-09, point: "现金打款应付金额", conclusion: "= 合计 × 汇率，四舍五入 2 位，只读", impact: "R-07-041", status: "已定（用户）" }
  - { id: D-07-10, point: "余额抵扣与结算币种", conclusion: "余额抵扣不换汇；结算币种、汇率、应付金额、付款主体只在现金打款时出现", impact: "R-07-035", status: "已定（用户）" }
  - { id: D-07-11, point: "系统算出 0 的计提项", conclusion: "不进弹窗，状态无返点 / 无客情，算作完成", impact: "R-07-013、R-07-017", status: "已定（用户）" }
  - { id: D-07-12, point: "单据状态", conclusion: "客户返点单、客情费用单不单独设状态，审批阶段看 12、打款阶段看 09；进度落在计提项状态上", impact: "entities、flows", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-07-13, point: "规则晚于出账才通过", conclusion: "已出账计提项以该月出账时刻为 t 取适用规则（R-03-003、D-03-24），出账后才通过的规则不作用于该月；消耗修正仍重算到提交为止", impact: "R-07-009", status: "已定（2026-10-21 用户定，会议清单 D08）" }
  - { id: D-07-14, point: "账户换客户", conclusion: "本期账户不能换所属客户和账户系统（R-02-017），本页不设计跟随规则；技术后台改数据按数据修复处理；原「没进单的跟账户走」作废", impact: "R-07-012", status: "已定（2026-10-21 用户定，会议清单 D105）" }
  - { id: D-07-15, point: "客户行汇总口径", conclusion: "累计 = 已结算实际金额；待结算 = 待结算状态的系统金额；新增处理中 = 审批中 + 待打款的实际金额；未出账不计；只算可见账户；结算期行加客户返点 / 客情进度摘要", impact: "R-07-021、R-07-023～R-07-025", status: "已定（2026-10-21 用户定，会议清单 D55）" }
  - { id: D-07-16, point: "纳入扣减月份可选范围", conclusion: "任一符合 R-06-024 的账单，不要求晚于返点月份、未出账不可选；同一账单同时最多被 1 张合计 > 0 的审批中扣减单占用，被占用的置灰带单号；选项由服务端下发；只校验整单合计 ≤ 可结算应收，账户行应收可为负", impact: "R-07-036、R-07-050；06", status: "已定（2026-10-21 用户定，会议清单 D10、D11）" }
  - { id: D-07-17, point: "合计为 0 能否提交", conclusion: "能；全部改 0 = 这些月份不返；合计为 0 时纳入扣减月份、结算币种、汇率、应付、收款主体都不出现、不校验，不占用账单；通过后直接已结算，不生成付款单、不入桶、不计入账单、不写交易明细", impact: "R-07-038、R-07-058、R-07-072", status: "已定（2026-10-21 用户定，会议清单 D57；原为由我代定）" }
  - { id: D-07-18, point: "交易明细写法", conclusion: "后付余额抵扣不写；预付余额抵扣写「客户返点」已完成；现金打款写待完成、应付金额记正数（用户 2026-10-19：付钱就大大方方付，不记负数；客户返点、客情费用都一样）", impact: "R-07-055～R-07-057；05", status: "已定（应付记正数为用户定；其余 2026-10-21 用户确认，由代定转已定）" }
  - { id: D-07-19, point: "调整痕迹", conclusion: "弹窗与审批内容区同时显示系统计算值与实际金额，不同的标红带「已调整」；不强制填备注", impact: "R-07-033、R-07-068", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-07-20, point: "最终通过时复核（原 Q-07-04）", conclusion: "后付余额抵扣只在提交时复核；最后一个审批人通过时不再复核，照常生效；本包没有最终通过执行失败情形（R-12-045、D-00-79）；审批期间可结算应收被扣成负数的，由 06 生成结算单时应付 0.00、超出部分结转下期（D-00-81）", impact: "R-07-061、G-07-054、T-07-006；06、12", status: "已定（用户 2026-10-20，D-00-67；2026-10-21 用户定，会议清单 D09、D26 改结转与失败口径）" }
  - { id: D-07-21, point: "权限点与可见性", conclusion: "页面按「返点管理（查看）」权限点显示（D-00-78）；新增「返点结算」「客情结算」两个权限点；数据与汇总只算可见账户；撤回只校验申请人本人（D-00-79）", impact: "R-07-020、R-07-021、R-07-028、R-07-065；13", status: "已定（2026-10-21 用户定，会议清单 D86、D81）" }
  - { id: D-07-22, point: "原型改名", conclusion: "标题「返点中心」→「返点管理」，tab「费用信息」→「返点信息」，审批详情「客情返点比例」→「客情费用比例」；弹窗「返点金额」框改为只读合计，逐行输入", impact: "R-07-020、R-07-033、R-07-070", status: "已定（2026-10-21 用户确认，由代定转已定）" }
  - { id: D-07-23, point: "搜索筛选、导出", conclusion: "搜索公司名称 / 客户别名 / 账户名称 / orgId（账户只在可见范围匹配，命中后照常列全部可见账户）；筛选所属账户系统、计费模式（第二个同名下拉不做）；导出、勾选框不做（同 06）", impact: "R-07-022、R-07-029", status: "已定（2026-10-21 用户定，会议清单 D53）" }
  - { id: D-07-24, point: "付款单作废时计提项怎么回退（原 Q-07-03）", conclusion: "本期收付款单不作废、不退回（D-00-69），本页不做付款单作废后的回退；待打款的计提项只能等付款单已完成（确认到账）变已结算，期间算未完成（R-07-017）", impact: "R-07-059、flows reverse", status: "已定（用户 2026-10-20，D-00-69）" }
  - { id: D-07-25, point: "MAX 识别（原 Q-07-02）", conclusion: "MAX = 出价策略 MAX_CONVERSIONS 的广告系列，按天按系列拆；按当天策略识别，从上线起记录策略变更，一天内改过的按当天 UTC0 结束时同步到的策略计整天，上线前按当前策略（S-23）", impact: "R-07-007、T-07-001", status: "已定（2026-10-21 用户定，会议清单附 1 B1、技术答复 T14）" }
  - { id: D-07-26, point: "计提天数与分段", conclusion: "返点计提天数只算第 1～90 天内有适用规则的日子，无规则的日子不进时间范围与范围内消耗，显式 0% 照常算；分段按条款（返点比例 / 客情方式与比例）而不是按规则记录，相邻两段条款相同合并落档；消耗首日首次确定后冻结", impact: "R-07-002、R-07-003、R-07-008、R-07-009", status: "已定（2026-10-21 用户定，会议清单 D104、D93、D95）" }
  - { id: D-07-27, point: "复核失败的交互", conclusion: "不再要求关闭重开：数据变了就地重载、变化行标黄、保留用户已填内容与改过的金额，不能选的取消勾选并标「状态已变化」；汇率变化弹确认；复核补收款主体仍有效、账单未被占用", impact: "R-07-050、R-07-051", status: "已定（2026-10-21 用户定，会议清单 D35、D10）" }
  - { id: D-07-28, point: "弹窗合计与逐行细节", conclusion: "有非法行时合计、应付显示「—」并暂停超额校验；结算期行同时显示系统计算合计与金额合计；取消勾选保留改过的值；保留表头全选；默认展开最近结算期；打开时无待结算行显示空态、提交置灰；金额输入按 D-00-82", impact: "R-07-031～R-07-033、R-07-036、R-07-041、R-07-046、R-07-068、R-07-070", status: "已定（2026-10-21 用户定，会议清单 D56、D34）" }
  - { id: D-07-29, point: "「付款主体」改名「收款主体」", conclusion: "现金打款（我们付钱给客户）字段叫「收款主体」，选项仍取客户当前生效的付款主体，下拉入口仍叫「+ 新增付款主体」并加灰字「需审批通过后可选」", impact: "R-07-042、R-07-045、R-07-057、R-07-067、R-07-070", status: "已定（2026-10-21 用户定，会议清单 D37、附 1 N8）" }
  - { id: D-07-30, point: "进度与执行状态展示", conclusion: "未出账悬浮数据截至时间；已提交审批加执行状态列（已充入余额 / 已计入 yyyy-mm 账单 / 付款单待汇出 / 付款单待完成 / 已到账 / 已结清（0 元））；审批内容区底部加执行结果行", impact: "R-07-011、R-07-064、R-07-067、R-07-070", status: "已定（2026-10-21 用户定，会议清单 D39、D51）" }
  - { id: D-07-31, point: "余额抵扣去向与计费模式", conclusion: "按客户当前生效的计费模式走，不按计提项所属月拆；所勾月份模式与当前不同照常可勾；有待生效变更时显示「当前值（yyyy-mm-dd 起改为目标值）」", impact: "R-07-023、R-07-030、R-07-035", status: "已定（2026-10-21 用户定，会议清单 D02-07、D02-待生效文案）" }
  - { id: D-07-32, point: "计提项从哪个月起产生", conclusion: "只对结算期 ≥ 上线月的月份产生计提项；上线月与 06 出账、08、10、11 共用 index S-18 的同一个配置；上线月之前的月份不产生（S-17 定掉，Q-07-01 关闭）", impact: "R-07-001；§3 存量", status: "已定（2026-10-22 用户与技术确认，闭环清单 A01）" }
  - { id: D-07-33, point: "在途的预付返点余额抵扣跨计费模式切换", conclusion: "预付改后付生效时还在审批中的预付返点余额抵扣，通过后按提交时的快照成桶（0 费率），之后按 R-05-118 ① 保留", impact: "R-07-055、§2.4.5", status: "已定（2026-10-22 用户与技术确认，闭环清单 B03）" }
  - { id: D-07-34, point: "审批详情第②类查看", conclusion: "对单内任一账户有查看权限之外，还要同时持「返点管理（查看）」；「收付款中心」权限点的只读查看照旧；申请人和快照里的审批人不受影响", impact: "R-07-071", status: "已定（2026-10-22 用户与技术确认，闭环清单 B10）" }
  - { id: D-07-35, point: "结算时间时区", conclusion: "展示统一用北京时间（Asia/Shanghai），存储统一用时间戳（与 06 bill.settled_at 一致）", impact: "字段 settled_at", status: "已定（2026-10-22 用户与技术确认，闭环清单 D 组）" }
