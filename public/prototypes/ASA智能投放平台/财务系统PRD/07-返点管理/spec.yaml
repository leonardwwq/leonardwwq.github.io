scope:
  in:
    - "返点计提项（账户 × 自然月）：客户返点、客情费用的计提天数、分段、落档、金额计算"
    - "计提项状态机：未出账 / 待结算 / 无返点（无客情）/ 审批中 / 待打款 / 已结算，及随数据刷新、提交冻结"
    - "返点管理页：返点信息（客户 → 结算期 → 账户三层）、已提交审批"
    - "客户返点弹窗：勾选计提项、逐行改金额、余额抵扣（预付充余额 / 后付纳入扣减月份）/ 现金打款（结算币种、汇率、收款主体）；合计为 0 的单"
    - "客情费用弹窗：勾选计提项、逐行改金额、现金打款"
    - "提交「返点管理—客户返点」「返点管理—客情费用」审批、服务端复核、审批结果处理（写 05 分桶 / 交易明细、06 账单扣减、生成 09 付款单）"
    - "两类审批详情的「审批内容」区（版本记录第 19 项）"
  out:
    - "规则配置本身、某日适用规则、消耗首日、阶梯与统计方式语义（归 03）"
    - "账单金额、可结算应收、可扣减判断与占用、超出部分结转（归 06，R-06-013、R-06-024、R-06-077）；本页只读取并在提交时复核，最后通过时不复核（D-00-67）"
    - "分桶、账户余额、交易明细实体（归 05）；本页只按 R-05-004、R-05-094 写入"
    - "付款单的确认汇款、确认到账、凭证与完成（归 09，D-00-33）；本期付款单不作废、不退回（D-00-69）"
    - "审批引擎、撤回、通知、审批详情通用框架（归 12）"
    - "导出、列表勾选框（原型有，本期不做，D-07-23）"
    - "利润、提成里怎么用返点 / 客情（归 10、11；本页只提供实际金额与状态）"
    - "上线月之前的月份的返点 / 客情（不产生计提项，R-07-001、D-07-32）"

roles:
  - { role: "有「返点管理（查看）」权限点的用户", can: ["看到返点管理菜单与页面"], cannot: [], source: "D-00-78、D-13-01（R-07-021）；「返点结算」「客情结算」依赖它" }
  - { role: "有「返点结算」权限点的用户", can: ["发起客户返点（余额抵扣 / 现金打款）"], cannot: ["结他看不到的账户的计提项"], source: "新增权限点（D-07-21；13 汇总）" }
  - { role: "有「客情结算」权限点的用户", can: ["发起客情费用（现金打款）"], cannot: ["结他看不到的账户的计提项"], source: "新增权限点（D-07-21；13 汇总）" }
  - { role: "申请人本人", can: ["撤回自己提交的审批中单（不校验业务权限点）"], cannot: [], source: "D-00-79（R-07-065）" }
  - { role: "有「审批配置」权限点的用户", can: ["在审批详情作废审批中的单（效果同撤回）"], cannot: [], source: "D-00-79（R-07-060）" }
  - { role: "能看到某账户的用户", can: ["在返点信息看到含该账户的客户与该账户的计提项", "同时持「返点管理（查看）」时只读查看含该账户的客户返点 / 客情费用审批详情（R-07-071）"], cannot: ["看他没有权限的账户行与金额"], source: "沿用现有账户查看权限（R-07-021）" }
  - { role: "有「收付款中心」权限点的用户", can: ["只读查看客户返点、客情费用两类审批详情（R-07-071）"], cannot: ["在审批详情通过 / 驳回 / 撤回", "因此获得返点管理页访问权"], source: "D-00-71、R-13-050" }
  - { role: "审批人", can: ["在审批详情通过 / 驳回"], cannot: ["修改审批内容"], source: "12（R-12-023 按钮、R-12-030 审批内容由业务包定义）" }
  - { role: "系统", can: ["计算计提项", "按出账、数据修正、审批结果、付款完成推进计提项状态"], cannot: [], source: "R-07-001～R-07-019" }

entities:
  - name: 返点计提项
    key: accrual_item
    note: "每个账户、每个 UTC0 自然月、每种（客户返点 / 客情费用）各一条；key 为文档内称呼，落库方式由技术定"
    fields:
      - { key: "item_id", label: "计提项ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "kind", label: "种类", type: "enum", required: true, enum: ["客户返点", "客情费用"], rule: "R-07-001" }
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "04 客户；账户所属客户添加后不变（R-07-012）" }
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "yyyy-mm（UTC0 自然月），展示「yyyy-mm-01 至 yyyy-mm-最后一天」" }
      - { key: "currency", label: "币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "账户消耗币种（R-05-002）" }
      - { key: "month_consumption", label: "消耗金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "账户全月消耗（R-07-008）" }
      - { key: "accrual_ranges", label: "返点时间范围 / 客情时间范围", type: "list", required: false, generated: true, rule: "计提天数合并成的连续日期段，元素「yyyy-mm-dd 至 yyyy-mm-dd」；没有计提天数为空（R-07-002、R-07-005）" }
      - { key: "range_consumption", label: "返点时间内消耗金额 / 客情时间内消耗金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "计提天数内的消耗，不扣 MAX（R-07-008）" }
      - { key: "range_max", label: "MAX消耗", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", generated: true, rule: "仅客户返点：计提天数内的 MAX 广告系列消耗（R-07-007、R-07-008）" }
      - { key: "segments", label: "计算分段", type: "list", required: false, generated: true, rule: "每段：日期段、所用规则记录及其规则起始日期、比例设置、基数、金额（R-07-003、R-07-004、R-07-006）；审批内容区「比例」列据此展示（R-07-069）" }
      - { key: "calc_amount", label: "系统计算金额", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", generated: true, rule: "R-07-004、R-07-006；提交后取单内快照（R-07-010）" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["未出账", "待结算", "无返点", "无客情", "审批中", "待打款", "已结算"], generated: true, rule: "flows 返点计提项；「无返点」只用于客户返点，「无客情」只用于客情费用" }
      - { key: "doc_id", label: "所在单据", type: "ref", required: false, generated: true, rule: "审批中 / 待打款 / 已结算时指向客户返点单或客情费用单" }
      - { key: "actual_amount", label: "实际金额", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", generated: true, rule: "进单后 = 单内该行的金额（D-07-04、D-07-08）；10、11 按它算（X-6）" }
      - { key: "settled_at", label: "结算时间", type: "datetime", required: false, tz: "存储为时间戳；展示北京时间 Asia/Shanghai", precision: "秒", generated: true, rule: "变为已结算的时间（D-07-35）" }
  - name: 返点单据
    key: rebate_doc
    note: "客户返点单（审批类型 返点管理—客户返点）与客情费用单（返点管理—客情费用）共用结构；不单独设状态，审批阶段看 12 审批单状态，现金打款通过后看 09 付款单状态（同 D-00-60 做法，D-07-12）"
    fields:
      - { key: "doc_id", label: "单据ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "doc_type", label: "单据类型", type: "enum", required: true, enum: ["客户返点", "客情费用"], rule: "R-12-001" }
      - { key: "customer_id", label: "客户", type: "ref", required: true, rule: "一张单只属于一个客户（D-07-03）" }
      - { key: "billing_mode", label: "计费模式", type: "enum", required: true, enum: ["预付款", "后付款"], rule: "提交时客户的计费模式快照（R-07-035）" }
      - { key: "method", label: "返点方式", type: "enum", required: true, enum: ["余额抵扣", "现金打款"], rule: "客户返点必选（R-07-034）；客情费用固定现金打款（D-07-05）" }
      - { key: "deduct_bill", label: "纳入扣减月份", type: "ref", required: false, rule: "仅后付款 + 余额抵扣 + 合计 > 0：06 账单，yyyy-mm（R-07-036）；0 元单不占用账单（R-07-072）" }
      - { key: "lines", label: "计提项明细", type: "list", required: true, rule: "元素：计提项ID、结算期、账户、系统计算金额快照、实际金额、时间范围 / 消耗 / MAX / 分段快照；至少 1 行（R-07-032、R-07-038）" }
      - { key: "total", label: "返点金额 / 客情费用（合计）", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "= 各行实际金额之和，只读（R-07-033）" }
      - { key: "settle_currency", label: "结算币种", type: "enum", required: false, enum: ["人民币", "USD", "USDT"], rule: "仅现金打款且合计 > 0，必选（R-07-039）" }
      - { key: "fx_rate", label: "汇率", type: "decimal", required: false, precision: 4, rule: "1 账户币种 = x 结算币种；日汇率四舍五入 4 位，显示与计算一致；币种相同为 1（R-07-040，D-00-74）" }
      - { key: "fx_date", label: "汇率日期", type: "date", required: false, tz: "UTC0", rule: "实际取到汇率的日期，币种不同时有（R-07-040）" }
      - { key: "payable", label: "应付金额", type: "decimal", required: false, precision: 2, currency: "结算币种", rule: "= 合计 × 汇率，四舍五入 2 位，只读（R-07-041、D-07-09）" }
      - { key: "payee", label: "收款主体", type: "string", required: false, rule: "仅现金打款且合计 > 0，必选；选项为客户当前生效的付款主体（R-07-042，D-07-29）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "即审批发起备注（R-07-043）" }
      - { key: "accounts", label: "涉及账户", type: "list", required: true, rule: "所勾计提项的账户，传给审批引擎解析「绑定的运营」（D-00-76）" }
      - { key: "approval_id", label: "审批单", type: "ref", required: true, generated: true, rule: "12 审批单" }
      - { key: "payment_id", label: "付款单", type: "ref", required: false, generated: true, rule: "现金打款且合计 > 0 时，审批通过生成的 09 付款单（R-07-057）" }

flows:
  - entity: 返点计提项
    states: [未出账, 待结算, 无返点, 无客情, 审批中, 待打款, 已结算]
    initial: 未出账
    transitions:
      - { from: "无", action: "账户在该月第一天有消耗", actor: 系统, to: 未出账, guard: "R-07-001" }
      - { from: 未出账, action: "该月账单出账（次月 2 日）且系统计算金额 > 0", actor: 系统, to: 待结算, guard: "R-07-013、D-07-02" }
      - { from: 未出账, action: "该月账单出账且系统计算金额 = 0", actor: 系统, to: "无返点 / 无客情", guard: "R-07-013、D-07-11" }
      - { from: 待结算, action: "数据修正后系统计算金额变为 0", actor: 系统, to: "无返点 / 无客情", guard: "R-07-009" }
      - { from: "无返点 / 无客情", action: "数据修正后系统计算金额变为 > 0", actor: 系统, to: 待结算, guard: "R-07-009" }
      - { from: 待结算, action: "被勾进客户返点单 / 客情费用单并提交审批", actor: "有权限点的用户", to: 审批中, guard: "R-07-050～R-07-053" }
      - { from: 审批中, action: "审批通过，余额抵扣", actor: 系统, to: 已结算, guard: "R-07-055、R-07-056" }
      - { from: 审批中, action: "审批通过，现金打款且合计 > 0", actor: 系统, to: 待打款, guard: "R-07-057" }
      - { from: 审批中, action: "审批通过，合计 = 0（余额抵扣或现金打款）", actor: 系统, to: 已结算, guard: "R-07-058、R-07-072" }
      - { from: 待打款, action: "09 付款单已完成（确认到账；确认汇款后仍待打款）", actor: 系统, to: 已结算, guard: "R-07-059、R-09-071" }
    reverse:
      - { action: "驳回 / 撤回 / 作废", actor: "审批人 / 申请人 / 「审批配置」持有人", allowed_from: [审批中], note: "回到待结算（重算后为 0 则无返点 / 无客情），解除冻结，按最新数据重算（R-07-060，D-00-79）" }
      - { action: "09 付款单作废 / 退回", actor: "—", allowed_from: [], note: "本期不做（D-00-69）；待打款只能等付款单已完成（D-07-24）" }
      - { action: "已结算后撤销", actor: "—", allowed_from: [], note: "本期没有；已结算后数据修正也不补差（D-07-07）" }

