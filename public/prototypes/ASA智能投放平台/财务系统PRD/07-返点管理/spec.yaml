  - { page: 05-费用管理, entity: 分桶, ids: [R-05-002, R-05-004, R-05-005, R-05-011, R-05-042, R-05-078, R-05-087], uses: "预付余额抵扣按账户入一个分桶（费率 0、不清零额度）；账户消耗币种；收款主体下拉与付款主体新增做法；二次确认框标题；已提交审批做法" }
  - { page: 05-费用管理, entity: 交易明细, ids: [R-05-094, R-05-095, R-05-096, R-05-098], uses: "预付余额抵扣写「客户返点」已完成；现金打款写「客户返点 / 客情费用」待完成，09 付款完成后由 05 变已完成" }
  - { page: 06-账单与结算单, entity: 账单, ids: [R-06-001, R-06-010, R-06-013, R-06-019, R-06-024, R-06-040, R-06-043, R-06-077, R-06-078], uses: "出账时点决定计提项可结；纳入扣减月份可选条件、占用与提交时复核（最后通过不复核，D-00-67）；扣减后账单按账户读本页实际金额；合计 > 0 的返点审批中时 06 生成结算单置灰；汇率取法同结算单；账单为负时 06 结转" }
  - { page: 06-账单与结算单, entity: 结算单, ids: [D-06-28], uses: "后付返点扣减后可结算应收为负时，06 生成结算单应付 0.00、超出部分结转下期（R-07-061、D-00-81）" }
  - { page: 09-收付款中心, entity: 付款单, ids: [R-09-042, R-09-071], uses: "现金打款付款单（收款主体）确认汇款后计提项仍待打款；执行状态取 09 状态；付款单已完成（确认到账）回写计提项已结算（R-07-059、D-00-33）；本期不作废（D-00-69）" }
  - { page: 10-利润中心, entity: 利润日明细, ids: [R-10-004, R-10-011, R-10-012], uses: "10 读计提项实际金额与系统逐日金额，按日折人民币（T-07-008）" }
  - { page: 12-审批配置与审批中心, entity: 审批单, ids: [R-12-001, R-12-016, R-12-018, R-12-023, R-12-025, R-12-026, R-12-030, R-12-032, R-12-033, R-12-034, R-12-035, R-12-043, R-12-044], uses: "提交两类审批与提交提示；按结果处理；撤回、作废；审批详情框架与第②类查看" }
  - { page: 13-导航与权限, ids: [R-13-050], uses: "有「收付款中心」权限点的人可只读查看两类审批详情（R-07-071、D-00-71）" }

rules:
  - { id: R-07-001, module: 计提与计算, text: "计提项：每个账户在每个 UTC0 自然月各有一条「客户返点」和一条「客情费用」计提项，从该账户当月第一天有消耗起产生；全月消耗为 0 的账户不产生。只对结算期 ≥ 上线月的月份产生，上线月与 06 出账、08、10、11 共用一个配置（index S-18；S-17 定为只从上线月起），上线月之前的月份不产生计提项（D-07-32）" }
  - { id: R-07-002, module: 计提与计算, text: "返点计提天数 = 当月里落在该账户消耗首日起第 1～90 天（含第 90 天）内、且当天有适用规则的日子（R-03-005、R-03-007、D-00-56）；没有适用规则的日子不算进计提天数，也不算进返点时间内消耗金额和 MAX消耗；显式配置为 0% 的日子照常算进去（D-07-26）；消耗首日首次确定后冻结，未确定时没有计提天数，早于首日的日子不计提。「返点时间范围」= 计提天数按连续日期合并成的段，每段「yyyy-mm-dd 至 yyyy-mm-dd」；没有计提天数显示「-」" }
  - { id: R-07-003, module: 计提与计算, text: "分段：对计提天数里的每一天按 R-03-003 取该账户的适用规则（已出账计提项以该月出账时刻为 t，D-03-24），连续日子里适用条款相同的为一段：返点看返点比例设置，客情看客情结算方式与客情比例设置，两段条款完全相同就合并成一段再落档（D-00-55、D-07-26）；没有适用规则的日子不进计提天数（R-07-002、R-07-005）" }
  - { id: R-07-004, module: 计提与计算, text: "客户返点金额：每段基数 = 段内消耗 − 段内 MAX 广告系列消耗，小于 0 按 0（D-00-15）。返点比例为固定比例 → 基数 × 比例；阶梯 + 按月统计 → 段基数（扣 MAX 后，D-07-01）按 R-03-009 落一档 × 该档比例；阶梯 + 按日统计 → 每天的（当日消耗 − 当日 MAX，小于 0 按 0）各自落档 × 该档比例；落档用未舍入的原始金额（D-00-13）。每段（按日统计时每天）四舍五入到 2 位后相加 = 系统计算金额，币种为账户消耗币种" }
  - { id: R-07-005, module: 计提与计算, text: "客情计提天数：逐日看当天适用规则的客情结算方式（R-03-008）——无客情 → 不计提；首次消耗起 90 天 → 当天在消耗首日起第 1～90 天内才计提；按自然月每月返还 → 当天计提；没有适用规则 → 不计提。「客情时间范围」= 计提天数按连续日期合并成的段，每段一行；没有计提天数显示「-」" }
  - { id: R-07-006, module: 计提与计算, text: "客情费用金额：客情计提天数按 R-07-003 分段，每段基数 = 段内全部消耗，不扣 MAX（D-00-20）；客情比例固定 → 基数 × 比例；阶梯 → 段基数落一档 × 该档比例（客情一律按自然月口径，D-00-22、R-03-010）；每段四舍五入到 2 位后相加 = 系统计算金额" }
  - { id: R-07-007, module: 计提与计算, text: "MAX 广告系列消耗（MAX 消耗口径以本条为准，08 等页引用）= 账户当天出价策略为 MAX_CONVERSIONS 的广告系列的消耗，按当天的策略识别：从上线起记录广告系列出价策略的变更，一天内改过策略的按该天 UTC0 结束时同步到的策略计整天；上线前的日子按上线时的当前策略计（index S-23）（D-07-25）" }
  - { id: R-07-008, module: 计提与计算, text: "列口径：消耗金额 = 账户全月消耗；返点时间内消耗金额 / 客情时间内消耗金额 = 各自计提天数内的消耗（扣 MAX 前），没有计提天数为 0.00；MAX消耗 = 返点计提天数内的 MAX 广告系列消耗，没有计提天数显示「-」。金额千分位、2 位小数（D-00-13）" }
  - { id: R-07-009, module: 计提与计算, text: "没进单的计提项（未出账、待结算、无返点、无客情）随最新数据重算：消耗修正、MAX 数据修正、消耗首日首次确定。规则按 R-03-003 取：未出账的以当前时刻为 t，已出账的以该月账单出账时刻为 t，出账后才审批通过的规则不作用于该月（R-03-011，D-03-24、D-07-13）" }
  - { id: R-07-010, module: 计提与计算, text: "冻结：计提项被提交进单时，系统计算金额、时间范围、范围内消耗、MAX消耗、分段与比例（含规则起始日期）都存进单据快照；在单期间（审批中、待打款、已结算）页面一律显示快照与单内实际金额，之后的数据修正、规则变化都不改它，也不补差（D-07-07）" }
  - { id: R-07-011, module: 计提与计算, text: "列表中计提项显示的金额：进了单的显示实际金额（D-07-04）；未出账显示实时预估的系统计算金额，状态旁悬浮「金额为实时预估，随消耗数据更新，数据截至 yyyy-mm-dd hh:mm（UTC0）」（截至时间取消耗数据最近一次同步的时间，技术取不到时去掉后半句，D-07-30）；其余显示系统计算金额；无返点 / 无客情显示 0.00" }
  - { id: R-07-012, module: 计提与计算, text: "账户的所属客户添加后不能改（R-02-017），本页不设计计提项跟随换客户 / 换账户系统的规则；技术后台改数据按数据修复处理（D-07-14）" }
  - { id: R-07-013, module: 计提项状态, text: "该月账单出账前（当月，以及上月在次月 2 日出账前）计提项为「未出账」，只展示预估、不能勾选；该账户该月账单按 R-06-001 出账后：系统计算金额 > 0 → 待结算，= 0 → 客户返点「无返点」/ 客情费用「无客情」（D-07-02、D-07-11）" }
  - { id: R-07-014, module: 计提项状态, text: "待结算与无返点 / 无客情之间随 R-07-009 重算自动切换；只有「待结算」能被勾进单" }
  - { id: R-07-015, module: 计提项状态, text: "同一条计提项同一时间只能在一张单里；审批中、待打款、已结算的计提项不再出现在弹窗里" }
  - { id: R-07-016, module: 计提项状态, text: "审批通过后：余额抵扣（预付或后付）→ 已结算；现金打款 → 待打款，09 付款单「已完成」（确认到账）后 → 已结算；合计为 0 的单 → 直接已结算（R-07-055～R-07-059、R-07-072）" }
  - { id: R-07-017, module: 计提项状态, text: "「完成」口径（供 10、11 判断「算没算完」，D-00-65）：客户返点计提项为「已结算」或「无返点」、客情费用计提项为「已结算」或「无客情」即为完成；未出账、待结算、审批中、待打款都是未完成" }
  - { id: R-07-018, module: 计提项状态, text: "10、11 计算利润、提成时取：已进单的计提项用实际金额，其余用系统计算金额（D-07-04「按实际的来」）；计提项的实际金额或状态变化时 10、11 按 D-00-66 处理（X-6）" }
  - { id: R-07-019, module: 计提项状态, text: "状态展示：账户行「客户返点状态」「客情费用状态」直接显示状态名" }
  - { id: R-07-020, module: 返点信息, text: "页面标题「返点管理」，两个切换「返点信息 / 已提交审批」，默认返点信息（原型标题「返点中心」、tab「费用信息」统一改名，D-07-22）；菜单与页面准入见 R-07-021" }
  - { id: R-07-021, module: 返点信息, text: "菜单与页面按「返点管理（查看）」权限点显示：没有该点不显示菜单，直接访问按 R-13-005 在内容区显示「无权限访问」、保留当前地址；「返点结算」「客情结算」两个权限点依赖该查看点，服务端同样校验（D-00-78、D-13-01）。数据权限跟账户查看权限走：用户对客户下任一账户有查看权限才展示该客户；第二、三层与所有汇总金额只算他有权限的账户（D-07-21）" }
  - { id: R-07-022, module: 返点信息, text: "搜索框按公司名称、客户别名、账户名称、orgId 包含匹配，占位「搜索公司名称 / 客户别名 / 账户名称 / orgId」；账户名称和 orgId 只在当前用户有查看权限的账户里匹配，由服务端过滤；命中账户时展示该客户，下面照常列全部可见账户（D-07-23）；筛选 所属账户系统（全部 + 现有账户系统列表；原型选项是登记表状态，复制残留，第二个同名下拉不做）、计费模式（全部 / 预付款 / 后付款，按客户当前生效的计费模式筛），默认全部" }
  - { id: R-07-023, module: 返点信息, text: "第一层每个客户一行，列依次：公司名称、所属账户系统、计费模式、客户别名、销售、累计客户返点金额、待结算客户返点金额、累计客情费用、待结算客情费用、处理中客户返点金额、处理中客情费用、操作；所属账户系统、计费模式、客户别名、销售取客户当前值；有待生效的计费模式变更时计费模式显示「{当前生效值}（{yyyy-mm-dd} 起改为{目标值}）」，同 R-04-067（D-00-73）；公司名称过长省略、悬浮显示全称；金额后带账户消耗币种（如「390.00 USD」）；两个「处理中」列表头悬浮「审批中 + 待打款」（D-07-15）" }
  - { id: R-07-024, module: 返点信息, text: "累计客户返点金额 / 累计客情费用 = 该客户可见账户「已结算」计提项的实际金额之和；待结算客户返点金额 / 待结算客情费用 = 状态为「待结算」的计提项系统计算金额之和；处理中客户返点金额 / 处理中客情费用 = 状态为审批中、待打款的计提项实际金额之和；未出账不计入任何一列（D-07-15）" }
  - { id: R-07-025, module: 返点信息, text: "展开客户行显示第二层结算期行，列：结算期（yyyy-mm-01 至 yyyy-mm-最后一天）、消耗金额、MAX消耗、客户返点金额、客户返点进度、客情费用、客情费用进度，金额列 = 该月可见账户行之和（金额按 R-07-011）；进度列按状态计数，只列数量不为 0 的「未出账 n」「待结算 n」「处理中 n」（处理中 = 审批中 + 待打款），用「 · 」分隔，如「待结算 1 · 处理中 1」；全部是已结算或无返点 / 无客情时显示「已完成」（D-07-15）；只列至少有一条计提项的月份，结算期降序" }
  - { id: R-07-026, module: 返点信息, text: "展开结算期行显示第三层账户行，列：账户名称、消耗金额、MAX消耗、返点时间范围、返点时间内消耗金额、客户返点、客情时间范围、客情时间内消耗金额、客情费用、客户返点状态、客情费用状态（口径 R-07-002、R-07-005、R-07-008、R-07-011）；时间范围多段时每段一行；按消耗金额降序" }
  - { id: R-07-027, module: 返点信息, text: "客户排序：待结算客户返点金额降序，相同按待结算客情费用降序，再按公司名称升序；分页按第一层 10 / 50 / 100 / 300 条每页，默认 10；没有可见客户或筛选无结果显示「暂无数据」" }
  - { id: R-07-028, module: 返点信息, text: "操作列「客户返点」只对同时有「返点管理（查看）」「返点结算」权限点的用户显示，「客情费用」只对同时有「返点管理（查看）」「客情结算」权限点的用户显示（D-13-01）；该客户没有可见的待结算计提项时按钮置灰不可点，悬浮提示「暂无待结算的客户返点」/「暂无待结算的客情费用」" }
  - { id: R-07-029, module: 返点信息, text: "原型的「导出」按钮本期不做（D-07-23）" }
  - { id: R-07-030, module: 客户返点弹窗, text: "弹窗标题「客户返点」，右上角 ✕ 关闭；顶部只读 公司名称、所属账户系统、计费模式（客户当前值，待生效写法同 R-07-023）；然后是 返点方式、纳入扣减月份 / 结算币种 / 汇率 / 应付金额 / 收款主体（按条件出现）、返点金额（合计）、备注；下方计提项表；底部「提交审批」" }
  - { id: R-07-031, module: 客户返点弹窗, text: "计提项表两层：结算期行（勾选框、结算期、消耗金额、MAX消耗、系统计算返点合计、返点金额合计）→ 账户行（勾选框、账户名称、消耗金额、MAX消耗、返点时间范围、返点时间内消耗金额、系统计算返点、返点金额）；只列该客户状态为「待结算」、当前用户有查看权限的账户的客户返点计提项，结算期降序；不列无返点、未出账和已在单里的；默认展开最近一个结算期，其余收起，收起的结算期行照样能勾，勾上即勾选其下全部账户行；打开时一行待结算都没有的，表格空态「暂无待结算的客户返点」，「提交审批」置灰，关闭弹窗时刷新列表（D-07-28）" }
  - { id: R-07-032, module: 客户返点弹窗, text: "勾选：默认都不勾；表头全选 = 勾上全部结算期行；勾结算期行 = 勾上其下全部账户行，取消同理；账户行部分勾选时结算期行显示半选，结算期行部分勾选时表头半选；可跨多个结算期、多个账户勾（D-07-03）；取消勾选后再勾，该行保留之前改过的金额与「已调整」标识" }
  - { id: R-07-033, module: 客户返点弹窗, text: "每个账户行的「返点金额」是输入框，默认 = 系统计算返点，勾选后才可编辑；可改大改小（D-07-04、D-07-08），必填、≥ 0、最多 2 位小数、不设上限；输入按 D-00-82：只接受数字和一个小数点，负号、字母输不进去，小数第 3 位按不下去，粘贴或自动填充的非法内容不写入、保留原值并就地标红「请输入不小于 0、最多 2 位小数的金额」，不静默四舍五入或截断；清空时同样标红；与系统计算值不同时输入框旁显示「已调整」。「返点金额（合计）」只读 = 已勾选行返点金额之和，实时更新，带账户消耗币种；任一勾选行不合法（如被清空）时合计显示「—」（D-07-28）" }
  - { id: R-07-034, module: 客户返点弹窗, text: "返点方式：必选单选 余额抵扣 / 现金打款，默认不选，未选提示「请选择返点方式」；合计为 0 时也必选（R-07-072）" }
  - { id: R-07-035, module: 客户返点弹窗, text: "余额抵扣按客户当前生效的计费模式走（待生效的变更不算，D-00-73）：预付款 → 不选月份，方式旁说明「审批通过后按账户充入各账户余额」（D-00-19）；后付款 → 合计 > 0 时必选「纳入扣减月份」（R-07-036）；所勾计提项所属月的计费模式和当前不同时照常可勾，余额抵扣去向只看当前模式（D-07-31）。结算币种、汇率、应付金额、收款主体只在现金打款且合计 > 0 时出现（D-07-10）" }
  - { id: R-07-036, module: 客户返点弹窗, text: "纳入扣减月份（合计 > 0 时）：必选，下拉单选，选项与可结算应收由服务端下发 = 该客户符合 R-06-024 的账单（后付款、待结算、没有审批中的结算单），显示「yyyy-mm（可结算应收 {金额} {币种}）」，降序；未出账月份不出现在选项里；已被另一张审批中、合计 > 0 的客户返点单选为扣减月份的账单置灰，显示「yyyy-mm（已有审批中的扣减单 {审批单号}）」，不可选（D-07-16）；不要求晚于所勾计提项的月份；没有可选账单时提示「暂无可扣减的账单，请选择现金打款」；合计 > 所选账单可结算应收时标红提示「返点金额不能大于该月账单可结算应收 {金额}」，合计显示「—」时暂停这条校验；只校验整单合计，账户行应收因此为负也允许（D-07-16）" }
  - { id: R-07-037, module: 客户返点弹窗, text: "后付余额抵扣通过后，返点按账户加到所选账单对应账户行的「客户返点」（R-06-010）：每个账户 = 本单该账户各行实际金额之和；返点时间范围 = 这些计提项的时间范围" }
  - { id: R-07-038, module: 客户返点弹窗, text: "至少勾 1 行，否则提示「请至少勾选一项」；合计可以为 0（全部改成 0 表示这些月份不返，提交后照常结掉，D-07-17、R-07-072）" }
  - { id: R-07-039, module: 客户返点弹窗, text: "结算币种（现金打款且合计 > 0 时）：必选，下拉单选 人民币 / USD / USDT，默认客户的币种，客户币种为空时无默认值（R-04-011）" }
  - { id: R-07-040, module: 客户返点弹窗, text: "汇率（现金打款且合计 > 0 时）：结算币种与账户消耗币种相同时汇率为 1、不显示；不同时显示「汇率：1 {账户币种} = x {结算币种}（yyyy-mm-dd）」，x = 当天（UTC0）日汇率四舍五入到 4 位，显示与计算都用这 4 位，日期 = 实际取到的那天（当天没有、向前取最近一天时显示那一天）（D-00-74、D-07-06）；提交时服务端按提交当天重新取并锁定，与弹窗不同时按 R-07-051 请用户确认；取不到任何汇率时不能提交，提示「未取到 {账户币种}→{结算币种} 汇率，请稍后再试」" }
  - { id: R-07-041, module: 客户返点弹窗, text: "应付金额（现金打款且合计 > 0 时）：只读 = 返点金额（合计）× 汇率，四舍五入到 2 位，带结算币种；合计或汇率变化时实时更新；合计显示「—」时应付金额也显示「—」（D-07-09、D-07-28）" }
  - { id: R-07-042, module: 客户返点弹窗, text: "收款主体（现金打款且合计 > 0 时）：必选，下拉单选，选项 = 该客户当前生效的付款主体（我们付钱给客户，字段叫「收款主体」，D-07-29）；下拉底部入口仍叫「+ 新增付款主体」，旁加灰字「需审批通过后可选」；新增、客户没有付款主体、有审批中的付款主体变更时的提示与做法同 R-05-042（调起 04 付款主体弹窗、走付款主体变更审批、通过前不在选项里、仅「客户管理-读写」可见）；客户没有付款主体时合计 > 0 的现金打款单不能提交" }
  - { id: R-07-043, module: 客户返点弹窗, text: "备注：多行、选填，长度上限沿用现有备注输入框；即审批发起备注，同时在审批内容区展示" }
  - { id: R-07-044, module: 客户返点弹窗, text: "点「提交审批」校验 R-07-033、R-07-034、R-07-036、R-07-038～R-07-042（合计为 0 时只校验 R-07-033、R-07-034、R-07-038），不通过在对应位置提示；通过后二次确认，标题「提示」（同 R-05-078），文案「客户返点需进行审批，是否提交审批单？」（取消 / 确定），确定后按 R-07-050 复核提交" }
  - { id: R-07-072, module: 客户返点弹窗, text: "合计为 0 的单：返点 / 客情合计为 0.00 时，纳入扣减月份、结算币种、汇率、应付金额、收款主体都不出现、不校验；客户返点仍必选返点方式；合计在 0 与非 0 之间变化时这些字段实时出现或消失，已选的值保留；0 元单不占用任何账单、不触发 06 生成结算单置灰（R-06-040）；审批内容区返点方式写「余额抵扣（0 元，不扣减账单）」或「现金打款（0 元，不生成付款单）」；审批通过后计提项直接变已结算，不入桶、不计入账单、不生成付款单、不写交易明细（D-07-17）" }
  - { id: R-07-045, module: 客情费用弹窗, text: "弹窗标题「客情费用」，右上角 ✕ 关闭；顶部只读 公司名称、所属账户系统；然后是 结算币种、汇率、应付金额、收款主体、客情费用（合计）、备注；没有返点方式和纳入扣减月份，一律现金打款（D-07-05）；底部「提交审批」" }
  - { id: R-07-046, module: 客情费用弹窗, text: "计提项表两层：结算期行（勾选框、结算期、消耗金额、系统计算客情合计、客情费用合计）→ 账户行（勾选框、账户名称、消耗金额、客情时间范围、客情时间内消耗金额、系统计算客情费用、客情费用）；只列状态为「待结算」、当前用户有查看权限的账户的客情费用计提项；勾选、展开、全选、空态做法同 R-07-031、R-07-032（空态文案「暂无待结算的客情费用」）" }
  - { id: R-07-047, module: 客情费用弹窗, text: "每个账户行的「客情费用」输入框、合计、结算币种、汇率、应付金额、收款主体、备注的取值与校验同 R-07-033、R-07-038～R-07-043、R-07-072（文案中的「返点金额」改为「客情费用」）" }
  - { id: R-07-048, module: 客情费用弹窗, text: "点「提交审批」校验后二次确认，标题「提示」（同 R-05-078），文案「客情费用需进行审批，是否提交审批单？」（取消 / 确定），确定后按 R-07-050 复核提交" }
  - { id: R-07-050, module: 提交与复核, text: "确定后服务端复核：当前用户有「返点管理（查看）」和对应的结算权限点（D-13-01）；所勾计提项都仍是「待结算」、都在当前用户可见账户内、系统计算金额与弹窗打开时一致；客户计费模式与弹窗打开时一致；后付余额抵扣且合计 > 0 时所选账单仍符合 R-06-024、没有被其他审批中的扣减单占用、且合计 ≤ 其当前可结算应收；现金打款且合计 > 0 时汇率与弹窗一致、所选收款主体仍在客户当前生效的付款主体里；并发提交同一账单的扣减单只成功一张" }
  - { id: R-07-051, module: 提交与复核, text: "复核失败时不建单、弹窗不关：①计提项金额或状态变了：按最新数据就地重载，保留结算币种、收款主体、备注、返点方式、勾选状态；值没变的行原样保留；值变了的行标黄「系统计算值已由 X 变为 Y」，用户没改过的跟随新值、改过的保留用户填的值；已经不能选的计提项取消勾选并标「状态已变化」；顶部提示「数据已更新，请核对后重新提交」，用户再点一次提交才建单；②计费模式变了：同样就地重载，顶部提示「客户计费模式已变化，请核对后重新提交」；③所选账单已不可扣减或被占用：「所选月份账单已不可扣减，请重新选择」，清空纳入扣减月份；④提交当天汇率与弹窗不同：返回新汇率，弹确认「汇率已更新为 1 {账户币种} = x {结算币种}（yyyy-mm-dd），换算后金额 {Y}，是否按新汇率提交？」，点确定后按新汇率建单；⑤收款主体已失效：「收款主体已变更，请重新选择」。同一弹窗连续点击只提交一次，请求中按钮显示加载（D-07-27）" }
  - { id: R-07-052, module: 提交与复核, text: "复核通过后提交审批（R-12-001）：类型「返点管理—客户返点」或「返点管理—客情费用」；操作对象客户 = 本客户；涉及账户 = 所勾计提项的账户（D-00-76）；业务单据 = 弹窗全部内容 + 汇率与汇率日期 + 应付金额 + 所勾计提项的全部快照（R-07-010）；发起备注 = 备注。成功后按 12 R-12-018 给弱提示（审批中「已提交审批」；免审直接通过「提交成功，无需审批，已生效」）、关闭弹窗，所勾计提项变「审批中」" }
  - { id: R-07-053, module: 提交与复核, text: "有选了某月扣减、合计 > 0、仍在审批中的客户返点单时，06 该月账单「生成结算单」置灰（R-06-040、D-06-23）" }
  - { id: R-07-054, module: 审批结果, text: "审批流 0 节点或全部节点被跳过时提交即通过（R-12-018），立即按 R-07-055～R-07-058 处理" }
  - { id: R-07-055, module: 审批结果, text: "客户返点单审批通过（R-12-025），预付款 + 余额抵扣、合计 > 0：单内每个账户的实际金额之和 > 0 时，给该账户按 R-05-004 ③ 入一个分桶（费率快照 0，R-05-005；不清零额度，R-05-011）；写一条「客户返点」交易明细，状态已完成：发起时间 = 申请时间，充值金额 = 合计（账户币种），应付金额「-」，账户列表每个账户一行「{账户名称} +{金额} {币种}」，关联审批单号，备注 = 备注；计提项变「已结算」。提交时为预付款、客户预付改后付生效时仍在审批中的，通过后照常按提交时的快照成桶（费率 0），之后按 R-05-118 ① 保留（D-07-33）" }
  - { id: R-07-056, module: 审批结果, text: "客户返点单审批通过，后付款 + 余额抵扣、合计 > 0：按 R-07-037 计入所选账单（06 按 R-06-010、R-06-019 刷新）；计提项变「已结算」；不写交易明细（不动钱、不动余额，结算单支付时体现，D-07-18）" }
  - { id: R-07-057, module: 审批结果, text: "现金打款（客户返点或客情费用）审批通过且合计 > 0：生成一张 09 付款单（交易类型 客户返点 / 客情费用，应付 = 应付金额，币种 = 结算币种，收款主体，关联本单与审批单）；写一条对应交易类型的交易明细，状态待完成：发起时间 = 申请时间，充值金额「-」，应付金额 = 应付金额（结算币种，正数，D-07-18），账户列表每个账户一行「{账户名称} {金额} {账户币种}」，关联审批单号，备注 = 备注；计提项变「待打款」（D-07-18）" }
  - { id: R-07-058, module: 审批结果, text: "合计为 0 的单（余额抵扣或现金打款）审批通过：按 R-07-072 处理，计提项直接变「已结算」" }
  - { id: R-07-059, module: 审批结果, text: "09 付款单变「已完成」（确认到账，D-00-33、R-09-071）时：该单计提项变「已结算」并记结算时间；交易明细由 05 按 R-05-095 变已完成。09 确认汇款后付款单为「待完成」，计提项仍为「待打款」、不回写（R-09-042）。本期付款单不作废、不退回（D-00-69），本页没有付款单作废后的回退" }
  - { id: R-07-060, module: 审批结果, text: "审批单变为已驳回、已撤回或被作废（作废效果同撤回，R-12-046、D-00-79）：计提项回到「待结算」并按 R-07-009 重算（重算为 0 的变无返点 / 无客情），不动任何余额、账单、付款数据；原单不能修改重提，要再申请需重新打开弹窗（R-12-034）" }
  - { id: R-07-061, module: 审批结果, text: "按 R-12-045 列明本包的最终通过执行失败情形：没有（D-00-79）——后付余额抵扣不再复核所选账单可结算应收，照常生效（D-00-67）；审批期间账单金额变小导致可结算应收被扣成负数的，由 06 在生成结算单时应付固定 0.00、超出部分结转下期（R-06-077、R-06-078）；预付抵扣、现金打款通过时也不复核" }
  - { id: R-07-062, module: 已提交审批, text: "已提交审批只展示当前登录账号提交的客户返点单、客情费用单（含免审直接通过的单，R-12-018；同 R-05-087 做法）" }
  - { id: R-07-063, module: 已提交审批, text: "搜索框按审批单号、公司名称包含匹配；筛选 操作对象（全部 / 客户返点 / 客情费用）、审批状态（全部 / 审批中 / 已通过 / 已驳回 / 已撤回），默认全部" }
  - { id: R-07-064, module: 已提交审批, text: "列表字段：审批单号、操作对象（客户返点 / 客情费用）、操作客户（公司名称）、所属账户系统（客户当前的）、申请人（已禁用时按 R-12-049 显示「姓名（已禁用）」）、申请时间（yyyy-mm-dd hh:mm:ss，Asia/Shanghai）、审批状态、执行状态、操作；执行状态只有已通过的单有值：「已充入余额」（预付抵扣）、「已计入 yyyy-mm 账单」（后付抵扣）、「付款单待汇出 / 付款单待完成 / 已到账」（现金打款，按 09 R-09-073 按审批单号取付款单状态）、「已结清（0 元）」，其余显示「-」（D-07-30）；排序 审批中置顶，其余按申请时间降序；分页 10 / 50 / 100 / 300，默认 10；没有数据显示「暂无数据」" }
  - { id: R-07-065, module: 已提交审批, text: "行操作：所有状态都有「详情」，新页打开审批详情（12 统一的审批详情页，按审批单号打开）；只有审批中有「撤回」，只校验申请人本人与单据审批中、不校验「返点结算」「客情结算」权限点（D-00-79）；确认文案、后果与通知按 12（R-12-032～R-12-035），撤回后按 R-07-060 处理" }
  - { id: R-07-066, module: 审批内容, text: "审批信息区按 12（R-12-026），审批事项「返点管理」、审批类型「客户返点」或「客情费用」" }
  - { id: R-07-067, module: 审批内容, text: "客户返点单内容区依次：公司名称（超链接，新页打开客户详情 R-04-050）、所属账户系统（客户当前的）、计费模式（提交时快照）、返点方式（合计为 0 时写法按 R-07-072）、纳入扣减月份（后付余额抵扣且合计 > 0 时，yyyy-mm）、返点金额（合计，带账户币种）、结算币种 / 汇率与汇率日期（币种不同时，「1 {账户币种} = x {结算币种}（yyyy-mm-dd）」）/ 应付金额 / 收款主体（现金打款且合计 > 0 时）、备注（空显示「-」）；下面是计提项表；审批通过后内容区底部显示执行结果：「已计入 yyyy-mm 账单」「已充入余额」「付款单：{财务ID} · {状态}」或「已结清（0 元）」（D-07-30；展示位置随 12 统一审批详情页）" }
  - { id: R-07-068, module: 审批内容, text: "客户返点计提项表：结算期行（结算期、消耗金额、MAX消耗、系统计算返点合计、返点金额合计）→ 账户行（账户名称、消耗金额、MAX消耗、返点时间范围、返点时间内消耗金额、客户返点比例、系统计算返点、返点金额）；只列本单包含的计提项，不带勾选框；全部取单据快照；返点金额与系统计算返点不同的行，返点金额标红并带「已调整」（D-07-19）" }
  - { id: R-07-069, module: 审批内容, text: "客户返点比例 / 客情费用比例按分段快照展示：每段一行「yyyy-mm-dd 至 yyyy-mm-dd：」加 R-03-037 的比例写法（固定「x.xx%」或「阶梯（按月统计 / 按日统计）」加档位；客情阶梯为「阶梯（按自然月）」），比例后加「（规则起始 yyyy-mm-dd）」，便于和 03 历史规则对上（D-03-24）" }
