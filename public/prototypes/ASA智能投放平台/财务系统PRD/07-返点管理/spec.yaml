# 07-返点管理 · 机器可读规格（2026-10-19 用户两轮问答 D-07-01～11；代定清单用户同意开写，评审时确认 Q-07-05；2026-10-21 总控代改：按会议清单 v2 回写；2026-10-22 总控代改：按闭环问题清单回写）
# 来源：html/返点管理.html:1828–3910（列表 / 两个弹窗 / 已提交审批，无 V2.1 注释）、html/审批详情-返点管理.html:1828–3057 + 版本 index §2.5 + 用户确认（见 decisions）
# 本页主管：返点计提项（账户 × 自然月 × 客户返点 / 客情费用）及其状态机、返点与客情的金额计算；客户返点单、客情费用单（「返点管理—客户返点」「返点管理—客情费用」审批的业务单据）。
# 本页不定义：规则配置与取用口径（03）、客户（04）、分桶 / 交易明细（05）、账单与可扣减判断（06）、付款单（09）、审批引擎（12）。
# 公共前置（返点 / 客情部分为本页补充；账户、币种、汇率与 06 公共前置一致）：
#   后付款客户「橙子出行科技有限公司」（币种 人民币，销售 李娜，所属账户系统 苹果ASA（自接苹果），付款主体 橙子出行科技有限公司、Orange Mobility Ltd）。
#   账户 C「橙子-iOS-CN」（orgid 5130021，消耗币种 USD），消耗首日 2026-08-20（第 90 天 = 2026-11-17）；规则：2026-09-01 起 返点 固定 2.00%、客情 按自然月每月返还 固定 1.00%；2026-10-16 起 返点 固定 3.00%、客情不变；2026-09-01 前没有规则。
#     消耗：2026-08-20～08-31 4,000.00（MAX 500.00）；2026-09 20,000.00（MAX 5,000.00）；2026-10-01～10-15 9,000.00（MAX 1,000.00）、10-16～10-31 11,000.00（MAX 0）。
#   账户 D「橙子-iOS-HK」（orgid 5130048，消耗币种 USD），消耗首日 2026-07-10（第 90 天 = 2026-10-07）；规则 2026-09-01 起：返点 阶梯 按月统计 [0, 10,000.00) 1.00%、[10,000.00, 不限) 2.00%，客情 无客情。
#     消耗：2026-09 12,000.00（MAX 3,000.00）；2026-10-01～10-07 2,800.00（MAX 0）、10-08～10-31 9,000.00。
#   橙子 2026-09 账单（06）出账后待结算、无在途结算单，未扣返点时可结算应收 35,340.00 USD（C 22,260.00 + D 13,080.00）。
#   预付款客户「星海网络科技有限公司」（币种 人民币，销售 张伟，付款主体 Starfish Ltd、星海网络科技有限公司）；账户 A「星海-iOS-US」（orgid 4521873，消耗币种 USD），消耗首日 2026-09-12（第 90 天 = 2026-12-10）；规则 2026-09-01 起：返点 固定 1.50%、客情 首次消耗起 90 天 固定 0.50%；2026-09 消耗 2,000.00（MAX 400.00）；2026-12-01～12-10 消耗 1,000.00（MAX 0）、12-11～12-31 2,100.00。
#   2026-10-05 日汇率 1 USD = 7.1234 人民币（已四舍五入到 4 位）。今天 2026-10-05（UTC0）。
#   操作人 王敏 有「返点结算」「客情结算」权限点，能看 C、D、A；赵磊 有两个权限点，只能看 C；以下用户除特别说明外都有「返点管理（查看）」权限点。样例假设上线月（index S-18）不晚于 2026-08。

meta:
  feature: 返点管理
