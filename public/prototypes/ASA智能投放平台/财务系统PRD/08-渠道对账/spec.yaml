decisions:
  - { id: D-08-01, point: "渠道是什么", conclusion: "渠道 = 账户系统；「同渠道同结算期」= 同账户系统 × 同结算期", impact: "全页", status: "已定" }
  - { id: D-08-02, point: "上传批次", conclusion: "弹窗只选结算期；文件里可混多个账户系统，按账户系统 × 结算期分别整批替换；一次上传一张审批单", impact: "R-08-021、R-08-031、R-08-038", status: "已定" }
  - { id: D-08-03, point: "同批同 orgid 多行", conclusion: "该 orgid 的所有行都报错、不入账", impact: "R-08-034", status: "已定" }
  - { id: D-08-04, point: "上传金额币种", conclusion: "按该账户的消耗币种理解，不换算；模板不加币种列", impact: "R-08-007、R-08-015", status: "已定" }
  - { id: D-08-05, point: "MAX消耗", conclusion: "系统里该账户本结算期 MAX 类型广告系列消耗（D-00-15 同口径），只展示供核对", impact: "R-08-020", status: "已定" }
  - { id: D-08-06, point: "渠道付款「充值金额」", conclusion: "原型复制残留，弹窗与审批详情都去掉", impact: "R-08-041、R-08-072", status: "已定" }
  - { id: D-08-07, point: "付款粒度", conclusion: "一个账户系统 × 结算期一张渠道付款单；应付 = 该行总计、不可改；可选结算币种（D-00-62）；同一行最多 1 张在途", impact: "R-08-040～R-08-046", status: "已定" }
  - { id: D-08-08, point: "已付后金额变化", conclusion: "只记录变化，状态不变，线下处理；不生成补付 / 退款单", impact: "R-08-025、R-08-091", status: "已定" }
  - { id: D-08-09, point: "校验时机", conclusion: "提交前先解析校验，审批前就抛错误清单，问是否继续上传，可带错误行提交；审批通过后再校验一次，有错的跳过，只录入正确的", impact: "R-08-037、R-08-051", status: "已定（用户原话：审批之前就说有哪几行会出问题……审批后有错误的话，就跳过，只录入正确的）" }
  - { id: D-08-10, point: "操作对象客户", conclusion: "渠道对账、渠道付款两种审批都不传操作对象客户；12 不给这两类提供动态选项（2026-10-21 改写，见 D-08-41）", impact: "R-08-038、R-08-046、R-08-050", status: "已定（2026-10-21 改写：用户定，会议清单 D117）" }
  - { id: D-08-11, point: "权限", conclusion: "3 个权限点：渠道对账中心（查看）、导入渠道账单、渠道付款；有查看权限即看全部账户系统、全部账户", impact: "R-08-080～R-08-082", status: "已定" }
  - { id: D-08-12, point: "来源判定与模板", conclusion: "抓取 / 上传按账户系统由技术预置，页面不做配置；模板 xlsx，「返点金额」列改叫「渠道返点」", impact: "R-08-016、R-08-032", status: "已定" }
  - { id: D-08-13, point: "缺数据账户能否付款", conclusion: "不拦，弹窗提示 N 个有消耗的账户还没有渠道统计金额", impact: "R-08-043", status: "已定" }
  - { id: D-08-14, point: "顶栏账户系统", conclusion: "页面不跟随顶栏账户系统，用页内筛选（默认全部）；搜索按账户名称 / orgid", impact: "R-08-001、R-08-009", status: "已定（用户确认代定清单）" }
  - { id: D-08-15, point: "第一层何时出行", conclusion: "账户系统 × 结算期有任一账户有消耗或有渠道数据就出行，当月也显示", impact: "R-08-002", status: "已定（用户确认代定清单）" }
  - { id: D-08-16, point: "行状态", conclusion: "只有 待完成 / 已完成，已完成 = 渠道付款对应付款单已完成；在途时操作列「付款中」；筛选「待结算 / 已结算」是残留", impact: "R-08-008、R-08-011", status: "已定（用户确认代定清单）" }
  - { id: D-08-17, point: "抓取口径", conclusion: "账户行 = 订单总计之和，第一层按订单号去重（同 06）；渠道返点「-」；上传的没有第三层", impact: "R-08-017、R-08-019、R-08-006", status: "已定（用户确认代定清单）" }
  - { id: D-08-18, point: "导入结算期与行校验", conclusion: "只能选已结束月份；6 列必填、金额 ≥ 0 四舍五入 2 位、账户系统存在且非抓取、orgid 存在且属于该账户系统、同 orgid 多行全报错；错误清单 = 原始行号 + 原因，可下载", impact: "R-08-031、R-08-034、R-08-039", status: "已定（用户确认代定清单）" }
  - { id: D-08-19, point: "在途冲突与驳回", conclusion: "文件里某账户系统同结算期已有审批中的导入单则整份不能提交；驳回 / 撤回不入账，可重新导入", impact: "R-08-036、R-08-052", status: "已定（用户确认代定清单）" }
  - { id: D-08-20, point: "整批替换范围", conclusion: "该账户系统该结算期旧数据整体失效，新文件里没有的 orgid 变回「-」", impact: "R-08-021", status: "已定（用户确认代定清单）" }
  - { id: D-08-21, point: "付款在途 / 已完成后导入", conclusion: "付款在途也能导入，付款金额按提交时快照；已完成后金额变了，行上标「金额有变化」、悬浮看已付与现总计，并记变化日志", impact: "R-08-022、R-08-025", status: "已定（用户确认代定清单）" }
  - { id: D-08-22, point: "渠道付款弹窗", conclusion: "结算期、账户系统、小计、税费、渠道返点、总计、应付（= 总计）、结算币种（默认本行币种）、汇率与换算后应付（币种不同时）、缺数据提示、备注选填", impact: "R-08-041～R-08-044", status: "已定（用户确认代定清单）" }
  - { id: D-08-23, point: "渠道付完判定（给 10）", conclusion: "账户有渠道统计金额，且所在账户系统该结算期行状态为已完成；2026-10-21 补：付款后才有值或金额变化的同样算付完，抓取类无订单账户与 0.00 行例外见 D-08-35、D-08-34（D-00-65 ③）", impact: "R-08-091", status: "已定（用户确认代定清单；2026-10-21 用户定补充，会议清单 D12、D33）" }
  - { id: D-08-24, point: "模板结构与导入弹窗备注", conclusion: "模板第一个工作表放数据、第二个工作表「填写说明」带示例不读；导入弹窗加选填「备注」作发起备注", impact: "R-08-031、R-08-032", status: "已定（依据：示例行放在数据表里容易被当数据导入；12 各类审批都带发起备注；2026-10-21 用户确认，由代定转已定）" }
  - { id: D-08-25, point: "已提交审批范围与列", conclusion: "只列当前登录账号提交的两种渠道审批单；原型「操作对象」列改「审批类型」，另加结算期、账户系统列", impact: "R-08-060、R-08-061", status: "已定（依据：与 06 R-06-060、R-06-061 做法一致；2026-10-21 用户确认，由代定转已定）" }
  - { id: D-08-26, point: "两种审批内容区字段", conclusion: "按 R-08-071、R-08-072；渠道对账要给审批人看到校验结果、按账户系统汇总、当前生效总计与「入账影响」表（D-08-33）", impact: "R-08-071、R-08-072", status: "已定（2026-10-21 用户定，会议清单 D59）" }
  - { id: D-08-27, point: "09 付款单作废 / 退回（原开放问题，2026-10-20 关闭）", conclusion: "本期收付款单不支持作废、退回、撤销，生成后只往前推进；本行在付款单已完成前一直是待完成、「付款中」，不能重新发起渠道付款；后续版本再加", impact: "flows 渠道账单行 reverse、R-08-092", status: "已定（D-00-69，用户 2026-10-20 在 09 会话确认）" }
  - { id: D-08-28, point: "上线前的历史月份（S-18）", conclusion: "08 第一层只出结算期 ≥ 上线月的行，导入结算期下限 = 上线月；上线月 = 第一个在系统里付渠道款的结算期，具体月份上线前定；2026-10-22 改：06 出账单、07 计提、08 渠道、10 利润、11 提成从同一个上线月起算，共用一个配置，即 index S-18 的上线月（D-10-08）", impact: "R-08-002、R-08-009、R-08-031；关闭 Q-08-04", status: "已定（2026-10-21 用户定，会议清单 D60；2026-10-22 用户与技术确认，闭环清单 A01）" }
  - { id: D-08-46, point: "行状态变化通知 10", conclusion: "第一层行状态变化（付款单完成变已完成 R-08-054；0.00 行视为已完成或回到待完成 R-08-056）与渠道统计金额变化一样通知 10，10 按 R-10-023「完成条件变化」重算", impact: "R-08-024", status: "已定（2026-10-22 用户与技术确认，闭环清单 B01）" }
  - { id: D-08-47, point: "换算后应付为 0.00", conclusion: "换算后应付为 0.00 时不能提交，提示「换算后应付金额为 0.00，请改用 {本行币种} 结算」；提交时服务端复核同样拦截", impact: "R-08-042、R-08-045、R-08-053", status: "已定（2026-10-22 用户与技术确认，闭环清单 B06）" }
  - { id: D-08-48, point: "苹果订单截止日未到时的折算", conclusion: "截止日期晚于今天时先按最近一天的汇率暂时折算；截止日当天汇率入库后重折一次，变化记为「订单数据更新」，之后不再变（06 同步）", impact: "R-08-017", status: "已定（2026-10-22 用户与技术确认，闭环清单 B07）" }
  - { id: D-08-49, point: "付款后整行清成「-」的金额变化提示", conclusion: "当前总计为「-」时「金额有变化」悬浮显示「已付 {已付总计}，现总计 -，差额按 0 计为 −{已付总计}」", impact: "R-08-025", status: "已定（2026-10-22 用户与技术确认，闭环清单 B21）" }
  - { id: D-08-29, point: "同账户系统同月币种", conclusion: "同一账户系统同一结算期只有一个币种（= 账户系统币种，技术答复 T08）；以「账户系统 × 结算期」为键，导入币种取账户系统币种", impact: "R-08-015；关闭 Q-08-02", status: "已定（2026-10-21 用户定，会议清单 D106）" }
  - { id: D-08-30, point: "系统抓取判定与苹果订单口径", conclusion: "系统抓取 = 从苹果同步订单、按订单号结算的账户系统；LOC 订单按账单月份落 UTC0 自然月，币种不同按截止日汇率折算；CC 订单按交易日归期与折算；有税费字段照实展示，没有（USD 体系、老数据为空）显示「-」、总计 = 小计，不补 0、不反推", impact: "R-08-016、R-08-017、R-08-019；关闭 Q-08-01", status: "已定（2026-10-21 用户定，会议清单 D13-税费列、D103，技术答复 T09）" }
  - { id: D-08-31, point: "渠道付款的收款主体", conclusion: "后端「付款主体」是渠道收款方，改叫「收款主体」；08 发起时选填（选项为该渠道填过的值，手填新值自动追加，上线预置渠道名称），写入快照，09 列表显示；收款账号本期不展示", impact: "R-08-041、R-08-046、R-08-047、R-08-053、R-08-072", status: "已定（2026-10-21 用户定，会议清单 D14-付款主体，技术答复 T06）" }
  - { id: D-08-32, point: "变化记录的入口与范围", conclusion: "本行有任一条变化日志就显示「变化记录」，可与「渠道付款」「付款中」并列；弹窗列本行全部日志并插入「付款提交」「付款完成」时间点行", impact: "R-08-011、R-08-025", status: "已定（2026-10-21 用户定，会议清单 D58，A 档按推荐）" }
  - { id: D-08-33, point: "入账影响表", conclusion: "校验结果、无错误行确认框、审批内容区都带「入账影响」表（将清空置顶标红 / 金额变化 / 新增 / 其余不变计数）；入账结果补「因跳过而清空」", impact: "R-08-026、R-08-037、R-08-071", status: "已定（2026-10-21 用户定，会议清单 D59，A 档按推荐）" }
  - { id: D-08-34, point: "总计为 0 或负数的行", conclusion: "第一层总计 > 0 才能发起渠道付款；0.00（有值）的行结算期结束后视为已完成、10 判付完；总计 < 0 不能发起，线下处理（已知限制）", impact: "R-08-040、R-08-056、R-08-091", status: "已定（2026-10-21 用户定，会议清单 D33-08 总计为 0，D-00-80）" }
  - { id: D-08-35, point: "渠道付完补充（给 10）", conclusion: "毛利扣当前渠道统计金额，不做收口动作；付款后才有值或金额变化的账户同样算付完；系统抓取类所属行已完成后，本期有消耗无订单的账户视为付完、10 按 0 计，订单到了退回重算；共享订单 10 按 R-10-006 拆分", impact: "R-08-025、R-08-091", status: "已定（2026-10-21 用户定，会议清单 D12-口径、D12-无订单账户、D13-口径）" }
  - { id: D-08-36, point: "渠道付款复核不通过", conclusion: "不再要求关闭重开：不建单、弹窗不关，按最新数据就地重载并标黄变化，用户再提交一次才建单", impact: "R-08-045", status: "已定（2026-10-21 用户定，会议清单 D35-复核失败，A 档按推荐）" }
  - { id: D-08-37, point: "结算汇率精度与日期", conclusion: "汇率 = 日汇率四舍五入 4 位，显示与计算一致；汇率后显示实际取数日期并进快照；提交时汇率变了弹确认后按新汇率建单", impact: "R-08-042、R-08-045、R-08-072", status: "已定（2026-10-21 用户定，会议清单 D35-汇率变化、D36，D-00-74）" }
  - { id: D-08-38, point: "在途单提示句式", conclusion: "在途提示带「审批单号、申请人」或「付款单财务ID、状态」，单号可点；用提示框不用自动消失的弱提示", impact: "R-08-036、R-08-045", status: "已定（2026-10-21 用户定，会议清单 D40、附 1 B2，A 档按推荐）" }
  - { id: D-08-39, point: "录入形态与选错结算期", conclusion: "只有「导入 → 审批」一条入口，不做单条录入、草稿、跨月合并付款、补充账单；选错结算期不能清回「未上传」，写成已知限制，导入时非上个月黄字提醒", impact: "§1.2、R-08-031、§2.2.4 已知限制", status: "已定（2026-10-21 用户定，会议清单 D14-入口形态、D14-作废分段，A 档按推荐）" }
  - { id: D-08-40, point: "渠道返点冲抵说明", conclusion: "本期不加「小计 + 税费 − 渠道返点 = 总计」校验、10 不加项；模板填写说明与导入弹窗写明「总计 = 冲抵渠道返点后的实际应付」；单独打回的渠道返点下期再做", impact: "R-08-031、R-08-032、已知限制", status: "已定（2026-10-21 用户定，会议清单 D107）" }
  - { id: D-08-41, point: "渠道两类审批的审批流与通过口径", conclusion: "不提供动态选项（只能配指定用户）；提交时按 D-00-76 传涉及账户；最终通过不设业务执行失败情形（错误行跳过不算失败）；撤回只校验申请人本人；「审批配置」可作废，效果同撤回；提交提示按 R-12-018 区分免审", impact: "R-08-038、R-08-046、R-08-050～R-08-052、R-08-055、R-08-057、R-08-062", status: "已定（2026-10-21 用户定，会议清单 D117、D26、D28、D29、D81、D85，D-00-76、D-00-79）" }
  - { id: D-08-42, point: "共享订单标注", conclusion: "第三层同一订单在各账户下标注「与 {账户} 共享，各账户全额列示，第一层只算一次」；付款弹窗与审批内容只在有共享订单时显示去重说明", impact: "R-08-006、R-08-041、R-08-072", status: "已定（2026-10-21 用户定，会议清单 D13-共享标注，A 档按推荐）" }
  - { id: D-08-43, point: "审批中渠道总计变化提示", conclusion: "渠道付款审批中、该行当前总计 ≠ 快照时，内容区顶部黄色提示差额，本单仍按快照付款；审批结束后不显示", impact: "R-08-070", status: "已定（2026-10-21 用户定，会议清单 D27-渠道变化提示，D-00-75）" }
  - { id: D-08-44, point: "0.00 行视为已完成是否可逆", conclusion: "第一层总计 0.00 的行结算期结束后、无在途且无已完成渠道付款时视为已完成；之后总计变为非 0 且该行从没付过款时回到待完成，按 R-08-040 处理，10 按 D-00-66 退回重算", impact: "R-08-056、R-08-091；flows 渠道账单行", status: "已定（2026-10-21 用户确认）" }
  - { id: D-08-45, point: "标准上传模板", conclusion: "R-08-032 与 PRD §2.3.2 现稿即定稿：6 列（账户系统、orgid、消耗金额、税费、渠道返点、总计金额）、第二个工作表「填写说明」含示例行、导入时不读", impact: "R-08-032", status: "已定（2026-10-21 用户确认）" }

open_questions:
  - { id: Q-08-01, question: "【已关闭 2026-10-21 → D-08-30（技术答复 T09）】原问题：哪些账户系统是「系统抓取」（自接苹果，有订单数据），其余为上传；订单数据现有字段与接口（与 06 的 Q-06-02 同一个问题，一起答）", owner: "技术负责人", blocks: "T-08-002", due: "—" }
  - { id: Q-08-02, question: "【已关闭 2026-10-21 → D-08-29（技术答复 T08）】原问题：同一个账户系统下所有账户的消耗币种是否一定相同（第一层合计与渠道付款都按一个币种算）；不相同的话第一层怎么合计、付款怎么拆", owner: "技术负责人核实 → 不一致时问用户", blocks: "—", due: "—" }
