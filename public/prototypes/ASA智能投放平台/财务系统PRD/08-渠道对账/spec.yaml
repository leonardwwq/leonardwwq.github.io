# 08-渠道对账 · 机器可读规格（2026-10-19 用户两轮问答 + 代定清单确认「都可以，开写」）
# 来源：html/渠道对账中心.html:1828–3293（列表三层 / 渠道付款弹窗 / 导入弹窗 / 已提交审批）、html/审批详情-渠道对账中心.html:1828–2322；3 份渠道样表（只参考格式，D-00-27）+ 用户确认（见 decisions）
# 本页主管：渠道导入批次（含批次分段）、渠道统计金额（账户 × 结算期）、渠道账单行（账户系统 × 结算期）及其状态、渠道付款单（「渠道对账中心—渠道付款」审批的业务单据）、渠道金额变化日志；「渠道对账中心—渠道对账 / 渠道付款」两种审批的业务处理与审批内容区。
# 本页不定义：账户（02）、账单与账单里渠道两列的展示（06）、付款单与付款执行（09）、利润计算（10）、客户返点（07）、审批引擎与审批详情框架（12）。
# 公共前置（以下 G 均基于此，另写的以 G 内为准）：
#   今天 2026-10-20（UTC0）；2026-10-20 日汇率 1 USD = 7.1234 人民币（已按 D-00-74 四舍五入到 4 位）。上线月（S-18、D-08-28）= 2026-09，另写的以 G 内为准。
# 2026-10-21 总控代改：按会议清单 v2 回写（D12、D13、D14、D26～D29、D33、D35、D36、D40、D58～D60、D85、D103、D105～D107、D117 等），见 PRD 与 decisions D-08-28～D-08-43。
# 2026-10-22 总控代改：按闭环清单 A01、B01、B06、B07、B21、D 组 R-08-072 回写，见 decisions D-08-28（改写）、D-08-46～D-08-49。
#   账户系统「亨利-国内」：上传，币种 人民币；账户 青柠-iOS-CN（orgid 8630011）、青柠-iOS-TW（8630012）、木棉记账（8630013），2026-09 消耗 16,000.00 / 5,500.00 / 6,800.00 人民币，MAX消耗 2,000.00 / 0.00 / 0.00。
#   账户系统「亨利-出海」：上传，币种 USD；账户 Kredi Plus（8527001）、OfferGo（8527002）、Moma Live（8527003），2026-09 消耗 20,100.00 / 1,230.00 / 810.00 USD。
#   账户系统「苹果ASA（自接苹果）」：系统抓取，币种 USD；账户 橙子-iOS-CN（5130021）、橙子-iOS-HK（5130048）；2026-09 苹果订单 PR-0901 小计 12,000.00 总计 12,000.00（只在 5130021 下）、PR-0902 8,000.00 / 8,000.00（两个账户下都有）、PR-0903 4,000.00 / 4,000.00（只在 5130048 下）；USD 体系订单没有税费字段（税费为空，D-08-30）；账户系统上线时预置收款主体选项「亨利-出海」「亨利-国内」「苹果ASA（自接苹果）」（= 渠道名称，D-08-31）。
#   已生效批次 SP-0901（亨利-国内 · 2026-09）：8630011 小计 16,277.43 税费 976.65 渠道返点 0.00 总计 17,254.07；8630012 5,482.11 / 328.93 / 0.00 / 5,811.04；8630013 6,774.44 / 406.47 / 500.00 / 6,680.91。
#   已生效批次 SP-0902（亨利-出海 · 2026-09）：只有 8527001 一行 20,145.70 / 0.00 / 2,618.94 / 17,526.76。
#   操作人 王敏、周琳 有「渠道对账中心」「导入渠道账单」「渠道付款」三个权限点；赵磊 只有「渠道对账中心」；孙婷 三个都没有。
#   SP-0901、SP-0902 入账时已按 R-08-023 各记了「- → 总计」的变化日志；苹果ASA 订单入数时记了「订单数据更新」日志。

meta:
  feature: 渠道对账
  product: ASA
  version: v2.1.0
  page: 08-渠道对账
  date: 2026-10-19
  prd: PRD.md
  status: 待评审
scope:
  in:
    - "渠道对账中心页：渠道账单 tab（账户系统 × 结算期 → 账户 → 订单三层）、已提交审批 tab"
    - "渠道统计金额口径：系统抓取（订单数据）/ 上传（标准模板），账户 × 结算期，整批替换，变化日志"
    - "导入渠道账单：标准模板、提交前校验与错误清单、「渠道对账中心—渠道对账」审批、审批通过后再校验入账"
    - "渠道付款：弹窗、结算币种与汇率、「渠道对账中心—渠道付款」审批、审批通过生成 09 付款单、付款完成后行状态"
    - "两类审批的审批内容区；本页 3 个权限点；给 06 / 09 / 10 的接口点"
  out:
    - "付款单本身、确认汇款 / 到账、付款凭证（归 09）"
    - "账单里渠道统计金额 / 消耗差额的展示与去重（归 06，R-06-014～R-06-018）"
    - "客户返点（归 07）；利润计算（归 10）"
    - "付款后金额变化的补付 / 退款单据（线下处理，D-08-08）"
    - "单条录入、草稿、跨月合并付款、补充账单（补充数据一律导入修正文件整批替换，D-00-30、D-08-39）；作废当前生效分段（选错结算期按已知限制处理，D-08-39）"
    - "渠道收款账号的展示与维护；收款主体的单独维护页面（D-08-31）"
    - "渠道返点隔月单独打回的收款记录（下期再做，D-08-40）"
    - "抓取 / 上传来源的页面配置（技术预置，D-08-12）"
    - "审批引擎、撤回、通知、审批详情通用框架（归 12）"

roles:
  - { role: "有「渠道对账中心」权限点的用户", can: ["进入渠道对账中心", "查看全部账户系统、全部账户的渠道账单", "只读查看渠道对账、渠道付款审批详情"], cannot: ["导入渠道账单（另需权限点）", "发起渠道付款（另需权限点）"], source: "新增权限点（R-08-080，13 汇总）" }
  - { role: "另有「导入渠道账单」权限点的用户", can: ["导入渠道账单并提交审批", "撤回自己提交的审批中渠道对账单"], cannot: ["导入系统抓取的账户系统"], source: "新增权限点（R-08-080）" }
  - { role: "另有「渠道付款」权限点的用户", can: ["对符合条件的行发起渠道付款", "撤回自己提交的审批中渠道付款单"], cannot: ["修改应付金额"], source: "新增权限点（R-08-080）" }
  - { role: "审批人", can: ["在审批详情通过 / 驳回"], cannot: ["修改审批内容"], source: "12 审批单快照" }
  - { role: "系统", can: ["按订单数据更新抓取账户系统的渠道统计金额", "审批通过后入账替换", "生成付款单", "记变化日志、通知下游"], cannot: [], source: "R-08-017、R-08-021、R-08-051、R-08-053" }

entities:
  - name: 渠道导入批次
    key: channel_import_batch
    note: "一次导入 = 一个批次 = 一张「渠道对账」审批单；只含一个结算期，可含多个账户系统（D-08-02）；key 为文档内称呼，落库方式由技术定"
    fields:
      - { key: "batch_id", label: "批次ID", type: "string", required: true, generated: true, rule: "唯一" }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "yyyy-mm（UTC0 自然月），只能选已结束的月份（R-08-031）" }
      - { key: "file", label: "渠道账单文件", type: "ref", required: true, rule: ".xlsx 原文件，留存可下载（R-08-031、R-08-071）" }
      - { key: "row_total", label: "数据行数", type: "int", required: true, generated: true, rule: "R-08-037" }
      - { key: "row_valid", label: "提交时可入账行数", type: "int", required: true, generated: true, rule: "R-08-037" }
      - { key: "row_error", label: "提交时错误行数", type: "int", required: true, generated: true, rule: "R-08-037" }
      - { key: "submit_errors", label: "提交时错误清单", type: "list", required: false, rule: "每项：原始行号、账户系统、orgid、错误原因（R-08-034、R-08-035）" }
      - { key: "valid_rows", label: "可入账行", type: "list", required: true, rule: "每项：原始行号、账户系统、orgid、账户、小计、税费、渠道返点、总计（四舍五入后）" }
      - { key: "system_summary", label: "按账户系统汇总", type: "list", required: true, rule: "每项：账户系统、可入账行数、小计、税费、渠道返点、总计、提交时当前生效总计（R-08-071）" }
      - { key: "post_impact", label: "入账影响", type: "list", required: true, rule: "提交时快照：将清空 / 金额变化 / 新增的账户，每项 账户系统、账户名称、orgid、当前生效总计、本次总计；另记不变账户数（R-08-026）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "即发起备注（R-08-031）" }
      - { key: "approval_id", label: "审批单号", type: "ref", required: true, rule: "12 审批单" }
      - { key: "status", label: "批次状态", type: "enum", required: true, enum: ["审批中", "已入账", "已驳回", "已撤回"], generated: true, rule: "flows 渠道导入批次" }
      - { key: "posted_rows", label: "入账行数", type: "int", required: false, generated: true, rule: "审批通过时写（R-08-051）" }
      - { key: "skipped_rows", label: "入账时跳过行数", type: "int", required: false, generated: true, rule: "R-08-051" }
      - { key: "post_errors", label: "入账错误清单", type: "list", required: false, rule: "审批通过时再校验不通过的行：原始行号、原因（R-08-051）" }
      - { key: "skip_cleared", label: "因跳过而清空的账户", type: "list", required: false, generated: true, rule: "通过时因跳过行而变为「-」的账户（R-08-071）" }
      - { key: "submitter", label: "申请人", type: "ref", required: true, generated: true, rule: "提交人" }
      - { key: "submitted_at", label: "申请时间", type: "datetime", required: true, tz: "存 UTC，展示 Asia/Shanghai，精度秒", generated: true }
  - name: 批次分段
    key: channel_import_segment
    note: "批次 × 账户系统；整批替换以分段为单位（R-08-021）；同一账户系统同一结算期任一时刻最多一个「当前生效」分段"
    fields:
      - { key: "batch_id", label: "批次", type: "ref", required: true }
      - { key: "account_system", label: "账户系统", type: "ref", required: true, rule: "02 账户系统" }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "= 批次结算期" }
      - { key: "effective", label: "生效状态", type: "enum", required: true, enum: ["当前生效", "已被替换"], generated: true, rule: "flows 批次分段" }
      - { key: "replaced_by", label: "被哪个批次替换", type: "ref", required: false, generated: true, rule: "R-08-021" }
  - name: 渠道统计金额
    key: channel_amount
    note: "账户 × 结算期一条；渠道统计金额即其中的「总计」（D-00-26）"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户，按 orgid 匹配（D-00-23）" }
      - { key: "orgid", label: "orgid", type: "string", required: true, rule: "账户 ID" }
      - { key: "account_system", label: "账户系统", type: "ref", required: true, rule: "账户所属账户系统（R-02-002）" }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "yyyy-mm（UTC0 自然月）" }
      - { key: "source", label: "来源", type: "enum", required: true, enum: ["系统抓取", "上传"], rule: "按账户系统预置（R-08-016）" }
      - { key: "subtotal", label: "小计", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "抓取 R-08-017；上传 = 模板「消耗金额」（R-08-018）" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "R-08-017、R-08-018" }
      - { key: "channel_rebate", label: "渠道返点", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "上传 = 模板「渠道返点」；抓取为空、显示「-」（R-08-017）" }
      - { key: "total", label: "总计（渠道统计金额）", type: "decimal", required: true, precision: 2, currency: "账户消耗币种", rule: "上传 = 模板「总计金额」原值，不反算（D-00-26）；抓取 R-08-017" }
      - { key: "segment_id", label: "来源批次分段", type: "ref", required: false, rule: "上传时有" }
      - { key: "updated_at", label: "更新时间", type: "datetime", required: true, tz: "存 UTC，展示 Asia/Shanghai，精度秒", generated: true }
  - name: 渠道账单行
    key: channel_bill_row
    note: "账户系统 × 结算期一行，即列表第一层；金额为汇总视图（R-08-019），状态由渠道付款结果决定"
    fields:
      - { key: "account_system", label: "账户系统", type: "ref", required: true }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7, rule: "展示「yyyy-mm-01 至 yyyy-mm-最后一天」（R-08-003）" }
      - { key: "currency", label: "币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "= 账户系统币种（同一账户系统下账户消耗币种相同，R-08-015，D-08-29）" }
      - { key: "subtotal", label: "小计", type: "decimal", required: false, precision: 2, currency: "本行币种", generated: true, rule: "R-08-019" }
      - { key: "max_consumption", label: "MAX消耗", type: "decimal", required: true, precision: 2, currency: "本行币种", generated: true, rule: "R-08-020" }
      - { key: "tax", label: "税费", type: "decimal", required: false, precision: 2, currency: "本行币种", generated: true, rule: "R-08-019" }
      - { key: "channel_rebate", label: "渠道返点", type: "decimal", required: false, precision: 2, currency: "本行币种", generated: true, rule: "R-08-019" }
      - { key: "total", label: "总计", type: "decimal", required: false, precision: 2, currency: "本行币种", generated: true, rule: "R-08-019；= 渠道付款应付金额（R-08-041）" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["待完成", "已完成"], default: "待完成", generated: true, rule: "flows 渠道账单行（R-08-008、R-08-056）" }
      - { key: "paid_total", label: "已付总计快照", type: "decimal", required: false, precision: 2, currency: "本行币种", generated: true, rule: "因付款已完成时 = 完成那张渠道付款单的总计（R-08-054）；按 R-08-056 视为已完成的 0.00 行没有快照" }
      - { key: "completed_at", label: "完成时间", type: "datetime", required: false, tz: "存 UTC，展示 Asia/Shanghai，精度秒", generated: true, rule: "R-08-054" }
      - { key: "paid_account_snapshot", label: "账户级已付快照", type: "list", required: false, generated: true, rule: "因付款已完成时 = 完成那张渠道付款单快照里每个账户的总计（R-08-054），给 10（R-08-091）" }
  - name: 渠道付款单
    key: channel_payment
    note: "「渠道对账中心—渠道付款」审批的业务单据；不单独设状态：审批阶段看 12 审批单状态，通过后看 09 付款单状态（同 D-00-60 做法）"
    fields:
      - { key: "account_system", label: "账户系统", type: "ref", required: true }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7 }
      - { key: "subtotal", label: "小计", type: "decimal", required: true, precision: 2, currency: "本行币种", rule: "提交时快照" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "本行币种", rule: "提交时快照" }
      - { key: "channel_rebate", label: "渠道返点", type: "decimal", required: false, precision: 2, currency: "本行币种", rule: "提交时快照；抓取为空" }
      - { key: "total", label: "总计", type: "decimal", required: true, precision: 2, currency: "本行币种", rule: "提交时快照" }
      - { key: "payable", label: "应付金额", type: "decimal", required: true, precision: 2, currency: "本行币种", rule: "= 总计，不可改（R-08-041，D-08-07）" }
      - { key: "settle_currency", label: "结算币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "默认本行币种（R-08-042）" }
      - { key: "fx_rate", label: "汇率", type: "decimal", required: true, precision: 4, rule: "1 本行币种 = x 结算币种；= 日汇率四舍五入到 4 位，显示与计算都用这 4 位（D-00-74）；同币种为 1；提交当天锁定（R-08-042，D-00-62）" }
      - { key: "fx_date", label: "汇率日期", type: "date", required: true, rule: "实际取到的那天日汇率的日期（UTC0，向前取时为那一天）；同币种为空（R-08-042）" }
      - { key: "payable_settle", label: "换算后应付金额", type: "decimal", required: true, precision: 2, currency: "结算币种", rule: "= 应付金额 × 汇率，四舍五入 2 位（R-08-042）" }
      - { key: "account_snapshot", label: "账户明细快照", type: "list", required: true, rule: "提交时本行第二层全部账户：账户名称、orgid、小计、税费、渠道返点、总计（含「-」的账户）（R-08-046）" }
      - { key: "missing_count", label: "缺数据账户数", type: "int", required: true, rule: "有消耗但渠道统计金额为「-」的账户数（R-08-043）" }
      - { key: "shared_order_count", label: "共享订单数", type: "int", required: true, rule: "系统抓取：本行同一订单号挂在多个账户下的订单数，上传为 0（R-08-041）" }
      - { key: "payee", label: "收款主体", type: "string", required: false, rule: "渠道一方收钱的主体名称，选填；可选该渠道填过的值或手填新值（R-08-047，D-08-31）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "即发起备注（R-08-044）" }
      - { key: "approval_id", label: "审批单号", type: "ref", required: true, rule: "12 审批单" }
      - { key: "payment_order_id", label: "付款单", type: "ref", required: false, generated: true, rule: "审批通过后 09 生成（R-08-053）" }
  - name: 渠道金额变化日志
    key: channel_amount_log
    fields:
      - { key: "logged_at", label: "时间", type: "datetime", required: true, tz: "存 UTC，展示 Asia/Shanghai，精度秒", generated: true }
      - { key: "account_system", label: "账户系统", type: "ref", required: true }
      - { key: "period", label: "结算期", type: "string", required: true, max: 7 }
      - { key: "account_id", label: "账户", type: "ref", required: true }
      - { key: "before_total", label: "变化前总计", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "原来没有为空（显示「-」）" }
      - { key: "after_total", label: "变化后总计", type: "decimal", required: false, precision: 2, currency: "账户消耗币种", rule: "变回无数据为空（显示「-」）" }
      - { key: "origin", label: "来源", type: "string", required: true, rule: "「渠道对账 {审批单号}」或「订单数据更新」（R-08-023）" }

flows:
  - entity: 渠道导入批次
    states: [审批中, 已入账, 已驳回, 已撤回]
    initial: 审批中
    transitions:
      - { from: "无", action: "导入渠道账单「提交审批」/「继续提交」", actor: "有「导入渠道账单」权限点的用户", to: 审批中, guard: "R-08-033、R-08-036～R-08-038" }
      - { from: 审批中, action: "「渠道对账」审批通过（含 0 节点即通过）", actor: 系统, to: 已入账, guard: "R-08-050、R-08-051" }
      - { from: 审批中, action: "审批驳回", actor: 审批人, to: 已驳回, guard: "R-08-052" }
      - { from: 审批中, action: "撤回", actor: 申请人, to: 已撤回, guard: "R-08-052、R-12-032（只校验申请人本人与审批中，D-00-79②）" }
      - { from: 审批中, action: "作废（效果同撤回）", actor: "持「审批配置」权限点的人", to: 已撤回, guard: "R-08-052（D-00-79③）" }
    reverse:
      - { action: "驳回 / 撤回 / 作废", actor: "审批人 / 申请人 / 持「审批配置」权限点的人", allowed_from: [审批中], note: "不入账，渠道数据不变；原单不能改重提，可重新导入（R-08-052）" }
      - { action: "已入账后撤销", actor: "—", allowed_from: [], note: "不提供；要改就导入修正文件整批替换（D-00-30）" }
  - entity: 批次分段
    states: [当前生效, 已被替换]
    initial: 当前生效
    transitions:
      - { from: "无", action: "所属批次入账时，该账户系统有可入账行", actor: 系统, to: 当前生效, guard: "R-08-021" }
      - { from: 当前生效, action: "同账户系统同结算期的新批次入账", actor: 系统, to: 已被替换, guard: "R-08-021" }
    reverse: []
  - entity: 渠道账单行
    states: [待完成, 已完成]
    initial: 待完成
    transitions:
      - { from: "无", action: "该账户系统该月有任一账户有消耗或有渠道统计金额", actor: 系统, to: 待完成, guard: "R-08-002" }
      - { from: 待完成, action: "本行渠道付款对应的 09 付款单变「已完成」（确认到账，D-00-33；确认汇款后的待完成不算）", actor: 系统, to: 已完成, guard: "R-08-054" }
      - { from: 待完成, action: "结算期已结束且第一层总计为 0.00（有值），无在途渠道付款单（视为已完成，无需付款）", actor: 系统, to: 已完成, guard: "R-08-056（D-00-80）" }
      - { from: 已完成, action: "按 R-08-056 视为已完成的行，总计变为不是 0.00", actor: 系统, to: 待完成, guard: "R-08-056、D-08-44（只适用于没有已完成渠道付款的行）" }
    reverse:
      - { action: "渠道付款驳回 / 撤回", actor: "审批人 / 申请人", allowed_from: [待完成], note: "保持待完成，「渠道付款」重新出现（R-08-055）" }
      - { action: "已完成后金额变化", actor: 系统, allowed_from: [已完成], note: "状态不变，只标记与记日志，线下处理（R-08-025，D-08-08）" }
      - { action: "收付款单作废 / 退回", actor: "—", allowed_from: [待完成], note: "本期不做（D-00-69，D-08-27）；sys 兜底撤回只对 05 充值收款单、退款付款单，渠道付款单不在其列" }
      - { action: "渠道付款审批作废", actor: "持「审批配置」权限点的人", allowed_from: [待完成], note: "效果同撤回，保持待完成、「渠道付款」重新出现（R-08-055，D-00-79③）" }

refs:
  - { page: 02-账户管理, entity: 账户, ids: [R-02-002, R-02-017], uses: "按 orgid 匹配账户（D-00-23）；账户所属账户系统（添加时选定 R-02-002，编辑不可改 R-02-017）用于分组与校验 orgid 归属" }
  - { page: 05-费用管理, entity: 账户资金, ids: [R-05-033, R-05-078], uses: "金额格式：千分位、2 位小数、后缀币种代码；提交审批二次确认框标题「提示」" }
  - { page: 07-返点管理, entity: 返点计提项, ids: [R-07-007], uses: "MAX 消耗的识别口径（出价策略为 MAX_CONVERSIONS，按当天策略）" }
  - { page: 10-利润中心, entity: 利润记录, ids: [R-10-006, R-10-023, D-10-08], uses: "共享订单在 10 按消耗占比拆分；上线月配置与 06 / 07 / 10 / 11 共用（index S-18）；行状态变化通知 10 按 R-10-023「完成条件变化」重算" }
  - { page: 06-账单与结算单, entity: 账单订单行, ids: [R-06-014, R-06-015, R-06-016, R-06-018, R-06-028], uses: "抓取账户系统的订单数据与口径同 06（账户行求和、第一层订单号去重、第三层列）；06 读本页上传来源的渠道统计金额，不锁定" }
  - { page: 12-审批配置与审批中心, entity: 审批单, ids: [R-12-001, R-12-010, R-12-014, R-12-045, R-12-046, R-12-047, R-12-016, R-12-018, R-12-025, R-12-026, R-12-030, R-12-031, R-12-032, R-12-033, R-12-034, R-12-035, R-12-038, R-12-043, R-12-044], uses: "提交「渠道对账」「渠道付款」两种审批（不传操作对象客户、传涉及账户；两类不提供动态选项 R-12-010）；提交后弱提示按 R-12-018；按结果处理；撤回；通知；审批详情框架、不启用高亮、第②类只读查看" }
  - { page: 09-收付款中心, entity: 付款单, ids: [R-09-012, R-09-042, R-09-071, R-09-072], uses: "付款单列表显示本页的收款主体与「{账户系统} · {结算期}」；付款单三态 待汇出 / 待完成 / 已完成；确认汇款后不回写、本行仍「付款中」；确认到账（已完成）后回写本行变已完成（D-00-33）；本期不作废（D-00-69）" }
  - { page: 13-导航与权限, ids: [R-13-005, R-13-006, R-13-050, D-13-01], uses: "无权限访问与加载失败形态（R-13-005、R-13-006）；导入 / 付款动作点依赖渠道对账中心查看点（D-13-01）；有「收付款中心」权限点的人可只读查看「渠道付款」审批详情（D-00-71）；「渠道对账」审批不在其列" }

rules:
  # —— 2.1 渠道账单列表 ——
  - { id: R-08-001, module: 渠道账单列表, text: "菜单「财务中心 / 渠道对账中心」进入；页面两个 tab：渠道账单（默认）、已提交审批；页面数据不跟随顶栏「账户系统」切换，只用页内筛选（D-08-14）" }
  - { id: R-08-002, module: 渠道账单列表, text: "第一层一个账户系统 × 一个 UTC0 自然月一行，只出结算期 ≥ 上线月的行（上线月 = 第一个在系统里付渠道款的结算期；06 出账单、07 计提、08 渠道、10 利润、11 提成从同一个上线月起算，共用一个配置，即 index S-18 的上线月（D-10-08），具体月份上线前定，D-08-28）；该账户系统该月有任一账户有消耗数据，或有任一账户有渠道统计金额时出现这一行；当月也展示，金额随数据变化；两者都没有的月份不出行（D-08-15）" }
  - { id: R-08-003, module: 渠道账单列表, text: "第一层列依次：结算期（「yyyy-mm-01 至 yyyy-mm-最后一天」）、账户系统（左固定）‖ 数据来源、小计、MAX消耗、税费、渠道返点、总计、状态 ‖ 操作（右固定）" }
  - { id: R-08-004, module: 渠道账单列表, text: "数据来源列：系统抓取的账户系统显示「系统抓取」；上传的账户系统有当前生效分段时显示「上传 · {该批次审批单号}」，审批单号可点、新页打开 12 的唯一审批详情地址（R-12-026）；没有当前生效分段显示「未上传」" }
  - { id: R-08-005, module: 渠道账单列表, text: "点第一层行展开第二层，列依次：账户名称、orgid、小计、MAX消耗、税费、渠道返点、总计；列出该账户系统下本结算期有消耗或有渠道统计金额的账户；没有渠道统计金额的账户 小计 / 税费 / 渠道返点 / 总计 显示「-」；按总计降序，「-」的排最后，同值按账户名称升序" }
  - { id: R-08-006, module: 渠道账单列表, text: "第三层只有系统抓取的账户系统有：点有订单的账户行展开，列 订单号、付款参考编号、账单、账单类型、产品或广告主、描述、发票、截止日期、小计、税费、总计；数据与 06 第三层是同一份苹果订单数据，下载与跳转沿用现有（R-06-028）；同一订单号挂在本行多个账户下时，该订单在每个账户下都标注「与 {其他账户名称} 共享，各账户全额列示，第一层只算一次」（其他账户多个时用「、」连接，D-08-42）；上传的账户系统的账户行不显示展开箭头" }
  - { id: R-08-007, module: 渠道账单列表, text: "金额一律本行币种（= 账户消耗币种，不换算，D-08-04），千分位、2 位小数、后缀币种代码（格式同 R-05-033）；没有数据显示「-」" }
  - { id: R-08-008, module: 渠道账单列表, text: "状态只有两个：待完成（默认）、已完成；已完成 = 本行渠道付款对应的 09 付款单已完成（R-08-054），或第一层总计为 0.00 视为已完成（R-08-056）；原型状态筛选里的「待结算 / 已结算」是复制残留，不做（D-08-16）" }
  - { id: R-08-009, module: 渠道账单列表, text: "筛选：搜索框按账户名称或 orgid 包含匹配，命中时第一层只显示含命中账户的行，展开后第二层只列命中账户，第一层金额仍是整行的；账户系统 单选 全部 + 全部账户系统，默认全部；结算期 单选 全部 + 有数据的月份（≥ 上线月，降序，R-08-002），默认全部；状态 全部 / 待完成 / 已完成，默认全部；各条件同时生效" }
  - { id: R-08-010, module: 渠道账单列表, text: "第一层按结算期降序、同结算期按账户系统名称升序；分页 10 / 50 / 100 / 300 条每页，默认 10；没有数据显示「暂无数据」；筛选后没有结果显示「没有符合条件的渠道账单」" }
  - { id: R-08-011, module: 渠道账单列表, text: "第一层操作列：符合 R-08-040 时显示「渠道付款」；有在途渠道付款单时显示灰字「付款中」（不可点）；本行有任一条变化日志（R-08-023）时另显示「变化记录」（R-08-025），可与「渠道付款」或「付款中」并列（D-08-32）；都不符合时为空" }
  # —— 2.2 渠道统计金额口径 ——
  - { id: R-08-015, module: 渠道统计金额, text: "渠道统计金额按「账户 × UTC0 自然月结算期」一条，含 小计、税费、渠道返点、总计 四项；系统里的「渠道统计金额」就是其中的总计（D-00-26）；币种 = 该账户的消耗币种，不换算（D-08-04）；同一账户系统下所有账户的消耗币种相同（= 账户系统币种），同一账户系统同一结算期只有一个币种，所以第一层合计、整批替换、渠道付款、渠道付完都以「账户系统 × 结算期」为键，导入金额的币种即账户系统币种（D-08-29）" }
  - { id: R-08-016, module: 渠道统计金额, text: "来源按账户系统二选一：系统抓取 / 上传，由技术预置，页面不提供配置（D-08-12）；系统抓取 = 从苹果同步订单、按订单号结算渠道账单的账户系统（自接苹果），其余都是上传（D-08-30）；系统抓取的账户系统不开放上传（D-00-24）" }
  - { id: R-08-017, module: 渠道统计金额, text: "系统抓取：账户的 小计 / 税费 / 总计 = 该账户本结算期订单行对应列之和，同一订单号挂在多个账户下时每个账户各算一次（口径同 R-06-015）；订单归期与币种同 06：LOC 订单按账单月份落 UTC0 自然月，订单币种与账户币种不同时按截止日期当天的日汇率折成账户币种，截止日期晚于今天（UTC0）时先按最近一天的日汇率暂时折算，截止日当天汇率入库后按当天汇率重折一次，变化记为「订单数据更新」（R-08-023），之后不再变（D-08-48）；CC 订单按交易日归期、按交易日的日汇率折算；税费：订单有税费字段的照实取，没有税费字段的（USD 体系，含老数据为空的）税费显示「-」、不补 0，此时总计 = 小计，不用总计 − 小计反推（D-08-30）；渠道返点为空、显示「-」；订单数据更新时随之更新" }
  - { id: R-08-018, module: 渠道统计金额, text: "上传：账户的四项 = 该账户所属账户系统（R-02-002）在本结算期「当前生效」分段里该 orgid 那一行（四舍五入到 2 位后的值）；没有当前生效分段，或分段里没有这个 orgid，显示「-」" }
  - { id: R-08-019, module: 渠道统计金额, text: "第一层合计：上传 = 第二层各账户四项分别相加，「-」不计，全部为「-」时显示「-」；系统抓取 = 本行全部订单按订单号去重后小计、税费、总计分别相加（口径同 R-06-016；税费全部为「-」时显示「-」），渠道返点「-」；所以抓取的第一层可能小于账户行之和" }
  - { id: R-08-020, module: 渠道统计金额, text: "MAX消耗 = 系统里该账户本结算期出价策略为 MAX_CONVERSIONS 的广告系列的消耗之和：按当天的出价策略识别，一天内改过的按当天 UTC0 结束时的策略计整天，上线前的日子按上线时的策略（口径同 07 R-07-007、D-00-15 里的 MAX 消耗），取数沿用现有广告数据；第一层 = 各账户相加；没有 MAX 系列为 0.00；只展示供核对，不参与任何计算（D-08-05）" }
  - { id: R-08-021, module: 渠道统计金额, text: "整批替换：批次入账时，对批次里每个有可入账行的账户系统，该账户系统该结算期原「当前生效」分段变「已被替换」，本批分段变「当前生效」；被替换分段的数据保留、可在审批详情追溯，不再参与任何计算；新分段里没有的 orgid 渠道统计金额变回「-」（D-00-30、D-08-20）；入账时某账户系统一行可入账的都没有，该账户系统不替换" }
  - { id: R-08-022, module: 渠道统计金额, text: "渠道统计金额不锁定：任何行状态（含付款中、已完成）下都随入账替换或订单数据更新（与 R-06-018 一致）；渠道付款金额以提交时快照为准（R-08-046）" }
  - { id: R-08-023, module: 渠道统计金额, text: "账户 × 结算期的总计每变一次记一条变化日志：时间、账户系统、结算期、账户、变化前总计、变化后总计、来源（「渠道对账 {审批单号}」或「订单数据更新」）；从无到有、变回「-」也记" }
  - { id: R-08-024, module: 渠道统计金额, text: "账户 × 结算期的渠道统计金额从无到有、变化、变回「-」时通知下游：06 账单的渠道两列随之更新（R-06-018），10 按 D-00-66 把该账户该月退回重算；第一层行状态变化（付款单完成变已完成 R-08-054；0.00 行视为已完成或回到待完成 R-08-056）同样通知 10，10 按 R-10-023「完成条件变化」重算该行各账户该月（D-08-46）；一次批次入账只发一次汇总通知还是逐条，由技术定" }
  - { id: R-08-025, module: 渠道统计金额, text: "付款后金额变化：行因渠道付款已完成（R-08-054），且当前总计 ≠ 已付总计快照时，状态保持已完成（D-08-08）；状态旁显示橙色「金额有变化」，悬浮显示「已付 {已付总计} {币种}，现总计 {当前总计} {币种}，差额 {当前 − 已付} {币种}」，差额含付款后才有渠道统计金额的账户；修正文件把整行清成「-」（当前总计为「-」）时悬浮显示「已付 {已付总计} {币种}，现总计 -，差额按 0 计为 −{已付总计} {币种}」（D-08-49）；线下处理，系统不生成补付或退款单据。「变化记录」（R-08-011）点开弹窗，标题「变化记录 · {账户系统} · {结算期}」，按时间倒序列本行全部变化日志（R-08-023），并在对应时间位置插入时间点行「付款提交 · {审批单号} · 快照总计 {快照总计} {币种}」「付款完成 · {财务ID}」（没有渠道付款的不插；驳回 / 撤回 / 作废的付款不插）（D-08-32）" }
  - { id: R-08-026, module: 渠道统计金额, text: "「入账影响」表：按本批每个有可入账行的账户系统，列出本结算期入账后会变的账户：账户系统、账户名称、orgid、当前生效总计 → 本次总计；分三类依次列：将清空（x → -：当前有值、本批没有它的可入账行，含错误行对应的账户和文件里没有的 orgid），置顶标红；金额变化（x → y）；新增（- → x）；当前有值且本次总计相同的不逐行列，表尾一行「其余 N 个账户不变」（N = 0 不显示）；可入账 0 行的账户系统不替换（R-08-021），不进本表；用于校验结果弹窗、无错误行时的确认框（R-08-037）与渠道对账审批内容区（R-08-071，提交时快照）（D-08-33）" }
  # —— 2.3 导入渠道账单 ——
  - { id: R-08-030, module: 导入渠道账单, text: "渠道账单 tab 右上「导入渠道账单」按钮只对有「导入渠道账单」权限点的用户显示；点开弹窗，标题「导入渠道账单」" }
  - { id: R-08-031, module: 导入渠道账单, text: "弹窗字段依次：结算期（必选单选，选项 = 上线月起已结束的 UTC0 自然月、降序，默认上个月，当月不可选，D-08-28；所选不是上个月时结算期下方黄字「所选结算期不是上个月，请确认」，不拦，D-08-39）；渠道账单模板（「下载模板」链接，下载「渠道账单导入模板.xlsx」），旁边说明文字「总计金额须为已冲抵渠道返点后、实际应付渠道的金额；渠道返点隔月单独打回的，按冲抵后的应付填总计」（D-08-40）；渠道账单文件（必传，1 个 .xlsx，重新选择即替换，大小上限沿用现有上传组件）；备注（选填、多行，即审批发起备注）；按钮「取消」「提交审批」（原型的「保存」改为「提交审批」）" }
  - { id: R-08-032, module: 导入渠道账单, text: "标准模板 .xlsx：第一个工作表「渠道账单」第 1 行为表头、第 2 行起为数据，列依次 账户系统、orgid、消耗金额、税费、渠道返点、总计金额，6 列都必填；第二个工作表「填写说明」写每列含义、一条示例行，以及「总计金额须为已冲抵渠道返点后、实际应付渠道的金额；渠道返点隔月单独打回的，按冲抵后的应付填总计」（D-08-40），导入时不读；结算期不在模板里，在弹窗里选（D-00-25）；模板「消耗金额」入账为「小计」，「返点金额」列名改为「渠道返点」（D-08-12）" }
  - { id: R-08-033, module: 导入渠道账单, text: "文件级校验，不通过不能提交，提示在对应字段下方：未选结算期「请选择结算期」；未传文件「请上传渠道账单文件」；不是 .xlsx「仅支持 .xlsx 文件，请下载模板填写」；第一个工作表表头和模板 6 列名称、顺序不一致（忽略首尾空格）「文件表头与模板不一致，请下载最新模板」；去掉全空行后没有数据行「文件里没有数据行」" }
  - { id: R-08-034, module: 导入渠道账单, text: "逐行校验（单元格去首尾空格；orgid 接受数字或文本；行号 = Excel 原始行号），错误原因原文：①任一列为空「{列名}为空」；②金额列不是数字或小于 0「{列名}须为不小于 0 的数字」；③账户系统名称在系统里找不到「账户系统不存在」；④账户系统是系统抓取的「该账户系统由系统抓取渠道数据，不支持上传」；⑤orgid 在系统里找不到账户「orgid 在系统中不存在」；⑥orgid 对应账户不属于本行账户系统「orgid 不属于账户系统 {账户系统}」；⑦同一 orgid 在文件里出现多行，这些行都报「orgid 在文件中重复出现（第 a、b 行）」，该 orgid 一行都不入账（D-08-03）；金额可以有任意位小数，通过校验后四舍五入到 2 位（D-00-13）；不校验 消耗 + 税费 − 渠道返点 是否等于总计（D-00-26）" }
  - { id: R-08-035, module: 导入渠道账单, text: "一行有多个错误时全部列出，用「；」隔开；没有错误的行为可入账行" }
  - { id: R-08-036, module: 导入渠道账单, text: "在途冲突：文件里出现的有效账户系统（通过 R-08-034 ③④）只要有一个在所选结算期已有审批中的渠道对账单，整份不能提交，用提示框（「知道了」，不用自动消失的弱提示）提示「{账户系统} {结算期} 已有审批中的渠道账单导入（审批单号 {审批单号}，申请人 {姓名}），请等审批结束或撤回后再导入」（句式按 12 R-12-047）；审批单号可点、新页打开 12 的唯一审批详情地址（R-12-026），没有查看权限时按 R-12-043 显示「无权限查看」（D-08-19、D-08-38）" }
  - { id: R-08-037, module: 导入渠道账单, text: "点「提交审批」后服务端解析并校验，期间按钮加载、弹窗不可关；文件级通过且无在途冲突时：没有错误行 → 确认框（标题「提示」，同 R-05-078）文案「导入渠道账单需进行审批，是否提交审批单？审批通过后，{账户系统列表} 在 {结算期} 的渠道数据将被本文件整批替换」，下方带「入账影响」表（R-08-026），按钮 取消 / 确定；有错误行 → 弹「校验结果」：标题行「共 N 行，可入账 A 行，错误 M 行」、按账户系统汇总表（账户系统、可入账行数、总计合计、当前生效总计，没有为「-」）、「入账影响」表（R-08-026）、错误清单表（原始行号、账户系统、orgid、错误原因，超过 10 行表内滚动）、「下载错误清单」、提示「错误行不会入账；错误行和文件里没有的 orgid，入账后渠道数据将清空（见入账影响）。审批通过后，{账户系统列表} 在 {结算期} 的渠道数据将被本文件整批替换」，按钮「返回修改」（回到导入弹窗、已选内容保留）「继续提交」（D-08-09）；可入账 0 行时「继续提交」置灰并提示「没有可入账的行，请修改文件后重新上传」" }
  - { id: R-08-038, module: 导入渠道账单, text: "确定 / 继续提交后，服务端再查一次 R-08-036，通过则提交「渠道对账中心—渠道对账」审批（R-12-001、R-12-014）：不传操作对象客户（D-08-10）；按 D-00-76 传本批可入账行涉及的账户（这类审批不提供动态选项，不影响审批人，D-08-41）；业务单据 = 渠道导入批次（结算期、原文件、校验结果、可入账行、错误清单、按账户系统汇总及当时生效总计、入账影响）；发起备注 = 备注；提交后的弱提示按 12 R-12-018（审批中「已提交审批」，免审即通过「提交成功，无需审批，已生效」），关闭弹窗；审批中时渠道数据不变；同一弹窗连续点击只提交一次" }
  - { id: R-08-039, module: 导入渠道账单, text: "错误清单下载为 .xlsx：列 原始行号、账户系统、orgid、消耗金额、税费、渠道返点、总计金额（原样）、错误原因；入账错误清单（R-08-051）同格式" }
  # —— 2.4 渠道付款 ——
  - { id: R-08-040, module: 渠道付款, text: "「渠道付款」同时满足才显示：有「渠道付款」权限点；结算期已结束（今天 UTC0 ≥ 结算期次月 1 日）；第一层总计不是「-」且 > 0（总计 0.00 的行按 R-08-056 视为已完成；总计 < 0 不能发起，线下处理，D-00-80、D-08-34）；状态待完成；没有在途渠道付款单（审批中，或审批已通过但 09 付款单还不是「已完成」，即待汇出 / 待完成）（D-08-07）" }
  - { id: R-08-041, module: 渠道付款, text: "渠道付款弹窗：标题「渠道付款」；只读 结算期、账户系统、小计、税费、渠道返点、总计（本行币种）、应付金额（= 总计，不可改，D-08-07）；本行有共享订单（同一订单号挂在本行多个账户下）时，应付金额下方灰字「本行有 K 个共享订单，在各账户下全额重复列示；应付按订单号去重 = {总计} {币种}」，没有共享订单不显示（D-08-42）；收款主体（选填，R-08-047）；下方带本行第二层只读明细（账户名称、orgid、小计、税费、渠道返点、总计）；原型的「充值金额」不做（D-08-06）" }
  - { id: R-08-042, module: 渠道付款, text: "结算币种：必选单选 人民币 / USD / USDT，默认本行币种；与本行币种相同时不显示汇率；不同时显示「汇率：1 {本行币种} = x {结算币种}（yyyy-mm-dd）」与「换算后应付金额：{应付 × 汇率，四舍五入 2 位} {结算币种}」；汇率取当天（UTC0）的日汇率，当天没有向前取最近一天，括号里的日期 = 实际取到的那天；x = 日汇率四舍五入到 4 位，显示与计算都用这 4 位（D-00-74、D-08-37）；提交时按提交当天重取并锁定（D-00-62），与弹窗展示不同时按 R-08-045 ② 确认；汇率与汇率日期随单进快照；取不到任何汇率时不能提交，提示「未取到 {本行币种}→{结算币种} 汇率，请稍后再试」；换算后应付为 0.00 时不能提交，提示「换算后应付金额为 0.00，请改用 {本行币种} 结算」（D-08-47）" }
  - { id: R-08-043, module: 渠道付款, text: "本行有消耗、但渠道统计金额为「-」的账户数 N > 0 时，弹窗顶部黄色提示「本结算期有 N 个有消耗的账户还没有渠道统计金额，应付金额不含这些账户」，明细表里这些账户金额显示「-」；不拦提交（D-08-13）" }
  - { id: R-08-044, module: 渠道付款, text: "备注：多行、选填，即审批发起备注；点「提交审批」校验结算币种与汇率，通过后二次确认（标题「提示」，同 R-05-078）「渠道付款需进行审批，是否提交审批单？」（取消 / 确定）" }
  - { id: R-08-045, module: 渠道付款, text: "确定后服务端复核：权限点、R-08-040 全部条件、本行第一层与第二层金额与弹窗展示一致、汇率；不通过时不创建审批单、弹窗不关（D-08-36）：①金额在弹窗打开期间变了 → 按最新数据就地重载，保留结算币种、收款主体、备注；值变了的金额（第一层与账户明细）标黄「系统计算值已由 X 变为 Y」，新出现或消失的账户行同样标黄；顶部提示「数据已更新，请核对后重新提交」，用户再点一次「提交审批」才建单；重载后总计不再 > 0 时「提交审批」置灰并提示「本行总计不大于 0，不能发起渠道付款」；②只有汇率变了（跨零点或当天汇率更新）→ 弹确认「汇率已更新为 1 {本行币种} = x {结算币种}（yyyy-mm-dd），换算后金额 Y {结算币种}，是否按新汇率提交？」，确定后按新汇率建单，取消则回到弹窗、汇率与换算后金额显示新值；③已有在途渠道付款单 → 提示框（「知道了」）：审批中写「该结算期已有审批中的渠道付款（审批单号 {审批单号}，申请人 {姓名}），请等审批结束或撤回后再操作」，已通过、付款单未完成写「该结算期已有处理中的渠道付款（付款单 {财务ID}，{待汇出 / 待完成}），待付款完成后再操作」，单号可点（无权限按 R-12-043），关闭后弹窗关闭、刷新列表（句式按 12 R-12-047，D-08-38）；④按复核时的应付与汇率换算后应付为 0.00 → 同 R-08-042 拦截，提示「换算后应付金额为 0.00，请改用 {本行币种} 结算」（D-08-47）；同一弹窗连续点击只提交一次，请求中按钮加载" }
  - { id: R-08-046, module: 渠道付款, text: "复核通过后提交「渠道对账中心—渠道付款」审批（R-12-001、R-12-014）：不传操作对象客户（D-08-10）；按 D-00-76 传本行第二层账户（这类审批不提供动态选项，不影响审批人，D-08-41）；业务单据 = 渠道付款单（弹窗全部内容 + 汇率与汇率日期 + 换算后应付金额 + 收款主体 + 第二层全部账户金额快照 + 缺数据账户数 + 共享订单数）；发起备注 = 备注；提交后的弱提示按 12 R-12-018（同 R-08-038），关闭弹窗；审批中时操作列变「付款中」，免审即通过时按 R-08-053 处理" }
  - { id: R-08-047, module: 渠道付款, text: "收款主体：渠道一方收钱的主体名称，选填，下拉可搜索；选项 = 该账户系统（渠道）填过的值，上线时每个渠道预置一项「渠道名称」（存量由技术迁移）；可手填新值，提交审批成功后新值自动追加到该渠道的选项里，不另设维护页面；写入审批快照（R-08-046），随付款单给 09 显示（R-09-012）；渠道收款账号本期不展示（D-08-31）" }
  # —— 2.5 审批结果处理 ——
  - { id: R-08-050, module: 审批结果, text: "两种审批流 0 节点或全部节点被跳过时提交即通过（R-12-018），立即按 R-08-051 / R-08-053 处理；渠道两类审批没有操作对象客户，12 审批配置不给这两类提供「绑定的销售 / 绑定的运营」动态选项（R-12-010，D-08-41），节点只能配指定用户" }
  - { id: R-08-051, module: 审批结果, text: "「渠道对账」审批通过：可入账行按 R-08-034 ③～⑥ 用当时数据再校验一次（①②⑦只看文件本身，结果不变），不通过的跳过、记入入账错误清单（原始行号 + 原因）；其余行按 R-08-021 入账替换并写渠道统计金额、记变化日志（R-08-023）、通知下游（R-08-024）；批次变「已入账」，记录入账行数、跳过行数（D-08-09）；跳过行不算业务执行失败，全部跳过也照常「已入账」（入账 0 行，R-08-057）。审批结果通知申请人沿用 12（R-12-038）" }
  - { id: R-08-052, module: 审批结果, text: "「渠道对账」审批驳回、撤回或作废（作废效果同撤回，R-12-046，D-00-79③）：批次变「已驳回 / 已撤回」，不入账，渠道数据不变；原单不能修改重提（R-12-034），要导入就重新上传" }
  - { id: R-08-053, module: 审批结果, text: "「渠道付款」审批通过（含免审即通过）：生成一张 09 付款单，带 交易类型「渠道付款」、应付金额 = 换算后应付金额（同币种即应付金额；换算后为 0.00 的不能提交，所以 > 0，R-08-042、R-08-045）、币种 = 结算币种、关联审批单号、账户系统、结算期、收款主体（没填为空）、申请人、备注；本行保持待完成，操作列「付款中」；09 确认汇款（付款单 待汇出 → 待完成）不回写本页，本行仍是待完成、「付款中」（R-09-042、R-09-072）" }
  - { id: R-08-054, module: 审批结果, text: "该付款单在 09 变为已完成（确认到账才算完成，D-00-33；回写见 R-09-071）时：本行变「已完成」，记完成时间，已付总计快照 = 该渠道付款单的总计（本行币种）；同时保留该单第二层每个账户的已付快照值（R-08-046 快照里该账户的总计，「-」的账户为空），供 10 详情展示（R-08-091）" }
  - { id: R-08-055, module: 审批结果, text: "「渠道付款」审批驳回、撤回或作废（作废效果同撤回，R-12-046，D-00-79③）：本行保持待完成，「渠道付款」重新出现；原单不能修改重提" }
  - { id: R-08-056, module: 审批结果, text: "第一层总计为 0.00 的行（有值，不是「-」）：结算期结束后、没有在途且没有已完成的渠道付款时视为已完成（无需付款），状态「已完成」、旁边灰字「无需付款」，不显示「渠道付款」，10 判该行账户渠道付完（R-08-091）；之后总计变为不是 0.00、且该行从没有已完成的渠道付款时回到待完成，按 R-08-040 处理（10 按 D-00-66 退回重算）（D-08-44）。第一层总计 < 0 的行不能发起渠道付款，保持待完成、线下处理（已知限制）（D-00-80，D-08-34）" }
  - { id: R-08-057, module: 审批结果, text: "两种审批最后一个审批人通过时，本页不设业务执行失败情形（R-12-045，D-00-79①）：渠道对账通过时再校验不通过的行跳过、其余照常入账（R-08-051）；渠道付款通过时照常生成付款单（R-08-053）；所以通过不会被业务回滚。持「审批配置」权限点的人可作废审批中的两类单，效果同撤回（R-12-046；本页按 R-08-052、R-08-055 处理，D-00-79③）" }
  # —— 2.6 已提交审批 ——
  - { id: R-08-060, module: 已提交审批, text: "已提交审批只展示当前登录账号提交的「渠道对账」「渠道付款」审批单（含免审即通过的单，状态「已通过」）；搜索框按审批单号包含匹配；筛选 审批类型 全部 / 渠道对账 / 渠道付款、审批状态 全部 / 审批中 / 已通过 / 已驳回 / 已撤回，默认都是全部" }
  - { id: R-08-061, module: 已提交审批, text: "列依次：审批单号、审批类型、结算期、账户系统（渠道对账含多个时用「、」连接，过长省略、悬浮显示全部）、申请人、申请时间（yyyy-mm-dd hh:mm:ss，Asia/Shanghai）、审批状态、操作；原型的「操作对象」列改为「审批类型」；审批中置顶，其余按申请时间降序；分页 10 / 50 / 100 / 300，默认 10；没有数据显示「暂无数据」" }
  - { id: R-08-062, module: 已提交审批, text: "行操作：所有状态都有「详情」，新页打开 12 的唯一审批详情地址（R-12-026）；只有审批中有「撤回」，只校验申请人本人与审批中、不校验「导入渠道账单」「渠道付款」权限点（D-00-79②），确认文案、后果与通知按 12（R-12-032～R-12-035），撤回后按 R-08-052 / R-08-055 处理；被持「审批配置」权限点的人作废的，本页回调同撤回（R-12-046）" }
  # —— 2.7 审批内容区 ——
  - { id: R-08-070, module: 审批内容, text: "两种审批详情都用 12 的通用框架（R-12-026～R-12-031，D-00-44）；标题「渠道对账中心/审批详情」（原型误写「返点管理/审批详情」）；不启用变更高亮（R-12-030 的提交时基准高亮本页不用）；审批内容一律展示提交时的快照，不随渠道数据变化；「渠道付款」审批在审批中、且该行当前第一层总计 ≠ 快照总计时，内容区顶部黄色提示「提交后本行总计已变为 {当前总计} {币种}，差额 {当前 − 快照} {币种}；本单按提交时金额付款」（当前总计为「-」时写「提交后本行总计已变为 -；本单按提交时金额付款」），审批结束后不显示（D-08-43）" }
  - { id: R-08-071, module: 审批内容, text: "「渠道对账」审批内容：结算期；渠道账单文件（文件名，点击下载原文件）；校验结果「共 N 行，可入账 A 行，错误 M 行」，M > 0 时带「下载错误清单」；按账户系统汇总表（账户系统、可入账行数、小计、税费、渠道返点、总计、提交时当前生效总计，没有为「-」）；「入账影响」表（R-08-026，提交时快照）；可入账明细表（账户系统、账户名称、orgid、小计、税费、渠道返点、总计）；备注；审批通过后另显示「入账结果：入账 X 行，跳过 Y 行」，Y > 0 时带「下载入账错误清单」，跳过行使账户变为「-」时另起一行「因跳过而清空：{账户名称}（{orgid}）」（多个用「、」连接）（D-08-33）" }
  - { id: R-08-072, module: 审批内容, text: "「渠道付款」审批内容：结算期、账户系统、小计、税费、渠道返点、总计、应付金额（本行币种）、共享订单说明（同 R-08-041，没有不显示）、结算币种、汇率（含汇率日期）与换算后应付金额（同币种不显示）、收款主体（没填显示「-」）、缺数据提示（N = 0 不显示）、账户明细表、备注；审批中总计变化提示见 R-08-070；审批通过后另显示「付款单：{财务ID} · {付款单状态}」（由 09 提供，待汇出 / 待完成 / 已完成，D-00-33）；原型的「充值金额」不做（D-08-06）" }
  # —— 2.8 权限 ——
  - { id: R-08-080, module: 权限, text: "新增 3 个权限点（D-00-45、D-08-11；全部财务权限点清单以 13 为准，D-00-78）：「渠道对账中心」（进入页面、查看全部数据、只读查看两种审批详情）、「导入渠道账单」、「渠道付款」；后两个依赖「渠道对账中心」查看点，需同时有才看得到入口、才能操作（D-13-01），服务端同样校验；没有「渠道对账中心」时左侧菜单不显示，直接访问页面地址时在主布局内容区显示「无权限访问」、保留当前地址（R-13-005）；权限 / 菜单加载失败时按 R-13-006 显示「加载失败，请刷新」，不跳登录页；没有对应权限点时按钮不显示" }
  - { id: R-08-081, module: 权限, text: "数据范围：有「渠道对账中心」即看全部账户系统、全部账户，不按账户数据权限过滤（D-08-11）" }
  - { id: R-08-082, module: 权限, text: "12 审批详情第②类只读查看（R-12-043、R-12-044）：渠道对账审批单 = 有「渠道对账中心」权限点的人可只读查看；渠道付款审批单 = 有「渠道对账中心」或「收付款中心」权限点的人可只读查看（「收付款中心」只给审批详情只读查看资格，不给本页访问权，不显示通过 / 驳回 / 撤回，D-00-71、R-13-050）；本页对「能否查看」判断按此返回" }
  # —— 2.9 对外接口 ——
  - { id: R-08-090, module: 对外接口, text: "给 06：按「账户 × 结算期」提供上传来源的渠道统计金额（R-08-018 的总计）；系统抓取（自接苹果）06 自己读订单数据（R-06-014、R-06-015），与本页 R-08-017 是同一份数据、同一口径；本页为「-」时 06 显示「-」" }
  - { id: R-08-091, module: 对外接口, text: "给 10：渠道统计金额 = 账户 × 结算期的总计（R-08-015）；同一订单挂多个账户时本页与 06 都展示全额，10 按 R-10-006 拆分；「渠道付完」（D-00-65 ③）= 该账户该结算期渠道统计金额不是「-」，且该账户所属账户系统该结算期的第一层行状态为已完成（含按 R-08-056 视为已完成的 0.00 行）（D-08-23）；付款后才有值或金额变化的账户同样算付完，差额由「金额有变化」提示（R-08-025）、线下处理（D-08-08）；系统抓取的账户系统：所属行已完成后，本结算期有消耗但没有任何订单的账户视为渠道付完，本页照常显示「-」，10 按 0 计；之后订单到了按 R-08-024 通知、10 退回重算（D-08-35）；向 10 提供账户级已付快照值（R-08-054：完成那张渠道付款单快照里该账户的总计，没有则为空），10 详情在「金额有变化」时据此展示「已付快照」；口径与 index D-00-65 ③、D-00-80 一致；渠道统计金额变化按 R-08-024 通知，触发 D-00-66 退回重算" }
  - { id: R-08-092, module: 对外接口, text: "给 09：渠道付款审批通过时按 R-08-053 生成付款单（含收款主体）；09 需回写 付款单号、付款单状态（待汇出 / 待完成 / 已完成）与完成时间（R-09-071）；本页向 09 提供该行当前第一层总计，供确认汇款弹窗比对快照总计并提示（R-09-040，D-09-22）；只有「已完成」（确认到账，D-00-33）时本页按 R-08-054 变更行状态，确认汇款后的待完成不变（R-08-053）；付款单本期不作废 / 退回，sys 兜底撤回也不含渠道付款单（D-00-69）" }

