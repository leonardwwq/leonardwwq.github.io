meta:
  feature: 收付款中心
  product: ASA
  version: v2.1.0
  page: 09-收付款中心
  date: 2026-10-20
  prd: PRD.md
  status: 待评审
scope:
  in:
    - "收付款中心页：收款单据、付款单据两个 tab（搜索、筛选、列表、排序、分页）"
    - "收款单：接收 05 账户充值、06 结算单支付生成；确认收款（实收、到账凭证、手续费与按账户分摊）；完成后回写来源"
    - "付款单：接收 05 余额退款、07 客户返点 / 客情费用、08 渠道付款生成；确认汇款、确认到账（到账才算完成，D-00-33）；完成后回写来源"
    - "收付款单编号（交易明细「财务ID」）、状态查询、生成幂等"
    - "本页 3 个权限点；操作日志；给 10 的手续费与金额数据"
  out:
    - "作废 / 退回收付款单、对前端开放撤回：本期不做，后续版本再加；撤回只留 sys 兜底两种（R-09-076，D-09-02）"
    - "错单、退款被银行退回的系统内处理：线下结清，确需改数据由技术逐单出方案（R-09-053，D-00-69）"
    - "客户以其他币种付款的汇差单独记录（计入手续费，D-09-18）"
    - "各来源业务单据本身与其审批（05、06、07、08、12）；交易明细的展示与列映射（05）"
    - "部分收款、分多次付款（D-00-32：收款只确认一次）"
    - "导出、确认收付款的通知（D-09-12）"
    - "银行流水对接、自动对账；另存真实银行手续费（D-09-04）"
    - "手续费、汇出 / 到账差额怎么进毛利、归哪个月（10 定，R-10-007）"
    - "菜单位置与权限点汇总（13）"

roles:
  - { role: "有「收付款中心」权限点的用户", can: ["进入收付款中心", "查看全部收款单与付款单（不按账户数据权限过滤）", "预览凭证"], cannot: ["确认收款", "确认汇款", "确认到账"], source: "新增权限点（R-09-060、R-09-061，D-09-03，13 汇总）" }
  - { role: "另有「确认收款」权限点", can: ["对待完成的收款单确认收款"], cannot: ["修改已完成的收款单"], source: "新增权限点（R-09-060）" }
  - { role: "另有「确认付款」权限点", can: ["对待汇出的付款单确认汇款", "对待完成的付款单确认到账"], cannot: ["修改应付金额", "修改已汇出 / 已完成的付款单"], source: "新增权限点（R-09-060）" }
  - { role: "系统", can: ["来源审批通过时生成收付款单", "收付款单完成时回写来源单据", "向来源与 10 提供状态与金额"], cannot: [], source: "R-09-001～R-09-006、R-09-070～R-09-075" }

entities:
  - name: 收款单
    key: receipt
    note: "来源审批通过时由系统生成（R-09-001）；生成后不能改金额、不能作废（D-09-02）"
    fields:
      - { key: "finance_id", label: "财务ID", type: "string", required: true, generated: true, rule: "收付款单编号，全局唯一（收款单与付款单之间也不重复）；沿用现有单据 ID（充值 RC-、退款 RF-、结算单、渠道结算单 ID），生成后不变（R-09-004，D-09-25）" }
      - { key: "type", label: "交易类型", type: "enum", required: true, enum: ["账户充值", "结算单支付"], rule: "R-09-001" }
      - { key: "source_doc", label: "来源单据", type: "ref", required: true, rule: "05 费用单据（账户充值）/ 06 结算单" }
      - { key: "approval_id", label: "关联审批单号", type: "ref", required: true, rule: "来源审批单；同一审批单只生成一张（R-09-003）" }
      - { key: "customer_id", label: "公司名称", type: "ref", required: true, rule: "04 客户" }
      - { key: "payer", label: "付款主体", type: "string", required: true, rule: "来源单据快照" }
      - { key: "applicant", label: "申请人", type: "ref", required: true, rule: "来源审批单申请人" }
      - { key: "applied_at", label: "申请时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", rule: "来源审批单申请时间（R-09-005）" }
      - { key: "created_at", label: "生成时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "审批通过、生成本单的时间；列表不展示" }
      - { key: "currency", label: "币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "来源单据的结算币种（D-00-08、D-00-68）" }
      - { key: "receivable", label: "应收金额", type: "decimal", required: true, precision: 2, currency: "本单币种", rule: "> 0（应收为 0.00 的单正常流程不生成，0 元处理只作兜底，R-09-006）；账户充值 = 应收金额总计（结算币种），结算单支付 = 结算单扣掉余额抵扣后的应付金额（余额抵扣不进收款单，D-00-73）（R-09-001）" }
      - { key: "account_lines", label: "账户行", type: "list", required: true, rule: "每个账户一行：账户、分摊权重（来源单据里该账户的应收，原币；本次应收 ≤ 0 的按 0，本次应收照原值记录；同一客户账户同币种 D-05-11）、手续费分摊（本单币种）（R-09-002、R-09-034）" }
      - { key: "payer_vouchers", label: "打款凭证", type: "list", required: false, rule: "账户充值 = 05 充值弹窗上传的凭证；结算单支付没有（R-09-001）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "来源单据备注" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["待完成", "已完成", "已撤回"], default: "待完成", generated: true, rule: "flows 收款单；已撤回只由 sys 兜底产生、只读（R-09-076）" }
      - { key: "received", label: "实收金额", type: "decimal", required: false, precision: 2, currency: "本单币种", rule: "确认收款时填（R-09-031）" }
      - { key: "handling_fee", label: "手续费", type: "decimal", required: false, precision: 2, currency: "本单币种", generated: true, rule: "= 应收 − 实收，可为负（R-09-032，D-00-32）" }
      - { key: "fee_alloc_mode", label: "手续费分配", type: "enum", required: false, enum: ["系统分配", "手动分配"], rule: "R-09-033～R-09-036" }
      - { key: "arrival_vouchers", label: "到账凭证", type: "list", required: false, rule: "确认收款时上传，至少 1 个；应收为 0.00 的单选填（R-09-031、R-09-050）" }
      - { key: "confirm_remark", label: "确认备注", type: "text", required: false, rule: "确认收款时选填，最多 1,024 字（R-09-054）" }
      - { key: "withdrawn_at", label: "撤回时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "sys 兜底撤回成功的系统时间（R-09-076）" }
      - { key: "confirmed_by", label: "确认人", type: "ref", required: false, generated: true, rule: "点确认收款的用户" }
      - { key: "completed_at", label: "完成时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "确认收款成功的系统时间（R-09-005）" }
  - name: 付款单
    key: payment
    note: "来源审批通过时由系统生成（R-09-001）；金额一律记正数（R-09-006）；生成后不能改金额、不能作废（D-09-02）"
    fields:
      - { key: "finance_id", label: "财务ID", type: "string", required: true, generated: true, rule: "同收款单（R-09-004）" }
      - { key: "type", label: "交易类型", type: "enum", required: true, enum: ["余额退款", "客户返点", "客情费用", "渠道付款"], rule: "R-09-001" }
      - { key: "source_doc", label: "来源单据", type: "ref", required: true, rule: "05 费用单据（充值退款）/ 07 返点单据 / 08 渠道付款单" }
      - { key: "approval_id", label: "关联审批单号", type: "ref", required: true, rule: "同一审批单只生成一张（R-09-003）" }
      - { key: "customer_id", label: "公司名称", type: "ref", required: false, rule: "渠道付款没有（R-09-012）" }
      - { key: "account_system", label: "账户系统", type: "ref", required: false, rule: "仅渠道付款：来源单据的账户系统（R-09-012）" }
      - { key: "period", label: "结算期", type: "string", required: false, rule: "仅渠道付款：yyyy-mm（R-08-053）" }
      - { key: "payee", label: "收款主体", type: "string", required: false, rule: "我们付钱给对方时对方的主体（D37）：余额退款 / 客户返点 / 客情费用 = 来源单据（05 退款、07 现金打款）的「收款主体」，选项取客户付款主体；渠道付款 = 08 发起时选填的值，可为空（R-08-047）" }
      - { key: "applicant", label: "申请人", type: "ref", required: true, rule: "来源审批单申请人" }
      - { key: "applied_at", label: "申请时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", rule: "R-09-005" }
      - { key: "created_at", label: "生成时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "列表不展示" }
      - { key: "currency", label: "币种", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "来源单据的结算币种（D-00-68）" }
      - { key: "payable", label: "应付金额", type: "decimal", required: true, precision: 2, currency: "本单币种", rule: "> 0，正数（R-09-006）" }
      - { key: "remark", label: "备注", type: "text", required: false, rule: "来源单据备注" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["待汇出", "待完成", "已完成", "已撤回"], default: "待汇出", generated: true, rule: "flows 付款单（D-00-33）；已撤回只由 sys 兜底产生、只读（R-09-076）" }
      - { key: "remitted", label: "汇出金额", type: "decimal", required: false, precision: 2, currency: "本单币种", rule: "确认汇款时填（R-09-041）" }
      - { key: "remit_vouchers", label: "打款凭证", type: "list", required: false, rule: "确认汇款时上传，至少 1 个（R-09-041）" }
      - { key: "remitted_by", label: "汇款确认人", type: "ref", required: false, generated: true, rule: "—" }
      - { key: "remitted_at", label: "汇出时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "确认汇款成功的系统时间（R-09-005）" }
      - { key: "remit_remark", label: "确认汇款备注", type: "text", required: false, rule: "确认汇款时选填，最多 1,024 字（R-09-054）" }
      - { key: "arrived", label: "到账金额", type: "decimal", required: false, precision: 2, currency: "本单币种", rule: "确认到账时填（R-09-044）" }
      - { key: "arrival_vouchers", label: "到账凭证", type: "list", required: false, rule: "确认到账时上传，至少 1 个（R-09-044）" }
      - { key: "arrived_by", label: "到账确认人", type: "ref", required: false, generated: true, rule: "—" }
      - { key: "completed_at", label: "完成时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "确认到账成功的系统时间（R-09-005）" }
      - { key: "arrive_remark", label: "确认到账备注", type: "text", required: false, rule: "确认到账时选填，最多 1,024 字（R-09-054）" }
      - { key: "withdrawn_at", label: "撤回时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "sys 兜底撤回成功的系统时间（R-09-076）" }
  - name: 收付款操作日志
    key: finance_log
    note: "只追加；页面不展示，供追溯"
    fields:
      - { key: "finance_id", label: "财务ID", type: "ref", required: true, rule: "收款单或付款单" }
      - { key: "action", label: "动作", type: "enum", required: true, enum: ["生成", "确认收款", "确认汇款", "确认到账", "撤回（sys 兜底）"], rule: "R-09-063" }
      - { key: "operator", label: "操作人", type: "ref", required: false, rule: "生成为系统，记空" }
      - { key: "at", label: "时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true }
      - { key: "payload", label: "提交内容", type: "text", required: true, rule: "本次填写的金额、分配方式与各账户手续费、凭证文件清单、确认备注；撤回记来源回退结果" }

flows:
  - entity: 收款单
    states: [待完成, 已完成]
    initial: 待完成
    transitions:
      - { from: "无", action: "05 账户充值 / 06 生成结算单 审批通过", actor: 系统, to: 待完成, guard: "R-09-001～R-09-003" }
      - { from: 待完成, action: "确认收款", actor: "有「确认收款」的用户", to: 已完成, guard: "R-09-030～R-09-038" }
      - { from: 待完成, action: "撤回待到款充值（sys 兜底，前端不暴露）", actor: "sys", to: 已撤回, guard: "仅账户充值收款单（R-09-076）" }
    reverse:
      - { action: "作废 / 退回", actor: "—", allowed_from: [], note: "本期不做（D-09-02）；已完成不可修改；错单线下处理（R-09-053）" }
      - { action: "撤回（sys 兜底）", actor: "sys", allowed_from: [待完成], note: "只限账户充值：充值不到账、05 交易明细「已撤回」、额度不清零（R-09-076，D-00-69）" }
  - entity: 付款单
    states: [待汇出, 待完成, 已完成]
    initial: 待汇出
    transitions:
      - { from: "无", action: "05 充值退款 / 07 现金打款（合计 > 0）/ 08 渠道付款 审批通过", actor: 系统, to: 待汇出, guard: "R-09-001～R-09-003" }
      - { from: 待汇出, action: "确认汇款", actor: "有「确认付款」的用户", to: 待完成, guard: "R-09-040～R-09-043" }
      - { from: 待完成, action: "确认到账", actor: "有「确认付款」的用户", to: 已完成, guard: "R-09-044～R-09-046（D-00-33）" }
      - { from: 待汇出, action: "撤回待汇出退款（sys 兜底，前端不暴露）", actor: "sys", to: 已撤回, guard: "仅余额退款付款单（R-09-076）" }
    reverse:
      - { action: "作废 / 退回", actor: "—", allowed_from: [], note: "本期不做（D-09-02）；已汇出、已完成不可修改；错单与银行退回线下处理（R-09-053）" }
      - { action: "撤回（sys 兜底）", actor: "sys", allowed_from: [待汇出], note: "只限余额退款：退款余额按原分桶快照加回、05 交易明细「已撤回」（R-09-076，D-00-69）" }

refs:
  - { page: 05-费用管理, entity: 交易明细, ids: [R-05-082, R-05-085, R-05-094, R-05-095, R-05-097, R-05-033, R-05-048, R-05-100, D-05-11, D-05-42], uses: "账户充值 / 充值退款审批通过时生成本页收付款单；本页完成时回写，05 按 R-05-085 到账 / 改交易明细；财务ID = 本页编号；金额格式、凭证限制沿用" }
  - { page: 06-账单与结算单, entity: 账单, ids: [R-06-013, R-06-051, R-06-053, R-06-044, R-06-061, Q-06-05], uses: "生成结算单审批通过、应付 > 0 时生成收款单（D-00-80）；账户行应收取 06（已扣返点抵扣、余额抵扣，D-00-73）；确认收款后 06 账单变已结算；06 已提交审批执行状态读本页状态" }
  - { page: 07-返点管理, entity: 返点计提项, ids: [R-07-057, R-07-059, R-07-017, R-07-064, Q-07-03], uses: "现金打款审批通过生成付款单；付款单已完成后计提项变已结算；07 已提交审批执行状态读本页状态" }
  - { page: 08-渠道对账, entity: 渠道账单行, ids: [R-08-003, R-08-040, R-08-047, R-08-053, R-08-054, R-08-092, R-08-070, R-08-072, R-08-080, R-08-081, D-08-27], uses: "渠道付款审批通过（总计 > 0）生成付款单，带收款主体（R-08-047）；结算期展示格式同 R-08-003；付款单已完成后行变已完成；08 审批内容区读本页付款单号与状态；确认汇款弹窗读 08 该行当前总计比对快照、黄字写法同 R-08-070；权限与数据范围写法同 08" }
  - { page: 12-审批配置与审批中心, entity: 审批单, ids: [R-12-020, R-12-025, R-12-043, R-12-044], uses: "确认备注长度同审批备注（R-12-020）；来源审批通过（R-12-025）由来源页调本页生成；审批单号链接的查看权限" }
  - { page: 04-客户管理, entity: 客户, ids: [R-04-013], uses: "公司名称、客户当前的所属账户系统" }
  - { page: 13-导航与权限, ids: [R-13-050], uses: "有「收付款中心」权限点的人可只读打开 8 种审批类型的审批详情（D-00-71），本页关联审批单号链接按此可打开（R-09-015）" }
  - { page: 10-利润中心, entity: 利润记录, ids: [R-10-007, R-10-011], uses: "手续费归月（结算单支付 → 账单结算期，账户充值 → 收款完成日 UTC0 所在月）、汇出 / 到账差额不进毛利、手续费按收款完成日汇率折人民币（R-09-074）" }

rules:
  # —— 2.1 生成与接口 ——
  - { id: R-09-001, module: 生成, text: "来源审批通过时由来源页调本页生成（本页不提交、不审批）：账户充值 → 收款单（05 R-05-082）；结算单支付 → 收款单，应收 = 结算单扣掉余额抵扣后的应付（余额抵扣是客户已付的款，在 06 / 05 结清，不进收款单，D-00-73），仅该应付 > 0 时生成（应付为 0.00 的结算单审批通过即已结算、不生成收款单，D-00-80）（06 R-06-051）；余额退款 → 付款单（05 R-05-082）；客户返点 / 客情费用 → 付款单，仅现金打款且合计 > 0，带 07 所选的「收款主体」（07 R-07-057）；渠道付款 → 付款单（08 R-08-053，第一层总计 > 0 才能发起，R-08-040）。生成时带：交易类型、来源单据、关联审批单号、公司名称（渠道付款无）、账户系统与结算期（仅渠道付款）、付款主体（收款单）/ 收款主体（付款单；渠道付款为 08 选填的值，可为空）、申请人、申请时间、币种、应收 / 应付金额、备注；账户充值另带打款凭证" }
  - { id: R-09-002, module: 生成, text: "收款单另带账户行，作为手续费分摊权重：账户充值 = 本单每个填了金额的账户及其应收金额（账户币种，05 R-05-047）；结算单支付 = 账单第二层每个账户行，权重 = 该账户行本次应收（= 可结算应收 − 该账户余额抵扣，以 06 R-06-051 / R-06-013 为准，D-00-73）；本次应收 ≤ 0 的账户行分摊权重按 0 算，本次应收照原值记录（D-09-21）；同一客户下账户消耗币种相同（D-05-11），权重按原币直接比、不换算（D-09-20）" }
  - { id: R-09-003, module: 生成, text: "同一张审批单只生成一张收付款单：来源重复调用时返回已有那张的财务ID，不新建" }
  - { id: R-09-004, module: 生成, text: "财务ID 生成时分配，收款单、付款单全局唯一、不复用，生成后不变；05 交易明细的「财务ID」即此编号（R-05-097）；沿用现有单据 ID（充值 RC-、退款 RF-、结算单、渠道结算单 ID），全局唯一、生成后不变（D-09-25）" }
  - { id: R-09-005, module: 生成, text: "申请时间 = 来源审批单的申请时间；汇出时间、完成时间、撤回时间 = 对应操作成功那一刻的系统时间，不能手填；页面时间一律 yyyy-mm-dd hh:mm:ss（Asia/Shanghai，北京时间）展示；手续费归月按 UTC0 自然日（只影响账户充值：按收款完成时刻的 UTC0 日期归月，R-09-074），所以北京时间 1 日 0～8 点完成的充值收款，手续费归上个月" }
  - { id: R-09-006, module: 生成, text: "付款单的应付、汇出、到账金额一律记正数（余额退款也是正数；交易明细里退款记负是 05 的展示口径，R-05-097）；付款单应付 > 0；收款单应收 > 0（应收为 0.00 的收款单正常流程不再生成，D-00-80、D-09-19；R-09-031 / R-09-037 里应收为 0 的处理只作兜底保留）" }
  # —— 2.2 列表 ——
  - { id: R-09-010, module: 列表, text: "页面标题「收付款中心」；两个 tab：收款单据（默认）、付款单据；页面数据不跟随顶栏「账户系统」切换，只用页内筛选（同 08 D-08-14 做法）" }
  - { id: R-09-011, module: 列表, text: "收款单据列依次：财务ID、交易类型、公司名称、所属账户系统、付款主体、申请人、申请时间、应收金额、实收金额、手续费、状态、关联审批单号、完成时间、打款凭证、到账凭证、备注、操作；财务ID 列左固定，操作列右固定；没有值的格显示「-」；备注格先显示来源备注，有确认备注时另起一行「确认备注：…」（R-09-054）" }
  - { id: R-09-012, module: 列表, text: "付款单据列依次：财务ID、交易类型、公司名称、所属账户系统、收款主体、申请人、申请时间、应付金额、汇出金额、到账金额、状态、关联审批单号、汇出时间、完成时间、打款凭证、到账凭证、备注、操作；渠道付款：公司名称格显示「{账户系统} · {结算期}」（结算期格式同 08 R-08-003，如「亨利-出海 · 2026-09-01 至 2026-09-30」），收款主体显示 08 发起时填的值、没填显示「-」，所属账户系统显示本单的账户系统；其他类型的所属账户系统取客户当前的（R-04-013）；备注格先显示来源备注，有确认备注时依次另起一行「确认汇款备注：…」「确认到账备注：…」（R-09-054）（D-09-15）" }
  - { id: R-09-013, module: 列表, text: "金额列一律本单币种，千分位、2 位小数、后缀币种（格式同 R-05-033，如「99,727.60 人民币」）；手续费为负时前面加「-」，不标红" }
  - { id: R-09-014, module: 列表, text: "已完成收款单的手续费格，鼠标悬浮显示各账户分摊，每个账户一行「{账户名称} {手续费} {币种}」" }
  - { id: R-09-015, module: 列表, text: "关联审批单号可点，新页打开审批详情，能否查看按 R-12-043；另外有「收付款中心」权限点的人可只读打开账户充值、充值退款、额度调整、余额分配、生成结算单、客户返点、客情费用、渠道付款 8 种审批类型的审批详情（R-13-050、D-00-71），本页 6 种交易类型的来源审批都在其中，所以没有账户查看权限也能打开，只读、不显示通过 / 驳回 / 撤回；打款凭证、到账凭证列有文件时显示「查看」，做法同 R-05-100（图片和 PDF 新页预览，其他格式直接下载；多个文件时弹出文件列表逐个查看），没有文件显示「-」（D-09-17）" }
  - { id: R-09-016, module: 列表, text: "搜索框按财务ID、关联审批单号、公司名称包含匹配，渠道付款按公司名称格的「{账户系统} · {结算期}」文字同样包含匹配；筛选：所属账户系统 单选（全部 + 现有账户系统列表），交易类型 单选（全部 + 本 tab 的类型：收款 账户充值 / 结算单支付，付款 余额退款 / 客户返点 / 客情费用 / 渠道付款），申请时间 日期范围（按 Asia/Shanghai 自然日，含首尾两天，默认不限），状态 单选（收款 全部 / 待完成 / 已完成；付款 全部 / 待汇出 / 待完成 / 已完成；「已撤回」不提供筛选项，只在「全部」下出现，R-09-076）；默认都为全部；各条件同时生效。原型「所属账户系统」里的登记表状态、状态里的「待结算 / 已结算」是复制残留，不做" }
  - { id: R-09-017, module: 列表, text: "切换 tab 时搜索与筛选重置为默认；同一 tab 内翻页保留筛选" }
  - { id: R-09-018, module: 列表, text: "排序：没完成的在前（收款单 待完成；付款单 待汇出和待完成同属「未完成」一组，组内混排、不分先后，D-09-24），已完成在后，已撤回排在已完成之后；各组内按申请时间降序，申请时间相同按财务ID降序" }
  - { id: R-09-019, module: 列表, text: "分页 10 / 50 / 100 / 300 条每页，默认 10，显示「共 N 条」；没有任何单据显示「暂无数据」；搜索 / 筛选后没有结果显示「没有符合条件的单据」" }
  - { id: R-09-020, module: 列表, text: "操作列：收款单 待完成 且有「确认收款」→「确认收款」；付款单 待汇出 且有「确认付款」→「确认汇款」，待完成 且有「确认付款」→「确认到账」；其余情况（含已完成、已撤回）为空" }
  # —— 2.3 确认收款 ——
  - { id: R-09-030, module: 确认收款, text: "确认收款弹窗只读区：公司名称、付款主体、交易类型、申请时间、关联审批单号、应收金额、打款凭证（结算单支付显示「-」）、备注；付款主体只读、不可改，客户代付或换了付款主体时在确认备注里写明实际付款方，不改快照（D-09-14）" }
  - { id: R-09-031, module: 确认收款, text: "输入：实收金额（必填，本单币种，> 0、最多 2 位小数；下方灰字「客户以其他币种付款时，按银行实际入账的本单币种金额填写」；应收为 0.00 的兜底单允许填 0.00）；到账凭证（必填，至少 1 个，限制见 R-09-050；应收为 0.00 的兜底单选填）；确认备注（选填，R-09-054）" }
  - { id: R-09-032, module: 确认收款, text: "手续费 = 应收金额 − 实收金额，随实收实时计算、只读，少收为正、多收为负（D-00-32、D-09-04）；实收没填时显示「-」" }
  - { id: R-09-033, module: 确认收款, text: "账户行有 2 个及以上时显示「手续费分配」单选 系统分配（默认）/ 手动分配 和账户列表（账户名称、应收金额（原币）、手续费）；只有 1 个账户行时不显示分配方式，手续费全部记在该账户" }
  - { id: R-09-034, module: 确认收款, text: "系统分配：只在应收 > 0 的账户行之间按应收占比分（账户行同一币种 D-05-11，按原币直接算占比）；除应收最大的那个账户外，每个账户 = 手续费 × 本账户应收 ÷ 参与账户应收之和，四舍五入到 2 位；应收最大的账户（并列取账户名称升序第一个）= 手续费 − 其余之和；应收 ≤ 0 的账户分 0.00；手续费、实收变化时自动重算，账户手续费只读" }
  - { id: R-09-035, module: 确认收款, text: "所有账户行应收都 ≤ 0 时，系统分配不可选，默认手动分配" }
  - { id: R-09-036, module: 确认收款, text: "手动分配：每个账户手续费可输入，可正可负、最多 2 位小数，切到手动时先按系统分配结果回填；显示「待分配手续费：{手续费 − 各账户之和}」（带正负号与币种），不为 0.00 时标红；切回系统分配时按 R-09-034 重算并覆盖手填值" }
  - { id: R-09-037, module: 确认收款, text: "点「确认收款」先做前端校验：实收不合格提示「请输入大于 0、最多 2 位小数的金额」（应收为 0 的兜底单提示「请输入不小于 0、最多 2 位小数的金额」）；没有到账凭证提示「请上传到账凭证」（应收为 0 的兜底单不校验）；手动分配待分配不为 0 提示「待分配手续费须为 0，当前为 {金额}」；账户手续费格式不对提示「最多 2 位小数」；凭证还在上传中不能确认；通过后二次确认「确认收款后不可修改。实收 {实收}，手续费 {手续费}，是否确认？」（取消 / 确定）；|手续费| > 应收金额 × 1% 时，确认文案前加红字「实收与应收相差超过 1%，差额将全部记为手续费，请核对实收金额」，不拦确认（D-09-16）" }
  - { id: R-09-038, module: 确认收款, text: "确定后服务端复核权限点与本单仍为待完成，并按 R-09-034 / R-09-036 复核分摊之和 = 手续费；通过则写入实收、手续费、各账户分摊、分配方式、到账凭证、确认备注、确认人、完成时间，状态变已完成，按 R-09-070 回写来源，弱提示「已确认收款」、关闭弹窗、刷新列表" }
  # —— 2.4 确认汇款 / 确认到账 ——
  - { id: R-09-040, module: 确认付款, text: "确认汇款弹窗只读区：公司名称（渠道付款显示「{账户系统} · {结算期}」）、收款主体、交易类型、申请时间、关联审批单号、应付金额、备注；收款主体只读、不可改，实际收款方不同时写在确认备注里，不改快照（D-09-14）；待汇出的渠道付款单，如果 08 该行当前第一层总计 ≠ 快照总计（R-08-092），确认汇款弹窗顶部显示黄字，写法同 R-08-070：「提交后本行总计已变为 {当前总计} {币种}，差额 {当前 − 快照} {币种}；本单按提交时金额付款」（当前总计为「-」时写「提交后本行总计已变为 -；本单按提交时金额付款」），只提示、不拦确认汇款，应付金额不变（D-09-22）" }
  - { id: R-09-041, module: 确认付款, text: "确认汇款输入：汇出金额（必填，本单币种，> 0、最多 2 位小数，默认空，不和应付比大小，D-09-06）；打款凭证（必填，至少 1 个，R-09-050）；确认备注（选填，R-09-054）；校验提示同 R-09-037（「请上传打款凭证」）；二次确认「确认已汇出 {汇出金额}？确认后不可修改。」" }
  - { id: R-09-042, module: 确认付款, text: "确认汇款成功：写入汇出金额、打款凭证、确认汇款备注、汇款确认人、汇出时间，状态 待汇出 → 待完成；不回写来源单据，来源仍是付款中（08 行「付款中」、07 计提项「待打款」、05 交易明细「待完成」）；弱提示「已确认汇款」" }
  - { id: R-09-043, module: 确认付款, text: "汇出金额与应付金额不同时，弹窗里「汇出金额」下方灰字提示「与应付金额相差 {应付 − 汇出}」，不拦确认" }
  - { id: R-09-044, module: 确认付款, text: "确认到账弹窗只读区：R-09-040 的只读内容（渠道金额变化黄字只在确认汇款弹窗显示）+ 汇出金额、汇出时间、打款凭证；输入：到账金额（必填，> 0、最多 2 位小数，不和应付、汇出比大小）、到账凭证（必填，至少 1 个，R-09-050；上传区提示「收款方确认收到的凭证均可：回执、对账单、邮件或聊天截图」，D-09-18）、确认备注（选填，R-09-054）；与应付不同时灰字提示同 R-09-043；二次确认「确认对方已到账 {到账金额}？确认后付款单完成，不可修改。」" }
  - { id: R-09-045, module: 确认付款, text: "确认到账成功：写入到账金额、到账凭证、确认到账备注、到账确认人、完成时间，状态 待完成 → 已完成，按 R-09-071 回写来源；弱提示「已确认到账」" }
  - { id: R-09-046, module: 确认付款, text: "确认汇款、确认到账提交时服务端复核权限点与本单当前状态（分别须为待汇出、待完成），不符时按 R-09-052 处理" }
  # —— 2.5 公共校验与异常 ——
