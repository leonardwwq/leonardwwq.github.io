  - { id: G-09-023, module: 对外接口, given: "公共前置；SK-A 待完成（账户充值），FK-C 待汇出（余额退款，审批通过时已扣 05 余额 31,486.85 人民币），FK-B 待汇出（客情费用）", when: "sys 分别对 SK-A、FK-C 执行兜底撤回，再尝试对 FK-B 撤回；李娜查看两个 tab", then: "SK-A、FK-C 状态「已撤回」，排在已完成之后，操作列为空，确认类字段「-」；05：SK-A 那笔充值交易明细「已撤回」、两个账户不到账、额度不清零，FK-C 那笔「已撤回」、退款余额按原分桶加回；FK-B 撤回被拒、仍待汇出；页面上没有任何撤回按钮；状态筛选没有「已撤回」，选「全部」能看到这两张；操作日志各有一条「撤回（sys 兜底）」" }
  - { id: G-09-024, module: 确认付款, given: "FK-B 待汇出", when: "李娜确认汇款时备注填「代付：橙子出行（香港）」，确认；再确认到账，备注填 1,025 个字", then: "确认汇款弹窗收款主体只读、不可改；完成后列表备注格先是来源备注，下一行「确认汇款备注：代付：橙子出行（香港）」；确认到账备注输到 1,024 字后不能继续输入；到账后备注格再多一行「确认到账备注：…」；操作日志记下两条备注" }
  - { id: G-09-025, module: 生成, given: "06 某结算单应付 0.00（返点抵满）审批通过；另一张应付 1,000.00 人民币审批通过", when: "查看收款单据", then: "只有应付 1,000.00 的那张生成了收款单；应付 0.00 的结算单没有收款单（06 账单直接已结算）" }

tasks:
  - { id: T-09-001, title: "数据模型：收款单 / 账户行分摊 / 付款单 / 操作日志；财务ID 生成", depends_on: [], done_when: "entities 全部字段可落库；财务ID 沿用现有单据 ID、全局唯一（D-09-25）" }
  - { id: T-09-002, title: "生成接口（5 种来源、幂等）与状态查询接口（R-09-001～R-09-006、R-09-073）", depends_on: [T-09-001], done_when: "G-09-001～G-09-003、G-09-025 通过；05～08 能拿到财务ID 与状态" }
  - { id: T-09-003, title: "收付款中心列表：两 tab、搜索筛选、排序分页、凭证预览、审批单号链接（R-09-010～R-09-020）", depends_on: [T-09-002, T-09-006], done_when: "G-09-004～G-09-006、G-09-021 通过" }
  - { id: T-09-004, title: "确认收款弹窗、手续费系统 / 手动分配、服务端复核、回写 05 / 06（R-09-030～R-09-038、R-09-050～R-09-053、R-09-070）", depends_on: [T-09-003], done_when: "G-09-007～G-09-014、G-09-022 通过" }
  - { id: T-09-005, title: "确认汇款 / 确认到账、回写 05 / 07 / 08（R-09-040～R-09-046、R-09-071、R-09-072）", depends_on: [T-09-003], done_when: "G-09-015～G-09-018、G-09-024 通过" }
  - { id: T-09-006, title: "3 个权限点与服务端校验、数据范围（R-09-060～R-09-062）", depends_on: [], done_when: "G-09-019、G-09-020 通过" }
