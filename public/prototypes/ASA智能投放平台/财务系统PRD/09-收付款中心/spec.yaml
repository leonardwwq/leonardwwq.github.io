decisions:
  - { id: D-09-01, point: "付款单状态与完成时点", conclusion: "三态 待汇出 → 待完成 → 已完成，确认到账才算完成；来源回写与 10 / 11「算完」都以已完成为准；D-00-33 已按用户授权由本页直接改写", impact: "R-09-042、R-09-045、R-09-072；D-00-33；05、07、08、10、11", status: "已定（用户：要到账才算完成，允许你直接改）" }
  - { id: D-09-02, point: "作废 / 退回 / 撤回", conclusion: "本期不支持作废、退回；撤回入口不对前端暴露，只留 sys 兜底两种（充值收款单待完成、退款付款单待汇出），09 加只读状态「已撤回」；错单与银行退回线下结清，确需改数据由技术逐单出方案、用户确认后执行并留日志；回答 05～08 作废逆向的开放问题（D-00-69；05 D-05-42、06 Q-06-05、07 Q-07-03、08 D-08-27）", impact: "R-09-016、R-09-018、R-09-053、R-09-075、R-09-076；05～08 的 reverse", status: "已定（用户：本期不支持作废；2026-10-21 改写：用户定，会议清单 D32）" }
  - { id: D-09-03, point: "数据范围", conclusion: "有「收付款中心」权限点即看全部单据，不按账户数据权限过滤", impact: "R-09-061", status: "已定（用户）" }
  - { id: D-09-04, point: "收款差额叫法、银行手续费（总控交给本页问的版本级问题）", conclusion: "沿用「手续费」= 应收 − 实收；不另存真实银行手续费", impact: "R-09-032；报总控关闭对应版本级问题（X-6）", status: "已定（用户）" }
  - { id: D-09-05, point: "手续费按账户分摊", conclusion: "保留系统分配 + 手动分配；系统按各账户应收占比（只算应收 > 0），尾差给应收最大的账户；手动时待分配须为 0", impact: "R-09-033～R-09-036", status: "已定（用户选方向；算法细节由我代定，用户确认代定清单）" }
  - { id: D-09-06, point: "汇出 / 到账金额与应付不同", conclusion: "允许不同，只记录、灰字提示差额；进不进利润由 10 定", impact: "R-09-041、R-09-043、R-09-044、R-09-074", status: "已定（用户）" }
  - { id: D-09-07, point: "列表补列与搜索", conclusion: "补 公司名称、所属账户系统、付款主体（付款单为收款主体，D-09-15）三列；加搜索框（财务ID / 审批单号 / 公司名称）；付款单金额一律正数", impact: "R-09-006、R-09-011、R-09-012、R-09-016", status: "由我代定（用户确认代定清单）" }
  - { id: D-09-08, point: "筛选与原型残留", conclusion: "所属账户系统用现有账户系统列表；交易类型按 tab；申请时间默认不限；状态按本单状态；原型残留选项不做；切 tab 重置", impact: "R-09-016、R-09-017", status: "由我代定（用户确认代定清单）" }
  - { id: D-09-09, point: "时间取值", conclusion: "申请时间 / 申请人取审批单；汇出时间、完成时间取确认时刻系统时间，不能手填", impact: "R-09-005", status: "由我代定（用户确认代定清单）" }
  - { id: D-09-10, point: "输入校验", conclusion: "实收、汇出、到账 > 0、最多 2 位小数；凭证必填，≤ 10 个、每个 ≤ 5MB；确认前二次确认，确认后不可改。应收为 0.00 的收款单（正常流程不再生成，D-09-19）作兜底：实收允许 0.00、到账凭证选填", impact: "R-09-031、R-09-037、R-09-041、R-09-044、R-09-050", status: "已定（用户确认代定清单；2026-10-21 用户定，会议清单 D33-金额、D33-凭证与备注）" }
  - { id: D-09-11, point: "权限点", conclusion: "「收付款中心」「确认收款」「确认付款」三个；后两个依赖第一个", impact: "R-09-060；13", status: "由我代定（用户确认代定清单）" }
  - { id: D-09-12, point: "导出与通知", conclusion: "本期不做导出；确认收付款不发通知", impact: "scope.out", status: "由我代定（用户确认代定清单）" }
  - { id: D-09-13, point: "凭证叫法", conclusion: "原型「到款凭证」「到账凭证」混用，统一叫「到账凭证」（与 05 交易明细列名 R-05-096 一致）；我们打出去的叫「打款凭证」", impact: "R-09-011、R-09-012", status: "由我代定" }  # alias-ok
  - { id: D-09-14, point: "确认时的主体与确认备注", conclusion: "确认收款 / 汇款 / 到账时付款主体、收款主体只读，代付或换主体写在确认备注；三个确认弹窗各加选填备注（≤ 1,024 字），写入单据与日志，列表备注格另起一行显示", impact: "R-09-030、R-09-040、R-09-054、R-09-011、R-09-012", status: "已定（2026-10-21 用户定，会议清单 D33-付款主体、D33-凭证与备注）" }
  - { id: D-09-15, point: "付款单「收款主体」与渠道付款展示", conclusion: "我们付钱给对方的单据（付款单列表、确认汇款 / 到账弹窗）字段叫「收款主体」；渠道付款的收款主体取 08 选填值，公司名称格显示「{账户系统} · {结算期}」并可搜索", impact: "R-09-001、R-09-012、R-09-016、R-09-040", status: "已定（2026-10-21 用户定，会议清单 D37、D14-付款主体、D90）" }
  - { id: D-09-16, point: "实收差额超过 1% 的提示", conclusion: "|手续费| > 应收 × 1% 时确认框加红字提醒，不拦；维持到账按 05 快照、差额全记手续费", impact: "R-09-037", status: "已定（2026-10-21 用户定，会议清单 D05，A 档按推荐）" }
  - { id: D-09-17, point: "凭证查看与超量上传", conclusion: "凭证按钮统一叫「查看」，图片 / PDF 新页预览、其他下载、多文件列表；一次选超出时按顺序保留到 10 个并提示", impact: "R-09-015、R-09-050", status: "已定（2026-10-21 用户定，会议清单 D47-凭证，A 档按推荐）" }
  - { id: D-09-18, point: "其他币种付款与到账凭证提示", conclusion: "实收按银行实际入账的本单币种金额填，汇差进手续费、按账户分摊进 10，不单独记；到账凭证提示「回执、对账单、邮件或聊天截图均可」", impact: "R-09-031、R-09-044、已知限制", status: "已定（2026-10-21 用户定，会议清单 D89、D91，A 档按推荐）" }
  - { id: D-09-19, point: "0 元收付款单", conclusion: "应付为 0.00 的结算单审批通过即已结算、不生成收款单（含返点抵满、余额抵扣抵满）；渠道总计 > 0 才付款；实收、汇出、到账 > 0，应收 0 的处理只作兜底", impact: "R-09-001、R-09-006、R-09-031、R-09-037", status: "已定（2026-10-21 用户定，会议清单拍板结果「06 应付为 0」、D33-金额，D-00-80、D-00-73）" }
  - { id: D-09-20, point: "手续费分摊的币种前提", conclusion: "同一客户下账户消耗币种相同（D-05-11，技术答复 T07），分摊按原币直接算占比；不改算法，只改措辞", impact: "R-09-002、R-09-034", status: "已定（2026-10-21 用户定，会议清单 D88）" }
  - { id: D-09-21, point: "结算单收款单分摊权重为负", conclusion: "本次应收 ≤ 0 的账户行手续费分摊权重按 0 算，本次应收照原值记录；R-09-002 引用改为 R-06-051 / R-06-013", impact: "R-09-002；spec 收款单 account_lines", status: "已定（2026-10-22 用户与技术确认，闭环清单 B05）" }
  - { id: D-09-22, point: "确认汇款时渠道金额已变", conclusion: "只提示不拦：待汇出的渠道付款单，08 该行当前总计 ≠ 快照总计时，确认汇款弹窗顶部黄字，写法同 R-08-070，并注明本单按提交时的金额付款", impact: "R-09-040、R-09-044；08 R-08-092", status: "已定（2026-10-22 用户与技术确认，闭环清单 B08）" }
  - { id: D-09-23, point: "按 S-19 导入的历史收付款单", conclusion: "只作记录：确认后不回写来源单据，也不进 10；渠道付款不导入，上线月之前一律线下处理；是否导入仍随 S-19 定（Q-09-03）", impact: "R-09-077；Q-09-03", status: "已定（2026-10-22 用户与技术确认，闭环清单 B09）" }
  - { id: D-09-24, point: "付款单未完成组排序", conclusion: "付款单的待汇出和待完成同属「未完成」一组，组内按申请时间降序混排", impact: "R-09-018", status: "已定（2026-10-22 用户与技术确认，闭环清单 B22）" }
  - { id: D-09-25, point: "财务ID 编号", conclusion: "沿用现有单据 ID（充值 RC-、退款 RF-、结算单、渠道结算单 ID），全局唯一、生成后不变", impact: "R-09-004、T-09-001；关闭 Q-09-02", status: "已定（2026-10-22 用户与技术确认，闭环清单 E 组）" }

