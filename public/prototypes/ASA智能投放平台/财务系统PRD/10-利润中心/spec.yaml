decisions:
  - { id: D-10-01, point: "服务费税费与公司承担服务费税费", conclusion: "06 账户行的服务费税费（客户承担部分）只展示、不进毛利；新增「公司承担服务费税费」计入成本（R-10-008）；自接苹果「税费」性质待财务（Q-10-05）。原「服务费税费不进毛利、公司承担的不算」作废", impact: "R-10-002、R-10-008、R-10-031、R-10-040、R-10-051、R-10-052", status: "2026-10-21 用户定，会议清单 D17（前提财务确认，Q-10-05）" }
  - { id: D-10-02, point: "结算单应付被人工改动的差额（06 · X-6）", conclusion: "10 的手续费 = 改前应收 − 实收：改应付差额并入手续费（推翻原「不另算」）；展示上汇总表与手续费明细拆两行「手续费（09）」「改应付差额」，两者之和为 10 的手续费；09 的手续费仍是 应收 − 实收，两页数不同是有意的", impact: "R-10-002、R-10-007、R-10-009、R-10-051～R-10-053", status: "2026-10-21 用户定，会议清单 D16（选技术①，与推荐不同）" }
  - { id: D-10-03, point: "自接苹果共享订单重复计渠道成本（08 · X-7）", conclusion: "按挂该订单的账户本结算期消耗占比分摊，尾差给消耗最大的账户", impact: "R-10-006", status: "已定（用户）" }
  - { id: D-10-04, point: "手续费归月（09 Q-09-04）", conclusion: "结算单支付 → 账单结算期；账户充值 → 收款完成日（UTC0）所在月", impact: "R-10-007", status: "已定（用户）" }
  - { id: D-10-05, point: "付款单汇出 / 到账与应付的差额（09 Q-09-04）", conclusion: "不进毛利，只在 09 记录；汇兑损益不单列", impact: "R-10-007", status: "已定（用户）" }
  - { id: D-10-06, point: "人民币折算取哪天的汇率", conclusion: "消耗、服务费、税费、服务费税费、客户返点、客情费用都按日（用户：技术最细账单按日，返点、客情也都有日数据）；渠道统计金额、渠道返点按月，取结算期最后一天；手续费取收款完成日", impact: "R-10-011", status: "已定（用户）" }
  - { id: D-10-07, point: "数据范围", conclusion: "「利润中心」页面查看权限点，有就看全部账户", impact: "R-10-060、R-10-061", status: "已定（用户）" }
  - { id: D-10-08, point: "上线前月份", conclusion: "只显示上线当月及以后，上线前月份不出行；上线月 = 第一个在系统里付渠道款的结算期，与 06 / 07 / 08 / 11 共用（D-10-26），具体月份上线前定", impact: "R-10-001", status: "已定（用户）；上线月定义 2026-10-21 用户定，会议清单 D60；共用范围 2026-10-22 闭环清单 A01" }
  - { id: D-10-09, point: "粒度与出行条件", conclusion: "账户 × UTC0 自然月一行；有消耗、渠道统计金额或手续费任一项才出；收入按 06 消耗出账口径，预付也不按充值", impact: "R-10-001、R-10-003", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-10, point: "列与原型残留", conclusion: "沿用原型主表列，加「详情」与「公司承担服务费税费」；只展示人民币；去掉货币展示切换、汇率配置；「审批」「草稿」隐藏状态不做", impact: "R-10-010、R-10-031、R-10-032、R-10-036", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-11, point: "筛选与人员取值", conclusion: "搜索账户名称 / 账户ID / 客户名称；账户系统、结算期、销售、优化师，另加状态；不跟顶栏账户系统；销售、优化师取当前值，候选含本页出现的已禁用用户（会议清单 D41）", impact: "R-10-030、R-10-033、R-10-035", status: "由我代定（用户确认代定清单）；候选 2026-10-21 用户定，会议清单 D41" }
  - { id: D-10-12, point: "数据概览", conclusion: "汇总原型 9 项 + 公司承担服务费税费 + 「共 N 个账户月，已算完 M 个」；缺汇率不计入并提示，渠道未到照常计入并提示", impact: "R-10-040、R-10-041", status: "由我代定（用户确认代定清单）；2026-10-21 按会议清单 D17、D108 补" }
  - { id: D-10-13, point: "状态展示与完成边界", conclusion: "计算中下方灰字列还差的；没有计提项、没有消耗和渠道数据视为该件完成；没有账户行时到次月 2 日视为客户收完；当月计算中加实时预估悬浮（会议清单 D39）", impact: "R-10-021、R-10-022", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-14, point: "逐日拆分", conclusion: "原币月合计以来源为准，按来源逐日金额占比拆，每天 2 位，尾差落最后一个有数据的日子；实际金额被改也照此拆", impact: "R-10-012", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-15, point: "缺数据与缺汇率", conclusion: "渠道统计金额「-」时毛利按 0、状态计算中、标「未含渠道成本」、照常计入概览；取不到汇率时该项与毛利「-」、不计入概览并提示，状态计算中还差「缺少汇率」", impact: "R-10-005、R-10-015、R-10-040", status: "由我代定（用户确认代定清单）；2026-10-21 按会议清单 D61、D108 补" }
  - { id: D-10-16, point: "详情与变化记录", conclusion: "右侧抽屉：汇总表、按日明细、手续费明细、共享订单分摊、完成情况、变化记录；变化记录只为已算完的记录记", impact: "R-10-024、R-10-050～R-10-056", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-17, point: "实时、导出、通知、排序", conclusion: "实时重算；不做导出与通知；结算期降序、客户名称、账户名称升序；分页 10 / 50 / 100 / 300", impact: "R-10-023、R-10-034", status: "由我代定（用户确认代定清单）；2026-10-21 Q-10-04 关闭，算已定" }
  - { id: D-10-18, point: "给 11 的数据", conclusion: "账户 × 日的人民币各项、毛利、提成用当日毛利、服务费（不含税）；账户 × 月的毛利、状态、还差项与缺少数据的日期", impact: "R-10-070、R-10-072", status: "由我代定（用户确认代定清单）；2026-10-21 按会议清单 D15 补" }
  - { id: D-10-19, point: "提成基数的负毛利下限放在哪（11 截 0 的对象）", conclusion: "10 给 11 的当日毛利里，渠道统计金额与手续费按该账户当月各日消耗占比拆到各天，11 再按日截 0；10 自身展示与汇率口径不变", impact: "R-10-070、R-10-072；11 R-11-010、R-11-012", status: "2026-10-21 用户定，会议清单 D15" }
  - { id: D-10-20, point: "已算完要不要看汇率", conclusion: "加第四件事「汇率齐全」，还差项「缺少汇率」，与 11 一致", impact: "R-10-015、R-10-021、R-10-022、R-10-055", status: "2026-10-21 用户定，会议清单 D61" }
  - { id: D-10-21, point: "已算完之后还能改多久（关账）", conclusion: "本期不做通用关账；账户月首次判为已算完时锁定所用汇率，之后补录 / 修订汇率不让已算完月份退回；其他变化仍按 D-00-66；汇率锁定后才出现的业务日按重算当时的日汇率取，下次判为已算完时一起锁定", impact: "R-10-010、R-10-023", status: "2026-10-21 用户定，会议清单 D110；锁定后新业务日 2026-10-22 用户与技术确认，闭环清单 B15" }
  - { id: D-10-22, point: "利润中心的销售 / 优化师按当前值还是按归属", conclusion: "维持当前值；列头「销售（当前）」「优化师（当前）」，筛选栏下注明与 11 口径不同", impact: "R-10-031、R-10-033、R-10-035", status: "2026-10-21 用户定，会议清单 D92-10（关闭 Q-10-03）" }
  - { id: D-10-23, point: "渠道为「-」时毛利照常显示；系统抓取无订单账户", conclusion: "按 0 计、计算中，毛利润旁「未含渠道成本」、概览提示条数照常计入；系统抓取行已完成后本期有消耗无订单的账户视为付完、按 0 计，订单到了退回重算；这类账户本页仍显示「-」但不标「未含渠道成本」（由我代定显示方式）", impact: "R-10-005、R-10-021、R-10-031、R-10-040", status: "2026-10-21 用户定，会议清单 D108、D12-无订单账户；显示方式由我代定" }
  - { id: D-10-24, point: "账单锁定后收入冻结、成本还在变", conclusion: "共享订单分摊的消耗取 06 账户行消耗，锁定后取快照；详情顶部提示锁定后的消耗修正不计入收入", impact: "R-10-006、R-10-050", status: "2026-10-21 会议清单 D109（A 档按推荐）" }
  - { id: D-10-25, point: "详情来源能不能点、已付快照", conclusion: "08 审批单号可点、打开审批详情唯一地址（R-12-026），查看资格按 R-12-043，无权时由 12 显示「无权限查看」，不做置灰；06、07、09 来源纯文本；08 行金额有变化时追加已付快照", impact: "R-10-051", status: "2026-10-21 会议清单 D62、D12-来源展示（A 档按推荐）" }
  - { id: D-10-26, point: "上线月对齐与没有账户行兜底", conclusion: "06 出账单、07 计提、08 渠道、10 利润、11 提成从同一个上线月（index S-18）起算，共用一个配置（S-16 / S-17 就此定掉）；结算期 ≥ 上线月、该账户该月有消耗却没有 06 账户行时，按「客户未收完」处理，不判已算完", impact: "R-10-001、R-10-003、R-10-021", status: "2026-10-22 用户与技术确认，闭环清单 A01" }
  - { id: D-10-27, point: "利润重算触发补完成条件变化", conclusion: "08 第一层行状态变化（R-08-054、R-08-056）、0.00 行在结算期结束后视为已完成、没有账户行次月 2 日视为客户收完，三者都触发重算，变化记录原因统一用「完成条件变化」；08 R-08-024 同时补行状态变化通知 10（08 改）", impact: "R-10-023、R-10-024", status: "2026-10-22 用户与技术确认，闭环清单 B01" }

