rules:
  # —— 2.1 毛利口径（本页定义） ——
  - { id: R-10-001, module: 毛利口径, text: "利润记录按「账户 × UTC0 自然月」一条；结算期 ≥ 上线月，且该账户该月有消耗、或有渠道统计金额、或有手续费（≠ 0）任一项时才有这条记录；当月也有，金额随数据变化。上线月 = 第一个在系统里付渠道款的结算期（index S-18）；06 出账单、07 计提、08 渠道、10 利润、11 提成从同一个上线月起算，共用一个配置，具体月份上线前定（D-10-08、D-10-26）" }
  - { id: R-10-002, module: 毛利口径, text: "毛利润 = 消耗 + 服务费 + 税费 − 客情费用 − 客户返点 − 手续费 − 渠道统计金额 − 公司承担服务费税费（D-00-34）；手续费含改应付差额（R-10-007、R-10-009，D-10-02）；服务费税费（06 账户行，客户承担部分）只展示、不进毛利，公司承担服务费税费计入成本（R-10-008，D-10-01）；渠道返点只展示、不再扣（已含在渠道统计金额里，D-00-26）；各项都先折成人民币再按此计算（R-10-013）" }
  - { id: R-10-003, module: 毛利口径, text: "消耗、服务费、税费、服务费税费取 06 该账户该月的账单账户行（R-06-005～R-06-009、R-06-011）；账单锁定或冻结后取快照（R-06-020），之后的消耗修正不影响利润；预付客户同样按消耗出账的金额算，不按充值算；该账户该月在 06 没有账户行时这四项为 0；其中结算期 ≥ 上线月、该账户该月有消耗却没有 06 账户行的，状态按 R-10-021① 兜底处理为「客户未收完」（D-10-26）。06 账单里的返点抵扣、余额抵扣、上期预付欠费、结转额不是本账户本月的收入，不计入：余额抵扣是客户之前已付的钱，上期预付欠费的消耗已在其所属月份计入（D-00-73、D-00-81）" }
  - { id: R-10-004, module: 毛利口径, text: "客户返点、客情费用取 07 该账户该月的计提项（R-07-001）：已进单用实际金额，其余用系统计算金额（R-07-018）；按计提项所属消耗月份计，不按后付抵扣到哪张账单；没有计提项为 0；后付返点抵扣超出账单产生的结转额（D-00-81）不改变本页客户返点" }
  - { id: R-10-005, module: 毛利口径, text: "渠道统计金额、渠道返点取 08 该账户该结算期的总计、渠道返点（R-08-015、R-08-017、R-08-018），共享订单按 R-10-006 拆分；08 为「-」时本页也显示「-」，计算毛利时渠道统计金额按 0，毛利润旁灰字「未含渠道成本」，状态按 R-10-021 停在计算中；例外：系统抓取的账户系统该结算期行已完成后，本期有消耗但没有任何订单的账户视为渠道付完（R-10-021③），渠道统计金额仍显示「-」、按 0 计，不标「未含渠道成本」；系统抓取的渠道返点为「-」" }
  - { id: R-10-006, module: 毛利口径, text: "自接苹果（系统抓取）共享订单分摊（D-10-03）：同一结算期同一订单号挂在多个账户下时，订单总计按这些账户本结算期消耗占比分摊，消耗取 06 该账户该月账户行的消耗金额，账单锁定后取快照（与收入同源，R-10-003，D-10-24）；四舍五入 2 位，尾差给消耗最大的账户（并列取账户名称升序第一个）；这些账户消耗都为 0 时整笔给账户名称升序第一个；只挂一个账户的订单整笔归该账户；账户渠道统计金额 = 本账户各订单分到的金额之和，所以各账户相加 = 按订单号去重后的总数；06、08 的展示不变" }
  - { id: R-10-007, module: 毛利口径, text: "手续费 = 手续费（09）+ 改应付差额（R-10-009）= 改前应收 − 实收（D-10-02）。手续费（09）取 09 已完成收款单按账户的分摊（R-09-034、R-09-036、R-09-074），原币 = 收款单币种；结算单支付 → 计入对应账单的结算期；账户充值 → 计入收款单完成时间（换算成 UTC0）所在月（D-10-04）；同一账户月有多张收款单相加；没完成的收款单不计；付款单汇出 / 到账金额与应付的差额不进毛利（D-10-05、D-09-06）" }
  - { id: R-10-008, module: 毛利口径, text: "公司承担服务费税费 = 06 按 R-06-007 / R-06-008 计算服务费税费时、承担方为公司而记为 0 的那部分：后付日子 = 服务费 × 该段规则税率，预付日子 = 分桶扣减金额 × 快照服务费率 × 快照税率；原币按 06 的分段口径各段四舍五入 2 位后相加，按 R-10-012 拆到每天、按 R-10-013 折人民币；客户承担的日子为 0；计入成本（D-10-01）。自接苹果账户系统的「税费」照 R-10-003 计入收入，它是我方要缴的销项税还是代收、要不要同额计入成本，与本条一起待财务确认（Q-10-05），确认前按本条执行" }
  - { id: R-10-009, module: 毛利口径, text: "改应付差额 = 生成结算单时系统给出的默认应付（改前应收，已扣返点抵扣、余额抵扣，D-00-73）− 审批通过的应付，应付改大时为负；按该结算单账户行应收占比拆到账户（算法同 R-09-034），原币 = 结算单结算币种；在该结算单变「已结算」时计入对应账单的结算期：有收款单的随收款单完成，落日与汇率同该笔结算单支付手续费（R-10-011）；应付为 0.00、审批通过即已结算的不生成收款单（D-00-80），汇率取审批通过日（UTC0），人工把正数应付改成 0 时差额 = 默认应付全额；可结算应收 < 0、应付固定 0.00 的结转情形（D-00-81）默认应付为 0、不产生改应付差额" }
  # —— 2.2 人民币折算（本页定义） ——
  - { id: R-10-010, module: 人民币折算, text: "汇率用日汇率（D-00-74，1 原币 = x 人民币），按 UTC0 自然日取；当天没有向前取最近一天；原币为人民币时汇率 = 1；计算用日汇率完整精度，详情里显示 4 位并注「按完整汇率计算，与显示汇率相乘可能相差 0.01」。利润记录第一次判为已算完时锁定它所用的每一天汇率：之后补录或修订汇率只对计算中的记录生效，已锁定的记录即使因其他原因退回计算中也仍用锁定的汇率（D-00-66 例外，D-10-21）；汇率锁定后才出现的业务日，按重算当时的日汇率取，下次判为已算完时一起锁定（D-10-21）；本页不提供汇率配置，原型隐藏的「汇率配置」按钮与弹窗不做（D-10-10）" }
  - { id: R-10-011, module: 人民币折算, text: "业务发生日（D-10-06）：消耗、服务费、税费、服务费税费、公司承担服务费税费、客户返点、客情费用按每个 UTC0 自然日；渠道统计金额、渠道返点按结算期最后一天；手续费（09）按收款单完成日（UTC0），其中结算单支付的手续费在日明细里落在结算期最后一天、汇率仍取完成日；改应付差额同结算单支付手续费（R-10-009）" }
  - { id: R-10-012, module: 人民币折算, text: "按日拆分（D-10-14）：每项的原币月合计以来源为准（R-10-003～R-10-009）；按来源的逐日金额占比拆到每天（06：当天消耗 × 当天适用费率或分桶快照，已出账月份的费率按出账时刻适用的规则取（R-03-003，D-03-24），公司承担服务费税费同理；07：当天按 R-07-004 / R-07-006 算出的金额），每天四舍五入到 2 位，尾差放在该月最后一个有逐日金额的日子；07 实际金额被人改过的也按系统逐日金额占比拆；逐日金额全为 0 而月合计不为 0 时，整笔落在该月最后一个有消耗的日子，没有消耗则落在结算期最后一天" }
  - { id: R-10-013, module: 人民币折算, text: "每天每项人民币 = 当天原币金额 × 当天汇率，四舍五入到 2 位；月人民币 = 各天之和；毛利润用月人民币各项按 R-10-002 计算；不先把原币按月加总再折算" }
  - { id: R-10-015, module: 人民币折算, text: "某天向前也取不到任何汇率时，用到这天汇率的项人民币为空，页面显示「-」，该行毛利润也显示「-」，状态按 R-10-021④ 为计算中、还差「缺少汇率」；详情里标「未取到 {原币}→人民币 汇率」；汇率补上后自动重算" }
  # —— 2.3 算没算完（本页定义） ——
  - { id: R-10-020, module: 算没算完, text: "状态只有 计算中 / 已算完，系统自动判断，没有人工确认、退回按钮（D-00-63、D-00-64）；新出现的利润记录为计算中" }
  - { id: R-10-021, module: 算没算完, text: "四件事都完成才「已算完」（D-00-65）：① 客户收完 = 该账户在该月账单里有账户行时，账单为「已结算」（含应付 0.00 审批通过即已结算 D-00-80、欠费转入后付账单后随承接账单已结算 D-00-73）；没有账户行时，到了次月 2 日（UTC0）视为完成；兜底：结算期 ≥ 上线月、该账户该月有消耗却没有 06 账户行时，不适用前一句，按「客户未收完」处理，不判已算完（D-10-26）；② 返点或客情结完 = 该账户该月客户返点、客情费用计提项都完成（R-07-017），没有计提项视为完成；③ 渠道付完 = 该账户该月有消耗或有渠道统计金额时按 R-08-091：渠道统计金额不是「-」且所属账户系统该结算期行已完成，付款后才有值或金额变化的账户同样算付完，系统抓取的账户系统行已完成后本期有消耗、无订单的账户视为付完（R-10-005），总计为 0.00 的行在结算期结束后视为已完成（D-00-80）；都没有视为完成；④ 汇率齐全 = 该月用到的每一天都取得到汇率（R-10-015）" }
  - { id: R-10-022, module: 算没算完, text: "计算中时状态下方灰字列出还差的，按 ①②③④ 顺序用「、」连接：客户未收完、返点或客情未结完、渠道未付完、缺少汇率；当月（结算期未结束）的「计算中」旁加悬浮提示「金额为实时预估，随消耗数据更新，数据截至 yyyy-mm-dd hh:mm（UTC0）」，截至时间取消耗数据最近一次同步时间，技术取不到时去掉这半句" }
  - { id: R-10-023, module: 算没算完, text: "任一来源数据变化（06 账单金额或状态、07 计提项金额或状态、08 渠道统计金额变化通知 R-08-024、09 收款单完成、结算单 0 元已结算）时，受影响的利润记录重算金额并重判状态；以下三种完成条件变化同样触发重算，变化记录原因统一记「完成条件变化」（D-10-27）：08 第一层行状态变化（R-08-054、R-08-056，由 08 按 R-08-024 通知）、08 总计为 0.00 的行在结算期结束后视为已完成（R-10-021③）、没有账户行的账户月到次月 2 日（UTC0）视为客户收完（R-10-021①）；汇率补录或修订只触发计算中记录的重算（R-10-010）；已算完的记录在重算期间视为计算中，重算后四件事仍都完成则回到已算完，否则停在计算中（D-00-66）" }
  - { id: R-10-024, module: 算没算完, text: "已算完的利润记录每次因 R-10-023 被重算且毛利润有变化或状态退回时，记一条变化记录：时间、原因、触发单据、变化前后毛利润、变化前后状态；只追加，不能删改；计算中的记录变化不记" }
  # —— 2.4 利润列表 ——
  - { id: R-10-030, module: 利润列表, text: "页面标题「利润中心」，菜单位置由 13 定（原型在财务中心下）；页面数据不跟随顶栏「账户系统」切换，只用页内筛选（同 08、09）" }
  - { id: R-10-031, module: 利润列表, text: "列依次：账户名称（左固定）、客户名称、销售（当前）、优化师（当前）、消耗、税费、服务费税费、公司承担服务费税费、服务费、渠道统计金额、客情费用、客户返点、手续费、毛利润、状态、账户系统、结算期、操作（右固定，「详情」）；手续费列为两项之和（R-10-007），拆分在详情看；毛利润格按 R-10-005 带灰字「未含渠道成本」；状态格按 R-10-022；结算期显示「yyyy-mm-01 至 yyyy-mm-最后一天」" }
  - { id: R-10-032, module: 利润列表, text: "金额一律人民币，千分位、2 位小数，不带币种后缀，表头上方注明「金额单位：人民币」；负数前加「-」，不标红；没有值显示「-」" }
  - { id: R-10-033, module: 利润列表, text: "搜索框按账户名称、账户ID（orgid）、客户名称包含匹配；筛选：账户系统 单选（全部 + 现有账户系统）、结算期 单选（全部 + 有利润记录的月份，降序）、销售 单选、优化师 单选、状态 单选（全部 / 计算中 / 已算完）；销售、优化师候选 = 全部 + 全部启用用户 + 本页记录里出现的已禁用用户（显示「姓名（已禁用）」，D-00-83、R-12-049，排在启用用户后面），不随其他筛选条件变化，可搜索；筛选栏下灰字「按当前归属筛选；提成按历史归属，以提成中心为准」；默认都是全部，各条件同时生效；原型销售、优化师选项里的「待结算 / 已结算」不做" }
  - { id: R-10-034, module: 利润列表, text: "排序：结算期降序，同结算期按客户名称升序、再按账户名称升序；分页 10 / 50 / 100 / 300 条每页，默认 10，显示「共 N 条」；没有任何记录显示「暂无数据」；筛选后没有结果显示「没有符合条件的利润记录」" }
  - { id: R-10-035, module: 利润列表, text: "销售、优化师、账户系统都取当前值：销售 = 账户所属客户当前的销售（R-02-015），优化师 = 账户当前的优化师；历史月份也显示当前值，筛选同样按当前值；与 11 口径不同：11 按业务日的历史归属算提成（R-11-003），两页按人对数时以 11 为准（D-10-22）" }
  - { id: R-10-036, module: 利润列表, text: "原型「货币展示」（人民币 / 美元）切换不做，只展示人民币（D-00-36）；原型信息展示里的「审批」「草稿」两个隐藏状态是复制残留，不做" }  # alias-ok
  # —— 2.5 数据概览 ——
  - { id: R-10-040, module: 数据概览, text: "列表上方数据概览，对当前搜索筛选结果的全部记录（不只本页）汇总：消耗、税费、毛利润、渠道统计金额、服务费、渠道返点、客情费用、客户返点、手续费、公司承担服务费税费，人民币、格式同 R-10-032；「-」不计入，某项全部为「-」时显示「-」；毛利润为「-」的记录不计入任一项，概览下方提示「有 K 条记录缺少汇率，未计入概览」；渠道统计金额为「-」且标「未含渠道成本」的记录照常计入，概览下方提示「有 K 条记录渠道统计金额未到，毛利润未扣渠道成本」；K = 0 时对应提示不显示" }
  - { id: R-10-041, module: 数据概览, text: "概览显示「共 N 个账户月，已算完 M 个」，N = 当前筛选结果记录数，M = 其中已算完的（D-00-63）" }
  # —— 2.6 详情 ——
  - { id: R-10-050, module: 详情, text: "点行操作「详情」从右侧打开详情抽屉，标题「{账户名称} · {yyyy-mm} 利润详情」；顶部：客户名称、账户系统、原币、状态（计算中时带还差项）、计算时间（yyyy-mm-dd hh:mm:ss，Asia/Shanghai）；06 账单已锁定且之后该账户该月消耗有修正时，顶部灰字「账单已锁定，之后的消耗修正不计入收入；未进单的返点、客情按最新消耗计」（D-10-24）；抽屉只读" }
  - { id: R-10-051, module: 详情, text: "汇总表每项一行：项目、原币金额（带币种）、汇率口径（按日 / 结算期最后一天 {日期} 1 {原币} = x 人民币 / 收款完成日 / 审批通过日；汇率显示 4 位并注「按完整汇率计算」）、人民币、来源；项目依次：消耗、服务费、税费、服务费税费（标「不计入毛利」）、公司承担服务费税费（标「计入毛利」）、客户返点、客情费用、渠道统计金额、渠道返点（标「只展示」）、手续费（09）、改应付差额、毛利润，手续费（09）+ 改应付差额 = 列表手续费。来源：06 账单状态；07 计提项状态与是否实际金额；08「系统抓取」或「上传 · {审批单号}」，审批单号可点、新页打开该审批单的审批详情唯一地址（R-12-026），能否查看按 R-12-043 / R-08-082，无权时由 12 审批详情页显示「无权限查看」，不做置灰；08 该行有「金额有变化」时来源后加灰字「付款后有变化，已付快照 {08 账户快照值}」；系统抓取本期无订单视为付完的写「08 系统抓取 · 本期无订单，按 0 计」；09 财务ID；改应付差额写「06 结算单 · 默认应付 x → 应付 y」；06、07、09 来源为纯文本（D-10-25）" }
