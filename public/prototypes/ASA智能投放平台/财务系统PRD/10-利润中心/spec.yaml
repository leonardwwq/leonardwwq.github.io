roles:
  - { role: "有「利润中心」权限点的用户", can: ["进入利润中心", "查看全部账户的利润记录、概览与详情（不按账户查看权限过滤）"], cannot: ["修改任何金额或状态"], source: "页面查看权限点（R-10-060、R-10-061，D-10-07，D-00-78，13 汇总）" }
  - { role: "系统", can: ["按来源数据计算利润与折算人民币", "自动判断计算中 / 已算完", "数据变化时重算并记变化记录", "向 11 提供账户 × 日数据"], cannot: ["回写任何来源单据"], source: "R-10-001～R-10-024、R-10-070～R-10-072" }

entities:
  - name: 利润记录
    key: profit_month
    note: "账户 × UTC0 自然月一条；系统计算，页面只读；金额字段都是人民币，原币只在详情里看（D-00-36）"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "period", label: "结算期", type: "string", required: true, rule: "yyyy-mm（UTC0）；展示「yyyy-mm-01 至 yyyy-mm-最后一天」；≥ 上线月（R-10-001）" }
      - { key: "currency", label: "原币", type: "enum", required: true, enum: ["人民币", "USD", "USDT"], rule: "账户消耗币种（R-05-002）；手续费与改应付差额的原币是收款单 / 结算单结算币种（R-10-007、R-10-009）" }
      - { key: "consumption", label: "消耗", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-10-003、R-10-012" }
      - { key: "fee", label: "服务费", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-10-003" }
      - { key: "tax", label: "税费", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-10-003、R-10-008" }
      - { key: "fee_tax", label: "服务费税费", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "06 账户行的服务费税费（客户承担部分），只展示，不进毛利（R-10-002，D-10-01）" }
      - { key: "company_fee_tax", label: "公司承担服务费税费", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "计入成本（R-10-008，D-10-01）" }
      - { key: "rebate", label: "客户返点", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-10-004" }
      - { key: "care_fee", label: "客情费用", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-10-004" }
      - { key: "channel_amount", label: "渠道统计金额", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "08 没有数据时为空，页面「-」，毛利按 0（R-10-005、R-10-006）" }
      - { key: "channel_rebate", label: "渠道返点", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "只展示（已含在渠道统计金额里，D-00-26）；系统抓取为空（R-10-005）" }
      - { key: "handling_fee_09", label: "手续费（09）", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "09 已完成收款单的分摊，可为负（R-10-007）" }
      - { key: "adjust_diff", label: "改应付差额", type: "decimal", required: true, precision: 2, currency: "人民币", default: "0.00", rule: "可为负（R-10-009）" }
      - { key: "handling_fee", label: "手续费", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "= 手续费（09）+ 改应付差额 = 改前应收 − 实收，可为负（R-10-007、R-10-009，D-10-02）" }
      - { key: "gross_profit", label: "毛利润", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "R-10-002；缺汇率时为空（R-10-015）" }
      - { key: "status", label: "状态", type: "enum", required: true, enum: ["计算中", "已算完"], default: "计算中", generated: true, rule: "flows 利润记录（R-10-020～R-10-023）" }
      - { key: "missing", label: "还差", type: "list", required: false, generated: true, rule: "计算中时：客户未收完 / 返点或客情未结完 / 渠道未付完 / 缺少汇率 的子集（R-10-022）" }
      - { key: "fx_missing", label: "缺汇率", type: "list", required: false, generated: true, rule: "取不到汇率的日期与「原币→人民币」组合（R-10-015）" }
      - { key: "fx_locked", label: "汇率已锁定", type: "boolean", required: true, default: "否", generated: true, rule: "首次判为已算完时置为是，之后汇率补录 / 修订不再作用于本记录（R-10-010，D-10-21）" }
      - { key: "updated_at", label: "计算时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "最近一次重算的时间；详情展示" }
  - name: 利润日明细
    key: profit_day
    note: "账户 × UTC0 自然日一条，由利润记录按 R-10-011、R-10-012 拆出；详情「按日明细」与给 11 的数据都用它"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true }
      - { key: "date", label: "日期", type: "date", required: true, rule: "UTC0 自然日" }
      - { key: "fx_rate", label: "汇率", type: "decimal", required: false, rule: "1 原币 = x 人民币，日汇率完整精度参与计算，详情显示 4 位；原币为人民币时 = 1（R-10-010）" }
      - { key: "items_orig", label: "各项原币金额", type: "list", required: true, rule: "消耗、服务费、税费、服务费税费、公司承担服务费税费、客户返点、客情费用、渠道统计金额、渠道返点、手续费（09）、改应付差额，2 位（R-10-012）" }
      - { key: "items_cny", label: "各项人民币金额", type: "list", required: true, rule: "= 原币 × 当日汇率，四舍五入 2 位（R-10-013）" }
      - { key: "gross_profit", label: "当日毛利润", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "按 R-10-002 用当日人民币各项算；页面展示用" }
      - { key: "commission_profit", label: "提成用当日毛利", type: "decimal", required: false, precision: 2, currency: "人民币", rule: "渠道统计金额与手续费按当月各日消耗占比拆到各天后的当日毛利；只给 11，不在本页展示（R-10-072，D-10-19）" }
  - name: 利润变化记录
    key: profit_change_log
    note: "只追加；只为「已算完」的利润记录记（R-10-024）"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true }
      - { key: "period", label: "结算期", type: "string", required: true }
      - { key: "at", label: "时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true }
      - { key: "reason", label: "原因", type: "enum", required: true, enum: ["消耗或费用变化", "返点或客情变化", "渠道统计金额变化", "手续费变化", "完成条件变化"], rule: "R-10-024；已算完记录的汇率已锁定，不会因汇率变化（R-10-010）" }
      - { key: "trigger", label: "触发单据", type: "string", required: false, rule: "审批单号 / 财务ID / 「订单数据更新」；没有单据为空" }
      - { key: "profit_before", label: "变化前毛利润", type: "decimal", required: false, precision: 2, currency: "人民币" }
      - { key: "profit_after", label: "变化后毛利润", type: "decimal", required: false, precision: 2, currency: "人民币" }
      - { key: "status_before", label: "变化前状态", type: "enum", required: true, enum: ["已算完"] }
      - { key: "status_after", label: "变化后状态", type: "enum", required: true, enum: ["计算中", "已算完"] }

flows:
  - entity: 利润记录
    states: [计算中, 已算完]
    initial: 计算中
    transitions:
      - { from: "无", action: "该账户该月满足出行条件", actor: 系统, to: 计算中, guard: "R-10-001" }
      - { from: 计算中, action: "四件事都完成", actor: 系统, to: 已算完, guard: "R-10-021；首次已算完时锁定汇率（R-10-010）" }
      - { from: 已算完, action: "来源数据变化后重算，四件事有一件不再完成", actor: 系统, to: 计算中, guard: "R-10-023（D-00-66），记变化记录 R-10-024；汇率补录 / 修订不触发（D-10-21）" }
    reverse:
      - { action: "人工确认 / 人工退回", actor: "—", allowed_from: [], note: "没有人工操作（D-00-64）；退回只由数据变化触发（R-10-023）" }

