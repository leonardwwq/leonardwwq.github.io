tasks:
  - { id: T-11-001, title: "读取 05 规则版本与 10 日利润（提成用当日毛利）/月份状态并按业务日归属", depends_on: [T-10-008], done_when: "G-11-002、G-11-004、G-11-009、G-11-010、G-11-011 通过" }
  - { id: T-11-002, title: "实现人员角色月规则段基数汇总、阶梯落档、按规则（版本内一条）封顶、重算与变化记录", depends_on: [T-11-001], done_when: "G-11-001、G-11-003、G-11-005、G-11-006、G-11-012～G-11-014 通过" }
  - { id: T-11-003, title: "实现提成中心筛选列表（三层展开）、概览与权限校验", depends_on: [T-11-002], done_when: "G-11-007、G-11-008、G-11-015 通过" }

decisions:
  - { id: D-11-01, point: "历史销售变更的提成归属", conclusion: "按业务日期的销售拆分；月中变更前后分别归当时销售", impact: "R-11-003、R-11-018", status: "已定（用户）" }
  - { id: D-11-02, point: "负毛利基数", conclusion: "负数按日按 0，不冲减其他日或账户正基数；截 0 的是 10 按消耗拆分后的「提成用当日毛利」（R-10-072），不是 10 页面上的当日毛利润", impact: "R-11-010、R-11-012～R-11-015", status: "已定（用户）；截 0 对象 2026-10-21 用户定，会议清单 D15" }
  - { id: D-11-03, point: "未完成月份的提成显示", conclusion: "任一相关账户月计算中时整个人员角色月份暂不展示金额，所有相关账户月已算完后再汇总显示；毛利规则与服务费规则都要等", impact: "R-11-011、R-11-022", status: "已定（用户）；2026-10-21 用户维持，会议清单 D111" }
  - { id: D-11-04, point: "提成中心数据权限", conclusion: "独立提成中心权限点，授权即看全部客户和账户", impact: "R-11-030", status: "已定（用户）" }
  - { id: D-11-05, point: "规则身份与月中换版本", conclusion: "规则 = 一个版本里的一条规则，跨版本不算同一条；同一人、同一角色、同一月、同一版本内同一条规则合计落一档、封顶；月中换版本各自落档、各自封顶，接受当月上限最多翻倍；无全局兜底规则", impact: "R-11-013、R-11-015、R-11-016", status: "2026-10-21 用户定，会议清单 D18" }
  - { id: D-11-06, point: "规则通过或 10 数据变化后已算完提成换数", conclusion: "记变化记录（时间、原因、触发单据、前后金额），行上标「金额有变化」；不锁、不做关账", impact: "R-11-018、R-11-019", status: "2026-10-21 用户定，会议清单 D19-留痕" }
  - { id: D-11-07, point: "按客户 / 账户 / 账户系统筛选时人员月汇总显示什么", conclusion: "账户条件只筛选人员月，金额、状态始终整月全量，展开高亮命中账户；结算期与人员候选按会议清单 D38、D41", impact: "R-11-020、R-11-023", status: "2026-10-21 会议清单 D63、D38、D41（A 档按推荐）" }
  - { id: D-11-08, point: "展开明细层级与概览", conclusion: "人员月 → 规则段（基数、比例、封顶前后）→ 账户（毛利、提成基数）；账户不显示提成金额；概览销售 / 优化师提成合计与算完条数；计算中列未算完账户", impact: "R-11-021、R-11-022、R-11-023", status: "2026-10-21 会议清单 D64、D65、D15-展示（A 档按推荐）" }
  - { id: D-11-09, point: "人员月出行条件", conclusion: "名下至少一个有消耗的账户月才出行；有账户无适用规则出 0.00；名下没有账户不出行", impact: "R-11-001", status: "2026-10-21 会议清单附 1 N13（直接改）" }
  - { id: D-11-10, point: "审批中的提成规则单要不要让人员月进计算中", conclusion: "不进计算中，只在状态旁灰字提示，状态和金额照常", impact: "R-11-022", status: "2026-10-21 会议清单 D19-前端补充（A 档按推荐）" }
  - { id: D-11-11, point: "是否提供导出", conclusion: "本版不提供导出，原型导出按钮不做", impact: "R-11-024", status: "已定（2026-10-21 用户确认）" }
  - { id: D-11-12, point: "某日销售 / 优化师为空、同一日多次变更", conclusion: "某日该账户的销售或优化师为空，该角色该日不产生提成，不进任何人员月，也不阻塞任何人员月；事后补上的从生效当天（UTC0）起算，之前不回算；同一 UTC0 日内多次变更人员的，当天归最后一次变更后的人", impact: "R-11-003、R-11-022", status: "2026-10-22 用户与技术确认，闭环清单 A02、B23" }
  - { id: D-11-13, point: "月中换人时谁「名下有消耗」", conclusion: "账户月「名下有消耗」= 这个人在该角色上的归属日里，该账户至少有一天消耗 ≠ 0，或当日毛利 / 服务费 ≠ 0；只在没有消耗的日子归属过的人，不出行，也不被阻塞", impact: "R-11-001、R-11-022", status: "2026-10-22 用户与技术确认，闭环清单 B14" }
  - { id: D-11-14, point: "变化记录多次触发与「人员归属更正」", conclusion: "从退回到再次算完之间的多次触发合并成一条记录，原因按先后列出，触发单据全部列出；「人员归属更正」保留，只用于技术修数据时改了历史变更记录的情况", impact: "R-11-019；spec commission_change_log.reason / trigger", status: "2026-10-22 用户与技术确认，闭环清单 B13" }

