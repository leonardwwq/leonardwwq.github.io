rules:
  - { id: R-11-001, module: 计算范围, text: "提成以 UTC0 自然日为计算输入、自然月为展示与阶梯累计周期；只计算上线月及以后月份（上线月与 06 出账单、07 计提、08、10 共用一个配置，index S-18，D-10-08、D-10-26）；人员 × 角色 × 月出行条件：当月该人员该角色名下至少有一个有消耗的账户月；名下有账户但都没有适用规则时出 0.00 行（R-11-022）；名下没有账户的不出行；账户月「名下有消耗」= 这个人在该角色上的归属日里，该账户至少有一天消耗 ≠ 0，或当日毛利 / 服务费 ≠ 0（R-11-010 的提成用当日毛利、不含税服务费）；只在没有消耗的日子归属过的人，不出行，也不被阻塞（D-11-13）" }
  - { id: R-11-002, module: 归属与规则, text: "每个业务日按该日适用的 05 提成规则版本（R-05-075）判定；一条规则仅覆盖其中明确选择的账户（R-05-070），未被规则覆盖的账户该角色该日不产生提成" }
  - { id: R-11-003, module: 归属与规则, text: "销售归属按业务日拆分：账户当日所属客户在该日的销售为当日提成人员；月中销售变更前的日期归旧销售、变更日及以后按新销售；历史月份不因当前销售变化而改归属。优化师（即运营，D-00-76）按账户在业务日的归属取值。业务日的销售取 04 记录的客户销售变更生效时间（R-04-064），优化师取 02 记录的账户优化师变更生效时间（R-02-026），变更当天（UTC0）起归新人；上线前不回填历史，上线前的日子一律按上线时的值（D-00-72）。账户添加成功前已有消耗的日子，按添加成功时记下的初始优化师、当日所属客户的销售归属（R-02-026、R-04-064）。同一个 UTC0 日内多次变更人员的，当天归最后一次变更后的人。某业务日该账户的销售（或优化师）为空时，该角色该账户该日不产生提成：不进任何人员月，也不阻塞任何人员月；事后补上的从生效当天（UTC0）起算，之前的日子不回算（D-11-12）" }
  - { id: R-11-004, module: 归属与规则, text: "规则版本变化按其生效日期切分业务日；每个自然日只使用该客户当日适用版本中所选账户对应的销售/优化师规则；跨月审批通过的版本仍按 05 所选生效日期生效（D-00-41、R-05-075）" }
  - { id: R-11-010, module: 计提基数, text: "毛利阶梯基数来源为 10 账户×日「提成用当日毛利」人民币（R-10-072：渠道统计金额与手续费按该账户当月各日消耗占比拆到各天，含公司承担服务费税费、改应付差额，D-10-19）；服务费百分比基数来源为 10 账户×日服务费人民币（不含税）（R-10-070）；不再折算原币" }
  - { id: R-11-011, module: 计提基数, text: "当账户×月 10 状态为计算中时，本页该账户月不展示提成金额；月内已算完日期也不得先行显示部分月结果，待该账户月已算完后再参与月汇总；账户×月状态及计算中时的还差项取 10 的 R-10-070（还差项见 R-10-022）" }
  - { id: R-11-012, module: 计提基数, text: "单日「提成用当日毛利」为负时按 0 计，不以负数冲减其他账户或其他日期的正基数（D-11-02）；服务费基数取 10 的不含税服务费日金额" }
  - { id: R-11-013, module: 阶梯汇总, text: "规则 = 一个版本里的一条规则（D-00-40）；对同一提成人员、角色、自然月、同一条规则，将该规则适用账户在其适用日期的日基数相加；每条规则独立汇总、独立落档、独立封顶，不跨规则累计；月中换版本（含原样再提一版）时新旧版本是两条规则，各自落档、各自封顶，当月该人员的上限最多翻倍（用户接受，D-11-05）" }
  - { id: R-11-014, module: 阶梯汇总, text: "规则月度基数按该规则阶梯落档：基数落在某档 [下限, 上限) 内即用该档比例，整笔乘该比例，不累进拆档；等于下限归该档、等于上限归下一档；最后一档无上限" }
  - { id: R-11-015, module: 阶梯汇总, text: "同一提成人员、角色、月份、同一条规则（同一版本）有多条适用账户或日期时，先合计这些账户日期的基数，再按合计落一档；不同客户的规则、同一客户不同版本的规则都不合并；销售与优化师分别计算、不得互相合并（D-00-40）" }
  - { id: R-11-016, module: 计算金额, text: "每条规则提成 = 该规则月度基数 × 落档比例，四舍五入到人民币 2 位（D-00-13）；提成上限按 05 规则（R-05-073），对每人每自然月每条规则（一个版本里的一条）的结果分别封顶（D-05-08、D-00-40）" }
  - { id: R-11-017, module: 计算金额, text: "人员月提成金额 = 该人员、角色、月份所有规则段提成金额（封顶后）之和；规则不适用的账户不贡献基数；无适用规则时提成金额为 0.00" }
  - { id: R-11-018, module: 重算, text: "05 提成规则审批通过、同生效日期覆盖、10 日利润数据或状态变化、账户销售或优化师历史归属更正时，系统按受影响业务日期和规则重算相应月份；若 10 中已算完月份因输入变化退回计算中，则本页同步变计算中并隐藏金额，恢复已算完后重算并展示；已算完月份的汇率由 10 锁定，汇率修订不触发本页重算（R-10-010）；金额变化按 R-11-019 留痕（D-00-41、D-00-66）" }
  - { id: R-11-019, module: 重算, text: "提成变化记录（D-11-06）：人员月曾经已算完、之后因 R-11-018 的任一原因重算并再次已算完，且月提成金额与上一次已算完时不同，记一条变化记录：时间、原因（提成规则审批通过 / 利润数据变化 / 人员归属更正）、触发单据、变化前后金额；从退回到再次已算完之间的多次触发合并成一条记录，原因按先后列出，触发单据全部列出；「人员归属更正」这个原因保留，只用于技术修数据时改了历史变更记录的情况（D-11-14）；只追加，不能删改；该人员月行上标「金额有变化」，点开可看全部变化记录（倒序）；不锁定，页面金额始终为最新（D-00-41）" }
  - { id: R-11-020, module: 页面与筛选, text: "页面标题为「提成中心」；提供搜索（客户名、账户名、orgid、提成人员）、结算期、账户系统、提成角色（全部/销售/优化师）、提成人员及计算状态筛选；结算期选项 = 全部 + 有提成记录的结算期（≥ 上线月），降序，「全部」不加隐含时间窗；提成人员候选 = 全部启用用户 + 本页有记录的已禁用用户（显示「姓名（已禁用）」，D-00-83、R-12-049，排在启用用户后面），不随其他筛选变化，可搜索；各条件同时生效，默认全部；不跟随顶栏账户系统切换。客户名、账户名、orgid 搜索与账户系统筛选只用来选人员月：该人员该角色该月任一贡献账户命中即整行出现，金额、状态、未算完账户始终是该人员月全量值，展开后命中账户高亮；表头注明「账户条件只筛选人员，金额为整月全量」；筛选区说明「归属按 UTC0 日界：变更当天（UTC0）起归新人」（D-11-07）" }
  - { id: R-11-021, module: 页面与筛选, text: "列表按结算期降序、提成人员名称升序、角色（销售后优化师）排序；每行一个人员 × 角色 × 月，显示月提成合计、状态；展开为三层（D-11-08）：① 人员月；② 规则段「{客户名称} · 提成规则N · {生效区间}」（规则序号随版本固定，取 05 R-05-119①；生效区间 = 版本生效区间（R-05-119②）与本月的交集，月中换人时仍按版本生效区间 ∩ 本月展示），显示基数合计、落档比例、封顶前金额、封顶后金额，封顶时标「已封顶」，按客户名称升序、生效区间先后排；③ 账户：账户名称、orgid、毛利（该账户在本段归属日期内提成用当日毛利之和，不截 0；服务费规则显示不含税服务费之和）、提成基数（截 0 后之和），两者不同时基数旁标「负毛利日按 0」，按账户名称升序；账户层不显示提成金额；只展示已算完的金额" }
  - { id: R-11-022, module: 页面与筛选, text: "涉及至少一个有适用规则账户月处于 10 计算中时，该人员角色月份状态为计算中、提成金额显示「-」；毛利规则与服务费规则一样都要等（D-11-03）；这里涉及的账户月 = 按 R-11-001 在本人该角色名下有消耗的账户月；只在没有消耗的日子归属过的账户月、人员为空的日子（R-11-003）都不阻塞本人员月（D-11-12、D-11-13）；计算中的状态格显示「未算完 K 个账户」，悬浮或展开后逐个列出：账户名称、还差项（R-10-022，含缺少汇率）、缺少数据的日期和缺的是什么（R-10-070）。所有相关账户月已算完后状态为已算完并展示金额；没有适用规则账户时状态已算完、金额 0.00。人员月涉及的客户有生效日期 ≤ 月末的审批中提成规则单（单号与所选生效日期取 05 R-05-119③）时，状态旁灰字「规则审批中（{审批单号}），通过后可能重算」，状态和金额照常" }
  - { id: R-11-023, module: 页面与筛选, text: "金额以人民币展示、千分位、2 位小数；列表上方概览对当前筛选结果全部人员月（不限当前分页，按全量值）计算：销售提成合计、优化师提成合计（只加已算完的人员月）、「共 N 条，已算完 M 条」，M < N 时加「有 N − M 条计算中，未计入合计」；没有记录显示「暂无数据」，筛选无结果显示「没有符合条件的提成记录」" }
  - { id: R-11-024, module: 页面与筛选, text: "列表不提供导出、批量操作、人工改数或支付操作；原型里的导出按钮不做（D-11-11）；提成中心仅展示本期计算结果（D-00-37）" }
  - { id: R-11-030, module: 权限, text: "页面查看权限点「提成中心」（D-00-45、D-00-78）；授权用户可看全部客户、账户提成，不按账户查看权限过滤，也不受客户数据范围隔离（D-00-77）限制；未授权用户菜单隐藏，直接访问时在主布局内容区显示「无权限访问」、保留当前地址与侧栏顶栏（R-13-005），服务端查询拒绝；权限 / 菜单加载失败（非登录失效）时内容区显示「加载失败，请刷新」和「重新加载」，不按全开放展示、不跳登录页（R-13-006）；上线配完角色后须重新登录生效" }
  - { id: R-11-031, module: 异常, text: "10 缺少某日利润或提成所需基数，或 10 按 R-10-070 标出该账户月有缺少数据的日期时，该账户月按未算完处理并展示缺少数据的账户；取不到汇率已是 10 的第四件事（R-10-021④，还差「缺少汇率」），按 R-11-011 处理；不将缺失值当作 0 生成提成；本页不重复折算" }
  - { id: R-11-050, module: 权限, text: "用户必须具备「提成中心」权限点才可进入页面或查询数据；服务端校验同一权限，不以隐藏菜单代替鉴权" }
  - { id: R-11-051, module: 范围边界, text: "本页只读，不创建付款单、不登记付款、不修改提成规则或计算结果；实际支付闭环不属于 v2.1.0（D-00-37）" }

acceptance:
  - { id: G-11-001, module: 计算规则, given: "客户甲（销售王敏）销售规则配置：账户 A、B 适用同一条规则，毛利阶梯 [0,10000) 5%、[10000,不限) 10%。2026-10 10 给的提成用当日毛利 A 6,000、5,000，B 2,000、10,000；相关账户月均已算完", when: "查看王敏销售 2026-10 提成", then: "该规则基数为 23,000.00 人民币，落第二档，提成 2,300.00；没有按阶梯累进拆分" }
  - { id: G-11-002, module: 销售归属, given: "客户甲 2026-10-01～10-15 销售为李娜，10-16 起为王敏；A 每日提成用当日毛利 1,000，规则各日有效且比例 5%，账户月已算完", when: "按提成人员查看 2026-10", then: "李娜归属 10-01～10-15 基数 15,000.00、提成 750.00；王敏归属 10-16～10-31 基数 16,000.00、提成 800.00；历史日期仍归李娜，不因当前销售为王敏而变化" }
  - { id: G-11-003, module: 负毛利, given: "某销售一条规则覆盖账户 A、B，固定比例 10%；10 给的提成用当日毛利 A 10-05 +1,000、10-12 -500（当天客情费用大于收入），B 10-08 +2,000；账户月已算完", when: "查看月度提成并展开", then: "负数日基数按 0；月基数 3,000.00、提成 300.00，不以 -500 冲减；账户层 A 毛利 500.00、提成基数 1,000.00 并标「负毛利日按 0」，B 毛利与基数都是 2,000.00、不标" }
  - { id: G-11-004, module: 规则分段, given: "账户 A 的毛利提成规则版本 10-01 起比例 5%，版本 10-16 起比例 8%；A 每日提成用当日毛利 1,000，整月已算完", when: "查看 2026-10 提成并展开", then: "按规则版本拆开计算：10-01～10-15 基数 15,000.00 × 5% = 750.00；10-16～10-31 基数 16,000.00 × 8% = 1,280.00；合计 2,030.00；展开后两行规则段「客户甲 · 提成规则1 · 2026-10-01 至 2026-10-15」「客户甲 · 提成规则1 · 2026-10-16 至 2026-10-31」" }
  - { id: G-11-005, module: 服务费基数与封顶, given: "优化师规则覆盖账户 A，方式服务费百分比；10 服务费不含税日金额月合计 8,000.00，规则比例 10%、每条规则月上限 500.00；账户月已算完", when: "查看优化师当月提成并展开", then: "基数显示 8,000.00，未使用含税金额；规则段封顶前 800.00、封顶后 500.00，标「已封顶」；月提成 500.00" }
  - { id: G-11-006, module: 未算完与重算, given: "销售规则覆盖 A、B；2026-10 A 已算完，B 计算中；之后 B 转为已算完；之后 A 因 10 的来源变化退回计算中并再恢复已算完", when: "每次刷新提成中心", then: "B 未完成期间整月提成显示「-」、状态计算中、状态格「未算完 1 个账户」并列 B；B 完成后显示整月合计；A 退回期间隐藏金额并列 A，恢复后按最新输入重算展示" }
  - { id: G-11-007, module: 页面与筛选, given: "接 G-11-013（王敏销售 2026-10 含客户甲、客户乙，月提成 1,300.00）；另有李娜销售、陈思远优化师 2026-09/10 已算完结果", when: "搜索「客户乙」，再筛选角色销售、结算期 2026-10、人员王敏，并将分页切为 50 条", then: "所有筛选条件同时生效；只显示王敏销售 2026-10 一行，金额 1,300.00（整月全量，含客户甲），展开后 E 高亮；表头注明「账户条件只筛选人员，金额为整月全量」；概览按筛选后的全部记录汇总，销售提成合计 1,300.00；结算期下拉为「全部」+ 有提成记录的月份降序；筛选区有「归属按 UTC0 日界：变更当天（UTC0）起归新人」；金额人民币、2 位小数" }
  - { id: G-11-008, module: 权限, given: "用户甲有提成中心权限但无账户 A 查看权限；用户乙无提成中心权限", when: "甲打开提成中心并查询 A；乙访问菜单、直接访问页面并调用查询", then: "甲可查看 A 全部提成；乙看不到菜单，直接访问时内容区显示「无权限访问」、地址不变、侧栏顶栏保留，服务端拒绝查询" }
  - { id: G-11-009, module: 不适用规则, given: "账户 A 该业务日没有适用提成规则；账户 B 规则已配置且 10 月已算完；另一销售孙浩 2026-10 名下没有任何账户", when: "查看该人员 2026-10 月汇总；筛选人员孙浩", then: "A 不贡献基数或提成；B 正常计入；无其他适用规则时该人员角色月金额为 0.00、状态已算完；孙浩 2026-10 不出行" }
  - { id: G-11-010, module: 计提基数, given: "接 10 G-10-010（C「橙子-iOS-CN」2026-09 已算完，10 月毛利润 32,804.57，10 页面上 9-30 当日毛利润 -121,525.83）；橙子销售李娜，销售规则只适用 C，毛利 [0,不限) 10%、无上限", when: "查看李娜销售 2026-09 提成并展开", then: "基数 32,804.57（提成用当日毛利 9-10 13,017.67 + 9-20 19,786.90，见 G-10-021），提成 3,280.46；不是把 9-10、9-20 的 61,628.00、92,702.40 加起来再把 9-30 截 0（154,330.40 → 15,433.04）；账户层 C 毛利 32,804.57、提成基数 32,804.57，不标「负毛利日按 0」" }
  - { id: G-11-011, module: 销售归属, given: "同 G-11-010，另：橙子的销售 2026-09-16 起由李娜改为张伟", when: "查看 2026-09 销售提成", then: "李娜基数 13,017.67、提成 1,301.77；张伟基数 19,786.90、提成 1,978.69；渠道成本与手续费按消耗归到两人各自的日子，张伟不独担 9-30 的整笔渠道成本；两人合计 3,280.46 = G-11-010" }
  - { id: G-11-012, module: 规则分段, given: "王敏是客户甲销售；A 每日提成用当日毛利 1,000，10 月已算完；客户甲销售规则 V1（10-01 起）与 V2（10-16 起，内容与 V1 完全相同）：阶梯 [0,20000) 5%、[20000,不限) 10%，每条规则月上限 600.00", when: "查看王敏 2026-10 提成并展开", then: "两行规则段：V1 基数 15,000.00 × 5% = 750.00，封顶 600.00；V2 基数 16,000.00 × 5% = 800.00，封顶 600.00；月提成 1,200.00；不按 31,000.00 合计落 10% 档（3,100.00 → 600.00）" }
  - { id: G-11-013, module: 阶梯汇总, given: "王敏是客户甲、客户乙的销售；两客户的销售规则都为 [0,10000) 5%、[10000,不限) 10%；2026-10 提成用毛利月合计：甲 A 6,000、B 5,000（同一条规则），乙 E 4,000；账户月都已算完", when: "查看王敏 2026-10 销售提成并展开", then: "客户甲规则段基数 11,000.00 落第二档，提成 1,100.00（不按账户各自落第一档 300.00 + 250.00）；客户乙规则段基数 4,000.00，提成 200.00；月提成 1,300.00（不把两客户合计 15,000.00 落一档得 1,500.00）" }
  - { id: G-11-014, module: 变化记录, given: "接 G-11-001（王敏销售 2026-10 已算完 2,300.00）", when: "2026-10-30 提交客户甲销售提成规则新版本 SP-1030（生效 2026-10-01，阶梯 [0,10000) 5%、[10000,不限) 12%）；2026-11-03 审批通过", then: "审批中期间：王敏 2026-10 状态旁灰字「规则审批中（SP-1030），通过后可能重算」，状态仍已算完、金额仍 2,300.00；通过后金额 2,760.00，行上标「金额有变化」，点开变化记录 1 条：原因「提成规则审批通过」、触发单据 SP-1030、2,300.00 → 2,760.00；没有锁定或退回操作" }
  - { id: G-11-015, module: 页面与筛选, given: "2026-10：李娜销售已算完 750.00；王敏销售涉及的账户「蓝帆-iOS-SG」10 状态计算中、还差「缺少汇率」（2026-10-15 USDT→人民币）；陈思远优化师已算完 500.00", when: "查看提成中心 2026-10 与概览；把鼠标移到王敏的状态格", then: "概览：销售提成合计 750.00、优化师提成合计 500.00、「共 3 条，已算完 2 条」、「有 1 条计算中，未计入合计」；王敏行金额「-」、状态格「未算完 1 个账户」，悬浮列出 蓝帆-iOS-SG、还差「缺少汇率」、缺少数据 2026-10-15 USDT→人民币 汇率" }

