# 11-提成中心 · 机器可读规格（v2.1.0；2026-10-21 总控代改：按《会议清单 v2》回写 D15、D18、D19、D38、D41、D63～D65、D92、D111、附 1 N13 等；2026-10-22 总控代改：按《闭环问题清单》回写 A01、A02、B13、B14、B23、B24、D 组）
# 来源：版本 index D-00-35、D-00-37～42、D-00-63～66、D-00-72、D-00-74、D-00-76；05 提成规则；10 利润日明细（提成用当日毛利）与月状态；用户确认的历史销售按日归属、负毛利按日截 0（截的是按消耗拆分后的当日毛利）、只展示已算完结果、变化留痕不锁。
# 本页主管：销售 / 优化师提成结果、提成变化记录与提成中心只读页面。
# 本页不定义：提成规则配置（05）、利润与完成状态（10）、销售 / 优化师变更记录（04 R-04-064、02 R-02-026，D-00-72）。

meta:
  feature: 提成中心
  product: ASA
  version: v2.1.0
  page: 11-提成中心
  date: 2026-10-21
  prd: PRD.md
  status: 待评审
scope:
  in:
    - "销售、优化师按日归属、按自然月汇总的提成计算与展示"
    - "按 05 已通过提成规则版本计算毛利阶梯或服务费百分比提成；规则身份 = 一个版本里的一条规则"
    - "引用 10 的账户×日提成用当日毛利、不含税服务费，账户×月毛利与计算状态"
    - "提成中心筛选、列表（人员月 → 规则段 → 账户三层）、概览及状态提示"
    - "已算完人员月金额变化的变化记录"
    - "提成中心权限点；授权用户查看全部客户与账户"
  out:
    - "提成规则的新增、编辑、审批与历史版本维护（05）"
    - "利润、汇率及账户利润计算（10）"
    - "提成实际支付、付款单、核销或支付状态（D-00-37，本版不做）；已发提成的关账锁定（本版不做，只留痕）"
    - "菜单位置与权限点分配汇总（13）"

roles:
  - { role: "有“提成中心”权限点的用户", can: ["查看全部客户、账户的已算完月份提成、筛选、展开明细与变化记录"], cannot: ["修改提成规则、结果或发起支付"], source: "页面查看权限点（D-00-45、D-00-78；13 汇总）" }
  - { role: "无“提成中心”权限点的用户", can: [], cannot: ["访问页面、读取提成结果"], source: "R-11-050 服务端鉴权" }
  - { role: "系统", can: ["按日应用规则版本、归属人员并计算销售及优化师提成", "在输入变化后重算并记变化记录"], cannot: ["发起实际支付"], source: "R-11-001～R-11-031、R-11-050、R-11-051、D-00-37" }

entities:
  - name: 提成结果日明细
    key: commission_day
    note: "以人员、角色、账户、自然日、规则（版本 + 规则序号）为计算明细粒度；只存基数与比例，不存当日提成金额（落档在月度规则层，D-11-08）"
    fields:
      - { key: "account_id", label: "账户", type: "ref", required: true, rule: "02 账户" }
      - { key: "date", label: "业务日期", type: "date", required: true, rule: "UTC0 自然日；以 10 利润日明细日期为准" }
      - { key: "role", label: "提成角色", type: "enum", required: true, enum: ["销售", "优化师"] }
      - { key: "person_id", label: "提成人员", type: "ref", required: true, rule: "按业务日期的销售 / 优化师归属（R-11-003）；当日人员为空的不生成本明细（D-11-12）" }
      - { key: "rule_ref", label: "提成规则", type: "ref", required: false, rule: "05 某一版本里的某一条规则（R-05-075，D-00-40）；无适用规则时不产生提成" }
      - { key: "basis_type", label: "提成基数类型", type: "enum", required: true, enum: ["毛利", "服务费（不含税）"] }
      - { key: "source_amount", label: "当日来源金额", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "毛利规则 = 10 提成用当日毛利（R-10-072，可为负）；服务费规则 = 10 当日不含税服务费（R-11-010）" }
      - { key: "basis_amount", label: "当日提成基数", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "来源金额为负时按 0（R-11-012）" }
      - { key: "tier_rate", label: "提成比例", type: "decimal", required: false, precision: 2, rule: "%；所属规则段月度落档后的比例（R-11-014）" }
  - name: 提成规则段
    key: commission_rule_month
    note: "人员 × 角色 × 月 × 规则（一个版本里的一条）一条，是落档与封顶的单位；展开明细第二层"
    fields:
      - { key: "period", label: "结算期", type: "string", required: true, rule: "yyyy-mm，UTC0 自然月" }
      - { key: "person_id", label: "提成人员", type: "ref", required: true }
      - { key: "role", label: "提成角色", type: "enum", required: true, enum: ["销售", "优化师"] }
      - { key: "customer_id", label: "客户", type: "ref", required: true }
      - { key: "rule_ref", label: "提成规则", type: "ref", required: true, rule: "版本 + 规则序号（随版本固定，R-05-119①）；展示「{客户名称} · 提成规则N · {生效区间}」" }
      - { key: "range", label: "生效区间", type: "string", required: true, rule: "05 版本生效区间（R-05-119②）与本月的交集，yyyy-mm-dd 至 yyyy-mm-dd" }
      - { key: "basis_total", label: "基数合计", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-11-013、R-11-015" }
      - { key: "tier_rate", label: "落档比例", type: "decimal", required: true, precision: 2, rule: "R-11-014" }
      - { key: "amount_before_cap", label: "封顶前金额", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-11-016" }
      - { key: "amount", label: "封顶后金额", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-11-016；封顶时标「已封顶」" }
  - name: 提成月汇总
    key: commission_month
    note: "按提成人员 × 角色 × UTC0 自然月聚合；列表主行，展开为规则段、账户"
    fields:
      - { key: "period", label: "结算期", type: "string", required: true, rule: "yyyy-mm，UTC0 自然月" }
      - { key: "person_id", label: "提成人员", type: "ref", required: true }
      - { key: "role", label: "提成角色", type: "enum", required: true, enum: ["销售", "优化师"] }
      - { key: "commission_basis", label: "月度提成基数", type: "decimal", required: true, precision: 2, currency: "人民币" }
      - { key: "commission_amount", label: "月度提成金额", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "R-11-017；计算中显示「-」" }
      - { key: "status", label: "计算状态", type: "enum", required: true, enum: ["计算中", "已算完"], generated: true, rule: "只有相关账户月全部已算完才展示金额，R-11-011、R-11-022" }
      - { key: "missing_accounts", label: "未算完账户", type: "list", required: false, generated: true, rule: "账户名称、还差项、缺少数据的日期与缺的是什么（R-11-022）" }
      - { key: "pending_rule_orders", label: "审批中的提成规则单", type: "list", required: false, generated: true, rule: "生效日期 ≤ 月末的审批中单号（R-05-119③），只做灰字提示（R-11-022）" }
      - { key: "changed", label: "金额有变化", type: "boolean", required: true, default: "否", generated: true, rule: "有变化记录时为是（R-11-019）" }
  - name: 提成变化记录
    key: commission_change_log
    note: "只追加；只为曾经已算完的人员月记（R-11-019）"
    fields:
      - { key: "period", label: "结算期", type: "string", required: true }
      - { key: "person_id", label: "提成人员", type: "ref", required: true }
      - { key: "role", label: "提成角色", type: "enum", required: true, enum: ["销售", "优化师"] }
      - { key: "at", label: "时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true }
      - { key: "reason", label: "原因", type: "list", required: true, enum: ["提成规则审批通过", "利润数据变化", "人员归属更正"], rule: "R-11-019：从退回到再次已算完之间的多次触发合并成一条，原因按先后列出（可多个）；「人员归属更正」只用于技术修数据时改了历史变更记录（D-11-14）" }
      - { key: "trigger", label: "触发单据", type: "list", required: false, rule: "审批单号 / 10 的触发单据，合并记录时全部列出（R-11-019）；没有为空" }
      - { key: "amount_before", label: "变化前金额", type: "decimal", required: true, precision: 2, currency: "人民币", rule: "上一次已算完时的月提成金额" }
      - { key: "amount_after", label: "变化后金额", type: "decimal", required: true, precision: 2, currency: "人民币" }

