  - { id: "G-12-026", module: "审批中心", given: "待审批标签有单子", when: "在列表行上点「驳回」并确定", then: "弹二次确认同审批详情；确定后该行从待审批消失" }
  - { id: "G-12-027", module: "审批中心", given: "用户与任何审批单都无关", when: "打开审批中心", then: "两个标签都显示空态「暂无审批」" }
  - { id: "G-12-041", module: "审批中心", given: "张三有 3 张待审批", when: "看侧栏；通过 1 张；看两个标签的筛选栏；在备注里输入第 1,025 个字", then: "一级、二级审批中心旁显示 3，通过后变 2，全部处理完不显示；待审批无审批状态筛选、全部审批有（全部/审批中/已通过/已驳回/已撤回）；第 1,025 个字输不进去" }
  - { id: "G-12-042", module: "权限", given: "周婷没有「审批中心（查看）」", when: "登录看侧栏，直接访问审批中心地址", then: "侧栏没有「审批中心」子项、没有角标；直接访问显示「无权限访问」" }
  - { id: "G-12-028", module: "通知", given: "按 G-12-014 方式构造会签 张三、赵六、钱七；张三绑定企业微信和邮箱；赵六没绑企业微信有邮箱；钱七都没有", when: "该会签节点轮到", then: "张三只收到企业微信；赵六收到邮件；钱七不收，通知日志记「无可用渠道」" }
  - { id: "G-12-029", module: "通知", given: "张三绑定企业微信但企业微信接口返回失败", when: "轮到张三审批", then: "不发邮件；通知日志记发送失败" }

tasks:
  - { id: "T-12-001", title: "审批类型预置 14 种及审批规则、节点配置的数据结构", depends_on: [], done_when: "14 种类型可查询，规则与节点可增删改并持久化" }
  - { id: "T-12-002", title: "审批配置列表页", depends_on: ["T-12-001"], done_when: "G-12-001、G-12-030 通过" }
  - { id: "T-12-003", title: "配置审批流弹窗（规则增删、角色互斥与回落、节点步进、审批人候选、保存校验含指定用户节点与渠道动态选项）", depends_on: ["T-12-001"], done_when: "G-12-002～G-12-010、G-12-033 通过" }
  - { id: "T-12-004", title: "审批单提交接口——业务包传入审批类型、申请人、操作对象客户、涉及账户、业务单据、发起备注、比对基准；完成规则匹配、审批人解析、快照、跳过与免审、提交提示", depends_on: ["T-12-001"], done_when: "G-12-011～G-12-014、G-12-016、G-12-017、G-12-019、G-12-035 通过" }
  - { id: "T-12-005", title: "通过 / 驳回 / 撤回 / 作废动作与服务端校验、并发防重、最终通过业务执行与回滚", depends_on: ["T-12-004"], done_when: "G-12-015、G-12-018、G-12-020、G-12-023、G-12-024、G-12-034、G-12-039、G-12-040 通过" }
  - { id: "T-12-006", title: "审批结束回调各业务包（已通过 / 已驳回 / 已撤回含作废）", depends_on: ["T-12-005"], done_when: "业务包能收到结果并按各自 PRD 处理" }
  - { id: "T-12-007", title: "审批详情页通用框架（唯一地址、信息区、时间线、会签圆点、按钮区、高亮基准快照、业务内容区插槽、已禁用显示）", depends_on: ["T-12-004"], done_when: "G-12-021、G-12-022、G-12-031、G-12-032、G-12-036、G-12-038 通过" }
  - { id: "T-12-008", title: "审批中心（两个标签、搜索筛选排序、行内通过驳回、查看权限点、待办角标）", depends_on: ["T-12-005"], done_when: "G-12-025～G-12-027、G-12-041、G-12-042 通过" }
  - { id: "T-12-009", title: "审批通知（企业微信 → 邮箱、模板含作废、发送日志）", depends_on: ["T-12-004"], done_when: "G-12-028、G-12-029 及各时机通知正确" }
  - { id: "T-12-010", title: "在途单提示通用组件（顶部提示条 / 知道了提示框、单号链接）", depends_on: ["T-12-007"], done_when: "G-12-037 通过；03～08 引用 R-12-047" }

decisions:
  - { id: "D-12-01", point: "规则怎么命中", conclusion: "一个用户只有一个角色；同一审批类型下各规则角色并集 = 全部角色；规则 1 为默认规则，新增角色自动归入规则 1", impact: "R-12-005、R-12-014", status: "已定" }
  - { id: "D-12-02", point: "没命中规则怎么办", conclusion: "不存在没命中的情况，规则 1 兜底", impact: "R-12-014", status: "已定" }
  - { id: "D-12-03", point: "审批人解析异常", conclusion: "绑定的销售/运营为空或账号禁用 → 跳过该节点；审批人是申请人本人照常要本人点通过", impact: "R-12-016、R-12-017、R-12-022", status: "已定" }
  - { id: "D-12-04", point: "改配置后的在途单", conclusion: "按提交那一刻的流程走完；新配置只影响之后提交的单", impact: "R-12-013、R-12-015", status: "已定" }
  - { id: "D-12-05", point: "备注是否必填", conclusion: "通过、驳回备注都选填（最多 1,024 字，2026-10-21 补，会议清单 v2 附 1 N9）；驳回原因为空时通知写「无」", impact: "R-12-020、R-12-040", status: "已定" }
  - { id: "D-12-06", point: "角色互斥与回落", conclusion: "同一类型下角色互斥；从其他规则去掉或删规则时自动回到规则 1；规则 1 不能删", impact: "R-12-005～R-12-007", status: "已定" }
  - { id: "D-12-07", point: "未配置与 0 节点", conclusion: "节点允许 0；未配置或 0 节点即免审批，提交即通过；风险是涉及钱的类型上线前没配就免审，靠上线检查兜底", impact: "R-12-009、R-12-018、上线检查", status: "已定" }
  - { id: "D-12-08", point: "跳过边界", conclusion: "全部节点跳过 → 直接已通过（「至少一个指定用户节点」为「要求」的 10 类例外，见 D-12-43）；会签只去掉解析不到的人；在途审批人被禁用不自动处理，申请人撤回重提或管理员作废", impact: "R-12-017、R-12-018、R-12-024", status: "已定" }
  - { id: "D-12-09", point: "撤回范围与入口", conclusion: "全部类型通用；仅审批中、仅申请人本人，不校验业务权限点；入口在业务页已提交审批和审批详情页，审批中心不放；例外：持「审批配置」的人可作废任何审批中的单（2026-10-21 用户定，会议清单 D81、D28，D-00-79）", impact: "R-12-031、R-12-032、R-12-046", status: "已定" }
  - { id: "D-12-10", point: "全部审批的范围", conclusion: "审批流里出现过我的单都算，含还没轮到的", impact: "R-12-036", status: "已定" }
  - { id: "D-12-11", point: "通知渠道", conclusion: "本期不做短信；没绑企微才走邮箱；企微发送失败不降级只记日志；撤回通知当前卡着的人", impact: "R-12-035、R-12-039", status: "已定" }
  - { id: "D-12-12", point: "原型动态面板「审批」「草稿」状态", conclusion: "复制残留，不做", impact: "范围", status: "已定" }
  - { id: "D-12-13", point: "节点与会签", conclusion: "一个节点配置时只能选一项；会签来自动态选项解析出多人（本期主要是「绑定的运营」涉及多个账户），全员通过才算过", impact: "R-12-010、R-12-016、R-12-017", status: "已定" }
  - { id: "D-12-14", point: "渠道付款与渠道对账", conclusion: "是两种审批类型，都在渠道对账中心下；预置共 14 种", impact: "R-12-001、08-渠道对账", status: "已定" }
  - { id: "D-12-15", point: "审批中心筛选排序", conclusion: "加审批事项、审批类型筛选；「审批状态」筛选仅全部审批标签（2026-10-21 用户定，会议清单 D83）；全部审批待我审批置顶、其余申请时间降序；待审批按申请时间降序", impact: "R-12-037", status: "已定" }
  - { id: "D-12-16", point: "原型列表「客户管理—规则配置变更」与撤回通知会签对象", conclusion: "按「客户登记表—规则配置」处理；会签节点撤回通知该节点所有未处理的人", impact: "R-12-001、R-12-035", status: "已定" }
  - { id: "D-12-17", point: "规则 1 角色的展示方式", conclusion: "规则 1 角色由系统自动计算、只读、可为空；规则 2 起的角色下拉排除其他非默认规则已选角色。依据：D-12-01、D-12-06 推导；风险：想把某角色从规则 2 挪回规则 1 只能在规则 2 取消勾选。2026-10-21 用户确认（由代定转已定）", impact: "R-12-005、R-12-007", status: "已定" }
  - { id: "D-12-18", point: "审批人何时解析", conclusion: "提交那一刻解析并固化名单。依据：D-12-04 在途按提交时流程、D-12-08 在途禁用不自动处理。2026-10-21 用户确认（由代定转已定）", impact: "R-12-015", status: "已定" }
  - { id: "D-12-19", point: "时间线节点状态文字", conclusion: "通过 / 驳回 / 待审批 / 未开始 / 已跳过（未找到审批人）/ 未处理，撤回、作废、自动通过各追加一条；色值按会议清单 v2 附 1 N11 补。依据：原型只画了 发起、通过、驳回、待审批，其余是为全部审批能看到没轮到的节点补的。2026-10-21 用户确认（由代定转已定）", impact: "R-12-028", status: "已定" }
  - { id: "D-12-20", point: "配置弹窗细节", conclusion: "审批人下拉只列启用且持审批中心查看点的用户、动态选项置顶；关闭不保存直接丢弃不确认；两人同时编辑后保存覆盖；列表按预置顺序固定排序。2026-10-21 用户确认（由代定转已定）", impact: "R-12-002、R-12-010、R-12-013", status: "已定" }
  - { id: "D-12-21", point: "免审时是否通知", conclusion: "0 节点或全部跳过直接通过时，也按「审批通过」通知申请人（2026-10-21 用户定，会议清单 D85 收口）", impact: "R-12-018、R-12-038", status: "已定" }
  - { id: "D-12-22", point: "发起记录的备注", conclusion: "取业务提交时填的备注；业务没有备注字段则不显示。2026-10-21 用户确认（由代定转已定）", impact: "R-12-027", status: "已定" }
  - { id: "D-12-23", point: "审批节点数上限", conclusion: "暂不设上限", impact: "R-12-009", status: "已定" }
  - { id: "D-12-24", point: "审批相关权限", conclusion: "审批配置单独一个权限点；审批中心按「审批中心（查看）」权限点显示，只看与自己相关的单（2026-10-21 改：原为「所有登录用户可进」，用户定，会议清单 D86，D-00-78）；审批详情只有申请人、审批流里的人与 R-12-043 其余两类能看", impact: "R-12-041～R-12-043、13-导航与权限、06 等在业务页展示审批单号链接的地方", status: "已定" }
  - { id: "D-12-25", point: "业务页审批单号链接的查看权限", conclusion: "审批详情另开放给对关联业务单据有查看权限的人，只读；沿用业务现有数据权限，不新增权限点，不进审批流；各业务包提供能否查看的判断", impact: "R-12-043、R-12-044、03～08 各业务包", status: "已定" }
  - { id: "D-12-26", point: "客户类审批单的只读查看范围", conclusion: "有「客户管理-只读」或「客户管理-读写」之一、且该客户在其客户数据范围内（非 sys 须是该客户销售或其名下任一账户优化师，sys 看全部）即可只读查看三类客户审批详情（2026-10-21 改正前提：现有系统按销售 / 运营隔离而非「不隔离」，用户定保留隔离，会议清单 D21，D-00-77）", impact: "R-12-043、04-客户管理", status: "已定" }
  - { id: "D-12-27", point: "动态选项名称", conclusion: "「绑定的商务」改叫「绑定的销售」，与 04 客户的「销售」字段统一（04 会话提出，用户确认）；解析的仍是客户的销售字段", impact: "R-12-010、R-12-016、配置弹窗、审批详情时间线、04", status: "已定" }  # alias-ok
  - { id: "D-12-28", point: "最终通过时业务执行失败", conclusion: "一律回滚：审批单保持审批中、这次通过不记录、确认框报业务原因、详情页记最近一次通过未执行；失败情形由各业务包列明（2026-10-21 用户定，会议清单 D26，D-00-79①）", impact: "R-12-045、R-12-020、R-12-026、03～08", status: "已定" }
  - { id: "D-12-29", point: "在途审批卡死的兜底", conclusion: "持「审批配置」的人可对任何审批中的单作废：二次确认、原因必填、效果同撤回、时间线记作废、通知申请人和未处理审批人（2026-10-21 用户定，会议清单 D28，D-00-79③）", impact: "R-12-046、R-12-031、R-12-038、13", status: "已定" }
  - { id: "D-12-30", point: "作废的落地细节", conclusion: "作废后状态记「已撤回」（时间线动作记「作废」以区分）；入口只在审批详情页；持「审批配置」可只读打开任何审批详情（否则找不到要作废的单）；操作人本人不收作废通知。依据：D-00-79③「效果同撤回」「任何审批中的单」；风险：扩大了审批配置管理员的查看范围。2026-10-21 用户确认（由代定转已定）", impact: "R-12-043、R-12-046、R-12-040", status: "已定" }
  - { id: "D-12-31", point: "「绑定的运营」解析口径", conclusion: "运营 = 账户优化师；按本单涉及账户的优化师去重、只取启用用户；客户级单据取客户名下全部账户；无账户解析为空跳过；多人即会签（2026-10-21 用户定，会议清单 D29、技术答复 T02，D-00-76）", impact: "R-12-016、术语、03～08 传涉及账户", status: "已定" }
  - { id: "D-12-32", point: "涉钱类型的配置约束", conclusion: "涉钱 8 类 + 新建客户 + 客户信息变更，节点数 ≥ 1 时至少一个指定用户节点；0 节点免审仍允许；渠道付款、渠道对账不提供动态选项（2026-10-21 用户定，会议清单 D117）", impact: "R-12-010、R-12-012、index S-15", status: "已定" }
  - { id: "D-12-33", point: "会签与节点多选", conclusion: "保留引擎会签能力，节点不改多选；用例前置用多账户不同优化师构造会签（2026-10-21 用户定，会议清单 D118）", impact: "R-12-017、R-12-029、G-12-014/015/021/023/028", status: "已定" }
  - { id: "D-12-34", point: "审批详情页形态", conclusion: "只有一个地址按单号打开，登录即可进入；标题首段不可点、无面包屑、侧栏高亮审批中心；各入口与通知链接都指向它（2026-10-21 用户定，会议清单 D82，A 档）", impact: "R-12-026、R-12-040、03～09 单号链接", status: "已定" }
  - { id: "D-12-35", point: "审批中心待办角标", conclusion: "一级、二级审批中心旁显示待审批条数，0 不显示，>99 显示 99+，非实时（2026-10-21 用户定，会议清单 D84，A 档）", impact: "R-12-048、13 R-13-003", status: "已定" }
  - { id: "D-12-36", point: "提交提示与免审单展示", conclusion: "审批中提示「已提交审批」、免审提示「提交成功，无需审批，已生效」；免审单有单号、进全部审批与业务页已提交审批，时间线追加「无需审批，自动通过」（2026-10-21 用户定，会议清单 D85、附 1 B3，A 档）", impact: "R-12-018、03～08 提交弱提示", status: "已定" }
  - { id: "D-12-37", point: "在途单提示统一句式", conclusion: "审批中与已通过未收付款两种句式，带单号与申请人 / 财务ID，单号可点；不用自动消失的提示（2026-10-21 用户定，会议清单 D40、附 1 B2，A 档）", impact: "R-12-047、03～08", status: "已定" }
  - { id: "D-12-38", point: "审批人候选", conclusion: "指定用户候选只列持「审批中心（查看）」的启用用户；已配审批人被收回该点后仍可从通知链接打开处理（2026-10-21 用户定，会议清单 D86、技术答复 T10 / R7，D-00-78）", impact: "R-12-010、R-12-042、R-12-043", status: "已定" }
  - { id: "D-12-39", point: "解析时是否按审批中心查看点过滤", conclusion: "不过滤：指定用户被收回该点仍解析为审批人；动态选项解析到的销售 / 优化师不看该点，靠通知链接处理。依据：D-00-78「已配审批人被收回后仍可处理」；风险：无该点的审批人只能靠通知或他人转发链接，无渠道时可能无人知晓。2026-10-21 用户确认（由代定转已定）", impact: "R-12-016、R-12-042", status: "已定" }
  - { id: "D-12-40", point: "免审单提交时业务执行失败", conclusion: "提交不成功、不生成审批单，业务页显示业务原因。依据：与 D-00-79①「执行失败一律回滚」同理；风险：各业务包需在提交接口上同步返回原因。2026-10-21 用户确认（由代定转已定）", impact: "R-12-018、03～08", status: "已定" }
  - { id: "D-12-41", point: "已禁用的指定用户是否算「指定用户节点」", conclusion: "不算：涉钱等 10 类必须至少有一个节点选的是启用中的用户，否则不能保存。依据：D117 防止只靠会被跳过的节点绕过审批；风险：用户禁用后管理员下次保存该类型时须先换人。2026-10-21 用户确认（由代定转已定）", impact: "R-12-012", status: "已定" }
  - { id: "D-12-42", point: "渠道两类存量动态节点", conclusion: "打开弹窗时该节点标红，保存时拦截，须改选用户。依据：D117 渠道两类不提供动态选项；风险：存量若有此配置，上线前需重配。2026-10-21 用户确认（由代定转已定）", impact: "R-12-012、index S-15", status: "已定" }
  - { id: "D-12-43", point: "10 类审批人全部解析为空", conclusion: "必须配指定用户节点的那 10 类审批，命中规则的节点数 ≥ 1、但审批人全部解析为空时，不按免审通过：提交直接被拒，提示「审批流中的审批人均不可用，请联系审批配置管理员」；节点数为 0 的免审照旧。2026-10-22 用户与技术确认，闭环清单 A03", impact: "R-12-012、R-12-016、R-12-018、flows、10 类业务包提交", status: "已定" }
  - { id: "D-12-44", point: "审批详情第②类是否还要页面查看点", conclusion: "要：05 的四类审批要求同时持「费用管理（查看）」；生成结算单要求同时持「账单管理（查看）」；客户返点 / 客情费用要求同时持「返点管理（查看）」；申请人和快照里的审批人不受影响。2026-10-22 用户与技术确认，闭环清单 B10", impact: "R-12-043、05、06、07", status: "已定" }
  - { id: "D-12-45", point: "存量审批配置迁移", conclusion: "①存量「账户销售」节点就是「绑定的销售」，保留；②迁移生成的规则 1 为 0 节点，「规则 1 为 0 节点、规则 2 起又没覆盖全部角色」的审批类型列入检查清单，由用户逐个确认；③规则之间角色重叠的，归原排序最前的那条；④「发起人」节点改为上线前核对，有残留就阻断上线，由管理员重配。2026-10-22 用户与技术确认，闭环清单 B11", impact: "R-12-050、R-12-005、R-12-007、R-12-014、index S-15", status: "已定" }
  - { id: "D-12-46", point: "新建客户单的绑定的销售与查看范围", conclusion: "新建客户单的「绑定的销售」取提交表单里的销售（R-04-034）；审批详情能不能看，按提交内容里的销售是不是本人判断。2026-10-22 用户与技术确认，闭环清单 B12", impact: "R-12-016、R-12-043、04", status: "已定" }

