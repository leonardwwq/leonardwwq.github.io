# 12-审批配置与审批中心 · 机器可读规格
# 来源：html/审批配置.html:3150/3158、html/审批中心.html:2522、html/审批详情-客户管理.html:2472/2480、html/客户管理.html:3049 + 用户确认（见 decisions）
# 2026-10-21 按会议清单 v2 回写（D26～D29、D40、D41、D81～D86、D117、D118、附 1 N9～N11 / B2～B4）
# 2026-10-22 按闭环清单 A03、B10、B11、B12、B20 回写
# 本页主管：审批类型清单、审批流配置、审批单实体与状态机、审批人解析与会签、撤回与作废、最终通过执行失败回滚、变更高亮基准、审批通知、审批详情页通用格式、审批中心、在途单提示句式。
# 业务包（03/04/05/06/07/08）只写：本业务审批详情「审批内容」区展示什么、提交前校验、哪些情形算最终通过执行失败、审批结果出来后业务单据怎么变。

meta:
  feature: 审批配置与审批中心
  product: ASA
  version: v2.1.0
  page: 12-审批配置与审批中心
  date: 2026-10-21
  prd: PRD.md
  status: 待评审

scope:
  in:
    - 预置审批类型清单（14 种）
    - 审批配置列表页与「配置审批流」弹窗（多套审批规则、申请者角色、节点数、每节点审批人、涉钱类型指定用户节点校验）
    - 审批单实体与状态机（审批中 / 已通过 / 已驳回 / 已撤回）
    - 提交时匹配规则、解析审批人（绑定的销售 / 绑定的运营）、跳过、会签、逐节点推进
    - 通过 / 驳回（二次确认 + 选填备注）；最终通过时业务执行失败回滚（D-00-79①）
    - 撤回（14 种类型通用；只看申请人本人 + 审批中）与作废（持「审批配置」，D-00-79③）
    - 审批通知（企业微信 → 邮箱）
    - 审批详情页通用格式（唯一地址、审批信息区、时间线、会签圆点、操作按钮、变更高亮基准快照）
    - 审批中心（待审批 / 全部审批、待办角标）
    - 业务页提交后弱提示与在途单提示通用句式
  out:
    - 各业务审批详情「审批内容」区的具体字段（归各业务包）
    - 哪些情形算最终通过执行失败（归各业务包列明）
    - 审批结果对业务单据的处理（归各业务包）
    - 各业务页「已提交审批」tab 的列表字段与筛选（归各业务包；撤回规则引用本页）
    - 短信通知（本期不做，D-12-11）
    - 或签、转交、加签、催办；节点多选（D-12-33）
    - 审批配置与审批中心原型动态面板里的「审批」「草稿」状态（残留，D-12-12）
    - 原型列表行前复选框对应的批量操作（原型无批量按钮，不做）
    - 权限点分配到角色（只出权限点，交 13-导航与权限 汇总，D-00-45）

roles:
  - { role: "持「审批中心（查看）」的用户", can: ["进入审批中心查看与自己相关的单", "被选为审批配置的指定用户节点"], cannot: ["查看与自己无关的审批详情"], source: "「审批中心（查看）」权限点（R-12-042、R-12-010，D-00-78）" }
  - { role: "审批配置管理员", can: ["查看审批配置列表", "配置审批流", "作废任何审批中的单", "只读打开任何审批详情"], cannot: ["通过或驳回不属于自己的节点"], source: "「审批配置」权限点（R-12-041、R-12-046、R-12-043；由 13 汇总，不预设角色）" }
  - { role: "申请人", can: ["在业务页提交审批单", "查看自己提交的审批单详情", "撤回自己提交的审批中审批单（不看业务权限点）"], cannot: ["审批不属于自己当前节点的单子", "撤回他人提交的单子"], source: "提交看各业务动作权限点；撤回只看申请人本人 + 审批中（R-12-032，D-00-79②）" }
  - { role: "业务数据查看者", can: ["只读查看自己有权看的业务单据对应的审批详情"], cannot: ["通过", "驳回", "撤回", "作废"], source: "沿用各业务现有数据权限，不新增权限点（R-12-043②）；另含收付款中心 8 类（D-00-71）" }
  - { role: "审批人", can: ["查看与自己相关的审批单", "对轮到自己且尚未处理的审批单通过或驳回（可从通知链接进入，不要求审批中心查看点）"], cannot: ["撤回他人提交的单子", "处理还没轮到或已处理过的节点"], source: "审批单快照里的审批人名单（R-12-023、R-12-043①）" }

entities:
  - name: 审批类型
    key: approval_type
    fields:
      - { key: "category", label: "审批事项", type: "enum", required: true, enum: ["客户登记表", "客户管理", "费用管理", "账单管理", "返点管理", "渠道对账中心"], rule: "R-12-001" }
      - { key: "type", label: "审批类型", type: "enum", required: true, enum: ["规则配置", "新建客户", "客户信息变更", "付款主体变更", "账户充值", "充值退款", "额度调整", "余额分配", "提成规则配置", "生成结算单", "客户返点", "客情费用", "渠道付款", "渠道对账"], rule: "R-12-001" }
      - { key: "require_user_node", label: "至少一个指定用户节点", type: "bool", required: true, generated: true, rule: "新建客户、客户信息变更、涉钱 8 类为 true（R-12-012③）" }
      - { key: "allow_dynamic", label: "提供动态选项", type: "bool", required: true, generated: true, rule: "渠道付款、渠道对账为 false，其余 true（R-12-010）" }
      - { key: "rules", label: "审批规则", type: "list", required: true, rule: "至少 1 套；规则 1 为默认规则（R-12-005）" }
      - { key: "edited_at", label: "编辑时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "最近一次保存审批流的时间；从未保存显示「—」（R-12-003）" }
      - { key: "edited_by", label: "最近编辑人", type: "ref", required: false, generated: true, rule: "列表不展示，留痕用" }
  - name: 审批规则
    key: approval_rule
    fields:
      - { key: "seq", label: "规则序号", type: "int", required: true, generated: true, rule: "从 1 连续编号；删除后重排（R-12-006）" }
      - { key: "applicant_roles", label: "申请者角色", type: "list", required: true, rule: "取角色列表；同一审批类型内互斥；规则 1 自动计算只读（R-12-005、R-12-007）" }
      - { key: "node_count", label: "审批节点", type: "int", required: true, default: 0, rule: "整数 ≥ 0；0 表示免审批（R-12-009）" }
      - { key: "nodes", label: "审批流", type: "list", required: true, rule: "长度 = node_count；每个节点一个审批人选项（R-12-010、R-12-011）" }
  - name: 审批节点配置
    key: approval_node_config
    fields:
      - { key: "approver_kind", label: "审批人类型", type: "enum", required: true, enum: ["指定用户", "绑定的销售", "绑定的运营"], rule: "R-12-010；渠道两类只能指定用户" }
      - { key: "user_id", label: "指定用户", type: "ref", required: false, rule: "approver_kind = 指定用户 时必填；候选为持「审批中心（查看）」的启用用户（R-12-010）" }
  - name: 审批单
    key: approval_instance
    fields:
      - { key: "approval_no", label: "审批单号", type: "string", required: true, generated: true, rule: "系统生成，全局唯一；格式以技术为准，文档示例仅示意" }
      - { key: "category", label: "审批事项", type: "enum", required: true, rule: "取自审批类型" }
      - { key: "type", label: "审批类型", type: "enum", required: true, rule: "取自审批类型" }
      - { key: "applicant_id", label: "申请人", type: "ref", required: true, generated: true }
      - { key: "applicant_role", label: "提交时申请人角色", type: "ref", required: false, generated: true, rule: "用于匹配规则（R-12-014）；无角色时为空" }
      - { key: "submitted_at", label: "申请时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "秒", generated: true }
      - { key: "status", label: "审批状态", type: "enum", required: true, enum: ["审批中", "已通过", "已驳回", "已撤回"], default: "审批中", rule: "见 flows；作废后为已撤回（R-12-046）" }
      - { key: "target_customer", label: "操作对象客户", type: "ref", required: false, rule: "业务包提交时给出；解析绑定的销售（R-12-016）" }
      - { key: "target_accounts", label: "涉及账户", type: "list", required: false, rule: "业务包提交时给出，可多个；客户级单据为客户名下全部账户；解析绑定的运营（R-12-016，D-00-76）" }
      - { key: "biz_ref", label: "业务单据", type: "ref", required: true, rule: "指向业务包的单据；审批内容区由业务包按它渲染" }
      - { key: "submit_remark", label: "发起备注", type: "text", required: false, rule: "业务提交时填写的备注；没有则时间线发起记录不显示备注（R-12-027）" }
      - { key: "matched_rule_seq", label: "命中规则", type: "int", required: true, generated: true, rule: "R-12-014" }
      - { key: "flow_snapshot", label: "流程快照", type: "list", required: true, generated: true, rule: "提交那一刻解析出的节点及每节点审批人名单，之后不随配置、销售、优化师、禁用、权限点变化（R-12-015）" }
      - { key: "diff_baseline", label: "比对基准快照", type: "text", required: false, generated: true, rule: "变更类审批提交时该对象的生效值，由业务包给出；审批中与结束后回看都按它标红（R-12-030，D-00-75）" }
      - { key: "last_failed_pass", label: "最近一次通过未执行", type: "text", required: false, generated: true, rule: "原因、审批人、时间；最终通过执行失败时覆盖写入，只在审批中显示（R-12-045）" }
      - { key: "current_node", label: "当前节点序号", type: "int", required: false, generated: true, rule: "审批中时有值；结束后为空" }
      - { key: "finished_at", label: "结束时间", type: "datetime", required: false, tz: "Asia/Shanghai", precision: "秒", generated: true, rule: "变为已通过/已驳回/已撤回的时间" }
  - name: 审批记录
    key: approval_record
    fields:
      - { key: "node_seq", label: "节点序号", type: "int", required: true, rule: "0 = 发起" }
      - { key: "user_id", label: "操作人", type: "ref", required: false, rule: "跳过的节点、自动通过为空" }
      - { key: "action", label: "动作", type: "enum", required: true, enum: ["发起", "通过", "驳回", "撤回", "作废", "已跳过", "自动通过"], rule: "R-12-018、R-12-028、R-12-046" }
      - { key: "remark", label: "备注", type: "text", required: false, max: 1024, rule: "通过 / 驳回选填（R-12-020）；作废时为必填作废原因（R-12-046）" }
      - { key: "acted_at", label: "操作时间", type: "datetime", required: true, tz: "Asia/Shanghai", precision: "分（展示）", generated: true }

flows:
  - entity: 审批单
    states: [审批中, 已通过, 已驳回, 已撤回]
    initial: 审批中
    transitions:
      - { from: "无（新提交）", action: "提交且有需审批的节点", actor: "申请人", to: "审批中", guard: "命中规则 node_count ≥ 1 且至少一个节点解析出审批人（R-12-014、R-12-017）" }
      - { from: "无（新提交）", action: "提交即免审且业务执行成功", actor: "系统", to: "已通过", guard: "命中规则 node_count = 0，或所有节点都被跳过（R-12-009、R-12-018）；执行失败则不生成审批单；require_user_node 为 true 的 10 类 node_count ≥ 1 且全部跳过时不走此转移，提交被拒、不生成审批单（R-12-018 例外，D-12-43）" }
      - { from: "审批中", action: "最后一个节点全员通过且业务执行成功", actor: "审批人", to: "已通过", guard: "R-12-019、R-12-045" }
      - { from: "审批中", action: "最后一位通过但业务执行失败", actor: "审批人", to: "审批中", guard: "回滚，这次通过不记录，记最近一次通过未执行（R-12-045）" }
      - { from: "审批中", action: "当前节点全员通过且后面还有节点", actor: "审批人", to: "审批中", guard: "进入下一个未被跳过的节点（R-12-019）" }
      - { from: "审批中", action: "任一审批人驳回", actor: "审批人", to: "已驳回", guard: "R-12-021" }
    reverse:
      - { action: "撤回", actor: "申请人本人", allowed_from: ["审批中"], note: "只看申请人本人 + 审批中，不看业务权限点；原单作废，不能原单修改或重提；通知当前节点未审的人（R-12-032～R-12-035）" }
      - { action: "作废", actor: "持「审批配置」权限点的人", allowed_from: ["审批中"], note: "原因必填；状态变已撤回，业务按撤回处理；时间线记作废；通知申请人和当前节点未审的人（R-12-046）" }
      - { action: "驳回", actor: "当前节点审批人", allowed_from: ["审批中"], note: "不再往后推进；业务单据如何处理由业务包定义" }

rules:
  # —— 2.1 审批类型与审批流配置 ——
  - { id: "R-12-001", module: "审批配置", text: "审批类型为系统预置的 14 种，不提供新增和删除：客户登记表—规则配置；客户管理—新建客户、客户信息变更、付款主体变更；费用管理—账户充值、充值退款、额度调整、余额分配、提成规则配置；账单管理—生成结算单；返点管理—客户返点、客情费用；渠道对账中心—渠道付款、渠道对账" }
  - { id: "R-12-002", module: "审批配置", text: "审批配置列表按 R-12-001 的顺序固定排序；搜索框按审批事项或审批类型模糊匹配；分页 10/50/100/300 条每页，默认 10" }
  - { id: "R-12-003", module: "审批配置", text: "列表字段为 审批事项、审批类型、编辑时间、操作；编辑时间为最近一次保存审批流的时间，格式 yyyy-mm-dd hh:mm:ss，从未保存过显示「—」；操作只有「配置审批流」" }
  - { id: "R-12-004", module: "审批配置", text: "点「配置审批流」打开审批配置弹窗，弹窗顶部只读展示审批事项、审批类型，下方展示该类型当前已保存的全部审批规则；从未配置过时只有规则 1，节点数 0" }
  - { id: "R-12-005", module: "审批配置", text: "规则 1 是默认规则：它的申请者角色由系统自动计算为「未被本类型其他规则选中的全部角色」，只读展示，可以为空；新建的角色自动落入每个审批类型的规则 1；存量配置迁移后的规则 1 按 R-12-050" }
  - { id: "R-12-006", module: "审批配置", text: "每套规则标题右侧有「+」「−」：「+」在最后追加一套新规则；「−」删除该套规则；规则 1 没有「−」，不能删除；删除后规则序号从 1 连续重排" }
  - { id: "R-12-007", module: "审批配置", text: "规则 2 及之后的「申请者角色」为必填复选下拉，选项来自角色列表，已被本类型其他非默认规则选中的角色不出现在选项里；勾选的角色即从规则 1 移出，取消勾选或删除该规则时角色自动回到规则 1；存量规则角色重叠按 R-12-050③ 归属" }
  - { id: "R-12-008", module: "审批配置", text: "某个角色在角色管理里被删除后，自动从所有规则里移除；若规则 2 及之后的某套规则因此没有角色，该规则保留但匹配不到任何人，下次保存时按 R-12-012 拦住" }
  - { id: "R-12-009", module: "审批配置", text: "「审批节点」为整数步进器，最小 0、不设最大值、不允许小数和负数；0 表示该规则免审批，审批流只显示「发起者」" }
  - { id: "R-12-010", module: "审批配置", text: "审批流显示为「发起者 — 节点1 — 节点2 …」，节点框个数等于审批节点数；每个节点只能选一项：一个用户（候选只列启用中且持「审批中心（查看）」的用户，可按用户名搜索，D-00-78），或动态选项「绑定的销售」「绑定的运营」之一，动态选项置顶；渠道付款、渠道对账不提供动态选项" }
  - { id: "R-12-011", module: "审批配置", text: "审批节点数调小时，从最后一个节点往前删掉多出的节点框及其已选值；调大时在末尾追加空节点框" }
  - { id: "R-12-012", module: "审批配置", text: "点「保存」时逐条校验，任一不通过不保存并标红：①规则 2 起申请者角色为空「请选择申请者角色」；②节点数 ≥ 1 时任一节点未选「请选择审批人」；③新建客户、客户信息变更与涉钱 8 类，节点数 ≥ 1 却没有一个节点选了启用中的用户（全动态或指定用户都已禁用）时提示「涉及资金或计费模式的审批类型，至少要有一个指定用户节点」，节点数 0 不受限；本条只在保存时校验，保存后指定用户被禁用、提交时全部节点解析为空的按 R-12-018 例外拒绝提交（D-12-43）；④渠道两类存量节点为动态选项时标红「该审批类型不支持动态选项，请选择用户」" }
  - { id: "R-12-050", module: "审批配置", text: "存量审批配置上线迁移（index S-15，D-12-45）：①存量「账户销售」节点即「绑定的销售」、「账户优化师」节点即「绑定的运营」，保留；②迁移生成的规则 1 为 0 节点，凡「规则 1 为 0 节点、规则 2 起又没覆盖全部角色」的审批类型列入上线检查清单，由用户逐个确认；③存量规则之间角色重叠的，重叠角色归原排序最前的那条；④存量「发起人」节点上线前核对，有残留即阻断上线，由管理员重配" }
  - { id: "R-12-013", module: "审批配置", text: "保存成功弱提示「保存成功」、关闭弹窗、该行编辑时间刷新；新配置只对保存之后提交的审批单生效；关闭弹窗不保存则丢弃本次修改，不弹确认；两人同时编辑同一类型时后保存的覆盖先保存的" }
  # —— 2.2 审批单与审批引擎 ——
  - { id: "R-12-014", module: "审批引擎", text: "提交时按申请人当时的角色在该审批类型的规则里找到所属那一套（角色互斥，只会命中一套）；申请人没有角色或角色不在规则 2 及之后任一套里，按规则 1 处理；不存在提交被「未配置审批流」拦住的情况" }
  - { id: "R-12-015", module: "审批引擎", text: "提交那一刻把命中规则的每个节点解析成审批人名单，连同比对基准固化到审批单快照；之后修改审批配置、客户的销售、账户的优化师、禁用用户、收回权限点，都不改变在途审批单的流程和名单" }
  - { id: "R-12-016", module: "审批引擎", text: "节点解析：指定用户 → 该用户（已禁用解析为空；是否持审批中心查看点不影响）；绑定的销售 → 操作对象客户当前的销售（D-00-50；新建客户取提交表单里的销售，R-04-034，D-12-46；已禁用或无销售解析为空）；绑定的运营 → 本单涉及账户当前的优化师去重后的启用用户（D-00-76；客户级单据取客户名下全部账户；无账户或都已禁用解析为空）；业务包没给客户/账户时对应动态选项解析为空；10 类（require_user_node）节点数 ≥ 1 而全部解析为空时按 R-12-018 例外拒绝提交（D-12-43）" }
  - { id: "R-12-017", module: "审批引擎", text: "节点解析结果为空 → 该节点跳过，时间线标「已跳过」；解析出 1 人 → 普通节点；解析出 2 人及以上 → 会签节点，名单里的人全员通过才算该节点通过（D-00-43）" }
  - { id: "R-12-018", module: "审批引擎", text: "命中规则节点数为 0 或全部节点被跳过时，审批单提交即为「已通过」并按 R-12-038 通知申请人；免审单照常有单号，出现在全部审批与业务页已提交审批，时间线追加「无需审批，自动通过」；业务页提交后弱提示：审批中「已提交审批」，已通过「提交成功，无需审批，已生效」；免审单提交时业务执行失败则提交不成功、不生成审批单；例外（D-12-43）：「至少一个指定用户节点」为「要求」的 10 类，命中规则节点数 ≥ 1 但审批人全部解析为空时不按免审通过，提交直接被拒、不生成审批单，提示「审批流中的审批人均不可用，请联系审批配置管理员」；节点数为 0 的免审照旧" }
  - { id: "R-12-019", module: "审批引擎", text: "审批单从第一个未被跳过的节点开始；当前节点全员通过后进入下一个未被跳过的节点并通知该节点的人；没有后续节点时按 R-12-045 结束" }
  - { id: "R-12-020", module: "审批引擎", text: "通过和驳回都要二次确认，确认框文案「是否要{通过/驳回}该审批？」，带选填的「备注」多行输入框（最多 1,024 字，超出不能输入；驳回不预填），按钮「取消」「确定」；确定后弱提示「操作成功」并刷新当前页；最终通过执行失败按 R-12-045" }
  - { id: "R-12-021", module: "审批引擎", text: "当前节点任一审批人驳回，审批单立即变为「已驳回」，不再往后推进；会签节点里其他尚未处理的人不能再操作" }
  - { id: "R-12-022", module: "审批引擎", text: "审批人恰好是申请人本人时照常需要本人点通过，不自动通过；同一个人出现在多个节点时，每个节点都要分别处理" }
  - { id: "R-12-023", module: "审批引擎", text: "只有「审批单为审批中」且「当前用户在当前节点名单里且尚未处理」时，才对他显示「通过」「驳回」按钮；其余情况一律隐藏；服务端同样校验；是否持审批中心查看点不影响" }
  - { id: "R-12-024", module: "审批引擎", text: "提交后审批人账号才被禁用的，系统不自动跳过或转交，单子停在该节点，由申请人撤回后重新提交，或由持「审批配置」的人作废（R-12-046）" }
  - { id: "R-12-025", module: "审批引擎", text: "审批单结束（已通过 / 已驳回 / 已撤回，作废按已撤回）后，系统通知对应业务包按结果处理业务单据；业务单据如何变化由各业务包定义，本页不定义" }
  - { id: "R-12-045", module: "审批引擎", text: "最后一个节点最后一位审批人通过时先让业务包执行：成功 → 记通过、已通过、通知申请人；失败 → 回滚，审批单保持审批中、这次通过不记录，确认框不关并红字显示业务原因，审批信息区显示「最近一次通过未执行：{原因}（{审批人} {时间}）」（仅审批中显示，再次失败覆盖）；哪些情形算失败由业务包列明，未列明不得拒绝；审批中心行内同（D-00-79①）" }
  # —— 2.3 审批详情页通用格式 ——
  - { id: "R-12-026", module: "审批详情", text: "审批详情只有一个地址，按审批单号打开，进入只要求登录，内容可见性按 R-12-043 服务端判断；标题「{审批事项}/审批详情」，首段纯文本不可点，不另加面包屑，侧栏高亮「审批中心」（无该菜单时不高亮）；审批信息展示 审批单号、审批状态、申请人、申请时间、审批事项、审批类型、最近一次通过未执行（有才显示）、审批流" }
  - { id: "R-12-027", module: "审批详情", text: "审批流时间线从左到右依次是：发起记录（申请人、「发起」、时间、发起备注），然后按快照顺序列出每个节点；每条记录展示 用户名、动作、时间（yyyy-mm-dd hh:mm）、备注，备注为空不显示" }
  - { id: "R-12-028", module: "审批详情", text: "节点状态显示：发起绿 #16a34a 有时间；通过绿 #16a34a；驳回红 #dc2626；待审批灰 #6b7280；未开始、已跳过（未找到审批人）、未处理浅灰 #9ca3af 无时间；免审追加「无需审批，自动通过」绿；撤回追加「申请人 · 撤回 · 时间」橙 #ea580c；作废追加「{操作人} · 作废 · 时间 · 原因」橙 #ea580c" }
  - { id: "R-12-029", module: "审批详情", text: "会签节点在节点名上方显示一排状态圆点，每个审批人一个，颜色 通过绿 / 驳回红 / 待审批灰 / 未处理浅灰 #9ca3af，选中的圆点有描边；点圆点切换下方显示的审批人；默认选中名单第一个人；圆点数量不设上限，一行放不下时其余收进「+N」悬浮层" }
  - { id: "R-12-030", module: "审批详情", text: "变更高亮基准 = 提交那一刻该对象的生效值，由业务包提交时给出并随快照保存（规则配置取新起始日期前一天适用的那条）；审批中与结束后回看一致；不同的值标红并在下方灰字「原：{原值}」，原值为空不标红不显示原；规则起始日期不标红，同日写「将覆盖 yyyy-mm-dd 起的规则」；审批中生效值已变时顶部提示「提交后该{对象}已有变更，当前生效值与本单比对基准不同」；启用高亮的类型由业务包声明（D-00-75）" }
  - { id: "R-12-031", module: "审批详情", text: "页面底部按钮：符合 R-12-023 时显示「驳回」「审批通过」；申请人且审批中时显示「撤回」；持「审批配置」且审批中时显示「作废」；都不满足时不显示按钮区" }
  # —— 2.4 撤回与作废 ——
  - { id: "R-12-032", module: "撤回", text: "14 种审批类型都支持撤回；只校验申请人本人且审批中，不校验任何业务权限点（D-00-79②），业务权限被收回仍可在审批详情撤回；入口在各业务页「已提交审批」tab 的行操作和审批详情页，审批中心不放撤回" }
  - { id: "R-12-033", module: "撤回", text: "撤回二次确认文案：「撤回后，本次审批申请将被立即关闭并作废，审批进度将终止。请注意：撤回后无法在本单据上直接修改或重新提交。如需再次申请，请移步至表单页面重新填写。确认撤回吗？」按钮「取消」「确定」" }
  - { id: "R-12-034", module: "撤回", text: "确认撤回后审批单变为「已撤回」，当前节点所有人的待办消失，弱提示「已撤回」并刷新；已撤回的单子不能再改、不能原单重新提交" }
  - { id: "R-12-035", module: "撤回", text: "撤回时通知当前节点里还没处理的所有人（普通节点就是那一位，会签节点是该节点所有未处理的人）" }
  - { id: "R-12-046", module: "作废", text: "持「审批配置」的人对任何审批中的单在审批详情页有「作废」；二次确认标题「作废审批单」，文案「作废后，本审批单立即关闭，效果同撤回，业务单据按撤回处理。确认作废吗？」，作废原因必填（≤1,024 字，空时标红「请填写作废原因」）；确定后状态已撤回、待办消失、时间线记作废、按已撤回通知业务包、通知申请人和当前节点未处理的人（操作人除外）、弱提示「已作废」；服务端校验权限点与审批中（D-00-79③）" }
  # —— 2.5 审批中心 ——
  - { id: "R-12-036", module: "审批中心", text: "审批中心有「待审批」「全部审批」两个标签，默认待审批，两标签字段一致；待审批 = 审批中且当前用户在当前节点名单里尚未处理的单；全部审批 = 当前用户出现在审批流里的所有单，含自己发起的（含免审单）、审过的、正等自己审的、还没轮到自己的" }
  - { id: "R-12-037", module: "审批中心", text: "列表字段 审批单号、审批事项、审批类型、申请时间、审批状态、操作；搜索按审批单号模糊匹配；筛选 审批事项、审批类型（联动）；「审批状态」筛选只在全部审批标签显示（全部 / 审批中 / 已通过 / 已驳回 / 已撤回），待审批不显示；待审批按申请时间降序，全部审批待我审批的置顶、其余按申请时间降序；分页 10/50/100/300，默认 10" }
  - { id: "R-12-048", module: "审批中心", text: "侧栏一级与二级「审批中心」旁显示待办数角标 = 待审批标签条数；0 不显示，超过 99 显示「99+」；进入页面、切换路由、本人通过/驳回后刷新，不要求实时推送；无审批中心菜单则无角标" }
  # —— 2.6 通知 ——
  - { id: "R-12-038", module: "通知", text: "通知时机：节点开始轮到某人时通知该节点所有人；审批单变为已通过或已驳回时通知申请人；撤回按 R-12-035；作废通知申请人和当前节点未处理的人；跳过的节点不通知；最终通过执行失败不通知" }
  - { id: "R-12-039", module: "通知", text: "通知渠道：收件人绑定了企业微信就只发企业微信；没绑企业微信但有邮箱就发邮箱；两者都没有则不发，只记日志；企业微信发送失败不降级到邮箱，只记日志；本期不做短信" }
  - { id: "R-12-040", module: "通知", text: "通知文案按 notifications 段模板；{审批事项-审批类型} 如「客户管理-新建客户」；{链接} 指向该审批单的审批详情唯一地址（R-12-026）；驳回原因取驳回备注，为空时写「无」；作废原因取作废时填写的原因" }
  # —— 权限 ——
  - { id: "R-12-041", module: "权限", text: "审批配置页（列表与配置审批流弹窗）只对拥有「审批配置」权限点的用户开放；没有该权限点时左侧菜单不显示「审批配置」，直接访问显示「无权限访问」（形态按 R-13-005）；保存接口在服务端同样校验" }
  - { id: "R-12-042", module: "权限", text: "审批中心菜单与页面按「审批中心（查看）」权限点显示（D-00-78）：没有该点不显示菜单、直接访问「无权限访问」、服务端同样校验；有该点时数据只按 R-12-036；审批详情不要求该点，被收回该点的审批人仍可从通知链接打开审批详情处理" }
  - { id: "R-12-043", module: "权限", text: "审批详情查看范围三类：①申请人和快照审批人名单里的人（含还没轮到的，不要求审批中心查看点，也不要求页面查看点）；②对关联业务单据有查看权限的人（映射：规则配置→登记表创建人，或有客户管理只读/读写且客户在数据范围内，D-00-77、R-03-050；新建客户→有客户管理只读/读写且本单提交内容里的销售是本人（sys 看全部），D-12-46；客户信息变更、付款主体变更→有客户管理只读/读写且客户在数据范围内，R-04-043；费用四类→对单内任一账户有查看权限且持「费用管理（查看）」；生成结算单→对账单内任一账户有查看权限且持「账单管理（查看）」；客户返点、客情费用→对单内任一账户有查看权限且持「返点管理（查看）」（D-12-44）；提成规则配置→有「提成规则管理」；渠道两类→有「渠道对账中心」，R-08-082；另 8 类含「收付款中心」持有人，D-00-71、R-13-050），只读；③持「审批配置」的人可只读打开任何审批单，审批中时只显示作废；都不是的显示「无权限查看」，服务端同样校验" }
  - { id: "R-12-044", module: "权限", text: "本页只向业务包询问「该用户能否查看这张业务单据」，判断由业务包实现，不另存可见名单；业务权限变化后可见范围随之变化。单内多账户而查看者只有部分账户权限时照样能打开，审批内容区里无权限账户行是否隐藏由业务包决定" }
  # —— 通用提示与显示 ——
  - { id: "R-12-047", module: "通用提示", text: "在途单提示统一句式：审批中的「该{对象}已有审批中的{审批类型}（审批单号 {单号}，申请人 {姓名}），请等审批结束或撤回后再操作」；06/08 已通过未收付款的「该{对象}已有处理中的{单据}（{收款单/付款单} {财务ID}，{待完成/待汇出}），待{收款/付款}完成后再操作」；单号可点新页打开审批详情，无资格按 R-12-043；不用自动消失的弱提示：锁定用顶部提示条，拦截用「知道了」提示框" }
  - { id: "R-12-049", module: "通用提示", text: "已禁用用户在审批详情申请人、时间线操作人、会签审批人、审批配置节点回显处显示「姓名（已禁用）」，不显示用户 ID；快照与配置原样保留（D-00-83）" }

