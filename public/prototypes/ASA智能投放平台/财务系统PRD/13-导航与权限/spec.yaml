rules:
  - { id: R-13-001, module: 导航, text: "客户管理一级模块新增二级菜单「客户登记表」；客户管理菜单沿用客户管理-只读或客户管理-读写；客户登记表菜单只看「客户登记管理」，持客户管理-只读/读写不能看到该菜单；登记表数据按R-01-008创建人隔离" }
  - { id: R-13-002, module: 导航, text: "新增「财务中心」一级模块，二级菜单依序为：费用管理、账单管理、返点管理、渠道对账中心、收付款中心、利润中心、提成中心；每个子菜单只对持其页面查看权限点的用户显示，不设登录常显（D-00-78）；各页面访问按 R-13-030～R-13-036 判定" }
  - { id: R-13-003, module: 导航, text: "新增「审批中心」一级模块，二级菜单依序为「审批中心」「审批配置」；审批中心要求「审批中心（查看）」（R-13-013），审批配置要求「审批配置」（R-13-014）；一级与二级审批中心旁显示待办数角标（R-12-048）" }
  - { id: R-13-004, module: 导航, text: "沿用现有导航交互：一级模块仅有一个可见二级菜单时点击一级菜单直接进入该页；有多个可见二级菜单时点击或悬浮一级菜单展示可见二级菜单；没有任何可见子菜单的一级模块不显示；用户不能因可见模块标题而访问无权页面" }
  - { id: R-13-005, module: 导航, text: "页面直链、查询和写请求都在服务端校验权限，隐藏菜单/按钮不替代服务端校验；涉及财务动作的接口按库里当前的角色权限校验，权限一收回立即生效，不等重新登录（D-13-04）；无页面权限时在主布局内容区显示「无权限访问」，保留当前地址、侧栏与顶栏，不改写到单独的无权限页；无审批详情查看资格按12显示「无权限查看」；菜单显示仍按登录时的权限，权限变更后重新登录才刷新，重新登录后回到原地址按新权限显示（D-13-02）" }
  - { id: R-13-006, module: 导航, text: "权限/菜单加载失败（非登录失效）时内容区显示「加载失败，请刷新」和「重新加载」按钮，不按全开放展示任何受控菜单，不跳登录页；重新加载成功后按权限显示原地址页面；登录失效时跳登录页，登录后回到原地址" }
  - { id: R-13-007, module: 导航, text: "一级导航顺序沿用现状：全局概览、广告管理、客户管理、财务中心、审批中心、智能工具、授权管理、系统管理、个人中心，按权限过滤后展示；权限配置入口沿用「系统管理 › 角色管理」勾选权限点、「系统管理 › 用户管理」分配角色，本期 19 个点出现在角色管理权限点列表里" }
  - { id: R-13-010, module: 通用权限原则, text: "本页汇总权限点名称与功能边界，不指定任何权限点的角色归属；由用户在交付后手动给角色分配权限点（D-00-45）" }
  - { id: R-13-011, module: 通用权限原则, text: "独立权限点分别授予，持一个动作点不隐含持有其他动作点；动作点依赖所在页面的查看点（账户费用管理、提成规则管理配置入口→费用管理（查看）；生成结算单→账单管理（查看）；返点结算、客情结算→返点管理（查看）；导入渠道账单、渠道付款→渠道对账中心；确认收款、确认付款→收付款中心），缺查看点时无入口且服务端拒绝（D-13-01）" }
  - { id: R-13-012, module: 通用权限原则, text: "权限校验必须覆盖菜单、页面直接访问及对应服务端查询/写入请求；隐藏按钮仅为表现，不能替代服务端拒绝；无页面权限按 R-13-005 显示「无权限访问」，无审批详情查看权显示12定义的「无权限查看」" }
  - { id: R-13-013, module: 审批中心, text: "「审批中心」子菜单、页面与列表接口要求「审批中心（查看）」，没有该点不显示、直接访问「无权限访问」、服务端拒绝；有该点时只返回与本人相关的单（R-12-036、R-12-042），不授予审批配置、审批操作或业务页面权限；审批详情不要求本点；审批人候选只列持本点的启用用户；已配审批人被收回本点后仍可从通知链接打开处理（D-00-78）" }
  - { id: R-13-014, module: 审批配置, text: "「审批配置」子菜单、页面与保存接口均要求「审批配置」权限点；无权限时隐藏子菜单，直接访问按 R-13-005 显示「无权限访问」，服务端拒绝配置保存（R-12-041）；持本点者另可作废任何审批中的审批单并只读打开任何审批详情（D-00-79③、R-12-046）" }
  - { id: R-13-020, module: 客户登记, text: "新增「客户登记管理」权限点，一个点控制客户登记表菜单及01全部内部动作（D-00-70，01按 R-01-037 落地）；不能扩大R-01-008的数据范围，不能让用户查看或处理他人创建的登记表。无该点时菜单不显示、直接访问显示「无权限访问」，服务端同样校验；权限收回后本人登记表不转移、不变状态，外链照常可填。规则配置入口与审批详情查看沿用03口径（D-03-22、D-03-23），撤回本人审批单（D-00-79②）不受本点限制" }
  - { id: R-13-030, module: 财务中心, text: "「费用管理（查看）」控制费用管理菜单、费用明细页与交易明细，没有该点不显示菜单、直接访问「无权限访问」；页面内数据按05账户查看权限过滤；账户费用管理、提成规则管理只控制对应写操作，入口在页内并依赖费用管理（查看）（D-00-78、D-05-37）" }
  - { id: R-13-031, module: 财务中心, text: "「账单管理（查看）」控制账单管理菜单与页面（R-06-025），数据按账户查看权限展示（R-06-031）；「生成结算单」动作独立要求「生成结算单」权限点（依赖账单管理（查看））和R-06-040全部条件，服务端按R-06-048复核" }
  - { id: R-13-032, module: 财务中心, text: "「返点管理（查看）」控制返点管理菜单与页面，数据按账户查看权限过滤（R-07-021）；「客户返点」动作要求「返点结算」，「客情费用」动作要求「客情结算」，两者均依赖返点管理（查看），服务端按R-07-050复核" }
  - { id: R-13-033, module: 财务中心, text: "「渠道对账中心」权限点控制菜单、页面、查询全部渠道数据和只读查看该中心两类审批详情；「导入渠道账单」「渠道付款」为独立动作权限点，均需同时持有「渠道对账中心」才生效；服务端按08定义校验（R-08-080～R-08-082）" }
  - { id: R-13-034, module: 财务中心, text: "「收付款中心」权限点控制菜单、页面与全部收款单/付款单查看；「确认收款」「确认付款」为独立动作权限点且均依赖「收付款中心」；服务端按09定义校验（R-09-060～R-09-062）" }
  - { id: R-13-035, module: 财务中心, text: "「利润中心」独立权限点控制菜单、页面、查询与全部账户数据查看；服务端按10校验（R-10-060、R-10-061）" }
  - { id: R-13-036, module: 财务中心, text: "「提成中心」独立权限点控制菜单、页面、查询与全部客户、账户数据查看；服务端按11校验（R-11-030、R-11-050）" }
  - { id: R-13-040, module: 权限清单, text: "本版本财务相关新增权限点共19个（D-00-78）：客户登记管理；费用管理（查看）；账户费用管理；提成规则管理；账单管理（查看）；生成结算单；返点管理（查看）；返点结算；客情结算；渠道对账中心；导入渠道账单；渠道付款；收付款中心；确认收款；确认付款；利润中心；提成中心；审批中心（查看）；审批配置。每一点的详细范围以 PRD §2.2 表和相应主管页为准，各页引用名称与本清单一致" }
  - { id: R-13-041, module: 权限清单, text: "不新增权限点的功能：02账户管理（沿用已有添加/编辑点，R-02-025）；03规则配置（登记表创建人及客户管理-读写条件，R-03-013、D-03-16）；04客户管理（沿用客户管理-只读/读写，R-04-061）；「+ 新增付款主体」（挂客户管理-读写，R-05-042）" }
  - { id: R-13-042, module: 权限清单, text: "上线：19 个点加入角色管理权限点列表，由用户给角色勾选，不预配（D-00-45）；技术另备按旧权限码映射的建议映射，执行与否由用户决定；配完用户须重新登录才生效；未配前所有用户（含持「拥有全部账户」的 sys 用户）都看不到财务中心各菜单与审批中心；sys（拥有全部账户）只决定各页能看哪些数据，不自动获得 19 个权限点中的任何一个（D-13-05）；上线检查项：给角色配权限点并按 G-13-002 抽查" }
  - { id: R-13-050, module: 审批详情只读查看, text: "对账户充值、充值退款、额度调整、余额分配、生成结算单、客户返点、客情费用、渠道付款这8种审批类型的审批单，仅有「收付款中心」权限点的用户可作为额外业务数据查看者只读查看审批详情；不因此获得审批、撤回权限；该只读资格不取得其他业务页面的访问权，收付款中心页面本身由「收付款中心」点控制（R-13-034）。申请人及审批流人员的既有查看资格不变（R-12-043、R-12-044）。版本级定为 D-00-71" }
  - { id: R-13-051, module: 审批详情只读查看, text: "R-13-050的额外只读资格仅适用于指定8种审批类型的审批详情及其内容；不授予费用/账单/返点/渠道业务页面或收付款单据列表的访问权限；12保持为通用审批详情权限判定主管，05～08在各自能否查看判断中实现新增映射（D-00-71）" }

acceptance:
  - { id: G-13-001, module: 导航, given: "甲仅有客户管理-只读，乙仅有客户登记管理；两人各有本人创建的登记表，另有他人创建的表", when: "两人分别查看客户管理导航并访问客户列表、客户登记表入口；之后收回乙的客户登记管理并重新登录", then: "甲可按04规则看客户数据但无客户登记表入口，直接访问显示「无权限访问」；乙有入口且仅看到本人登记表，直接访问他人登记表详情「无权限访问」；收回后乙菜单消失、直接访问「无权限访问」，本人登记表归属与状态不变（R-13-001、R-13-020、R-01-037）" }
  - { id: G-13-002, module: 财务中心, given: "甲持费用管理（查看）、账单管理（查看）且只对账户C有查看权；乙仅持渠道对账中心；丙持利润中心、提成中心；丁无财务点", when: "各自查看财务中心、访问各子页面直链并调用未授权操作", then: "甲只见费用管理、账单管理且只显示账户C数据、无动作，直接访问返点管理「无权限访问」；乙只见渠道对账中心、看全部渠道数据、导入/付款被拒；丙只见利润中心、提成中心且看全部；丁无财务中心，直接访问费用管理「无权限访问」；子菜单顺序与R-13-002一致（R-13-002、R-13-030～036）" }
  - { id: G-13-003, module: 审批中心, given: "甲只持审批中心（查看）；乙持审批中心（查看）与审批配置；丙两者都无但仍是某待审批单的指定审批人（配置后被收回）", when: "三人访问审批中心、审批配置；丙打开待审批通知链接；在审批配置用户候选里搜丙", then: "甲乙看到审批中心并带角标，只含本人相关单；只有乙能进审批配置，甲直接访问「无权限访问」；丙无审批中心一级模块、直接访问「无权限访问」，但能从通知链接打开审批详情并通过；候选里搜不到丙（R-13-003、R-13-013、R-13-014）" }
  - { id: G-13-004, module: 审批详情只读查看, given: "赵磊持收付款中心，无相关账户查看权限、不在审批流、无费用管理（查看）；8种审批类型各一张单", when: "赵磊逐个打开审批详情，再直接访问费用管理页面", then: "8种详情均可只读查看，无通过/驳回/撤回按钮；费用管理显示「无权限访问」（R-13-050、R-13-051）" }
  - { id: G-13-005, module: 权限原则, given: "用户有账单管理（查看）、生成结算单、收付款中心但无确认收款；之后收回收付款中心；再收回账单管理（查看）只留生成结算单", when: "尝试生成结算单、确认收款、访问收付款中心并调用接口", then: "符合条件的生成结算单可提交，确认收款被拒；收回收付款中心并重新登录后菜单消失、页面「无权限访问」、确认收款被拒；只留生成结算单时无入口且接口被拒；无数据变更（R-13-005、R-13-011、R-13-012、R-13-031、R-13-034）" }
  - { id: G-13-006, module: 权限清单, given: "01～12各页交付规格已具备；角色管理已上线", when: "按R-13-040逐项比对并打开角色管理权限点列表", then: "19个点均可在角色管理勾选、名称与R-13-040一致、能追溯到主管页规则；02、03、04既有权限点未重复新增；未预分配给任何角色（R-13-040～R-13-042）" }
  - { id: G-13-007, module: 导航, given: "甲无利润中心；乙的权限接口被模拟为失败；丙登录令牌已过期", when: "甲打开利润中心地址，之后给甲加利润中心并重新登录；乙刷新财务页并在接口恢复后点重新加载；丙打开审批中心地址", then: "甲看到内容区「无权限访问」、地址不变、侧栏顶栏照常，重新登录后回到该地址正常显示；乙看到「加载失败，请刷新」和「重新加载」，无受控菜单、不跳登录，重新加载后按权限显示原页；丙跳登录页，登录后回到审批中心地址（R-13-005、R-13-006）" }
  - { id: G-13-008, module: 导航, given: "用户持全部19个点及客户管理、系统管理等现有权限", when: "查看侧栏一级与二级菜单顺序并进入系统管理找权限配置", then: "一级顺序为 全局概览、广告管理、客户管理、财务中心、审批中心、智能工具、授权管理、系统管理、个人中心；财务中心7项、审批中心2项顺序同PRD §1.4；角色管理可勾选权限点、用户管理可分配角色（R-13-007、R-13-002、R-13-003）" }

decisions:
  - { id: D-13-01, point: "动作点是否依赖页面查看点", conclusion: "依赖：账户费用管理、提成规则管理（配置入口）→费用管理（查看）；生成结算单→账单管理（查看）；返点结算、客情结算→返点管理（查看）；服务端同样校验。依据：取消常显后入口都在页面内，与导入渠道账单、确认收款依赖中心点的既有写法一致；风险：只配动作点不配查看点的角色会失去操作能力。2026-10-21 用户确认（由代定转已定）", impact: "R-13-011、R-13-030～R-13-032、05、06、07", status: "已定" }
  - { id: D-13-02, point: "无权限与权限加载失败的页面形态", conclusion: "无权限在主布局内容区显示「无权限访问」、保留地址；加载失败显示「加载失败，请刷新」+「重新加载」、不跳登录；登录失效回登录页再回原地址（2026-10-21 用户定，会议清单 D87，A 档；改现状 /403 整页与失败跳登录，技术答复 T24）；权限变更后菜单须重新登录才刷新，重新登录后回到原地址按新权限显示（2026-10-21 用户确认；财务动作接口的即时校验见 D-13-04）", impact: "R-13-005、R-13-006、前端全局", status: "已定" }
  - { id: D-13-03, point: "一级导航顺序与权限配置入口", conclusion: "沿用现状（2026-10-21 用户定，会议清单 D87；现状见技术答复 T24）", impact: "R-13-007", status: "已定" }
  - { id: D-13-04, point: "收回权限后财务动作接口何时失效", conclusion: "涉及财务动作的接口按库里当前的角色权限校验，权限一收回立即生效；菜单显示仍按登录时的权限，重新登录后刷新；不写成已知限制。2026-10-22 用户与技术确认，闭环清单 A04", impact: "R-13-005、PRD §2.4、服务端财务动作接口", status: "已定" }
  - { id: D-13-05, point: "sys（拥有全部账户）与 19 个权限点的关系", conclusion: "sys 只决定各页能看哪些数据，不自动获得 19 个权限点中的任何一个；上线未配点之前，所有人（含 sys）都看不到财务菜单和审批中心。2026-10-22 用户与技术确认，闭环清单 A05", impact: "R-13-042、上线检查", status: "已定" }

