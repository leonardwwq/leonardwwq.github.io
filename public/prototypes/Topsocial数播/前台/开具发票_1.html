        <div id="u5931_text" class="text ">
          <p><span style="font-family:'ArialMT', 'Arial', sans-serif;">1</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">、开票金额不得低于</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">100</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">元，类型为技术服务费，税率为</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">6%</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">（包含在会员费用内），</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#F85A00;">勾选金额满</span><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#F85A00;">100</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#F85A00;">元</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">，即可开票；</span></p><p><span style="font-family:'ArialMT', 'Arial', sans-serif;">2</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">、发票基于订单开具，金额为实际支付金额。（多个订单可合并开票，单个订单不可拆分开票）；</span></p><p><span style="font-family:'ArialMT', 'Arial', sans-serif;">3</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">、提交开票申请审核通过后，将在</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">7</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">个工作日内为您寄出，默认顺丰快递；</span></p><p><span style="font-family:'ArialMT', 'Arial', sans-serif;">4</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">、建议开具电子普通发票，电子发票（增值税普通发票）与纸质发票（增值税专用发票）具备同等法律效力，可报销入账；</span></p><p><span style="font-family:'ArialMT', 'Arial', sans-serif;">5</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">、线下对公转账用户请联系客服进行充值开票。点击查看</span><span style="font-family:'ArialMT', 'Arial', sans-serif;"> </span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#F85A00;">开票记录</span><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#F85A00;">&gt;&gt;</span></p>
