            <p style="font-size:18px;"><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#1EC695;"><br></span></p><p style="font-size:14px;"><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#666666;">1</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">、全局顶栏：新增移动端全局顶栏</span></p><p style="font-size:14px;"><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#666666;">2</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">、登录注册页：仅支持短信验证码注册登录</span></p><p style="font-size:14px;"><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#666666;">3</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">、首页：新增移动端首页</span></p><p style="font-size:14px;"><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">4、个人中心：新增移动端个人中心页，包含一个优惠券子页面</span></p><p style="font-size:14px;"><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">5、404页面：新增移动端404页面</span></p><p style="font-size:14px;"><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">6、博主搜索：新增移动端博主搜索页面</span></p><p style="font-size:14px;"><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">7、博主排行：新增移动端博主排行页面</span></p><p style="font-size:14px;"><span style="font-family:'ArialMT', 'Arial', sans-serif;color:#666666;">8</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;color:#666666;">、会员权益及购买：新增移动端会员权益介绍以及购买流程</span></p>
